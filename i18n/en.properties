darkpriest=Dark Priest
darkpriest.description=Class special ability - restless soul: at the beginning of the game, a creature with the same name (3/11) appears on the opponent's side. If it dies, it is reborn at the end of the opponent's turn and gives 2 special mana to the Dark Priest.
darkpriest.RestlessSoul.name=Restless soul
darkpriest.RestlessSoul.description=If it dies, it is reborn at the end of the opponent's turn and gives 2 special mana to the Dark Priest.
darkpriest.Ghost.name=Ghost
darkpriest.Ghost.description=If killed by a spell or a creature ability, it is reborn and switches sides.\nWhen it enters the game, it heals its owner 1 life for each of its creatures on the board.
darkpriest.Occultist.name=Occultist
darkpriest.Occultist.description=When it enters the game, it summons a shadow of the priest in the opposite slot.
darkpriest.BlackMass.name=Black Mass
darkpriest.BlackMass.description=Sacrifices the target creature and deals 4X damage to all enemy creatures (X = number of different elements to which the enemy creatures belong).
darkpriest.EnergyVampire.name=Energy vampire
darkpriest.EnergyVampire.description=Every turn gives its owner 1 mana for each neighbor (the mana's element matches the neighbor's).
darkpriest.BlackMonk.name=Black monk
darkpriest.BlackMonk.description=When it receives damage, it heals its owner the same amount of life.
darkpriest.Betrayer.name=Betrayer
darkpriest.Betrayer.description=Can only be summoned on an enemy creature when it dies. Every turn deals 4 damage to itself, its owner and its neighbors.
darkpriest.DarkHydra.name=Dark hydra
darkpriest.DarkHydra.description=When it attacks, it damages the opponent and all its creatures. After attacking, it permanently increases its attack by 1 and heals X life to its owner (X = damage dealt to the opponent)
darkpriest.Missionary.name=Missionary
darkpriest.Missionary.description=When it enters the game, the weakest friendly creature and the weakest enemy creature of the same element lose half of their current health. When the owner summons an elemental creature, it turns into a heretic 6/20 (no special abilities). When the owner summons a special creature, it turns itself into a black angel 8/25 (when it kills a creature, it fully heals itself).
darkpriest.Heretic.name=Heretic
darkpriest.BlackAngel.name=Black Angel
darkpriest.BlackAngel.description=When it kills a creature, it fully heals itself
darkpriest.ShadowOfPriest.name=Shadow of Priest
darkpriest.ShadowOfPriest.description=Every turn heals 1 life to the Dark Priest and all its creatures

antimancer=Antimancer
antimancer.0.name=Angry Mob
antimancer.2.name=Mirror Priest
antimancer.2.description=Each time the opponent plays a card, gain 1 power of that card's type. If the opponent played a special card, gain 1 Revenge.
antimancer.3.name=Resistance
antimancer.3.description=Put a 3/9 Angry Mob into each of your unblocked slots.
antimancer.4.name=Retaliator
antimancer.4.description=Every time the retaliator loses life, it deals an equivalent amount of damage to all the opponent's creatures.
antimancer.5.name=Martyr
antimancer.5.description=As long as Martyr is in play, all your other cards that die or are destroyed by a spell will be reborn.
antimancer.6.name=Harvester
antimancer.6.description=Each time one of the owner's creatures dies, the Harvester randomly increases its owner's fire, water, air or earth power by 1.
antimancer.7.name=Voodoo Doll
antimancer.7.description=At the beginning of its owner's turn, Voodoo Doll drains 1 life from each of the opponent's cards.
antimancer.8.name=Bombardier
antimancer.8.description=When Bombardier deals damage to the opponent, it deals the same amount of damage to all the opponent's cards. When Bombardier dies, it deals 28 damage to the card in the opposing slot.
antimancer.9.name=Bribery
antimancer.9.description=Destroys the target opponent's card with a power cost of 7 or less. That card will reappear in one of the owner's random empty slots with maximum life.

colors=Colors
colors.description=Each color has a minimal cost. When a special card is summoned, all special mana is spent on it. The amount of mana affects the abilities of colors (X). Only one color of each type can be on the board.
colors.Discoloration.name=Discoloration
colors.Discoloration.description=Destroys the selected color of the owner and gives one additional action.
colors.Amber.name=Amber
colors.Amber.description=When killed, it distributes 2X mana equally between the owner's two highest powers.
colors.Violet.name=Violet
colors.Violet.description=Permanently reduces the cost of the owner's cards with cost 2X and lower by 1. Damage dealt by the enemy's spells is reduced by 3 while Violet stays on the board.
colors.Azure.name=Azure
colors.Azure.description=While Azure stays on the board, the owner's creatures with cost X, X + 1 or X - 1 take no damage from spells and creatures' abilities, but take 4 damage each turn.
colors.Silver.name=Silver
colors.Silver.description=Heals the owner's creatures for X - 1 life each turn. Reduces the growth of Colors' power by 1 if X > 5.
colors.Emerald.name=Emerald
colors.Emerald.description=Reduces damage dealt to its owner by X - 3. The cost of all Colors' cards is increased by X while Emerald stays on the board.
colors.Crimson.name=Crimson
colors.Crimson.description=Increases damage dealt by creatures to both players by X.
colors.Gold.name=Gold
colors.Gold.description=Dies instead of the creature killed on the left


wind=Wind
wind.description=Master of Wind
wind.WingedWarrior.name=Winged Warrior
wind.WingedWarrior.description=The next creature summoned attacks on the same turn it is summoned.
wind.Simoom.name=Simoom
wind.Simoom.description=Stuns the target elemental creature and gives X mana of that creature's element (X = half the creature's cost, rounded down)
wind.BallLightning.name=Ball Lightning
wind.BallLightning.description=Deals 7 damage to the opponent and allows an additional card this turn.
wind.Squall.name=Squall
wind.Squall.description=Allows two additional cards this turn and deals 1 damage to all enemies
wind.EnergeticVortex.name=Energetic vortex
wind.EnergeticVortex.description=Increases damage dealt by the owner's next spell by 50% and transfers 2 air mana from the opponent to the owner.
wind.TheSpiritOfThunderstorm.name=The spirit of thunderstorm
wind.TheSpiritOfThunderstorm.description=Gives 1 special mana per turn. Deals 3 damage to all enemies when the owner skips a turn.
wind.Whirlwind.name=Whirlwind
wind.Whirlwind.description=Destroys the target creature and the opposite one, and allows an additional card this turn.
wind.EternalStorm.name=Eternal Storm
wind.EternalStorm.description=This turn, all friendly creatures attack the opponent directly.

mountainking=Mountain King
mountainking.description=Hird: while a dwarf stands side by side with another dwarf, it gets its second ability
mountainking.DwarvenSoldier.name=Dwarven soldier
mountainking.DwarvenSoldier.description=On entering the game, it increases the attack of neighbors by 3 for 1 turn. Hird: decreases the attack of the opposite creature by 1 for each dwarven soldier on the board.
mountainking.DwarvenShieldman.name=Dwarven shieldman
mountainking.DwarvenShieldman.description=Redirects half of the damage dealt to its neighbors to itself. Hird: cannot be killed by magic (at least 1 hp will be left).
mountainking.DwarvenСrossbowman.name=Dwarven crossbowman
mountainking.DwarvenСrossbowman.description=When it attacks, it deals the same damage directly to the opponent. Hird: attacks instantly right before death.
mountainking.ArmourcladDwarf.name=Armour-clad Dwarf
mountainking.ArmourcladDwarf.description=Reduces non-magical damage dealt to it by X (X = difference in level with the opposite creature). Hird: its ability applies to its neighbors as well.
mountainking.Runesmith.name=Runesmith
mountainking.Runesmith.description=Runesmith can be harmed only by the opposite creature when blocked. Hird: +1 attack for each dwarf in the game (including itself).
mountainking.Ballista.name=Ballista
mountainking.Ballista.description=When an enemy creature enters the game, it halves its health and loses 10 health itself. Hird: loses only 7 health when activating its ability.
mountainking.Berserker.name=Berserker
mountainking.Berserker.description=When its owner receives more than 5 damage, it attacks the opposite slot instantly. Hird: +3 attack and damage dealt to the berserker.
mountainking.MountainKingCard.name=Mountain king
mountainking.MountainKingCard.description=When an allied dwarf enters the game, it heals itself by 4 and permanently increases its attack by 2. When it enters the game, it stuns the strongest opponent creature. Hird: reduces the cost of dwarven cards by 1.

darksider=Darksider
darksider.fallen.name=Fallen mage
darksider.fallen.description=When it attacks, it deals the same damage to all enemy creatures of the element of the opposite creature.
darksider.spider.name=Wolf spider
darksider.spider.description=When the opponent summons a card, it deals to the opposite creature damage equal to the cost of that card.
darksider.knight.name=Black knight
darksider.knight.description=Its neighbors attack only the slot opposite the Black Knight.
darksider.mystic.name=Dark mystic
darksider.mystic.description=Its attack is equal to the owner's special power. When a friendly elemental creature dies, its special power increases by 1
darksider.faceless.name=Faceless horror
darksider.faceless.description=When summoned, the opponent loses the card of the opposite creature.
darksider.lake.name=Lake of oblivion
darksider.lake.description=When the opponent summons a card, it blocks it until the lake dies.
darksider.warlock.name=Warlock
darksider.warlock.description=When the opponent casts a spell, it blocks it and loses 3X hp (X = cost of the spell).
darksider.dragon.name=Black dragon
darksider.dragon.description=Immune to all spells and abilities. When it enters the game, it stuns all enemy creatures

limbo=Limbo
limbo.description=Keeper of Limbo. Passive ability: whenever an enemy creature attacks and kills Keeper of Limbo or one of its creatures, their death is postponed until the end of Keeper of Limbo's turn, and they are considered to be in 'Limbo-state'. Creatures in 'Limbo-state' attack and block as usual.
limbo.heaven=Heaven's Keeper
limbo.heaven.description=Each time another creature of its owner enters 'Limbo-state', Heaven's Keeper heals 2 life to its owner and to each of its owner's creatures.
limbo.hell=Hell's Keeper
limbo.hell.description=Each time another creature of its owner enters 'Limbo-state', Hell's Keeper deals 2 damage to the opponent and to each of the opponent's creatures.
limbo.wraith=Limbo Wraith
limbo.wraith.description=Limbo Wraith's attack is equal to the number of its owner's creatures that are in 'Limbo-state' plus 1. Limbo Wraith's attack damages the opponent and each of the opponent's creatures.
limbo.tower=Tower of sins
limbo.tower.description=Each time one of the owner's creatures enters 'Limbo-state', the opponent's mana of that creature's house is reduced by 1 and the owner's mana of that creature's house is increased by 1.
limbo.nether=Nether Grasp
limbo.nether.description=Destroys each of its caster's creatures and they enter 'Limbo-state', then deals 3 damage to each of the opponent's creatures for each of the caster's creatures that is in 'Limbo-state'.
limbo.adjudicator=Soul Adjudicator
limbo.adjudicator.description=Each time one of the owner's creatures enters 'Limbo-state', a Heaven's Keeper or a Hell's Keeper (whichever is in your hand) that gains the "can't enter 'Limbo-state'" restriction is summoned in a random empty slot adjacent to that creature.
limbo.redemption=Redemption
limbo.redemption.description=The target caster's creature that is in 'Limbo-state' is re-summoned with full health.
limbo.baron=Limbo Baron
limbo.baron.description=When a spell or ability damages and kills Keeper of Limbo or Limbo Baron, they enter 'Limbo-state'. When Limbo Baron enters 'Limbo-state', its attack doubles.

dreamweaver=Dreamweaver
dreamweaver.wisp=Ethereal Wisp
dreamweaver.wisp.description=Ethereal Wisp takes no damage from enemy spells and abilities. Ethereal Wisp's attack is increased by 1 for each other creature of its owner.
dreamweaver.roc=Roc Hatchling
dreamweaver.roc.description=While Roc Hatchling is unopposed, its attack is halved (round up).
dreamweaver.aurora=Aurora
dreamweaver.aurora.description=All creatures are healed for 12 life and add 1 mana of their own type to their owner's mana pool.
dreamweaver.guide=Spiritual Guide
dreamweaver.guide.description=When Spiritual Guide is summoned, it heals all the owner's creatures for an amount equal to the owner's Dream power, and heals its owner for 3 life for each of the owner's creatures.
dreamweaver.sword=Living Sword
dreamweaver.sword.description=Living Sword gains 1 attack for each neighboring creature. When Living Sword attacks, if there are creatures adjacent to the opposing slot, it also attacks those creatures.
dreamweaver.butterfly=Rainbow Butterfly
dreamweaver.butterfly.description=Each time the opponent summons a creature, Rainbow Butterfly's owner gains 3 mana of that creature's type. (All Special creatures count as Dream for this purpose.)
dreamweaver.castle=Flying Castle
dreamweaver.castle.description=Flying Castle attacks the opponent and all the opponent's creatures. Flying Castle reduces damage dealt to all other creatures of its owner by 2.
dreamweaver.mare=Night Mare
dreamweaver.mare.description=When Night Mare is summoned, it deals 6 damage to each of the opponent's creatures for each empty opponent slot. Night Mare's attack is increased by 1 for each other creature of its owner.

soulbinder=Soulbinder
soulbinder.description=The Soulbinder always starts the duel with 1 Bound Soul in play in a random slot. Bound Soul does not attack. Bound Soul receives no damage from attacking creatures, abilities, or spells. A creature opposite a Bound Soul does not attack the Bound Soul but rather attacks the owner directly as if the slot were empty. Any creature may be summoned onto a Bound Soul; when this occurs, the Bound Soul is no longer in play. A Bound Soul neither "dies" nor is "destroyed".
soulbinder.boundsoul=Bound Soul
soulbinder.boundsoul.description=Does not attack and cannot be damaged. A creature opposite Bound Soul attacks the owner as if this slot were empty. Any creature may be summoned onto it.
soulbinder.tethered=Tethered Soul
soulbinder.tethered.description=Must be summoned onto a Bound Soul. When Tethered Soul dies, it is replaced by a Bound Soul.
soulbinder.summon=Spiritual Summoning
soulbinder.summon.description=Summons a Bound Soul into the target empty slot and increases the caster's Fire, Water, Air and Earth powers by 1.
soulbinder.tree=Soulseed Tree
soulbinder.tree.description=Must be summoned onto a Bound Soul. At the beginning of its owner's turn, Soulseed Tree puts a Bound Soul into one of its neighboring slots (left to right) if that slot is not already occupied.
soulbinder.seeker=Soul Seeker
soulbinder.seeker.description=Must be summoned onto a Bound Soul. At the end of its owner's turn, Soul Seeker moves into a random empty slot and puts a Bound Soul in the slot it used to occupy.
soulbinder.release=Spiritual Release
soulbinder.release.description=Heals the caster and all of the caster's creatures for 3 life for each Bound Soul in play (own and opponent), then removes all Bound Souls from play (own and opponent) and puts 2 Bound Souls into random empty slots of the owner.
soulbinder.sheppard=Soul Sheppard
soulbinder.sheppard.description=Must be summoned onto a Bound Soul. Soul Sheppard's attack is increased by 1 for each Bound Soul the owner controls. Each turn, Soul Sheppard heals the owner for 2 life for each Bound Soul the owner controls.
soulbinder.priestess=Priestess of Passage
soulbinder.priestess.description=Must be summoned onto a Bound Soul. When summoned, Priestess of Passage heals 2 life to the owner and deals 2 damage to the opponent for each Bound Soul in play (own and opponent). Each time one of the owner's creatures dies, Priestess of Passage puts a Bound Soul into a random empty slot of the owner.
soulbinder.dragon=Spirit Dragon
soulbinder.dragon.description=Must be summoned onto a Bound Soul. When summoned, Spirit Dragon deals 6 damage to the opponent and to all of the opponent's creatures. Each turn, Spirit Dragon heals itself and its owner for 3 life for each Bound Spirit the owner controls.

faerie=Faerie Druid
faerie.twins=Faerie Twins
faerie.twins.description=When summoned, it heals its neighboring creatures 4 life. When it dies, it heals its neighboring creatures 4 life
faerie.fire=Faerie Fire
faerie.fire.description=Deals 5 damage to all blocked enemy creatures and stuns all unblocked enemy creatures.
faerie.nightwing=Nightwing Butterfly
faerie.nightwing.description=Nightwing Butterfly lowers the attack of all enemy creatures by 1.
faerie.ring=Faerie Ring
faerie.ring.description=Faerie Ring increases the growth of the owner's Faerie mana by 1. Each time the owner uses a Faerie card, Faerie Ring's attack increases by 2.
faerie.piper=Faerie Piper
faerie.piper.description=Faerie Piper heals its neighboring creatures 3 life each turn.
faerie.cloud=Butterfly Cloud
faerie.cloud.description=Summons a Butterfly Rabble in all the owner's empty slots.
faerie.unicorn=Unicorn
faerie.unicorn.description=Unicorn attacks in the turn it is summoned. Unicorn lowers the cost of all the owner's creatures by 1.
faerie.dragon=Faerie Dragon
faerie.dragon.description=When summoned, Faerie Dragon heals all the owner's creatures 20 life. Faerie Dragon increases the attack of all other creatures of its owner by 2 in the turn it is summoned.
faerie.rabble=Butterfly Rabble
faerie.rabble.description=When Butterfly Rabble dies, it heals its owner 4 life.

entomologist=Entomologist
entomologist.beetle=Fire Beetle
entomologist.beetle.description=When summoned, Fire Beetle deals 4 damage to the creature in the opposite slot. When Fire Beetle dies, it increases its owner's fire power by 1.
entomologist.moth=Poisonpowder Moth
entomologist.moth.description=Each turn Poisonpowder Moth deals 1 damage to all opponent creatures and to the opponent. When Poisonpowder Moth dies, it stuns the creature in the opposite slot.
entomologist.hivemind=Hivemind
entomologist.hivemind.description=Select a target opponent's creature. All of the caster's creatures attack the target creature instead of their opposite creature this turn.
entomologist.locust=Locust Swarm
entomologist.locust.description=Summon a Locust Swarm onto a target opponent creature. The target creature takes 8 damage each turn and the opponent takes 4 damage each turn until the target creature dies.
entomologist.ant=Giant Ant
entomologist.ant.description=All damage dealt to Giant Ant is reduced by 2. Giant Ant lowers the cost of the owner's other Giant Ants by 2 while in play.
entomologist.assassin=Assassin Wasp
entomologist.assassin.description=When summoned, Assassin Wasp summons Wasp Drones in its adjacent slots. Assassin Wasp gains +2 to its attack for each Wasp Drone in play.
entomologist.hive=Insect Hive
entomologist.hive.description=At the end of each owner's turn, Insect Hive summons an Insect Warrior into a random slot of the owner.
entomologist.mantis=Red Mantis
entomologist.mantis.description=When summoned, Red Mantis reduces all the opponent's powers by 1. Red Mantis lowers by 1 the growth of the opponent's power matching the power type of the creature in the opposite slot. When Red Mantis dies, it deals 5 damage to the creature in the opposite slot.
entomologist.warrior=Insect Warrior
entomologist.warrior.description=When Insect Warrior dies, it increases its owner's Entomologist power by 1.
entomologist.drone=Wasp Drone
entomologist.drone.description=No special ability


seasons=Seasons
seasons.description=Passing of Seasons: each of the Warden's special cards grants him a small passive effect that remains active from the beginning of the game until the card is played. Exhaustion: the Warden's special cards may only be used once apiece during the match.
seasons.Nectarbloom.name=Nectarbloom
seasons.Nectarbloom.description=Nectarbloom regenerates 2 life each turn.
seasons.AiluvBees.name=Ailuv Bees
seasons.AiluvBees.description=When Ailuv Bees is summoned, two 2/10 Nectarblooms are summoned into random empty slots of the caster. Passive: Regrowth: your mana growth is increased by 1 in each House with fewer than 2 mana.
seasons.SpiritofEquinox.name=Spirit of Equinox
seasons.SpiritofEquinox.description=When summoned, it deals 4 damage to the opponent and to each of the opponent's creatures, and heals 4 life to the caster and to each of the caster's creatures. Passive: Regrowth: your mana growth is increased by 1 in each House with fewer than 2 mana.
seasons.SolarWave.name=Solar Wave
seasons.SolarWave.description=The opponent takes 2 damage for each of their empty creature slots. The opponent's creatures take triple damage this turn. Passive: Midnight Sun: when you take 4 or more damage, that damage is reduced by 1.
seasons.EternalSummer.name=Eternal Summer
seasons.EternalSummer.description=You may immediately play one creature and one spell from your hand, in either order. Both have -2 cost. Passive: Midnight Sun: when you take 4 or more damage, that damage is reduced by 1.
seasons.Cornucopia.name=Cornucopia
seasons.Cornucopia.description=When summoned, it heals all other allied creatures for 9 life. All other allied creatures receive +1 attack and take -1 damage while Cornucopia is on the board. Passive: Plentitude: the cost of your most expensive Fire, Water, Air and Earth cards is reduced by 1.
seasons.GaeasAvatar.name=Gaea's Avatar
seasons.GaeasAvatar.description=Its attack is equal to the number of creatures on the board. Gaea's Avatar is unaffected by all spells but takes 1 damage each turn for each empty slot on the board. Passive: Plentitude: the cost of your most expensive Fire, Water, Air and Earth cards is reduced by 1.
seasons.BehemothofFrozenTime.name=Behemoth of Frozen Time
seasons.BehemothofFrozenTime.description=When summoned, the opponent's blocked creatures are stunned for a turn. The opponent's mana in each House cannot grow higher than 9 while Behemoth of Frozen Time is in play. Passive: Wintry Chill: the opponent's unblocked creatures take 1 damage each turn.
seasons.TheGreatAurora.name=The Great Aurora
seasons.TheGreatAurora.description=The caster's creatures are healed for 16 life, and each grants 3 mana of their own type to the caster. Passive: Wintry Chill: the opponent's unblocked creatures take 1 damage each turn.

kinetician=Kinetician
kinetician.magerunner=Magerunner
kinetician.magerunner.description=When summoned, it switches places with the friendly creature with the highest attack
kinetician.tricker=Tricker
kinetician.tricker.description=Every turn it moves to the nearest unblocked slot
kinetician.force=Focused Force
kinetician.force.description=This turn, all friendly creatures attack only the target creature, with its attack increased by 1
kinetician.warp=Warp reality
kinetician.warp.description=Reduces the hp of the target creature to X (X = its level)
kinetician.mage=Lone mage
kinetician.mage.description=Every turn deals X damage to the opponent (X = number of the opponent's empty slots)
kinetician.call=Call the fittest
kinetician.call.description=Halves the cost of the cards of the target element (each for a single use)
kinetician.barrier=Force barrier
kinetician.barrier.description=Doubles the current and max hp of the target friendly creature. It skips the next turn
kinetician.manipulator=Manipulator
kinetician.manipulator.description=When it enters the game, the attack of all enemy creatures becomes equal to 3 for 1 turn. When the opponent summons a creature, it switches owners; Manipulator loses 4X hp (X = cost of that creature)

shaman=Shaman
shaman.description=Spirit of ancestors: at the beginning of the game, a ghost wolf 2/18 (cost 2, no special ability) appears in the rightmost slot. If the wolf dies, it is replaced by a new wolf summon.
shaman.ghost=ghost wolf
shaman.ghost.description=The Shaman's companion. It has no ability of its own: the Shaman's other cards change its attack, its life and the damage it takes.
shaman.hunger=Unappeasable Hunger
shaman.hunger.description=The wolf receives +X attack (X = attack of the target creature) for 1 turn.
shaman.rage=Spirit of rage
shaman.rage.description=When it enters the game, it permanently increases the attack of neighbors by 1.
shaman.moon=Power of full moon
shaman.moon.description=Permanently decreases the damage dealt to the wolf by 1 and heals 8 life to its neighbors and its owner.
shaman.fury=Phantom fury
shaman.fury.description=Deals 8 damage to all enemy creatures and permanently increases the wolf's attack by 1 for each creature that died this turn.
shaman.protector=Spirit protector
shaman.protector.description=While the protector remains in the game, all damage received by the owner is decreased by 2, and enemy spells heal the wolf instead of damaging it.
shaman.hunter=Spirit hunter
shaman.hunter.description=While the hunter remains in the game, the wolf gets +2 attack and heals itself by the damage dealt when it attacks.
shaman.shadow=Wolf shadow
shaman.shadow.description=All cards which affect the wolf also affect the wolf shadow. When it enters the game, its neighbors attack immediately.
shaman.mate=Phantom mate
shaman.mate.description=When it enters the game, it permanently decreases the cost of wolf cards by 1 and deals 8 damage to the opponent. Every turn, the wolf additionally attacks the slot opposite the mate.

vampires=Vampires
vampires.flock=Dark flock
vampires.flock.description=Moves the owner's creature with the lowest hp into the target slot and makes it invulnerable for 1 turn if its level is not higher than 9.
vampires.noctule=Noctule
vampires.noctule.description=When it deals damage to the opponent, it heals its owner the same amount of life.
vampires.ghoul=Ghoul
vampires.ghoul.description=If the opposite creature has less than 11 life, it kills it at one blow.
vampires.acolyte=Acolyte
vampires.acolyte.description=When an enemy creature receives more than 5 damage, it additionally deals 4 damage to it.
vampires.ties=Blood ties
vampires.ties.description=Destroys the owner's creature and permanently increases the attack of its neighbors by its attack (it does not affect creatures with mass attack nor creatures of level higher than 9).
vampires.nosferatu=Nosferatu
vampires.nosferatu.description=When a creature dies, it heals its owner by 3 and itself by 2.
vampires.aristocrat=Aristocrat
vampires.aristocrat.description=At the beginning of the turn, it moves into the slot opposite the opponent's creature with the lowest hp (it can switch places with a friendly creature). When it kills a creature, it deals the opponent damage equal to its attack.
vampires.mansion=Mansion
vampires.mansion.description=When one of the owner's non-special creatures dies, it replaces it with a neophyte. On entering the game, it turns its neighbors into ghouls.
vampires.neophyte=Neophyte
vampires.neophyte.description=It heals itself for half of the damage dealt to enemies.


fairy=Fairy knight
fairy.lesovik=Lesovik
fairy.lesovik.description=While alive, blocks the card of the opposite creature.
fairy.kikimora=Kikimora
fairy.kikimora.description=When it enters the game, it summons a Vodyanoy in a random slot.
fairy.vodyanoy=Vodyanoy
fairy.rusalka=Rusalka
fairy.rusalka.description=When it kills a creature, the opponent loses that card.
fairy.likho=Likho
fairy.likho.description=When it dies, it reduces the hp of the creature which killed it to 10 (it kills the creature if it has less than 10 hp). If killed by a spell or an ability, it gives its owner 2 random powers.
fairy.sirin=Sirin
fairy.sirin.description=While alive, it halves the attack of the opposite creature and its neighbors (attack rounds up).
fairy.alkonost=Alkonost
fairy.alkonost.description=Every turn it blocks 6 random enemy cards. It cannot block cards which have already been blocked the previous turn
fairy.firebird=Firebird
fairy.firebird.description=Invulnerable while next to a friendly Fire creature.
fairy.zmey=Zmey Gorynych
fairy.zmey.description=When it dies, it is reborn as a two-headed Zmey 6/25, then as a one-headed Zmey 3/15. When any player uses a Fire card, it deals 6 damage to a random enemy creature.
fairy.2head=two-headed Zmey
fairy.1head=one-headed Zmey

elementalist=Elementalist
elementalist.sylph=Sylph
elementalist.sylph.description=When it enters the game, it allows an additional special card to be played. +1 cost for each sylph on the board.
elementalist.freeze=Deep freeze
elementalist.freeze.description=Both players skip 1 turn and cannot use special cards on their next turn.
elementalist.salamander=Salamander
elementalist.salamander.description=If the owner's fire power is higher than the opponent's, it deals 4 damage to the opponent at the beginning of the turn.
elementalist.avalanche=Avalanche
elementalist.avalanche.description=Deals 2X damage to enemy creatures (X = owner's earth power) [{0}], heals 2X life to the owner and reduces the owner's earth power to 0.
elementalist.incineration=Incineration
elementalist.incineration.description=Destroys the strongest enemy and the weakest friendly creatures (calculated by health), both on the board and in the deck.
elementalist.phoenix=Arch Phoenix
elementalist.phoenix.description=Every turn it regenerates hp equal to the owner's fire power.
elementalist.golem=Stone golem
elementalist.golem.description=+4 attack when blocked. It receives no damage from spells and creature abilities when unblocked.
elementalist.frost=Frost lightning
elementalist.frost.description=Deals X damage to the opponent (X = difference between its lowest power and the owner's highest power) and permanently blocks the target slot.

reaper=Soul Reaper
reaper.description=When a creature on the field dies, the owner gets 1 soul. For every soul the owner has, all damage dealt by its special spells is increased by 1 (1 soul = 1 damage)
reaper.damnation=Damnation
reaper.damnation.description=Target a creature and deal 3 damage to it. If the creature dies because of this spell, increase the number of souls by x, where x is equal to the creature's cost (max. damage 8)
reaper.passage=Dark Passage
reaper.passage.description=Select 1 target creature. This creature and its neighboring creatures are healed for x life, where x is equal to the number of souls you have (max. heal 12 life)
reaper.rage=Eternal Rage
reaper.rage.description=Select 1 target creature; it cannot be destroyed for the next 2 turns, however much damage it takes.

reaper.onslaught=Onslaught of souls
reaper.onslaught.description=Deal x damage to all the opponent's creatures, where x is equal to the number of souls you have. After this spell is used, the owner does not receive souls for creatures killed by this spell, and the number of souls the owner has becomes 0
reaper.tribute=Tribute
reaper.tribute.description=Select 1 target creature of the owner and destroy it; the owner gets x life, where x is equal to the life of the destroyed creature (max. life 36)
reaper.furious=Furious souls
reaper.furious.description=Deal x + 7 damage to the opponent, where x is equal to the owner's number of souls. After this spell is used, the number of souls is reduced to 0
reaper.sentence=Death Sentence
reaper.sentence.description=Destroys all creatures on the field. For every destroyed creature, the owner receives 2 souls instead of 1
reaper.shackles=Soul Shackles
reaper.shackles.description=The target creature cannot attack and its ability is cancelled. Its slot cannot be used until the end of the duel. For every turn the trapped creature remains on the field, the owner gets 1 soul. If the owner summons something in front of that slot after the opponent's creature is destroyed, that creature receives 6 damage every turn

sower=Sower
sower.tangling=Tangling
sower.tangling.description=Transfers X health from the target creature to the opposite creature (X = attack of the target creature).
sower.devouring=Devouring
sower.devouring.description=Sacrifices a friendly creature and doubles the attack of the rest of the friendly creatures for 1 turn.
sower.monster=Monster plant
sower.monster.description=When it kills a creature, it fully heals all monster plants on the board.
sower.pollination=Pollination
sower.pollination.description=Turns the target creature of level X into a special creature of level (X minus 3) with full hp and heals X life to the owner.
sower.sundew=Blood sundew
sower.sundew.description=When it deals damage, it regenerates the same amount of hp.
sower.predator=Predator plant
sower.predator.description=When it attacks a creature, it deals X additional damage to it (X = difference between its current and max hp).
sower.drake=Forest drake
sower.drake.description=When the owner summons a special creature, it creates a copy of it in the nearest empty slot.
sower.flower=Fiery flower
sower.flower.description=Every turn it halves the health of the enemy creature with the highest hp and gives 1 fire power to the owner. When it enters the game, it deals X damage to the opponent (X = its fire power)

warp=Warp
warp.errant=Errant
warp.errant.description=Hides in the shadows after killing a creature and comes back when damaged
warp.quake=Earthquake
warp.quake.description=Deals to each enemy creature damage equal to the difference between the owner's and the opponent's powers of its element
warp.cloak=Cloak
warp.cloak.description=Should be summoned on an existing creature; it adds that creature's attack and life to its own. When summoned, it gives 2 mana of the cloaked creature's element. When it dies, it restores that creature
warp.photographer=Photographer
warp.photographer.description=When an adjacent creature dies, it is replaced by a Photographer with the same hp
warp.schizo=Schizo
warp.schizo.description=When summoned, the opposite creature loses its abilities until Schizo's death
warp.ram=Ram
warp.ram.description=When summoned, it destroys the opposite creature and gives its owner X - 3 mana (X = cost of that creature)
warp.stranger=Stranger
warp.stranger.description=Its attack is equal to the highest enemy power. When summoned, it copies the effect of the opposite creature (except multiattack and immediate effects)
warp.queen=Warp Queen
warp.queen.description=When summoned, it deals 4 damage to enemy creatures. They lose their abilities until the end of the next turn

disciples=Disciples
disciples.description=Prisoner spawns at the end of the owner's turn in a random empty slot of the owner. When a prisoner dies, the owner loses 1 mana from the 2 highest basic houses and\nearns 1 special mana. When a disciple is low on life (< half), its belief is weakened and it loses 1/3 attack.
disciples.prisoner=Prisoner
disciples.prisoner.description=When dying, it loses 1 mana from the two highest basic houses and earns 1 special mana.
disciples.enraged=Enraged Prisoner
disciples.enraged.description=Immune to spells and abilities while the liberator is alive.
disciples.drug=Speed drug
disciples.drug.description=Adds +1 attack to the owner's creatures and deals 4 damage to them. The effect disappears when the prisoner dies.
disciples.preacher=Preacher
disciples.preacher.description=While in play, normal cards cost 1 more mana. It increases the growth of special mana by 1 and adds 1 attack to the prisoner.
disciples.monk=Dark monk
disciples.monk.description=While alive, it decreases the opponent's fire mana by 2 and increases its cost by 1.
disciples.prophet=false prophet
disciples.prophet.description=Until it dies, normal cards cost 1 more mana. It gives 2 mana to each basic house and takes one mana back when dying.
disciples.escape=Astral escape
disciples.escape.description=Damage done to the prisoner is redirected to Astral Escape. The prisoner attacks the opponent directly.
disciples.scarecrow=Scarecrow
disciples.scarecrow.description=Stuns and deals 4 damage to the opposite creature. It can switch with the prisoner to the nearest empty slot
disciples.wind=wind of oppression
disciples.wind.description=Stuns the scarecrow's opposite creature and its neighbors. Deals 4 damage to them
disciples.liberator=Liberator
disciples.liberator.description=Turns the prisoner into an Enraged Prisoner. When dying, it inflicts {0} damage to it.
disciples.falconer=Falconer
disciples.falconer.description=Each turn, it deals damage equal to the slot distance to opponent creatures.
disciples.madden=Madden
disciples.madden.description=Deals 8 damage to an opponent creature. It heals 3 for each creature killed and adds 1 attack to everyone.

junk=Junk
junk.screamer=Screamer
junk.screamer.description=+1 attack for each other Screamer in play
junk.poison=Poison flower
junk.poison.description=Deals 5 damage to the owner's target, and to the opposite and adjacent cards. It removes 1 mana from both the owner and the opposite creature.
junk.fortune=Junkyard fortune
junk.fortune.description=Absorbs the first 4 damage dealt to the owner
junk.chain=Chain controller
junk.chain.description=Mirrors the summon of an adjacent creature of cost < 4. When an adjacent creature of cost < 6 dies, it fills the slot with another weak creature nearby
junk.assassin=Roaming assassin
junk.assassin.description=If unblocked, it moves to the closest unblocked opponent (leftmost if a choice is needed) and deals 5 damage to it at the end of the turn.
junk.factory=Factory Bot
junk.factory.description=When summoned with a creature of cost < 6 on one side and an empty slot on the other, it copies that creature into the empty slot. It also copies an adjacent summoned creature of cost < 6 into the empty slot on the other side.
junk.bot=Recycling Bot
junk.bot.description=When one of the owner's creatures dies, that creature heals 6 life, and heals 2 life to its owner for each creature lost.
junk.cyborg=Trash Cyborg
junk.cyborg.description=When it enters the game, it fills the board with trash 2/11. Every turn, 2 pieces of trash assemble into the cyborg, increasing its life and attack by the amount of their remaining life (it can potentially become 13/85).
junk.trash=Trash

snowblood=Snowblood
snowblood.tracker=Tracker
snowblood.tracker.description=When a creature is summoned in an adjacent slot, it gains invulnerability for 1 turn
snowblood.hunter=Bounty hunter
snowblood.hunter.description=When summoned, it deals 2 damage to the opposite creature. When it kills the opposite creature, it gives the owner 1/3 of its cost in mana (rounded up)
snowblood.maiko=Maiko
snowblood.maiko.description=While alive, it decreases by 1 the attack of the opposite creature and its neighbors. Each turn, it heals 1 hp to adjacent friendly creatures. After its summon, its card is replaced with a death letter (cost 3, 0/3 - reduces damage dealt to it to 1 and cannot be healed). When it dies, it deals 15 damage to the opposite creature
snowblood.letter=Death letter
snowblood.letter.description=Reduces damage to 1. When it dies, it deals 15 damage to the opposite creature. (Cannot be healed)
snowblood.echo=Echo
snowblood.echo.description=Instantly triggers for all friendly creatures "each turn" and "direct" effects, then all friendly Snowblood creatures attack
snowblood.kojiro=Kojiro
snowblood.kojiro.description=Can be summoned on any slot of the owner, occupied or empty. It attacks when summoned, with +4 attack on that turn. Every turn, it deals 2 damage to the opposite creature and all its neighbors (neighbors are the successive filled slots around it)
snowblood.guide=War guide
snowblood.guide.description=The next summoned creature deals to all enemy creatures damage equal to its attack. When a friendly special creature is summoned, it heals 1 hp to all its neighbors (neighbors are the successive filled slots around it)
snowblood.janus=Janus
snowblood.janus.description=When summoned, it gives +1 mana for each creature in the two other slots on its side and heals its owner for 2 hp. Each turn, it deals 2 damage to all the owner's creatures on the opposite side of the board
snowblood.amaterasu=Amaterasu
snowblood.amaterasu.description=When the owner summons a creature of element:\n- fire: Amaterasu deals 4 damage to the opposite creature\n- water: increases the lowest power by 1\n- air: deals 2 damage to the opponent\n- earth: heals 2 hp to the owner

zen=Zen
zen.elementesist=Elementalist
zen.elementesist.description=Deals damage to the opposite card, and to all opposite cards of the same mana.
zen.redlight=Redlight
zen.redlight.description=Attacks opposite and adjacent slots
zen.focus=Focus
zen.focus.description=Gain 2 mana of the target creature's house, and 1 mana of the house of each adjacent creature.
zen.guard=Electric guard
zen.guard.description=Deals 3 damage to creatures that damage the owner.
zen.dreamer=Dreamer
zen.dreamer.description=Each turn deals 4 damage to the weakest opponent creature (leftmost if tied).
zen.mimic=Mimic
zen.mimic.description=At the start of your turn, a cocoon appears on a random empty slot. Summon a creature there to gain 2 mana of its house and 3 life.
zen.cocoon=Cocoon
zen.cocoon.description=Summon a creature here to gain 2 mana of its house and 3 life.
zen.fighter=Zen Fighter
zen.fighter.description=If the opposite creature has stronger attack or more life or higher cost, each turn gains 1 mana of that creature's house and heals 3 life. Absorbs 5 damage from spells and abilities. Each time the owner is hit, heals himself by 1.
zen.inertia=Inertia
zen.inertia.description=Immune to spells. Spawns Matter in the next empty slot to the right. When summoned and each turn, while Matter is in play, heals the owner's weakest creature by 3.
zen.matter=Matter
zen.matter.description=When summoned and each turn, while Inertia is in play, deals 3 damage to the opponent's strongest creature.

highpriest=High Priest
highpriest.description=Class special ability - divine path: depending on whether the total level of the owner's Fire and Earth creatures or of its Water and Air creatures is higher, its special draw changes, becoming Ra's or Set's.
highpriest.Sacredscarab=Sacred scarab
highpriest.Sacredscarab.description=Decreases non-magical damage received by it by 2X; X = number of its neighbors.
highpriest.sunpriest=Sun priest
highpriest.sunpriest.description=When it attacks, it deals to all enemy creatures damage equal to the owner's lowest power.
highpriest.Apis=Apis
highpriest.Apis.description=Every turn, it gives the owner 1 special power and 3 hp for each other Apis on the board.
highpriest.Bennu=Bennu
highpriest.Bennu.description=If killed by an enemy card, it attacks the opposite slot with tripled attack before death.
highpriest.EyeofWajet=Eye of Wajet
highpriest.EyeofWajet.description=It heals its owner and its creatures for 1 hp for each revealed owner card, and deals the same damage to all enemies.
highpriest.sphinx=Sphinx
highpriest.sphinx.description=When it dies, it leaves a puzzle 0/6. If the puzzle was destroyed by an enemy creature, the Sphinx is reborn with halved hp. If the puzzle was destroyed by an enemy spell or ability, the opponent loses 3 power of the highest element.
highpriest.Ouroboros=Ouroboros
highpriest.Ouroboros.description=At the beginning of the owner's turn, it summons a serpent of eternity 2/8 in the nearest empty slot. At the end of the opponent's turn, the serpent dies and heals X hp to the owner and to Ouroboros (X = its remaining hp).
highpriest.Wingeddragon=Winged dragon of Ra
highpriest.Wingeddragon.description=When it enters the game, it summons a sun stone 0/22 in the nearest empty slot (it increases damage from the owner's spells by 2 and increases Ra's attack by 1 every turn).
highpriest.Ancientcrocodile=Ancient crocodile
highpriest.Ancientcrocodile.description=When it attacks, it skips the next turn (digestion).
highpriest.Serpopard=Serpopard
highpriest.Serpopard.description=When the owner summons a special creature, it moves into the nearest unblocked slot and doubles its attack for 1 turn.
highpriest.Anubite=Anubite
highpriest.Anubite.description=When it kills a creature, it summons a guardian mummy 4/20 with no special ability in the nearest empty slot.
highpriest.Babi=Babi
highpriest.Babi.description=When the opponent's power grows, it deals the same damage to the opposite creature.
highpriest.Curseofchaos=Curse of chaos
highpriest.Curseofchaos.description=Deals to the target creature and its neighbors damage equal to their total attack.
highpriest.Simoom=Simoom
highpriest.Simoom.description=Reduces the attack of all enemy creatures to 2. They restore 3 attack per turn starting the next turn.
highpriest.Ammit=Ammit
highpriest.Ammit.description=When any creature dies, it deals to its owner damage equal to its power of that element and gives 1 special power to the owner.
highpriest.Apep=Apep
highpriest.Apep.description=Attacks all enemies. Every turn, it decreases the elemental powers of both players by 1.
highpriest.puzzle=puzzle
highpriest.puzzle.description=Left behind when the Sphinx dies. If an enemy creature destroys it, the Sphinx is reborn in its place with half its life. If a spell or ability destroys it, the opponent loses 3 power of the highest element.
highpriest.guardianmummy=guardian mummy
highpriest.sunstone=sun stone
highpriest.sunstone.description=Increases damage from the owner's spells by 2 and increases Ra's attack by 1 every turn
highpriest.serpent=serpent of eternity
highpriest.serpent.description=No special ability

shadowmage=Shadowmage
shadowmage.description=Specialization: Stealth. The Shadowmage weaves immense protection that fades - shields, silence, and unseen blades that last only a turn.
shadowmage.archer=Shadow Archer
shadowmage.archer.description=When summoned, deals 6 damage to the opponent. When Shadow Archer dies, the opponent heals 6 life.
shadowmage.stalker=Shade Stalker
shadowmage.stalker.description=Shade Stalker's position is not revealed to the opponent until it receives damage.
shadowmage.weaver=Nightshroud Weaver
shadowmage.weaver.description=When summoned, neighboring creatures ignore all damage until the end of the opponent's next turn.
shadowmage.silencer=Silencer
shadowmage.silencer.description=When summoned, the opposing creature cannot attack, and the opponent cannot use cards of that creature's element, until the end of their next turn.
shadowmage.eclipse=Eclipse
shadowmage.eclipse.description=Increases the caster's Fire, Water, Air, and Earth powers by 2. The caster ignores up to 30 damage until the end of the opponent's next turn.
shadowmage.spike=Spike of Pain
shadowmage.spike.description=Deals 16 damage to all enemy creatures. At the end of the caster's turn, heals all enemy creatures by 16 life.
shadowmage.warden=Dark Warden
shadowmage.warden.description=Dark Warden always ignores the first damage it receives every turn.
shadowmage.assassin=Grandmaster Assassin
shadowmage.assassin.description=When summoned, deals 12 damage to the creature in the opposing slot. Can replace any allied creature of cost 9 or lower. The caster gains power of the replaced creature's element equal to half that creature's cost (rounded up).

battlemage=Battlemage
battlemage.description=Specialization: Tactics. Battlemage creatures pair aggressive stats with defensive abilities, or the reverse. Spells serve both attack and protection. Keep the line in balance, then tip it.
battlemage.taunt=Taunt
battlemage.taunt.description=Your target creature immediately deals damage equal to its attack to the opponent. If you target an enemy creature with a lower attack than the creature opposing it, stun it.
battlemage.rune=Rune Warrior
battlemage.rune.description=Reduce damage of opponent's spells by 2.
battlemage.sergeant=Silver Sergeant
battlemage.sergeant.description=Adjacent non-wall creatures deal 3 extra damage to the opponent while unblocked.
battlemage.knight=Charging Knight
battlemage.knight.description=Charging Knight attacks twice while blocked. If it is no longer blocked after the first attack, it does not attack a second time.
battlemage.fieldmage=Field Mage
battlemage.fieldmage.description=Enemy spell damage dealt to the owner or the owner's other creatures is redirected to Field Mage.
battlemage.cavalier=Golden Cavalier
battlemage.cavalier.description=Gains 1 attack for each empty slot on your side of the board. Banned combo: Apocalypse.
battlemage.warcry=Sonorous Warcry
battlemage.warcry.description=Deals 9 damage to the opponent and all enemy creatures. Those enemy creatures lose their abilities until the end of your next turn.
battlemage.retinue=General's Retinue
battlemage.retinue.description=You may play an additional creature this turn. While General's Retinue remains in play, the next Tactics card you play costs 1 less.

tinker=Tinker
tinker.description=Specialization: Tinker. A steampunk workshop that seeds the enemy line with ticking bombs, then spends them - extra swings, growing soldiers, and a queen who turns every fuse into a blast.
tinker.bomb=Tinkerbomb
tinker.bomb.description=Loses 1 life each turn. When Tinkerbomb dies, it deals 3 damage to its owner.
tinker.plant=Tinker
tinker.plant.description=Place a Tinkerbomb in target open opponent slot.
tinker.spider=Clockwork Spider
tinker.spider.description=When summoned, places a Tinkerbomb in the opposite slot if it is empty. When Clockwork Spider kills an opposing creature, it attacks again.
tinker.falcon=Clockwork Falcon
tinker.falcon.description=When summoned, places a Tinkerbomb in the rightmost open opponent slot. When it dies, places a Tinkerbomb in the leftmost open opponent slot.
tinker.scatter=Scatterbomb
tinker.scatter.description=Deals 8 damage to all opponent creatures. For each creature that dies from this spell, place a Tinkerbomb in the slot that creature occupied.
tinker.soldier=Steam Soldier
tinker.soldier.description=Each time an opponent Tinkerbomb dies, Steam Soldier's attack is increased by 1 permanently.
tinker.automaton=Automaton
tinker.automaton.description=At the end of its owner's turn, Automaton places a Tinkerbomb in a random open opponent slot.
tinker.queen=Clockwork Queen
tinker.queen.description=When summoned, kills all opponent Tinkerbombs in play. While Clockwork Queen is in play, all Tinkerbombs deal an additional 3 damage to the opponent.
tinker.dragon=Steam Dragon
tinker.dragon.description=Attacks when summoned. When summoned, places a Tinkerbomb in three random open opponent slots. Each time Steam Dragon kills an opposing creature, its owner gains 1 Tinker power.

conjurer=Conjurer
conjurer.description=Specialization: Conjuration. Spells and creatures feed each other: every spell you cast triggers Conjure on your creatures. Attack swings, type-mana, and a second pulse from the same play.
conjurer.nectar=Lavender nectar
conjurer.nectar.description=Heal target creature by 5 (yours or an opponent's). You gain 1 power of that creature's type.
conjurer.bravery=Bravery
conjurer.bravery.description=Increase the attack of each of your non-wall creatures by 1 until end of turn. Gain 1 Conjuration power.
conjurer.warmage=War mage
conjurer.warmage.description=When summoned, your creatures gain +2 attack until end of turn. Conjure: your other creatures gain +2 attack until end of turn.
conjurer.golem=Bone golem
conjurer.golem.description=Bone golem receives no damage from spells and abilities. Conjure: Bone golem's attack increases by 1 permanently. Your other creatures are healed by 3.
conjurer.nurture=Nurture rite
conjurer.nurture.description=Your creatures do not attack this turn. After special effects they are healed by their attack plus 4, and you are healed by the total of their attack plus 4.
conjurer.pain=Pain of essence
conjurer.pain.description=Deals 3 damage to target opponent creature and the opponent. Deals 2 additional damage for each power the opponent has of that creature's type.
conjurer.guard=Unholy guard
conjurer.guard.description=When summoned, decreases the attack of each opponent creature by 3 until the end of the opponent's turn. Conjure: permanently decreases the attack of each opponent creature by 1.
conjurer.mystic=Dark mystic
conjurer.mystic.description=When summoned, increases Fire, Water, Air and Earth power by 2. Conjure: increase Conjuration power by 2.

rogue=Rogue
rogue.description=Specialization: Sneak. Ambush the blocked line, steal growth, and finish what a stab starts. Small bodies, dirty timing.
rogue.sneak=Sneak Attack
rogue.sneak.description=Stuns target creature and deals 4 damage to it. If the target is blocked, this spell deals double damage.
rogue.trickster=Halfling Trickster
rogue.trickster.description=When opposed by a creature, deals 2 damage to the opponent at the beginning of its owner's turn.
rogue.thief=Energy Thief
rogue.thief.description=At the beginning of its owner's turn, reduces by 1 the opponent's power of the creature type opposite Energy Thief.
rogue.dancer=Shadow Dancer
rogue.dancer.description=When Shadow Dancer is opposed by a creature, she performs an extra attack.
rogue.fighter=Street Fighter
rogue.fighter.description=Each time Street Fighter receives damage from the creature in the opposite slot, his attack is permanently increased by 2.
rogue.assassin=Elven Assassin
rogue.assassin.description=When summoned, deals 8 damage to the creature in the opposite slot. If that creature dies, she attacks immediately.
rogue.trap=Arcane Trap
rogue.trap.description=Reduces all of the opponent's powers by 2 and forces them to skip their next turn.
rogue.archer=Dark Archer
rogue.archer.description=When summoned, destroys all opponent creatures with 6 life or less. When Dark Archer kills the creature in the opposite slot, deals 3 damage to the opponent.

meteomancer=Meteomancers
meteomancer.description=Specialization: Prescience. When you summon a Meteo creature, choose a basic element (Fire, Water, Air, or Earth) as your Called Element. Most Meteo cards trigger off the opponent playing cards of that element.
meteomancer.thief=Lightning Thief
meteomancer.thief.description=When the opponent uses a spell of the Called Element, Call to Thunder is cast on the opponent's highest-life creature (6 damage to it and 6 to the opponent).
meteomancer.extremophile=Extremophile
meteomancer.extremophile.description=Immune to damage from opponent's spells and abilities. When the opponent plays a card of the Called Element, another Extremophile appears in its owner's rightmost empty slot.
meteomancer.clairvoyant=Clairvoyant
meteomancer.clairvoyant.description=When summoned, the opponent gains 3 mana of the new Called Element and loses 1 mana of every other type.
meteomancer.mistwalker=Mistwalker
meteomancer.mistwalker.description=The Called Element chosen when Mistwalker is summoned is not revealed to the opponent. Mistwalker's attack is increased by 5 while it is your only Meteo creature in play.
meteomancer.grenadier=Astral Grenadier
meteomancer.grenadier.description=When the opponent summons a non-Special creature, it loses half its life (rounded up) if it belongs to the Called Element and takes 4 damage otherwise.
meteomancer.fateweaver=Fateweaver
meteomancer.fateweaver.description=When the opponent plays a card of the Called Element, gain 4 mana of that element and play an extra card of the Called Element on your next turn.
meteomancer.prism=Prism Mage
meteomancer.prism.description=Each turn, deals damage to each opponent creature equal to half the opponent's mana in the Called Element (rounded down). When the opponent plays a card of the Called Element, Prism Mage's attack is permanently increased by 1.
meteomancer.storm=Astral Storm
meteomancer.storm.description=When the opponent plays a card of the Called Element, deals 19 damage to the opponent and each opponent creature.

quantumancer=Quantumancer
quantumancer.description=Specialization: Superposition. Spells that scale with enemy mana, warriors that share their damage, and seals that steal the opponent's options.
quantumancer.surge=Power Surge
quantumancer.surge.description=Deals damage to each opponent creature equal to the opponent's mana in that creature's House, but not less than 3 damage.
quantumancer.kineticist=Kineticist
quantumancer.kineticist.description=Opponent's spells and abilities heal Kineticist instead of damaging it, and permanently increase its attack by 1.
quantumancer.warrior=Dimension Warrior
quantumancer.warrior.description=When Dimension Warrior attacks a creature, it also deals damage to the opponent equal to its attack power.
quantumancer.martyr=Magnetic Martyr
quantumancer.martyr.description=All damage dealt to your creatures by opponent's spells is dealt to Magnetic Martyr instead.
quantumancer.wall=Phosphor Wall
quantumancer.wall.description=When Phosphor Wall is attacked, it deals damage to each opponent creature equal to the level of the creature that attacked it.
quantumancer.sealing=Spirit of Sealing
quantumancer.sealing.description=When the opponent plays a card, the opponent cannot play that card again until Spirit of Sealing dies. While it is in play, its owner may not play another Spirit of Sealing.
quantumancer.fusion=Fusion Elemental
quantumancer.fusion.description=Fusion Elemental's attack is equal to the opponent's highest mana pool. Decreases the opponent's lowest mana pool by 1 each turn.
quantumancer.cosmic=Cosmic Mage
quantumancer.cosmic.description=When Cosmic Mage comes into play, gain an extra turn to replay a spell of cost 10 or less played by the opponent, for free. You may skip the replay.
quantumancer.cosmic.choose=Replay an opponent's spell for free, or skip
meteomancer.choose=Called element (current: {0})
meteomancer.noelement=none
powermancer=Powermancer
powermancer.description=Specialization: Power. Bargain with special power to cast anything, sacrifice creatures for power and life, and tax the opponent's power.
powermancer.bargain=Infernal Bargain
powermancer.bargain.description=You may play any basic card by spending all your power of its type and the rest from your special power. Allows you to play an additional card this turn. Cannot be played during your first two turns.
powermancer.burial=Eternal Burial
powermancer.burial.description=Sacrifice a creature: gain 3 power of its type and 1 of every other type. Gain life equal to twice its cost, up to 10.
powermancer.hunter=Power Hunter
powermancer.hunter.description=Whenever Power Hunter damages an opponent creature, gain 1 special power. Whenever it damages the opponent, reduce a random opponent power by 1.
powermancer.tower=Ivory Tower
powermancer.tower.description=While in play, your spells cost 2 less and your other cards 1 less. Whenever you play a card, deal 3 damage to the opponent; gain 3 life instead if it was a spell.
powermancer.equilibrium=Equilibrium
powermancer.equilibrium.description=Deal damage to the opponent equal to their highest power, then reduce that power by 2. Gain life equal to your lowest power, then increase that power by 2.
powermancer.hound=Astral Hound
powermancer.hound.description=Increase your special mana growth by 1 and decrease the opponent's by 1.
powermancer.stasis=Stasis
powermancer.stasis.description=Reduce each opponent power by 1, stun all opponent creatures, and prevent the opponent from playing cards next turn.
powermancer.rainbow=Rainbow Avatars
powermancer.rainbow.description=Summon four 2/16 Avatars into random empty slots: one each of Fire, Water, Air and Earth. Each increases its element's mana growth by 1 while in play.
powermancer.avatar.fire=Fire Avatar
powermancer.avatar.fire.description=Avatar of Fire. Increases your fire mana growth by 1 while in play.
powermancer.avatar.water=Water Avatar
powermancer.avatar.water.description=Avatar of Water. Increases your water mana growth by 1 while in play.
powermancer.avatar.air=Air Avatar
powermancer.avatar.air.description=Avatar of Air. Increases your air mana growth by 1 while in play.
powermancer.avatar.earth=Earth Avatar
powermancer.avatar.earth.description=Avatar of Earth. Increases your earth mana growth by 1 while in play.

shadowcaster=Shadowcaster
shadowcaster.description=Specialization: Dark. Dark power is a separate counter, not mana. Feed on the enemy's fear, cast shadows over the battlefield and call the cursed Dark Elves from the Shadow Realms.
shadowcaster.bat=Giant Bat
shadowcaster.bat.description=Each time Giant Bat deals damage to an opposing creature, it heals itself 3 life.
shadowcaster.wave=Shadow Wave
shadowcaster.wave.description=Deals X+2 damage to all opponent's creatures (X = caster's Dark power).
shadowcaster.noble=Dark Elf Noble
shadowcaster.noble.description=If killed by an opponent's spell, increases its owner's Dark power by 2.
shadowcaster.mage=Dark Elf Mage
shadowcaster.mage.description=Increases the cost of all its owner's spells by 1 and their damage by 2. Each time its owner casts a spell, increases its owner's Dark power by 1.
shadowcaster.scythe=Shadow Scythe
shadowcaster.scythe.description=Deals X+4 damage to all opponent's creatures (X = caster's Dark power). For each creature killed, deals 2 damage to the opponent and increases the caster's Dark power by 1.
shadowcaster.assassin=Dark Elf Assassin
shadowcaster.assassin.description=Attacks in the same turn it is summoned. Each time it kills an opponent's creature, increases its owner's Dark power by 1.
shadowcaster.moonblade=Moonblade
shadowcaster.moonblade.description=At the beginning of its owner's turn, deals damage to all opponent's creatures equal to its owner's Dark power. Each time it kills a creature, increases its owner's Dark power by 1.
shadowcaster.priestess=Priestess of Shadows
shadowcaster.priestess.description=When summoned, stuns all opponent's creatures. When killed, increases its owner's Dark power by 2.

spiritshaman=Spirit Shaman
spiritshaman.description=Specialization: Release. Spirit power is the special mana. Summon Spirit Totems; when a totem's Release condition is met it is replaced in its slot by its Spirit creature.
spiritshaman.tortoise=Tortoise Totem
spiritshaman.tortoise.description=When summoned, it releases every Totem in neighboring slots. Release: when its owner summons another Spirit creature.
spiritshaman.tortoise.spirit=Tortoise Spirit
spiritshaman.tortoise.spirit.description=When released, increases its owner's Spirit power by 1.
spiritshaman.fox=Fox Totem
spiritshaman.fox.description=When summoned, deals damage to the opposite creature equal to that creature's attack. Release: at the beginning of its owner's turn, if its life is 5 or less.
spiritshaman.fox.spirit=Fox Spirit
spiritshaman.fox.spirit.description=When released, all other Totems of its owner are released too, even if their Release condition is not met.
spiritshaman.deer=Deer Totem
spiritshaman.deer.description=Each turn heals its owner 1 life. Release: at the beginning of its owner's turn, if the owner's Earth power is 7 or more.
spiritshaman.deer.spirit=Deer Spirit
spiritshaman.deer.spirit.description=When released, heals all other creatures of its owner 6 life.
spiritshaman.owl=Owl Totem
spiritshaman.owl.description=When summoned, increases its owner's lowest Fire, Water, Air or Earth power by 1. Release: when one of those powers is 1 or less.
spiritshaman.owl.spirit=Owl Spirit
spiritshaman.owl.spirit.description=When released, increases its owner's lowest Fire, Water, Air or Earth power by 2.
spiritshaman.panther=Panther Totem
spiritshaman.panther.description=Its attack increases by 1 each turn, but it may not attack. Release: when the combined attack of Panther Totem and its neighbors is 12 or more.
spiritshaman.panther.spirit=Panther Spirit
spiritshaman.panther.spirit.description=Its attack is 2 plus the attack Panther Totem had when released. When it kills an opponent's creature it attacks again immediately.
spiritshaman.awakening=Spiritual Awakening
spiritshaman.awakening.description=Heals the caster and all the caster's creatures by an amount equal to the owner's Spirit power (before the spell's cost is paid) and releases all the caster's Totems.
spiritshaman.bear=Bear Totem
spiritshaman.bear.description=In the turn it is summoned, increases the attack of all other creatures of its owner by 2. Release: when there are at least 8 creatures on the board (including itself).
spiritshaman.bear.spirit=Bear Spirit
spiritshaman.bear.spirit.description=When released, deals 8 damage to all opponent's creatures.
spiritshaman.eagle=Eagle Totem
spiritshaman.eagle.description=When summoned, increases its owner's Spirit power by 4. Release: when its owner's Spirit power is 8 or more.
spiritshaman.eagle.spirit=Eagle Spirit
spiritshaman.eagle.spirit.description=When released, reduces its owner's Spirit power by 4 and increases all the owner's other powers by 2.
chronomaster=Chronomaster
chronomaster.description=Specialization: Time. Freeze the present, skip ahead, and rewind the board to yesterday.
chronomaster.freeze=Freeze
chronomaster.freeze.description=Target creature skips its next turn.
chronomaster.sprites=Light Sprites
chronomaster.sprites.description=These ultra-fast creatures cannot be blocked.
chronomaster.accelerate=Accelerate Time
chronomaster.accelerate.description=Target friendly creature attacks 2 or 3 times this turn.
chronomaster.wall=Time Distortion Wall
chronomaster.wall.description=While in play, the owner cannot be damaged. Its creatures can still be damaged.
chronomaster.aging=Aging
chronomaster.aging.description=Target creature permanently loses 3 attack.
chronomaster.groundhog=Groundhog Day
chronomaster.groundhog.description=The board returns to how it was at the start of the previous turn. Players keep their current life. Both players lose 1 mana in every house. Counters board-wiping and other deadly spells from the last turn.
chronomaster.queen=Chrono Queen
chronomaster.queen.description=When summoned, all friendly creatures can attack one more time this turn.
chronomaster.king=Chrono King
chronomaster.king.description=Next turn the owner can play two cards.
chronomaster.king.phase=Play a second card

troopers=Troopers
troopers.marine.description=When it is summoned on the opponent's side of the board, Marine deals 4 damage to itself.
troopers.conscription.description=Gives 1 Troopers mana. Costs 0 the first time it is played, then 1 more each time after.
troopers.barracks.description=Increases Troopers mana growth by 1 every turn
troopers.wraith.description=Every turn, deals 2 damage to all opponent creatures
troopers.goliath.description=Reduces non-magical damage dealt to it by 1. It cannot be damaged by spells or abilities.
SiegeTank=Siege Tank
troopers.siegetank.description=Every turn, deals 8 damage to the opposing creature with the most life
NuclearMissile=Nuclear Missile
troopers.nuclearmissile.description=Deals 19 damage to all opponent creatures
ScienceVessel=Science Vessel
troopers.sciencevessel.description=When summoned, deals 12 damage to all opponent creatures

dudes=Dudes

settings.dev=Dev
settings.debug=Debug mode (campaign: win without playing)
button.debugwin=Win (debug)
