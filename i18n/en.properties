campaign.title=Campaign
campaign.intro=You've just arrived by boat in a country you don't know. You don't know why, but you remember that, long ago, your master warned you that a time might come when the elements of nature would fall apart, and that, when that time came, the few lessons he had given you would prove useful. You hope to find a peaceful land, but when you look to the far mountains, something worries you.
campaign.day=Day
campaign.night=Night
campaign.complete=The summit is yours
campaign.epilogue=You don't understand why you have gone so far. You suddenly have a vision. A long time ago, there was a community of mancers that were fighting each other in a playful manner to progress in their mastery. There was magic in the balance of those old times. You remember the moment you had to leave that community, and why you had to leave. At that moment you felt an echo of magic in whatever you were doing.
campaign.epilogue.menu=Return to menu
