campaign.continue=Continue
campaign.night.rest.title=Night
campaign.night.rest=You wake up in a bed at night, in an unknown house.
campaign.night.visit.title=A stranger's voice
campaign.night.visit=I followed you into the mountain. You fainted after leaving Aelwyn, so my wife and I carried you here.
campaign.night.meal.title=A warm meal
campaign.night.meal=Sit down on the towel and eat something. Then you can explore the country by night if you want.
campaign.night.out.title=Under the stars
campaign.night.out=Your strength comes back slowly. You thank your hosts and step out, curious of the smell of the countryside at night, of the sounds of the nocturnal world.
campaign.next=Next
campaign.antimancer.wake.title=Far in the land
campaign.antimancer.wake=After meeting Corvin, you lost consciousness and wake up far in the land.
button.yes=Yes
campaign.entomologist.message=The woods are kind today. Walk with me a while - my little ones would love a gentle game.
campaign.farmer.message=You may find traps on the roads. Don't linger. Find your own path to discover this beautiful country.
campaign.duckwoman.message=The city's packed with folk these days. Keep your eyes open - with a bit of luck you'll meet a mage who actually knows their magic. Or take the quieter roads and skip the crowds.
campaign.duckwoman.choice.go_city=Go to the city
campaign.duckwoman.choice.avoid_city=Avoid the city
campaign.ram.message=Not many folk climb these mountains. Watch your step - some slopes are slippery.
campaign.rabbit.message=I heard there are powerful magicians up in the mountains. If you find them, they might teach you a few tricks.
campaign.beaver.message=You are passing through a peculiar forest. There is something magical here. Do you feel it?
campaign.otter.message=The swamp can be tricky if you're not used to it. Time can pass strangely here.
campaign.elder.message=At night some mages abuse their power, growing it with no restraint. Be careful on this road.
campaign.fishman.message=I can't sleep well, knowing the machines are working through the night. They keep running through my head now.
campaign.fisherman.message=Here some people lose themselves trying only to compete with the worst.
campaign.deer.message=Ask yourself why you want to confront these powerful mages - and what you left behind.
campaign.girl.message=When I wander at night, I hear eerie sounds from the mountain. You can climb toward them, or go down into the valley instead.
campaign.girl.choice.to_mountain=Continue to the mountain
campaign.girl.choice.to_valley=Go down into the valley
campaign.patou.message=You're far from your source. I hope you still have enough energy.
campaign.catboy.message=Easy to get lost in the dark. I'm scared of going back to my family - some of them have become powerful mages. Will you take me to the city, or keep to the land?
campaign.catboy.choice.bring_city=Bring him to the city
campaign.catboy.choice.stay_land=Continue in the land
campaign.panther.message=During the night, light can be as dangerous as shadows. You can forget the darkness.
campaign.crowd.message=The boy has disappeared into the crowd. You wonder what people are yelling about, and follow them.
campaign.gardener.message=I have a vegetable garden here, but the potatoes haven't grown for years. I have no idea why...
campaign.seasons.message=Fair weather for a match. Let's see which of us the year favors.
campaign.disciples.message=Oh! I hope I didn't scare you. Did you get lost? I can tell you that you didn't. If you'd let me weigh your soul.
campaign.dudes.message=Nice stroll so far. Pity it ends in the dirt. Try not to cry when I drop you.
campaign.mountainking.message=The stones remember every trespasser. Come closer - I'll carve your name into the cliff.
campaign.spiritshaman.message=The spirits of this ridge owe me a favor. Shall we see whom they answer when the drums start?
campaign.shaman.message=This is where the mountain begins. The dead already know which of us walks back down.
campaign.wind.message=I will tear the breath out of you and scatter what's left across these rocks.
campaign.antimancer.message=The sun is gone, and so is the courtesy. Still, I'll play - once.
campaign.warp.message=You look thinner in this light. One tug and you'll come apart.
campaign.rogue.message=Another tourist. Empty your pockets or empty your life - I haven't decided.
campaign.faerie_druid.message=The trees remember kinder guests. They will not mourn you.
campaign.vampires.message=Your pulse is a dinner bell. Sit down. I prefer my meals still talking.
campaign.darkpriest.message=Kneel. If you will not pray, I will write your last hymn in blood.
campaign.zen.message=You seem lost. Wake up! You may think this is a lesson. It is an ending. Be silent and lose.
campaign.darksider.message=I will unmake the path behind you. There is no village left to run to.
campaign.highpriest.message=The summit keeps no pilgrims. I will break you and bless the pieces.
campaign.end.win.title=Victory
campaign.end.lose.title=Defeat
campaign.end.map=Map
campaign.end.replay=Rematch
campaign.end.win=The road opens. I will remember this duel.
campaign.end.lose=That was the difference. Gather yourself and try again.
campaign.end.summoner.win=You raced me clean off the board. I never even got my swarm going - well played.
campaign.end.summoner.lose=I told my little ones you would run out of answers. Come, we can play again.
campaign.end.strategist.win=A cleaner line than mine. I planned for three of your moves and you played the fourth.
campaign.end.strategist.lose=I read your tempo two turns before you felt it. Shuffle up and hide it better.
campaign.end.gambler.win=Ha! You called my bluff with a better hand. The mountain takes my wager - walk on.
campaign.end.gambler.lose=The dice fell my way, friend. Double or nothing? The stones are waiting.
campaign.end.lecturer.win=Noted. Your thesis holds; mine needs revision. The board is yours.
campaign.end.lecturer.lose=A predictable refutation. Review your opening, then request another examination.
campaign.end.oracle.win=The threads lied to me. Walk on - the vision after you is brighter than the one with you in the dirt.
campaign.end.oracle.lose=I saw this ending before you drew. The trees, the bell, the hymn - they all rhyme. Try to surprise me.
campaign.end.diviner.win=So. The summit keeps a pilgrim after all. Climb - and be kinder than I was.
campaign.end.diviner.lose=The summit keeps no pilgrims yet. Mend your deck, steady your heart, and climb again.
campaign.entomologist.win=My little ones are tired, and so am I. Walk on gently - the woods will remember you kindly.
campaign.entomologist.lose=There, there. The woods are still kind, and my little ones liked your game. Rest, then play me again.
campaign.seasons.win=So the year favored you. Fair weather for your march - spend it well.
campaign.seasons.lose=The year favored me, as I said it might. Come back when the season turns.
campaign.disciples.win=Clever indeed - proven before the revival soured. Take my blessing with my defeat.
campaign.disciples.lose=Clever is not enough yet. The revival sours, as promised - pray, study, then come back.
campaign.dudes.win=Hah - dropped me in my own dirt. No tears, I swear. You earned the road, pit-fighter.
campaign.dudes.lose=Told you it ends in the dirt. Wipe your eyes, get up, and demand your rematch.
campaign.mountainking.win=The stones will remember YOU, not me. I gambled the cliff and lost - climb on.
campaign.mountainking.lose=Your name is on the cliff now, under a dozen others. The stones keep their wager - try again?
campaign.spiritshaman.lose=The spirits answered me, as they always do. Rest by the fire, then beat the drum again.
campaign.spiritshaman.win=The drums fell silent for me. The spirits answered you - go, the wind is waiting.
campaign.wind.win=My breath is spent - yours holds. A sound thesis, well defended. The peak is open.
campaign.wind.lose=Scattered, as I promised. Gather your breath and your cards, then face the wind again.
campaign.antimancer.win=One game, and you took it. Courtesy returns with the dawn - go, before I change my syllabus.
campaign.antimancer.lose=Once was enough, as I said. The dark keeps its courtesy - but I will grant one more game.
campaign.warp.win=You held together where I tugged hardest. One knot slipped - my analysis, and the road, are yours.
campaign.warp.lose=You came apart at the tug, just so. Let me pull you together for the next examination.
campaign.rogue.win=Pockets AND life - keep both, tourist. You paid for the lesson in full.
campaign.rogue.lose=I decided: pockets. Empty them, learn the streets, and come buy your lesson back.
campaign.faerie_druid.win=The trees will remember a kinder guest now - you. Pass gently under their branches.
campaign.faerie_druid.lose=The trees do not mourn you, as I warned. Grow wiser, and walk this grove again.
campaign.soulbinder.message=The grove keeps what slips between worlds. I will bind what you cannot hold.
campaign.soulbinder.win=Your soul stayed your own. Walk on - the night still has teeth.
campaign.soulbinder.lose=Bound, as the night requires. Slip free, then face me again.
campaign.vampires.win=The meal bites back. My bell rings hollow - drink the night air and go, still talking.
campaign.vampires.lose=Your pulse was a fine dinner bell, and you talked so prettily. Hunger returns - sit down again?
campaign.darkpriest.win=You would not kneel, and no hymn is written. The dark releases you - walk unbound.
campaign.darkpriest.lose=Your last hymn is written, in red as promised. Pray it scans better next time - kneel again?
campaign.zen.win=The ending refused you. Speak, then - the lesson is yours now, not mine.
campaign.zen.lose=Silent, and lost, as instructed. When you find your voice, I will hear your rematch.
campaign.shaman.win=The dead were wrong - YOU walk back down. The mountain opens its wager to you.
campaign.shaman.lose=The dead knew, as I said. They keep your bones warm - come win them back.
campaign.darksider.win=The path holds after all. Your village stands - run home and tell them the way stays open.
campaign.darksider.lose=The path behind you is unmade. No village, no retreat - only a rematch forward.
campaign.highpriest.win=The summit keeps a pilgrim at last. I am broken and blessed both - climb, keeper of the peak.
campaign.highpriest.lose=Broken, as promised - let me bless the pieces. Mend yourself and climb again.
campaign.tinker.message=Gears turn, tourist, and so does my patience. Let's see how you hold up under load.
campaign.tinker.win=Jammed. My machine, not yours - take the road, and mind the sparks.
campaign.tinker.lose=Stripped for parts. Come back with better tolerances.
campaign.battlemage.message=Steel and sigil together. You'll find I'm hard to read and harder to stop.
campaign.battlemage.win=Parried, then broken. Fair enough - the field is yours.
campaign.battlemage.lose=Blade and spell, as promised. Drill your forms and return.
campaign.snowblood.message=The cold keeps what it takes. Come closer, I'll show you how quiet a heart can go.
campaign.snowblood.win=You kept your warmth. Rare. Go on before the snow changes its mind.
campaign.snowblood.lose=Frozen where you stood. The thaw will come - so may you.
campaign.shadowmage.message=Your shadow already left you. I'm only here to collect the rest.
campaign.shadowmage.win=The shadows lost their grip. Walk on, while you still cast one.
campaign.shadowmage.lose=Swallowed whole. Return when you've found your own shadow.
campaign.shadowcaster.message=Light is a loan, and I'm calling it in. Stand still - this won't take long.
campaign.shadowcaster.win=The dark recoils from you. I never saw that coming.
campaign.shadowcaster.lose=Cast out, as the dark foretold. Seek the light and come again.
campaign.soulreaper.message=Every soul has a harvest day. Yours is a fine, late crop.
campaign.soulreaper.win=My scythe dulled on you. Go - the harvest can wait.
campaign.soulreaper.lose=Reaped clean. Your soul will keep till you try again.
campaign.conjurer.message=Pick a card, any card - they're all mine, and they all hate you.
campaign.conjurer.win=A trick I didn't foresee. Take the stage, then.
campaign.conjurer.lose=The curtain falls on you. Practice your sleight and return.
campaign.chronomaster.message=Your time is counted.
campaign.chronomaster.win=A few grains left. Spend them before I turn the glass.
campaign.chronomaster.lose=Counted, and spent. Come back if any sand remains.
campaign.limbo.message=Neither day nor night, neither won nor lost. Here is where all roads wait.
campaign.limbo.win=You walk out of the in-between. Few do. The summit calls.
campaign.limbo.lose=Held in the between. Stay a while, then try again.
campaign.meteomancer.message=The sky told me you were coming. It also told me how this ends - with rain.
campaign.meteomancer.win=Even the forecast can be wrong. Take the clear road, traveler.
campaign.meteomancer.lose=Rain, as the sky foretold. Dry off, then come back for a second front.
campaign.sower.message=Plant yourself in the mud and see what grows. I'm patient - the swamp is patient.
campaign.sower.win=You didn't take root. Fine - walk on, and mind the reeds.
campaign.sower.lose=Rooted at last. The swamp keeps what it sows - come back when you've sprouted.
campaign.fairy_knight.message=Halt, wanderer. These reeds are under the Fairy Court's protection. Draw, or yield.
campaign.fairy_knight.win=A fair duel, fairly lost. The Court yields you passage.
campaign.fairy_knight.lose=The Court's blade is swift. Train, and challenge me again.
campaign.dreamweaver.message=Shh. You're already half asleep, and the mountain hums a lullaby for you.
campaign.dreamweaver.win=You woke before the dream closed. Walk on, dreamer.
campaign.dreamweaver.lose=Sleep well. Dream of better openings, and return when you wake.
campaign.junk.message=Everything's worth something. Even you. Let's see what I can build out of your wreckage.
campaign.junk.win=Hah. Junk to treasure - you beat my pile. Take the road.
campaign.junk.lose=Into the scrap heap with you. Come back when you've been fixed.
campaign.colors.message=Every hue has a temper. Pick a color, any color - I've got the answer to all of them.
campaign.colors.win=You saw through the spectrum. Walk on, brightly.
campaign.colors.lose=A whole rainbow of defeat. Look at the colors and try again.
campaign.elementalist.message=I like playing with my four friends, fire, water, earth, air. Let them play you.
campaign.elementalist.win=The elements fall silent for you. Pass, wielder.
campaign.elementalist.lose=The elements have spoken. Come back when you can answer all four.
campaign.powermancer.message=Power is not given; it is drawn. And I am drawing yours, right now.
campaign.powermancer.win=My charge is drained, yours is not. The mountain is open to you.
campaign.powermancer.lose=Drained to the last spark. Recharge and try me again.
campaign.kinetician.message=Everything moves. Even you - straight into my hands.
campaign.kinetician.win=You held your ground against the push. Go on, then.
campaign.kinetician.lose=Momentum, as predicted. Brace yourself and come again.
campaign.quantumancer.message=I am both beaten and unbeaten until you look. Look carefully.
campaign.quantumancer.win=The wave collapsed in your favor. Climb on.
campaign.quantumancer.lose=The wave collapsed against you. Observe, adjust, and re-run the experiment.

