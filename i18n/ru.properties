campaign.night.rest.title=Ночь
campaign.night.rest=Вы просыпаетесь ночью в кровати в незнакомом доме.
campaign.night.visit.title=Незнакомый голос
campaign.night.visit=Я пошёл за вами в горы. Вы потеряли сознание после ухода из Аэлвин, и мы с женой принесли вас сюда.
campaign.night.meal.title=Горячая еда
campaign.night.meal=Садитесь на полотенце и поешьте. Потом вы сможете исследовать страну ночью, если захотите.
campaign.night.out.title=Под звёздами
campaign.night.out=Силы возвращаются медленно. Вы благодарите хозяев и выходите наружу, вслушиваясь в запахи ночной страны и в звуки ночного мира.
campaign.next=Далее
campaign.antimancer.wake.title=Далеко в землях
campaign.antimancer.wake=После встречи с Корвином вы потеряли сознание, словно что-то было не совсем так, и вы просыпаетесь далеко в землях.
button.yes=Да
campaign.entomologist.message=Сегодня лес добр. Пройдёмся вместе — мои малыши любят тихую игру.
campaign.farmer.message=На дорогах могут быть ловушки. Не задерживайтесь. Найдите собственный путь, чтобы открыть эту прекрасную страну.
campaign.duckwoman.message=В городе нынче полно народу. Не зевайте — с везением встретите мага, который и впрямь знает магию. Или ступайте тихими дорогами и обойдите толпу.
campaign.duckwoman.choice.go_city=Идти в город
campaign.duckwoman.choice.avoid_city=Обойти город
campaign.ram.message=Мало кто поднимается в эти горы. Точно ли вы хотите идти дальше? Стоит сделать выбор — и назад будет не вернуться, а любая ошибка может оказаться смертельной. Тогда не теряйте самообладания и смотрите под ноги — склоны местами скользкие.
campaign.rabbit.message=Говорят, в горах есть могучие маги. Если найдёте их, они могли бы научить вас паре трюков.
campaign.beaver.message=Вы идёте через странный лес. Здесь есть что-то волшебное, хотя теперь это, пожалуй, лишь едва уловимо. Чувствуете?
campaign.otter.message=Болото коварно, если вы к нему не привыкли. Здесь время течёт странно.
campaign.elder.message=Ночью иные маги злоупотребляют силой и растят её без всякой меры. Каждый пытается построить своё королевство или свою церковь. На этой дороге вы пересечёте их территорию. Будьте осторожны.
campaign.fishman.message=Плохо спится, когда знаешь, что машины работают всю ночь. Теперь они всё время крутятся у меня в голове.
campaign.fisherman.message=Здесь иные теряют себя, наивно соперничая лишь с худшими. Тех, кого худшие вытянули начисто, может оставить позади часть себя, но вернуть её - все равно что ловить рыбу в открытом море.
campaign.deer.message=Спросите себя, зачем вам противостоять этим могучим магам - и что вы оставили позади.
campaign.girl.message=Когда я брожу ночью, с горы доносятся страшные звуки. Можно подняться к ним — или спуститься в долину.
campaign.girl.choice.to_mountain=Идти к горе
campaign.girl.choice.to_valley=Спуститься в долину
campaign.patou.message=Вы далеко от своего истока. Надеюсь, у вас ещё хватит сил. Вы можете отдыхать где угодно, когда захотите. Гора подождёт. Она никуда не денется.
campaign.catboy.message=В такие ночи легко заблудиться. Мне страшно возвращаться к семье: некоторые стали могучими магами. Отведёте меня в город или останемся в землях?
campaign.catboy.choice.bring_city=Отвести его в город
campaign.catboy.choice.stay_land=Остаться в землях
campaign.panther.message=Ночью я видел, как маги зачаровывают людей, затягивая их в выдуманные истории, но и там свет бывает так же опасен, как тени. Он может заставить людей усомниться в том, что скрывает тьма, а страх может сопровождать их до самого дня.
campaign.crowd.message=Мальчик исчез в толпе. Вам интересно, на что кричат люди, и вы идёте за ними.
campaign.gardener.message=У меня тут огород, но картошка уже много лет не растёт. Понятия не имею почему...
campaign.seasons.message=Погода для честного поединка. Посмотрим, кому улыбнётся год.
campaign.disciples.message=О! Надеюсь, я вас не напугал. Заблудились? Нет, вы не заблудились. Вы нашли сюда дорогу, сами того не зная. Позвольте-ка мне взвесить вашу душу — на минутку — и я увижу, кто вы.
campaign.dudes.message=Неплохая прогулка. Жаль, она кончится в пыли. Постарайтесь не плакать.
campaign.mountainking.message=На горе каждый чувствует себя маленьким. Здесь живут только самые смелые. Подойдите - я выбью ваше имя в скале.
campaign.spiritshaman.message=Духи этого хребта не слишком-то думают, зато у них есть свои странные привычки. Подойдите к ним, пока я играю на барабанах, и вы увидите, что стихий они не боятся.
campaign.shaman.message=Здесь начинается гора. Мёртвые уже знают, кто спустится обратно.
campaign.wind.message=Здесь воздух разрежен, и ветер может сдуть вас между одним вдохом и следующим. Дышите в такт ветру и прислушайтесь к тому, что скажет его дыхание.
campaign.antimancer.message=Возможно, вы из той толпы, что пометила меня знаком изгнания, потому что я не выношу её выдуманный мир. Всё же я сыграю — один раз. Садитесь и соблюдайте приличия.
campaign.warp.message=При этом свете вы кажетесь тоньше. Один рывок - и вы распадётесь. Так давайте посмотрим, что вас держит: только звучание имени или только облик?
campaign.rogue.message=Ещё один турист. Кошелёк или жизнь - я ещё не решил. Сначала потанцуем. Боли вы не почувствуете.
campaign.faerie_druid.message=Я мирно беседовал со своими феями, а ты прошёл через лес, потревожив нас. Теперь я говорю от имени деревьев. Деревья помнят гостей добрее. Они вас не оплачут.
campaign.vampires.message=Ваш пульс - ужинный колокол. Садитесь. Я люблю, когда еда ещё говорит.
campaign.darkpriest.message=На колени. Не хотите молиться - я напишу ваш гимн кровью.
campaign.zen.message=Кажется, вы заблудились. Очнитесь! Вам может казаться, что это урок. Но это конец. Молчите и проиграйте.
campaign.darksider.message=Я уничтожу путь за вами. Деревни, куда бежать, больше нет.
campaign.highpriest.message=Вершина не хранит паломников. Здесь бывают немногие. Я сломаю ваше эго и благословлю осколки.
campaign.end.win.title=Победа
campaign.end.lose.title=Поражение
campaign.end.map=Карта
campaign.end.replay=Реванш
campaign.end.win=Дорога открыта. Я запомню этот поединок.
campaign.end.lose=Вот в чём разница. Соберитесь и попробуйте снова.
campaign.end.summoner.win=Вы смели меня с доски. Я даже рой не успел поднять - хорошая игра.
campaign.end.summoner.lose=Я говорил малышам, что у вас кончатся ответы. Идём, сыграем ещё.
campaign.end.strategist.win=Ваша линия чище моей. Я предусмотрел три ваших хода, а вы сыграли четвёртый.
campaign.end.strategist.lose=Я прочёл ваш темп на два хода раньше, чем вы его почувствовали. Тасуйте лучше и прячьте замысел.
campaign.end.gambler.win=Ха! Вы вскрыли мой блеф лучшей рукой. Гора забирает мою ставку - идите дальше.
campaign.end.gambler.lose=Кости легли за меня, друг. Удвоим ставку? Камни ждут.
campaign.end.lecturer.win=Записано. Ваш тезис держится, мой требует правок. Доска ваша.
campaign.end.lecturer.lose=Предсказуемое опровержение. Разберите свой дебют и просите повторного разбора.
campaign.end.oracle.win=Нити солгали мне. Идите - видение после вас светлее, чем с вами в пыли.
campaign.end.oracle.lose=Я видел этот финал до вашего хода. Деревья, колокол, гимн - всё рифмуется. Попробуйте удивить меня.
campaign.end.diviner.win=Итак, значит, вершина всё же хранит паломника. Поднимайтесь - и будьте милосерднее меня.
campaign.end.diviner.lose=Вершина пока не хранит паломников. Чините колоду, крепитесь сердцем и поднимайтесь снова.
campaign.entomologist.win=Мои малыши устали, и я тоже. Идите тихо дальше - лес запомнит вас добром.
campaign.entomologist.lose=Ну-ну. Лес всё ещё добр, и малышам понравилась ваша игра. Отдохните и сыграйте со мной ещё.
campaign.seasons.win=Значит, год улыбнулся вам. Хорошей погоды вашему маршу - потратьте её с толком.
campaign.seasons.lose=Год улыбнулся мне, как я и говорил. Возвращайтесь, когда сезон сменится.
campaign.disciples.win=Умны, ничего не скажешь - доказали, пока пробуждение не стало хуже. Примите моё благословение вместе с поражением.
campaign.disciples.lose=Ума пока мало. Пробуждение стало хуже, как обещано - молитесь, учитесь и возвращайтесь.
campaign.dudes.win=Ха - уронили меня в мою же пыль. Без слёз, клянусь. Вы заслужили дорогу, боец.
campaign.dudes.lose=Говорил же: всё кончится в пыли. Утритесь, встаньте и требуйте реванша.
campaign.mountainking.win=Камни запомнят ВАС, а не меня. Я поставил скалу и проиграл - поднимайтесь.
campaign.mountainking.lose=Ваше имя теперь в скале, под дюжиной других. Камни держат ставку - попробуете ещё?
campaign.spiritshaman.lose=Духи ответили мне, как всегда. Отдохните у костра и снова ударьте в барабан.
campaign.spiritshaman.win=Барабаны смолкли для меня. Духи ответили вам - идите, ветер ждёт.
campaign.wind.win=Моё дыхание вышло - ваше держится. Крепкий тезис, хорошо защищённый. Пик открыт.
campaign.wind.lose=Развеяны ветром по его воле. Соберите дыхание и карты и снова встаньте против ветра.
campaign.antimancer.win=Одна игра - и вы её выиграли. Моя вежливость и мои фокусы были моей единственной защитой - идите, пока я не сменил план урока.
campaign.antimancer.lose=Одного раза хватило, как я и говорил. Возвращайтесь к своей толпе и переосмыслите свой мир — я дам ещё одну игру.
campaign.warp.win=Вы удержались там, где я тянул сильнее всего. Один узел поддался - мой разбор и дорога ваши.
campaign.warp.lose=Вы распались от рывка, вот так. Дайте собрать вас к следующему разбору.
campaign.rogue.win=Кошелёк И жизнь - оставьте оба, турист. За урок вы заплатили сполна.
campaign.rogue.lose=Я решил: кошелёк. Выкладывайте, учите улицы и приходите выкупать свой урок.
campaign.blacksmith.name=Бранн
campaign.blacksmith.message=Я покажу тебе, что тебе нужна моя сталь, чтобы защититься.
campaign.blacksmith.win=В твоей магии, похоже, есть что-то настоящее. Помни, что каждый день может потребовать иного инструмента, а инструмент, подогнанный под одну руку, никогда не подойдёт другой. Иди по дороге - и береги то, что несёшь.
campaign.blacksmith.lose=Сталь выдержала, а твоя магия — пустой ветер. Возвращайся с чем-то настоящим, и я починю, что смогу.
campaign.faerie_druid.win=Деревья запомнят гостя добрее - вас. Пройдите тихо под их ветвями.
campaign.faerie_druid.lose=Деревья вас не оплачут, я предупреждал. Мудрейте и снова ступайте в эту рощу.
campaign.soulbinder.message=Те, кто отправляется в этот лес ночью, обычно бегут от чего-то. Ты бежишь от мира. Роща хранит то, что скользит между мирами. Я свяжу то, что вам не удержать.
campaign.soulbinder.win=Ваша душа осталась вашей. Идите - у ночи ещё есть зубы.
campaign.soulbinder.lose=Связаны, как требует ночь. Вы отдались ночи с уверенностью. Теперь я могу связать вашу душу. Освободитесь и встретьтесь со мной снова.
campaign.vampires.win=Еда кусается. Мой колокол звенит впустую - пейте ночной воздух и идите, всё ещё говоря.
campaign.vampires.lose=Ваш пульс был отличным ужинным колоколом, и вы так мило говорили. Голод возвращается - присядете снова?
campaign.darkpriest.win=Вы не встали на колени, и гимн не написан. Тьма отпускает вас - идите свободным.
campaign.darkpriest.lose=Ваш последний гимн написан, красным, как обещано. Молитесь, чтобы в следующий раз он звучал лучше - снова на колени?
campaign.zen.win=Концовка вас отвергла. Оставшись на своём плане, я смотрел на мир с чрезмерной высоты. Говорите же - урок теперь ваш, а не мой.
campaign.zen.lose=Молча и проиграв, как велено. Когда найдёте свой голос, я выслушаю ваш реванш.
campaign.shaman.win=Вы разглядели меня лучше, чем я сам, глядя глазами моего волка. Мёртвые ошиблись - ВЫ спускаетесь обратно. Гора открывает вам свою ставку.
campaign.shaman.lose=Мёртвые знали, как я и говорил. Они греют ваши кости - приходите отыгрывать их.
campaign.darksider.win=Путь всё же устоял. Ваша деревня стоит - бегите домой и скажите, что дорога открыта.
campaign.darksider.lose=Путь за вами уничтожен. Ни деревни, ни отступления - только реванш вперёд.
campaign.highpriest.win=Вершина наконец хранит паломника. Вы раскусили меня. Ради вашего эго? Я и сломан, и благословен - поднимайтесь, хранитель пика.
campaign.highpriest.lose=Сломан, как обещано - дайте благословить осколки. Соберите себя и поднимайтесь снова.
campaign.tinker.message=Шестерни крутятся, путник, как и моё терпение. Посмотрим, как вы выдержите нагрузку.
campaign.tinker.win=Заклинило. Мою машину, не вашу, - идите, но берегитесь искр.
campaign.tinker.lose=Разобран на запчасти. Возвращайтесь с лучшими допусками.
campaign.battlemage.message=Сталь и руна вместе. Меня трудно прочесть и ещё труднее остановить.
campaign.battlemage.win=Отбит и сломлен. Что ж - поле ваше.
campaign.battlemage.lose=Клинок и заклинание, как обещано. Отточите приёмы и возвращайтесь.
campaign.snowblood.message=Холод хранит то, что берёт. Он не оставляет места для сомнений. Подойдите - покажу, как тихо может стать сердце.
campaign.snowblood.win=Вы сохранили тепло. Редкость. Идите, пока снег не передумал.
campaign.snowblood.lose=Заморожены на месте. Оттепель придёт - может, и вы.
campaign.shadowmage.message=Загляните в тень - там больше, чем вы думаете. Вашей там уже нет: она покинула вас. Я лишь забираю остальное.
campaign.shadowmage.win=Тени разжали хватку. Идите, пока отбрасываете свою.
campaign.shadowmage.lose=Поглощены целиком, пока вы выигрывали в своём воображении. Вернитесь, когда найдёте свою тень.
campaign.shadowcaster.message=Свет - это заём, и вы неправильно его используете. Я его взыскиваю. Стойте смирно - это недолго.
campaign.shadowcaster.win=Тьма отпрянула от вас. Этого я не предвидела.
campaign.shadowcaster.lose=Изгнаны, как предрекла тьма. Ищите свет и приходите снова.
campaign.soulreaper.message=У каждой души есть день жатвы — день, который каждая предпочитает отложить. Ваш входит в сегодняшний урожай.
campaign.soulreaper.win=Моя коса затупилась о вас. Идите - жатва подождёт.
campaign.soulreaper.lose=Сжаты начисто. Ваша душа подождёт до следующей попытки.
campaign.conjurer.message=Каждое заклинание оставляет след, и каждый след зовёт что-то в ответ. В ответе может таиться скрытое намерение. Позволь показать, что откликается на мой зов.
campaign.conjurer.win=Ты дал моим созданиям больше, чем они могли выдержать. Ритуал завершать тебе.
campaign.conjurer.lose=Круг сомкнулся вокруг тебя, как и должен был. Возвращайся, когда твоя воля выдержит зов.
campaign.kahjivir.name=Нахира
campaign.kahjivir.message=Ты вошёл в наши охотничьи угодья, и трава уже сомкнулась за твоей спиной. Похоже, ты забыл звериную часть себя. Скоро ты её вспомнишь. Клан сегодня ещё не кормился — беги, если хочешь. От этого охота будет только слаще.
campaign.kahjivir.win=Клан опускает копья. Он не может тягаться с магией, которой не понимает. Ты заслужил право пройти под этой луной — иди, пока ветер не переменился.
campaign.kahjivir.lose=Охота кончается тобой в траве. Мы оставляем тебе жизнь; возвращайся, когда когти твои станут острее.
campaign.chronomaster.message=Ваше время сочтено. Вы отдали мне столько во всех своих играх - и всё это приведёт вас к гибели. Счёт будет закрыт... сейчас!
campaign.chronomaster.win=Осталось несколько зёрен. Потратьте их, пока я не переверну часы.
campaign.chronomaster.lose=Сочтено и истрачено. Возвращайтесь, если песок ещё остался.
campaign.limbo.message=Ни день, ни ночь, ни победа, ни поражение, ни реальность, ни воображение. Здесь ждут все дороги.
campaign.limbo.win=То, выиграли вы или проиграли, не определяет, в аду вы или в раю. Можно выиграть и оказаться в аду. В междумирье вы видите себя сразу в обоих местах. Решать вам, что для вас ад, а что рай. Вы выходите из междумирья. Немногие могут. Вершина зовёт.
campaign.limbo.lose=Удержаны посередине. Побудьте здесь и попробуйте снова.
campaign.meteomancer.message=Небо сказало, что вы придёте. И что всё закончится дождём.
campaign.meteomancer.win=Даже прогноз бывает неверным. Идите по ясной дороге, путник.
campaign.meteomancer.lose=Дождь, как предсказало небо. Просушитесь и возвращайтесь за вторым фронтом.
campaign.emotion.message=Ах, ещё одно сердце на дороге. Покажите, что вы чувствуете, - доска расскажет мне остальное. То, что она откроет, всегда самое ценное.
campaign.emotion.win=Ваше сердце осталось твёрдым. Идите дальше и пусть оно ведёт вас.
campaign.emotion.lose=У каждого чувства свой черёд. Ваше дрогнуло; моё - нет. Возвращайтесь, когда оно окрепнет.
campaign.sower.message=Вросните в грязь и посмотрим, что вырастет. Я терпелив - болото тоже.
campaign.sower.win=Вы не пустили корни. Что ж - идите, и берегитесь камыша.
campaign.sower.lose=Наконец-то укоренились. Болото хранит то, что посеяло, - возвращайтесь, когда прорастёте. Вам хотелось бы, чтобы внутри вас выросло нечто большее вас — или нечто более прекрасное, цветок, например. Но у этого цветка есть зубы. Он пожирает других так же легко, как и вас.
campaign.trappers.message=Старые корни помнят каждый шаг. Боритесь сколько угодно - отсюда никто не уходит несвязанным.
campaign.trappers.win=Достойная борьба. Первый шаг к свободе - понять, что вы в ловушке. Лес ещё прибережёт для вас место.
campaign.trappers.lose=Корни держат вас. Отдохните немного и станьте тише.
campaign.fairy_knight.message=Стой, путник. Этот камыш под защитой Двора фей. Ты не ступишь на эту землю, если я не сочту тебя достойным её. Обнажай клинок или сдавайся.
campaign.fairy_knight.win=Честный поединок, честно проигран. Двор даёт вам проход.
campaign.fairy_knight.lose=Клинок Двора быстр. Тренируйтесь и бросьте вызов снова.
campaign.dreamweaver.message=Тсс. Вы уже наполовину спите, увлечённые своими снами или кошмарами. Слышите? Гора напевает вам колыбельную.
campaign.dreamweaver.win=Вы проснулись до того, как сон сомкнулся. Вы уверены, что не остались во сне? Идите, мечтатель.
campaign.dreamweaver.lose=Спите крепко. Видьте сны о лучших дебютах и возвращайтесь, проснувшись.
campaign.junk.message=Ты, похоже, удивлён. Большинство людей хотят забыть это место. Я — нет. Там, где ты видишь магию, я вижу только хлам, который ты оставил после себя. Ты ничего не стоишь, если только мне не удастся собрать что-нибудь из твоих обломков.
campaign.junk.win=Ха. Из хлама в сокровище - вы разбили мою кучу. Дорога ваша.
campaign.junk.lose=В кучу металлолома. Возвращайтесь, когда вас починят.
campaign.colors.message=У каждого цвета свой нрав. Выбирайте любой - у меня ответ на каждый.
campaign.colors.win=Вы прозрели сквозь спектр. Идите, ярко.
campaign.colors.lose=Целая радуга поражения. Рассмотрите цвета и попробуйте снова.
campaign.elementalist.message=Я люблю играть со своими четырьмя друзьями-стихиями. Они тоже любят играть, но им грустно, что играть с ними умеет только ребёнок. Давайте попробуем.
campaign.elementalist.win=Теперь стихии довольны. Проходите, повелитель.
campaign.elementalist.lose=Стихии скучают. Возвращайтесь, когда ответите всем четырём.
campaign.powermancer.message=Силу не дают - её черпают, и удерживают те, кто умеет преображать её и поддерживать её круговращение в себе самом. Я дам вам это лицезреть.
campaign.powermancer.win=Мой заряд иссяк, ваш - нет. Гора открыта для вас.
campaign.powermancer.lose=Моя сила высушила вашу до последней искры. Зарядитесь и бросьте мне вызов снова.
campaign.kinetician.message=Всё движется. Даже вы, хотите вы того или нет, — прямо мне в руки.
campaign.kinetician.win=Вы устояли под напором. Идите, раз так.
campaign.kinetician.lose=Импульс, как и предсказано. Упритесь и приходите снова.
campaign.quantumancer.message=Я одновременно побеждён и не побеждён, пока вы не посмотрите. Скорее всего, вы таковы же — выигрываете вы или проигрываете, на самом деле вы не меняетесь. Смотрите внимательно.
campaign.quantumancer.win=Волна схлопнулась в вашу пользу. Поднимайтесь.
campaign.quantumancer.lose=Волна схлопнулась против вас. Наблюдайте, корректируйте и повторите опыт.

