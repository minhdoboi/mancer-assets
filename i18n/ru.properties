campaign.restart.night=Только ночь
campaign.continue=Продолжить
campaign.night.rest.title=Ночь
campaign.night.rest=Вы отдохнули в комнате в городе и просыпаетесь ночью.
campaign.antimancer.wake.title=Далеко в землях
campaign.antimancer.wake=Одолев антимага, вы потеряли сознание и просыпаетесь далеко в землях.
button.yes=Да
campaign.entomologist.message=Сегодня лес добр. Пройдёмся вместе - мои малыши любят тихую игру.
campaign.farmer.message=На дорогах могут быть ловушки. Не задерживайтесь. Найдите собственный путь, чтобы открыть эту прекрасную страну.
campaign.duckwoman.message=В городе нынче полно народу. Не зевайте — с везением встретите мага, который и впрямь знает магию. Или ступайте тихими дорогами и обойдите толпу.
campaign.duckwoman.choice.go_city=Идти в город
campaign.duckwoman.choice.avoid_city=Обойти город
campaign.ram.message=Мало кто поднимается в эти горы. Смотрите под ноги - иные места опасны.
campaign.rabbit.message=Говорят, в горах живёт могучий маг. Если найдёте его, он мог бы научить вас паре трюков.
campaign.beaver.message=Вы идёте особым лесом. В нём есть что-то волшебное.
campaign.elder.message=Ночью иные маги злоупотребляют силой и растят её без всякой меры. Будьте осторожны на этой дороге.
campaign.fishman.message=Плохо спится, когда знаешь, что машины работают всю ночь.
campaign.fisherman.message=Здесь иные потеряли себя, стараясь соперничать лишь с худшим.
campaign.deer.message=Спросите себя, зачем вам противостоять этим могучим магам - и что вы оставили позади.
campaign.girl.message=Когда я брожу ночью, с горы доносятся страшные звуки. Можно подняться к ним — или спуститься в долину.
campaign.girl.choice.to_mountain=Идти к горе
campaign.girl.choice.to_valley=Спуститься в долину
campaign.patou.message=Вы далеко от своего истока. Надеюсь, у вас ещё хватит сил.
campaign.catboy.message=В такие ночи легко заблудиться. Мне страшно возвращаться к семье: некоторые стали могучими магами. Отведёте меня в город или останемся в землях?
campaign.catboy.choice.bring_city=Отвести его в город
campaign.catboy.choice.stay_land=Остаться в землях
campaign.crowd.message=Мальчик исчез в толпе. Вам интересно, на что кричат люди, и вы идёте за ними.
campaign.seasons.message=Погода для честного поединка. Посмотрим, кому улыбнётся год.
campaign.disciples.message=О! Надеюсь, я вас не напугал. Заблудились? Могу сказать, что это не так. Позвольте взвесить вашу душу.
campaign.dudes.message=Неплохая прогулка. Жаль, она кончится в пыли. Постарайтесь не плакать.
campaign.mountainking.message=Камни помнят каждого пришельца. Подойдите - я выбью ваше имя в скале.
campaign.spiritshaman.message=Духи этого хребта у меня в долгу. Посмотрим, кому они ответят, когда загремят барабаны?
campaign.shaman.message=Здесь начинается гора. Мёртвые уже знают, кто спустится обратно.
campaign.wind.message=Я вырву из вас дыхание и развею остатки по этим скалам.
campaign.antimancer.message=Солнце село, и вежливость с ним. Но я сыграю - один раз.
campaign.warp.message=При этом свете вы кажетесь тоньше. Один рывок - и вы распадётесь.
campaign.rogue.message=Ещё один турист. Кошелёк или жизнь - я ещё не решил.
campaign.faerie_druid.message=Деревья помнят гостей добрее. Они вас не оплачут.
campaign.vampires.message=Ваш пульс - ужинный колокол. Садитесь. Я люблю, когда еда ещё говорит.
campaign.darkpriest.message=На колени. Не хотите молиться - я напишу ваш гимн кровью.
campaign.zen.message=Вы всё ещё думаете, что это урок. Это конец. Молчите и проиграйте.
campaign.darksider.message=Я уничтожу путь за вами. Деревни, куда бежать, больше нет.
campaign.highpriest.message=Вершина не хранит паломников. Я сломаю вас и благословлю осколки.
campaign.end.win.title=Победа
campaign.end.lose.title=Поражение
campaign.end.map=Карта
campaign.end.replay=Реванш
campaign.end.win=Дорога открыта. Я запомню этот поединок.
campaign.end.lose=Вот в чём разница. Соберитесь и попробуйте снова.
campaign.end.summoner.win=Вы смели меня с доски. Я даже рой не успел поднять - хорошая игра.
campaign.end.summoner.lose=Я говорил малышам, что у вас кончатся ответы. Идём, сыграем ещё.
campaign.end.strategist.win=Ваша линия чище моей. Я предусмотрел три ваших хода, а вы сыграли четвёртый.
campaign.end.strategist.lose=Я прочёл ваш темп на два хода раньше, чем вы его почувствовали. Тасуйте лучше и прячьте замысел.
campaign.end.gambler.win=Ха! Вы вскрыли мой блеф лучшей рукой. Гора забирает мою ставку - идите дальше.
campaign.end.gambler.lose=Кости легли за меня, друг. Удвоим ставку? Камни ждут.
campaign.end.lecturer.win=Записано. Ваш тезис держится, мой требует правок. Доска ваша.
campaign.end.lecturer.lose=Предсказуемое опровержение. Разберите свой дебют и просите повторного разбора.
campaign.end.oracle.win=Нити солгали мне. Идите - видение после вас светлее, чем с вами в пыли.
campaign.end.oracle.lose=Я видел этот финал до вашего хода. Деревья, колокол, гимн - всё рифмуется. Попробуйте удивить меня.
campaign.end.diviner.win=Значит, вершина всё же хранит паломника. Поднимайтесь - и будьте милосерднее меня.
campaign.end.diviner.lose=Вершина пока не хранит паломников. Чините колоду, крепитесь сердцем и поднимайтесь снова.
campaign.entomologist.win=Мои малыши устали, и я тоже. Идите тихо дальше - лес запомнит вас добром.
campaign.entomologist.lose=Ну-ну. Лес всё ещё добр, и малышам понравилась ваша игра. Отдохните и сыграйте со мной ещё.
campaign.seasons.win=Значит, год улыбнулся вам. Хорошей погоды вашему маршу - потратьте её с толком.
campaign.seasons.lose=Год улыбнулся мне, как я и говорил. Возвращайтесь, когда сезон сменится.
campaign.disciples.win=Умны, ничего не скажешь - доказали, пока пробуждение не стало хуже. Примите моё благословение вместе с поражением.
campaign.disciples.lose=Ума пока мало. Пробуждение стало хуже, как обещано - молитесь, учитесь и возвращайтесь.
campaign.dudes.win=Ха - уронили меня в мою же пыль. Без слёз, клянусь. Вы заслужили дорогу, боец.
campaign.dudes.lose=Говорил же: всё кончится в пыли. Утритесь, встаньте и требуйте реванша.
campaign.mountainking.win=Камни запомнят ВАС, а не меня. Я поставил скалу и проиграл - поднимайтесь.
campaign.mountainking.lose=Ваше имя теперь в скале, под дюжиной других. Камни держат ставку - попробуете ещё?
campaign.spiritshaman.lose=Духи ответили мне, как всегда. Отдохните у костра и снова ударьте в барабан.
campaign.spiritshaman.win=Барабаны смолкли для меня. Духи ответили вам - идите, ветер ждёт.
campaign.wind.win=Моё дыхание вышло - ваше держится. Крепкий тезис, хорошо защищённый. Пик открыт.
campaign.wind.lose=Развеяны, как я и обещал. Соберите дыхание и карты и снова встаньте против ветра.
campaign.antimancer.win=Одна игра - и вы её взяли. С рассветом возвращается вежливость - идите, пока я не сменил план урока.
campaign.antimancer.lose=Одного раза хватило, как я и говорил. Тьма вежливости не хранит - но я дам ещё одну игру.
campaign.warp.win=Вы удержались там, где я тянул сильнее всего. Один узел поддался - мой разбор и дорога ваши.
campaign.warp.lose=Вы распались от рывка, вот так. Дайте собрать вас к следующему разбору.
campaign.rogue.win=Кошелёк И жизнь - оставьте оба, турист. За урок вы заплатили сполна.
campaign.rogue.lose=Я решил: кошелёк. Выкладывайте, учите улицы и приходите выкупать свой урок.
campaign.faerie_druid.win=Деревья запомнят гостя добрее - вас. Пройдите тихо под их ветвями.
campaign.faerie_druid.lose=Деревья вас не оплачут, я предупреждал. Мудрейте и снова ступайте в эту рощу.
campaign.soulbinder.message=Роща хранит то, что скользит между мирами. Я свяжу то, что вам не удержать.
campaign.soulbinder.win=Ваша душа осталась вашей. Идите - у ночи ещё есть зубы.
campaign.soulbinder.lose=Связаны, как требует ночь. Освободитесь и встретьтесь со мной снова.
campaign.vampires.win=Еда кусается. Мой колокол звенит впустую - пейте ночной воздух и идите, всё ещё говоря.
campaign.vampires.lose=Ваш пульс был отличным ужинным колоколом, и вы так мило говорили. Голод возвращается - присядете снова?
campaign.darkpriest.win=Вы не встали на колени, и гимн не написан. Тьма отпускает вас - идите свободным.
campaign.darkpriest.lose=Ваш последний гимн написан, красным, как обещано. Молитесь, чтобы в следующий раз он звучал лучше - снова на колени?
campaign.zen.win=Концовка вас отвергла. Говорите же - урок теперь ваш, а не мой.
campaign.zen.lose=Молча и проиграв, как велено. Когда найдёте свой голос, я выслушаю ваш реванш.
campaign.shaman.win=Мёртвые ошиблись - ВЫ спускаетесь обратно. Гора открывает вам свою ставку.
campaign.shaman.lose=Мёртвые знали, как я и говорил. Они греют ваши кости - приходите отыгрывать их.
campaign.darksider.win=Путь всё же устоял. Ваша деревня стоит - бегите домой и скажите, что дорога открыта.
campaign.darksider.lose=Путь за вами уничтожен. Ни деревни, ни отступления - только реванш вперёд.
campaign.highpriest.win=Вершина наконец хранит паломника. Я и сломан, и благословен - поднимайтесь, хранитель пика.
campaign.highpriest.lose=Сломан, как обещано - дайте благословить осколки. Соберите себя и поднимайтесь снова.
campaign.tinker.message=Шестерни крутятся, путник, как и моё терпение. Посмотрим, как вы выдержите нагрузку.
campaign.tinker.win=Заклинило. Мою машину, не вашу, - идите, но берегитесь искр.
campaign.tinker.lose=Разобран на запчасти. Возвращайтесь с лучшими допусками.
campaign.battlemage.message=Сталь и руна вместе. Меня трудно прочесть и ещё труднее остановить.
campaign.battlemage.win=Отбит и сломлен. Что ж - поле ваше.
campaign.battlemage.lose=Клинок и заклинание, как обещано. Отточите приёмы и возвращайтесь.
campaign.snowblood.message=Холод хранит то, что берёт. Подойдите - покажу, как тихо может стать сердце.
campaign.snowblood.win=Вы сохранили тепло. Редкость. Идите, пока снег не передумал.
campaign.snowblood.lose=Заморожены на месте. Оттепель придёт - может, и вы.
campaign.shadowmage.message=Ваша тень уже покинула вас. Я лишь забираю остальное.
campaign.shadowmage.win=Тени разжали хватку. Идите, пока отбрасываете свою.
campaign.shadowmage.lose=Поглощены целиком. Вернитесь, когда найдёте свою тень.
campaign.shadowcaster.message=Свет - это заём, и я его взыскиваю. Стойте смирно - это недолго.
campaign.shadowcaster.win=Тьма отпрянула от вас. Этого я не предвидела.
campaign.shadowcaster.lose=Изгнаны, как предрекла тьма. Ищите свет и приходите снова.
campaign.soulreaper.message=У каждой души свой день жатвы. Ваш - поздний и славный урожай.
campaign.soulreaper.win=Моя коса затупилась о вас. Идите - жатва подождёт.
campaign.soulreaper.lose=Сжаты начисто. Ваша душа подождёт до следующей попытки.
campaign.conjurer.message=Выберите карту, любую - все они мои, и все вас ненавидят.
campaign.conjurer.win=Фокус, которого я не предвидел. Выходите на сцену.
campaign.conjurer.lose=Занавес падает. Отточите ловкость рук и возвращайтесь.
campaign.chronomaster.message=Ваше время сочтено.
campaign.chronomaster.win=Осталось несколько зёрен. Потратьте их, пока я не переверну часы.
campaign.chronomaster.lose=Сочтено и истрачено. Возвращайтесь, если песок ещё остался.
campaign.limbo.message=Ни день, ни ночь, ни победа, ни поражение. Здесь ждут все дороги.
campaign.limbo.win=Вы выходите из междумирья. Немногие могут. Вершина зовёт.
campaign.limbo.lose=Удержаны посередине. Побудьте здесь и попробуйте снова.
campaign.meteomancer.message=Небо сказало, что вы придёте. И что всё закончится дождём.
campaign.meteomancer.win=Даже прогноз бывает неверным. Идите по ясной дороге, путник.
campaign.meteomancer.lose=Дождь, как предсказало небо. Просушитесь и возвращайтесь за вторым фронтом.
campaign.sower.message=Вросните в грязь и посмотрим, что вырастет. Я терпелив - болото тоже.
campaign.sower.win=Вы не пустили корни. Что ж - идите, и берегитесь камыша.
campaign.sower.lose=Наконец-то укоренились. Болото хранит то, что посеяло, - возвращайтесь, когда прорастёте.
campaign.fairy_knight.message=Стой, путник. Этот камыш под защитой Двора фей. Обнажай клинок или сдавайся.
campaign.fairy_knight.win=Честный поединок, честно проигран. Двор даёт вам проход.
campaign.fairy_knight.lose=Клинок Двора быстр. Тренируйтесь и бросьте вызов снова.
campaign.dreamweaver.message=Тсс. Вы уже наполовину спите, а гора напевает вам колыбельную.
campaign.dreamweaver.win=Вы проснулись до того, как сон сомкнулся. Идите, мечтатель.
campaign.dreamweaver.lose=Спите крепко. Видьте сны о лучших дебютах и возвращайтесь, проснувшись.
campaign.junk.message=Всё чего-то стоит. Даже вы. Посмотрим, что я соберу из ваших обломков.
campaign.junk.win=Ха. Из хлама в сокровище - вы разбили мою кучу. Дорога ваша.
campaign.junk.lose=В кучу металлолома. Возвращайтесь, когда вас починят.
campaign.colors.message=У каждого цвета свой нрав. Выбирайте любой - у меня ответ на каждый.
campaign.colors.win=Вы прозрели сквозь спектр. Идите, ярко.
campaign.colors.lose=Целая радуга поражения. Рассмотрите цвета и попробуйте снова.
campaign.elementalist.message=Огонь, вода, земля, воздух - четверо друзей, и все вас недолюбливают. Начнём?
campaign.elementalist.win=Стихии молчат для вас. Проходите, повелитель.
campaign.elementalist.lose=Стихии сказали своё слово. Возвращайтесь, когда ответите всем четырём.
campaign.powermancer.message=Силу не дают - её черпают. И я черпаю вашу прямо сейчас.
campaign.powermancer.win=Мой заряд иссяк, ваш - нет. Гора открыта для вас.
campaign.powermancer.lose=Высушен до последней искры. Зарядитесь и бросьте мне вызов снова.
campaign.kinetician.message=Всё движется. Даже вы - прямо мне в руки.
campaign.kinetician.win=Вы устояли под напором. Идите, раз так.
campaign.kinetician.lose=Импульс, как и предсказано. Упритесь и приходите снова.
campaign.quantumancer.message=Я одновременно побеждён и не побеждён, пока вы не посмотрите. Смотрите внимательно.
campaign.quantumancer.win=Волна схлопнулась в вашу пользу. Поднимайтесь.
campaign.quantumancer.lose=Волна схлопнулась против вас. Наблюдайте, корректируйте и повторите опыт.

fire=Огонь
fire.goblin=Goblin
fire.goblin.description=Every turn deals 2 damage to owner adjacent cards
fire.wall=Wall of flame
fire.wall.description=Deals 5 damage to opponent creatures when summoned
fire.monk=Fire monk
fire.monk.description=Every turn increase fire mana growth by 1
fire.drake=Drake
fire.drake.description=Attack the turn he is summoned
fire.orc=Orc chieftain
fire.orc.description=Increase attack of adjacent card by 2
fire.wave=Flame wave
fire.wave.description=Deals 9 damage to opponent creatures
fire.bull=Bull Commander
fire.bull.description=Increase attack of owner card by 1
fire.blargl=Blargl
fire.blargl.description=Deals 4 damage to every creature when summoned
fire.inferno=Inferno
fire.inferno.description=Deals 18 damage to target and 10 to other opponent creatures effects
fire.elemental=Fire Elemental
fire.elemental.description=Fire Elemental deals 3 damage to opponent creatures when summoned
fire.apocalypse=Apocalypse
fire.apocalypse.description=Damage any creature and opponent by 8 + fire mana [{0}]
fire.dragon=Dragon
fire.dragon.description=Increase spell damage by 50%

water=Вода
water.meditate=Meditate
water.meditate.description=Increase normal mana by 1
water.sprite=sea sprite
water.sprite.description=Every turn deals 2 damage to owner
water.apostate=Merfolk Apostate
water.apostate.description=Give 2 fire mana when summoned
water.golem=Ice Golem
water.golem.description=Immune to spell & ability
water.elder=Merfolk Elder
water.elder.description=Increase air mana growth by 1
water.guard=Ice guard
water.guard.description=Halve damage dealt to owner
water.turtle=HugeTurtle
water.turtle.description=Absorb 5 damage
water.shower=Acidic shower
water.shower.description=Damage all creature by 15 and decrease mana of opponent by 1
water.lord=Sea Lord
water.lord.description=Adjacent cards attack the turn they're summoned
water.elemental=Water Elemental
water.elemental.description=Heals owner by 10 when summoned
water.mind=Mind Master
water.mind.description=Increase mana growth by 1
water.astral=Astral guard
water.astral.description=Decrease mana growth by 1

air=Воздух
air.fairy=Фейский новичок
air.fairy.description=Увеличивает урон заклинаний на 1
air.griffin=Griffin
air.griffin.description=If Air mana >= 5 deals 5 damage to opponent when summoned
air.call=Call to thunder
air.call.description=Deals 6 damage to target creature and opponent
air.medic=Air medic
air.medic.description=When summoned heals owner by amount of earth mana(limited to 10)
air.fence=Lightning fence
air.fence.description=Every turn deals 4 damage to opponent
air.lightnin=Lightnin
air.lightnin.description=Deals (5 + air power)[{0}] damage to opponent
air.phoenix=Phoenix
air.phoenix.description=Can reborn if fire mana >= 10
air.chain=Chain lightning
air.chain.description=Deals 9 damage to opponent and his creatures
air.cloud=Cloud
air.cloud.description=Attack all opponent creatures
air.twister=Twister
air.twister.description=destroy target
air.elemental=Air Elemental
air.elemental.description=Air elemental deals 8 damage to opponent when summoned
air.titan=Titan
air.titan.description=Deals 15 damage to opposite creature when summoned



earth=Земля
earth.elven=Elven
earth.elven.description=Heals owner by 3 every turn
earth.care=Natures care
earth.care.description=heals target and owner by 8
earth.sprite=Forest Sprite
earth.sprite.description=attack all opponent creatures
earth.therapy=Plant therapy
earth.therapy.description=heals by 2 * earth mana [{0}]
earth.hermit=woods hermit
earth.hermit.description=Increase earth mana growth by 2
earth.fury=Fury
earth.fury.description=Deals to opponent the sum of the attacks of the 2 strongest owner creatures[{0}]
earth.hugespider=Huge spider
earth.hugespider.description=Spawn 2 forest spiders around him
earth.forestspider=forest spider
earth.troll=Troll
earth.troll.description=Every turn heals himself by 4
earth.shower=Stone shower
earth.shower.description=Deals 25 damage to any creature
earth.elemental=Earth Elemental
earth.healer=Master healer
earth.healer.description=Every turn heals by 3 owner and his creatures
earth.hydra=Hydra
earth.hydra.description=Attack all opponent creatures

darkpriest=Темный жрец
darkpriest.description=Классовая особенность - мятущаяся душа: в начале игры на стороне оппонента появляется одноименное существо 3/11 (если оно убито, то возрождается в конце хода оппонента и приносит темному жрецу 2 спецманы).
darkpriest.RestlessSoul.name=Мятущаяся душа
darkpriest.RestlessSoul.description=Eсли она убита, то возрождается в конце хода оппонента и приносит темному священнику 2 спецманы
darkpriest.Ghost.name=Привидение
darkpriest.Ghost.description=Если умирает от магии или способности существа, возрождается и переходит на сторону другого игрока. При входе в игру лечит хозяину 1 хп за каждое его существо на поле
darkpriest.Occultist.name=Оккультист
darkpriest.Occultist.description=При входе в игру призывает в противостоящий слот тень священника 3/20, которая каждый ход лечит темному священнику и его существам 1 жизни.
darkpriest.BlackMass.name=Черная месса
darkpriest.BlackMass.description=Жертвует указанным существом и наносит существам противника 4X урона (X - кол-во разных стихий, которые представлены на поле существами противника).
darkpriest.EnergyVampire.name=Энергетический вампир
darkpriest.EnergyVampire.description=Каждый ход приносит по 1 маны за каждого своего соседа (стихия маны = стихии соседа).
darkpriest.BlackMonk.name=Черный монах
darkpriest.BlackMonk.description=При получении урона лечит столько же жизни хозяину.
darkpriest.Betrayer.name=Изменник
darkpriest.Betrayer.description=Может быть призван только на вражеское существо, которое умирает. Каждый ход наносит 4 урона себе, хозяину (т.е. противнику) и соседям.
darkpriest.DarkHydra.name=Темная гидра
darkpriest.DarkHydra.description=Атакует всех врагов. При атаке повышает свою атаку на 1 и лечит хозяина на нанесенный урон.
darkpriest.Missionary.name=Миссионер
darkpriest.Missionary.description=Когда хозяин призывает стихийное существо, превращает его в еретика 6/20. Когда хозяин призывает спецовое существо, миссионер превращается в падшего ангела 8/25. Когда миссионер призван, слабейшее существо хозяина и слабейшее существо оппонента той же стихии теряют половину здоровья.
darkpriest.Heretic.name=Еретик
darkpriest.BlackAngel.name=Падший ангел
darkpriest.BlackAngel.description=При убийстве существа полностью лечится
darkpriest.ShadowOfPriest.name=Тень священника
darkpriest.ShadowOfPriest.description=Каждый ход лечит темному священнику и его существам 1 жизни.

antimancer=Антимаг
antimancer.0.name=Злыдень
antimancer.2.name=Зеркальный жрец
antimancer.2.description=Когда противник играет карту, приносит 1 ману той же стихии (в т.ч. спецкласса).
antimancer.3.name=Сопротивление
antimancer.3.description=Заполняет пустые слоты хозяина Злобной толпой 3/9.
antimancer.4.name=Каратель
antimancer.4.description=Когда каратель теряет хп, он наносит такой же урон всем вражеским существам.
antimancer.5.name=Мученик
antimancer.5.description=Пока мученик жив, все ваши погибшие от заклинаний существа возродятся.
antimancer.6.name=Собиратель
antimancer.6.description=При гибели дружественного существа приносит 1 ману случайной стихии.
antimancer.7.name=Кукла вуду
antimancer.7.description=В начале каждого хода высасывает у всех вражеских существ по 1 хп в пользу хозяина.
antimancer.8.name=Бомбардир
antimancer.8.description=Когда бомбардир наносит урон противнику, наносит такой же урон всем его существам. При гибели наносит противостоящему существу 28 урона
antimancer.9.name=Подкуп
antimancer.9.description=Уничтожает указанное существо противника и призывает его в случайном слоте с полным хп и под контролем заклинателя.

colors=Цвета
colors.description=Каждый цвет имеет минимальную стоимость. В него можно вложить количество спецманы, равное или больше минимальной стоимости (спецсила, само собой, уйдёт вся, сколько бы вы ни хотели вложить). На возможности Цветов влияет количество вложенной спецсилы. На поле не может быть два одинаковых цвета за раз.
colors.Discoloration.name=Серость
colors.Discoloration.description=Уничтожает выбранный цвет хозяина. Даёт один дополнительный ход.
colors.Amber.name=Плоть Золота
colors.Amber.description=Плоть Золота погибает вместо погибшего существа слева. Спасенное существо возрождается с 4Х жизнями. После перерождения атака текущих существ соперника повышается на 1.
colors.Violet.name=Плоть Сирени
colors.Violet.description=Перманентно снижает стоимость всех карт хозяина стоимостью 2Х и ниже на 1. Урон, наносимый заклинаниями хозяина противнику, уменьшается на 3, пока Плоть Сирени на поле.
colors.Azure.name=Плоть Лазури
colors.Azure.description=Пока Плоть Лазури на поле, существа со стоимостью Х, Х+1, Х-1 не получают урона от магии и получают 4 урона каждый ход.
colors.Silver.name=Плоть Серебра
colors.Silver.description= 6 or more.=Лечит существ хозяина на X-1 единиц каждый ход. Уменьшает прирост силы Цвета на 1, если вложено 6 или больше силы Цвета.
colors.Emerald.name=Плоть Изумруда
colors.Emerald.description=Плоть Изумруда уменьшает урон по хозяину на Х-3 единиц. Стоимость всех карт Цвета повышается на Х, пока Плоть Изумруда в игре.
colors.Crimson.name=Плоть Пурпура
colors.Crimson.description=Повышает урон от существ по противнику на Х единиц. Повышает урон от существ по хозяину на Х.
colors.Gold.name=Плоть Золота
colors.Gold.description=Плоть Золота погибает вместо погибшего существа слева. Спасенное существо возрождается с 4Х жизнями. После перерождения атака текущих существ соперника повышается на 1.


wind=Ветер
wind.description=Класс Повелитель Ветра
wind.WingedWarrior.name=Крылатый воин
wind.WingedWarrior.description=Следующее призванное существо будет атаковать сразу после призыва.
wind.Simoom.name=Самум
wind.Simoom.description=Оглушает указанное элементальное существо противника, приносит X маны той же стихии, где X - половина его цены (округление вниз).
wind.BallLightning.name=Шаровая молния
wind.BallLightning.description=Наносит оппоненту 7 урона, дает 1 доп. действие.
wind.Squall.name=Шквал
wind.Squall.description=Дает два доп. действия и наносит 1 урона всем врагам
wind.EnergeticVortex.name=Вихрь энергии
wind.EnergeticVortex.description=Усиливает следующее заклинание хозяина на 50 процентов. 2 маны воздуха переходят от оппонента к заклинателю.
wind.TheSpiritOfThunderstorm.name=Дух грозы
wind.TheSpiritOfThunderstorm.description=Приносит 1 спецману в ход. Наносит всем врагам по 3 урона каждый раз, когда хозяин пропускает ход.
wind.Whirlwind.name=Смерч
wind.Whirlwind.description=Уничтожает указанное существо и противостоящее ему, дает 1 доп. действие.
wind.EternalStorm.name=Вечный шторм
wind.EternalStorm.description=В этот ход все существа хозяина атакуют непосредственно оппонента.

mountainking=Король гор
mountainking.description=Способность класса: боевой строй Хирд. Когда гном располагается рядом с другим гномом, он получает вторую способность.
mountainking.DwarvenSoldier.name=Гном-ратник
mountainking.DwarvenSoldier.description=При входе в игру на 1 ход повышает атаку соседей на 3. Хирд: снижает атаку противостоящего существа на 1 за каждого ратника в игре.
mountainking.DwarvenShieldman.name=Гном-щитоносец
mountainking.DwarvenShieldman.description=Перенаправляет на себя половину урона, получаемого соседями. Хирд: не может быть убит магией (останется минимум 1 хп).
mountainking.DwarvenСrossbowman.name=Гном-арбалетчик
mountainking.DwarvenСrossbowman.description=При атаке наносит такой же урон непосредственно оппоненту. Хирд: перед гибелью проводит внеочередную атаку.
mountainking.ArmourcladDwarf.name=Латник
mountainking.ArmourcladDwarf.description=Снижает получаемый им немагический урон на X, где X - разница в уровне с противостоящим существом (максимум на 5). Хирд: способность распространяется на соседей.
mountainking.Runesmith.name=Рунный воин
mountainking.Runesmith.description=Рунный воин получает урон только от атак противостоящего существа. Хирд: +1 к атаке за каждого гнома в игре.
mountainking.Ballista.name=Баллиста
mountainking.Ballista.description=Когда вражеское существо входит в игру, ополовинивает его здоровье и сама теряет 10 здоровья. Хирд: при активации способности теряет только 7 здоровья.
mountainking.Berserker.name=Берсеркер
mountainking.Berserker.description=Когда хозяин получает больше 5 урона, проводит внеочередную атаку по противостоящему слоту. Хирд: +3 к атаке и +3 к урону ото всех атак.
mountainking.MountainKingCard.name=Гномий король
mountainking.MountainKingCard.description=При входе в игру оглушает сильнейшее существо оппонента. Когда в игру призывается гном, лечится на 6 и перманентно повышает свою атаку на 2. Хирд: снижает стоимость всех гномьих карт на 1.

darksider=Темный странник
darksider.fallen.name=Падший маг
darksider.fallen.description=при атаке наносит такой же урон всем вражеским существам одной с целью стихии
darksider.spider.name=Волкопаук
darksider.spider.description=когда противник использует карту, наносит противостоящему существу урон, равный ее стоимости
darksider.knight.name=Черный рыцарь
darksider.knight.description=соседи рыцаря атакуют только противостоящий ему слот
darksider.mystic.name=Темный мистик
darksider.mystic.description=атака равна спецмане хозяина. При гибели дружественного стихийного существа повышает спецману на 1
darksider.faceless.name=Безликий ужас
darksider.faceless.description=при входе в игру противник теряет карту противостоящего существа
darksider.lake.name=Омут забвения
darksider.lake.description=когда противник использует карту, блокирует ее до своей смерти
darksider.warlock.name=Колдун
darksider.warlock.description=когда противник использует заклинание, отменяет его и теряет 3Х хп (Х – стоимость заклинания)
darksider.dragon.name=Черный дракон
darksider.dragon.description=иммунен к заклинаниям и способностям существ. При входе в игру оглушает всех вражеских существ

limbo=Хранитель чистилища
limbo.description=Пассивная особенность: когда существо хозяина должно умереть, вместо этого оно попадает в «чистилище» и остается на поле вплоть до след.хода, когда умирает
limbo.heaven=Хранитель небес
limbo.heaven.description=когда дружественное существо попадает в чистилище, лечит 2 хп хозяину и всем его существам
limbo.hell=Хранитель ада
limbo.hell.description=когда дружественное существо попадает в чистилище, наносит 2 урона всем врагам
limbo.wraith=Призрак чистилища
limbo.wraith.description=атака равна кол-ву существ в чистилище+1. Атакует всех врагов
limbo.tower=Башня грехов
limbo.tower.description=когда дружественное существо попадает в чистилище, снижает силу противника этой стихии на 1 и повышает на 1 силу хозяина той же стихии
limbo.nether=Объятия смерти
limbo.nether.description=уничтожает всех дружественных существ, переводя в чистилище. Наносит всем вражеским существам по 3 урона за каждое существо в чистилище
limbo.adjudicator=Судящий души
limbo.adjudicator.description=когда дружественное существо попадает в чистилище, призывает в соседний с ним слот хранителя небес/ада, неспособного попасть в чистилище
limbo.redemption=Искупление
limbo.redemption.description=восстанавливает с полным хп указанное существо в чистилище
limbo.baron=Барон чистилища
limbo.baron.description=когда хранитель чистилища или барон убит заклинанием или способностью, они попадают в чистилище. В чистилище атака барона удваивается

dreamweaver=Ткач снов
dreamweaver.wisp=Эфирный светлячок
dreamweaver.wisp.description=Не получает урона от вражеских заклинаний и способностей. +1 к атаке за каждое дружественное существо, кроме себя
dreamweaver.roc=Птенец
dreamweaver.roc.description=Когда незаблокирован, атака падает вдвое
dreamweaver.aurora=Северное сияние
dreamweaver.aurora.description=Все существа лечатся на 12, их хозяева получают по 1 мане соотв.стихии за каждое существо
dreamweaver.guide=Духовный проводник
dreamweaver.guide.description=При призыве лечит всех дружественных существ на спецману хозяина и лечит хозяина на 3Х (Х – кол-во дружественных существ)
dreamweaver.sword=Оживший меч
dreamweaver.sword.description=При атаке наносит такой же урон соседним с целью существам. +1 к атаке за каждого соседа
dreamweaver.butterfly=Радужная бабочка
dreamweaver.butterfly.description=Когда противник призывает существо, приносит 3 маны той же стихии (в т.ч. специальной)
dreamweaver.castle=Летучий замок
dreamweaver.castle.description=Атакует всех врагов. Снижает получаемый другими существами хозяина урон на 2
dreamweaver.mare=Кошмар
dreamweaver.mare.description=При призыве наносит вражеским существам 6Х урона (Х – кол-во пустых слотов у противника). +1 к атаке за каждое дружественное существо, кроме себя

soulbinder=Ловец душ
soulbinder.description=В начале игры в случайном слоте появляется 1 Скованная душа: стоимость 0, параметры 0/0. Скованная душа не атакует, не может быть атакована и считается пустым слотом при атаке существа. Поверх души можно призвать любое существо, при этом Скованная душа не «умирает», а просто выходит из игры.
soulbinder.boundsoul=Скованная душа
soulbinder.boundsoul.description=Не атакует и не получает урон. Существо напротив бьёт хозяина, как если бы слот был пуст. Поверх неё можно призвать любое существо.
soulbinder.tethered=Привязанная душа
soulbinder.tethered.description=Призывается только на Скованную душу. При гибели заменяется Скованной душой.
soulbinder.summon=Вызов душ
soulbinder.summon.description=Призывает Скованную душу в выбранный пустой слот и повышает стихийные силы на 1.
soulbinder.tree=Древо духовных семян
soulbinder.tree.description=Призывается только на Скованную душу. В начале хода хозяина призывает Скованную душу в один из соседних слотов.
soulbinder.seeker=Искатель душ
soulbinder.seeker.description=Призывается только на Скованную душу. В конце хода перемещается в случайный пустой слот и призывает в слот, где стоял, Скованную душу.
soulbinder.release=Высвобождение душ
soulbinder.release.description=Лечит заклинателю и всем его существам по 3 хп за каждую Скованную душу, удаляет все Скованные души из игры и призывает две Скованных души в случайные слоты.
soulbinder.sheppard=Собирательница душ
soulbinder.sheppard.description=Призывается только на Скованную душу. За каждую дружественную Скованную душу получает +1 к атаке и лечит хозяину по 2 хп в ход.
soulbinder.priestess=Жрица судьбы
soulbinder.priestess.description=Призывается только на Скованную душу. При входе в игру лечит хозяину и наносит противнику 2Х урона (Х – кол-во Скованных душ в игре). При гибели дружественного существа призывает Скованную душу в случайный слот.
soulbinder.dragon=Дракон-дух
soulbinder.dragon.description=Призывается только на Скованную душу. При входе в игру наносит всем врагам 6 урона. Каждый ход лечит себе и хозяину 3Х хп (Х – кол-во дружественных Скованных душ).

faerie=Волшебный друид
faerie.twins=Феи-близнецы
faerie.twins.description=При входе в игру и при гибели лечат соседям по 4 хп.
faerie.fire=Пламя фей
faerie.fire.description=Наносят 5 урона заблокированным вражеским существам и оглушает незаблокированных.
faerie.nightwing=Ночное крыло
faerie.nightwing.description=Снижает атаку всех вражеских существ на 1.
faerie.ring=Кольцо фей
faerie.ring.description=Повышает прирост спецманы на 1. Когда хозяин использует спецкарту, атака кольца повышается на 2.
faerie.piper=Дудочник
faerie.piper.description=Каждый ход лечит соседям 3 хп.
faerie.cloud=Облако бабочек
faerie.cloud.description=Призывает стаю бабочек в пустые слоты.
faerie.unicorn=Единорог
faerie.unicorn.description=атакует после призыва. Снижает стоимость существ на 1.
faerie.dragon=Волшебный дракон
faerie.dragon.description=при входе в игру лечит дружественным существам 20 хп и повышает их атаку на 2 на 1 ход.
faerie.rabble=Облако бабочек
faerie.rabble.description=При гибели лечит хозяину 4 хп.

entomologist=Энтомолог
entomologist.beetle=Огнежук
entomologist.beetle.description=При входе в игру наносит противостоящему существу 4 урона. При гибели повышает силу огня хозяина на 1.
entomologist.moth=Ядовитая моль
entomologist.moth.description=Каждый ход наносит всем врагам 1 урона. При гибели оглушает противостоящее существо.
entomologist.hivemind=Коллективный разум улья
entomologist.hivemind.description=В этот ход все дружественные существа атакуют только выбранное существо.
entomologist.locust=Рой саранчи
entomologist.locust.description=Выбранное существо получает 8 урона в ход, а противник – 4 урона вплоть до гибели существа.
entomologist.ant=Гигантский муравей
entomologist.ant.description=Весьма наносимый муравью урон снижается на 2. Пока жив, стоимость муравьев снижается на 2.
entomologist.assassin=Оса-убийца
entomologist.assassin.description=При входе в игру призывает трутней в соседние слоты. +2 к атаке за каждого трутня в игре.
entomologist.hive=Улей насекомых
entomologist.hive.description=В конце каждого хода призывает воина в случайный слот.
entomologist.mantis=Красный богомол
entomologist.mantis.description=При входе в игру снижает все силы противника на 1. Снижает на 1 прирост силы противника стихии противостоящего существа. При гибели наносит противостоящему существу 5 урона.
entomologist.warrior=Воин
entomologist.warrior.description=При гибели повышает спецсилу хозяина на 1.
entomologist.drone=Трутень


seasons=Сезоны
seasons.description=Особенности. Цикл времен года: пока карта не сыграна, она дает определенный пассивный эффект. Истощение: карты можно сыграть только 1 раз. 
seasons.Nectarbloom.name=Медоносница
seasons.Nectarbloom.description=Восстанавливает 2 хп каждый ход.
seasons.AiluvBees.name=Айлувские пчелы
seasons.AiluvBees.description=При входе в игру призывают две медоносицы 2/10 (восстанавливает 2 хп в ход) в случайные слоты. Пассивка: +1 к приросту маны во всех стихиях с запасами маны ниже 2.
seasons.SpiritofEquinox.name=Дух равноденствия
seasons.SpiritofEquinox.description=При призыве лечит 4 хп хозяину и всем его существам и наносит 4 урона всем врагам. Пассивка: +1 к приросту маны во всех стихиях с запасами маны ниже 2.
seasons.SolarWave.name=Солнечная волна
seasons.SolarWave.description=Наносит противнику по 2 урона за каждый его пустой слот. Вражеские существа получают в этот ход утроенный урон. Пассивка: когда хозяин получает более 3 урона, урон снижается на 1.
seasons.EternalSummer.name=Вечное лето
seasons.EternalSummer.description=Можно немедленно сыграть (в любом порядке) еще 1 заклинание и 1 существо с -2 к цене. Пассивка: когда хозяин получает более 3 урона, урон снижается на 1.
seasons.Cornucopia.name=Рог изобилия
seasons.Cornucopia.description=При входе в игру лечит всех дружественных существ на 9. Пока жив, дружественные существа получают +1 к атаке и получаемый ими урон сокращается на 1. Пассивка: стоимость самых дорогих карт в 4 стихиях снижается на 1.
seasons.GaeasAvatar.name=Аватар Геи
seasons.GaeasAvatar.description=Атака равна кол-ву существ на поле. Иммунен к заклинаниям. Каждый ход получает 1 урона за каждый пустой слот на поле. Пассивка: стоимость самых дорогих карт в 4 стихиях снижается на 1
seasons.BehemothofFrozenTime.name=Чудище застывшего времени
seasons.BehemothofFrozenTime.description=При входе в игру оглушает вражеских заблокированных существ. Пока жив, маны противника не могут вырасти выше 9. Пассивка: незаблокированные вражеские существа каждый ход получают 1 урона.
seasons.TheGreatAurora.name=Утренняя заря
seasons.TheGreatAurora.description=Лечит по 16 хп всем дружественным существам и приносит по 3 маны их стихий. Пассивка: незаблокированные вражеские существа каждый ход получают 1 урона.

kinetician=Кинетик
kinetician.magerunner=Маг-бегун
kinetician.magerunner.description=При призыве меняется местами с сильнейшим (по атаке) существом хозяина.
kinetician.tricker=Трюкач
kinetician.tricker.description=Каждый ход перемещается в ближайший незаблокированный слот.
kinetician.force=Фокус силы
kinetician.force.description=В этот ход все дружественные существа атакуют только выбранное существо и получают +1 к атаке.
kinetician.warp=Деформация реальности
kinetician.warp.description=Сокращает здоровье выбранного существа до его уровня.
kinetician.mage=Одинокий маг
kinetician.mage.description=Каждый ход наносит противнику урон, равный кол-ву пустых слотов на его стороне поля.
kinetician.call=Призыв достойного
kinetician.call.description=Снижает вдвое стоимость каждой из карт стихии выбранного существа на 1 применение.
kinetician.barrier=Силовой барьер
kinetician.barrier.description=Удваивает макс.и текущее хп выбранного существа. Цель пропускает следующий ход
kinetician.manipulator=Манипулятор
kinetician.manipulator.description=При входе в игру на 1 ход сокращает атаку всех вражеских существ до 3. Когда противник призывает существо, получает 4X урона (X - его стоимость) и переводит его на свою сторону.

shaman=Шаман
shaman.description=Дух предков: в начале игры в случайном слоте появляется призрачный волк 2/18 (стоимость 2, особенностей нет). Если волк умирает, карта 1 или 2 заменяется картой призыва волка в игру (как с прирученным грифоном в кампании).
shaman.ghost=Призрачный Волк
shaman.hunger=Неутолимый голод
shaman.hunger.description=На 1 ход дает волку +X к атаке (X – атака указанного существа).
shaman.rage=Дух ярости
shaman.rage.description=При входе в игру навсегда повышает атаку соседей на 1.
shaman.moon=Сила полнолуния
shaman.moon.description=Лечит соседям волка и хозяину 8 хп и навсегда снижает получаемый волком урон на 1.
shaman.fury=Призрачная ярость
shaman.fury.description=Наносит вражеским существам по 7 урона и навсегда повышает атаку волка на 1 за каждое погибшее на этом ходу вражеское существо.
shaman.protector=Дух-защитник
shaman.protector.description=Пока он на поле, весь получаемый хозяином урон снижается на 2, а вражеские заклинания вместо нанесения урона лечат волка.
shaman.hunter=Дух-охотник
shaman.hunter.description=Пока он на поле, волк получает +2 к атаке и лечится на нанесенный урон при атаке.
shaman.shadow=Волчья тень
shaman.shadow.description=Эффекты всех карт, действующих на волка, распространяются и на волчью тень. При входе в игру соседи волчьей тени проводят внеочередную атаку.
shaman.mate=Призрачный помощник
shaman.mate.description=При входе в игру перманентно снижает стоимость спецкарт на 1 и наносит противнику 8 урона. Каждый ход волк дополнительно атакует слот напротив помощника.

vampires=Вампиры
vampires.flock=Темная стая
vampires.flock.description=Перемещает свое существо с наименьшим запасом здоровья в указанный слот и делает его на один ход неуязвимым.
vampires.noctule=Нетопырь
vampires.noctule.description=Нанося урон оппоненту, лечит хозяину столько же жизни.
vampires.ghoul=Упырь
vampires.ghoul.description=Если у противостоящего существа осталось меньше 11 жизни, убивает его одним ударом.
vampires.acolyte=Прислужник
vampires.acolyte.description=Когда враждебное существо получает больше 5 урона, приносит хозяину единичку маны его же стихии. 
vampires.ties=Связь крови
vampires.ties.description=Уничтожает свое существо, усиливает соседей (кроме существ уровнем выше 8) на его атаку.
vampires.nosferatu=Носферату
vampires.nosferatu.description=При гибели существа восстанавливает 3 жизни хозяину и 2 - себе.
vampires.aristocrat=Аристократ
vampires.aristocrat.description=В начале каждого хода перемещается в слот напротив существа оппонента с наименьшим здоровьем (если нужно, меняется местами с дружественным). Убивая существо, наносит оппоненту равный его атаке урон.
vampires.mansion=Особняк
vampires.mansion.description=При смерти стихийного существа хозяина призывает на его место вампира 5/14, при атаке восстанавливающего себе жизни в размере половины нанесенного урона. При входе в игру превращает соседей в упырей.
vampires.neophyte=Неофит
vampires.neophyte.description=Восстанавливает себе жизни в размере половины нанесенного урона.


fairy=Сказочник
fairy.lesovik=Леший
fairy.lesovik.description=Блокирует карту противостоящего существа, пока жив. 
fairy.kikimora=Кикимора
fairy.kikimora.description=При входе в игру призывает в случайный слот водяного 4/11.
fairy.vodyanoy=Водяной
fairy.rusalka=Русалка 
fairy.rusalka.description=Оппонент теряет карту убитого ею существа.
fairy.likho=Лихо одноглазое
fairy.likho.description=Когда умирает, сокращает здоровье убившего его существа до 10. Если у него меньше 10 хп, оно умирает. Если убита заклинанием или способностью существа, повышает случайную силу хозяина на 2.
fairy.sirin=Сирин
fairy.sirin.description=Пока жива, ополовинивает атаку противостоящего существа и его соседей.
fairy.alkonost=Алконост 
fairy.alkonost.description=Каждый блокирует 6 случайных карт оппонента. Не может блокировать карты, заблокированные на прошлом ходу.
fairy.firebird=Жар-птица
fairy.firebird.description=Неуязвима, пока стоит рядом с огненным существом.
fairy.zmey=Трехглавый Горыныч 
fairy.zmey.description=При гибели возрождается сначала в виде двухголового горыныча 6/25, а потом в виде одноголового 3/15. Когда один из игроков играет огненную карту, наносит случайному существу оппонента 6 урона.
fairy.2head=Двухглавый Горыныч
fairy.1head=Одноглавый Горыныч

elementalist=Elementalist
elementalist.sylph=Сильф
elementalist.sylph.description= При входе в игру позволяет сыграть доп.спецкарту. +1 к цене за каждого сильфа на поле.
elementalist.freeze=Глубокая заморозка
elementalist.freeze.description=Оба игрока пропускают ход и не могут использовать спецкарты в свой следующий ход.
elementalist.salamander=Саламандра
elementalist.salamander.description=Если сила огня хозяина выше силы огня противника в начале хода, то наносит противнику 4 урона.
elementalist.avalanche=Обвал
elementalist.avalanche.description=Наносит вражеским существам 2Х урона (Х – сила земли хозяина) [{0}], лечит 2Х хп хозяину и обнуляет силу земли хозяина.
elementalist.incineration=Испепеление
elementalist.incineration.description=Уничтожает самое сильное (по хп) существо противника и самое слабое существо хозяина. Лишает игроков их карт.
elementalist.phoenix=Архифеникс
elementalist.phoenix.description=Каждый ход регенерирует Х хп (Х – сила огня хозяина).
elementalist.golem=Каменный голем
elementalist.golem.description=+4 атаки, пока заблокирован. Пока незаблокирован, не получает урона от заклинаний и способностей.
elementalist.frost=Ледяная молния
elementalist.frost.description=Наносит противнику урон в размере разницы между его самой низкой силой и самой высокой силой хозяина. Навсегда блокирует выбранный слот.

reaper=Жнец душ
reaper.description=Когда на поле умирает существо, его владелец получает 1 душу. За каждую душу владельца урон от его особых заклинаний увеличивается на 1 (1 душа = 1 урона)
reaper.damnation=Проклятие
reaper.damnation.description=Выберите существо и нанесите ему 3 урона. Если существо погибает от этого заклинания, увеличьте число душ на x, где x равно стоимости существа (макс. урон 8)
reaper.passage=Тёмный проход
reaper.passage.description=Выберите 1 существо. Это существо и соседние с ним исцеляются на x жизни, где x равно числу ваших душ (макс. исцеление 12)
reaper.rage=Вечная ярость
reaper.rage.description=Выберите 1 существо; оно остаётся активным на поле ещё 2 хода после смерти

reaper.onslaught=Натиск душ
reaper.onslaught.description=Нанесите x урона всем существам противника, где x равно числу ваших душ. После этого заклинания владелец не получает душ за убитых им существ, а число душ владельца становится 0
reaper.tribute=Дань
reaper.tribute.description=Выберите 1 существо владельца и уничтожьте его; владелец получает x жизни, где x равно жизни уничтоженного существа (макс. 36)
reaper.furious=Яростные души
reaper.furious.description=Нанесите противнику x + 7 урона, где x равно числу душ владельца. После этого заклинания число душ становится 0
reaper.sentence=Смертный приговор
reaper.sentence.description=Уничтожает всех существ на поле. За каждое уничтоженное существо владелец получает 2 души вместо 1
reaper.shackles=Оковы души
reaper.shackles.description=Целевое существо не может атаковать, его способность отменена. Его слот нельзя использовать до конца дуэли. Каждый ход, пока пойманное существо на поле, владелец получает 1 душу. Если владелец призовёт что-то напротив этого слота после уничтожения существа противника, это существо будет получать 6 урона каждый ход

sower=Сеятель
sower.tangling=Запутывание
sower.tangling.description=Передаёт X здоровья от целевого существа существу напротив (X = атака целевого существа).
sower.devouring=Пожирание
sower.devouring.description=Жертвует союзным существом и удваивает атаку остальных союзных существ на 1 ход.
sower.monster=Монстр-растение
sower.monster.description=Когда убивает существо, полностью исцеляет все монстр-растения на поле.
sower.pollination=Опыление
sower.pollination.description=Превращает целевое существо уровня X в особое существо уровня (X минус 3) с полным здоровьем и исцеляет владельца на X жизни.
sower.sundew=Кровавая росянка
sower.sundew.description=Когда наносит урон, восстанавливает столько же здоровья.
sower.predator=Хищное растение
sower.predator.description=Когда атакует существо, наносит ему дополнительно X урона (X = разница между текущим и максимальным здоровьем).
sower.drake=Лесной дрейк
sower.drake.description=Когда владелец призывает особое существо, создаёт его копию в ближайшем пустом слоте.
sower.flower=Огненный цветок
sower.flower.description=Каждый ход делит пополам здоровье вражеского существа с наибольшим здоровьем и даёт владельцу 1 силы огня. При появлении наносит противнику X урона (X = его сила огня)

warp=Искажение
warp.errant=Скиталец
warp.errant.description=После убийства существа скрывается в тени и возвращается, получив урон.
warp.quake=Землетрясение
warp.quake.description=Наносит каждому вражескому существу урон, равный разнице сил хозяина и противника в стихии этого существа.
warp.cloak=Плащ
warp.cloak.description=Призывается на существующее существо, прибавляет его атаку и здоровье к своим. При входе в игру даёт 2 маны стихии скрытого существа. При гибели возвращает это существо.
warp.photographer=Фотограф
warp.photographer.description=Когда соседнее существо погибает, на его место встаёт Фотограф с тем же запасом здоровья.
warp.schizo=Шизо
warp.schizo.description=При входе в игру противостоящее существо теряет способности до гибели Шизо.
warp.ram=Таран
warp.ram.description=При входе в игру уничтожает противостоящее существо и даёт его хозяину X-3 маны (X - стоимость этого существа).
warp.stranger=Чужак
warp.stranger.description=Атака равна самой высокой силе противника. При входе в игру копирует способность противостоящего существа (кроме множественной атаки и мгновенных эффектов).
warp.queen=Королева искажения
warp.queen.description=При входе в игру наносит вражеским существам 4 урона. Они теряют способности до конца следующего хода.

disciples=Последователи
disciples.description=В конце хода владельца в случайном пустом слоте владельца появляется заключённый. Когда заключённый умирает, владелец теряет 1 маны из 2 высших базовых домов и\nполучает 1 особой маны. Когда у последователя мало жизни (< половины), его вера слабеет и он теряет 1/3 атаки.
disciples.prisoner=Заключённый
disciples.prisoner.description=При смерти владелец теряет 1 маны из двух высших базовых домов и получает 1 особой маны.
disciples.enraged=Разъярённый заключённый
disciples.enraged.description=Невосприимчив к заклинаниям и способностям, пока жив освободитель.
disciples.drug=Стимулятор
disciples.drug.description=Даёт +1 атаки существам владельца и наносит им 4 урона. Эффект исчезает, когда заключённый умирает.
disciples.preacher=Проповедник
disciples.preacher.description=Пока в игре, обычные карты стоят на 1 маны больше. Увеличивает рост особой маны на 1 и даёт заключённому +1 атаки.
disciples.monk=Тёмный монах
disciples.monk.description=Пока жив, уменьшает силу огня противника на 2 и увеличивает её стоимость на 1.
disciples.prophet=Ложный пророк
disciples.prophet.description=До смерти обычные карты стоят на 1 маны больше. Даёт по 2 маны каждому базовому дому и забирает одну ману при смерти.
disciples.escape=Астральный побег
disciples.escape.description=Урон по заключённому перенаправляется на Астральный побег. Заключённый атакует противника напрямую.
disciples.scarecrow=Пугало
disciples.scarecrow.description=Оглушает и наносит 4 урона существу напротив. Может поменяться местами с заключённым в ближайший пустой слот
disciples.wind=Ветер угнетения
disciples.wind.description=Оглушает существо напротив пугала и его соседей. Наносит им 4 урона
disciples.liberator=Освободитель
disciples.liberator.description=Превращает заключённого в разъярённого заключённого. При смерти наносит ему {0} урона.
disciples.falconer=Сокольник
disciples.falconer.description=Каждый ход наносит существам противника урон, равный расстоянию в слотах.
disciples.madden=Безумие
disciples.madden.description=Наносит 8 урона существу противника. Исцеляет на 3 за каждое убитое существо и даёт +1 атаки каждому.

junk=Хлам
junk.screamer=Крикун
junk.screamer.description=+1 к атаке за каждого другого Крикуна в игре.
junk.poison=Ядовитый цветок
junk.poison.description=Наносит 5 урона выбранному существу хозяина, а также противостоящему существу и его соседям. Снижает на 1 ману стихии выбранного существа и противостоящего существа.
junk.fortune=Свалковая удача
junk.fortune.description=Поглощает 4 единицы первого урона, нанесённого хозяину.
junk.chain=Контроллер цепи
junk.chain.description=Зеркально копирует соседнее существо стоимостью <4. Когда соседнее существо стоимостью <6 погибает, заполняет слот другим слабым существом рядом.
junk.assassin=Бродячий убийца
junk.assassin.description=Если не заблокирован, в конце хода перемещается к ближайшему незаблокированному противнику (крайнему слева при выборе) и наносит ему 5 урона.
junk.factory=Фабрика
junk.factory.description=Если при входе в игру с одной стороны существо стоимостью < 6, а с другой пустой слот, копирует это существо в пустой слот. Также копирует призванное соседнее существо стоимостью < 6 в пустой слот с другой стороны (эффект призыва срабатывает).
junk.bot=Утилизатор
junk.bot.description=Когда существо хозяина погибает, лечит себе 6 хп, а хозяину - 2 хп за каждое потерянное существо.
junk.cyborg=Мусорный киборг
junk.cyborg.description=При входе в игру заполняет поле мусором 2/11. Каждый ход 2 куска мусора собираются в киборга, повышая его здоровье и атаку на оставшееся здоровье мусора (потенциально становится 13/85).
junk.trash=Мусор

snowblood=Снежная кровь
snowblood.tracker=Следопыт
snowblood.tracker.description=Когда существо призывается в соседний слот, оно получает неуязвимость на 1 ход
snowblood.hunter=Охотник за головами
snowblood.hunter.description=При призыве наносит 2 урона существу напротив. Когда убивает существо напротив, даёт владельцу 1/3 его стоимости в мане (округление вверх)
snowblood.maiko=Майко
snowblood.maiko.description=Пока жива, уменьшает на 1 атаку существа напротив и его соседей. Каждый ход исцеляет соседних союзников на 1. После призыва её карта заменяется письмом смерти (стоимость 3, 0/3 — получаемый урон снижается до 1, исцеление невозможно). При смерти наносит 15 урона существу напротив
snowblood.letter=Письмо смерти
snowblood.letter.description=Снижает получаемый урон до 1. При смерти наносит 15 урона существу напротив. (Нельзя исцелить)
snowblood.echo=Эхо
snowblood.echo.description=Мгновенно срабатывают для всех союзных существ эффекты «каждый ход» и «прямые», затем все союзные существа Снежной крови атакуют
snowblood.kojiro=Коджиро
snowblood.kojiro.description=Можно призвать на любой слот владельца, занятый или пустой. Атакует при призыве с +4 атаки в этот ход. Каждый ход наносит 2 урона существу напротив и всем его соседям (соседи — последовательные занятые слоты вокруг него)
snowblood.guide=Военный наставник
snowblood.guide.description=Следующее призванное существо наносит всем вражеским существам урон, равный его атаке. Когда призывается союзное особое существо, исцеляет всех его соседей на 1 (соседи — последовательные занятые слоты вокруг него)
snowblood.janus=Янус
snowblood.janus.description=При призыве даёт +1 маны за каждое существо в двух других слотах на его стороне и исцеляет владельца на 2. Каждый ход наносит 2 урона всем существам владельца на противоположной стороне поля
snowblood.amaterasu=Аматэрасу
snowblood.amaterasu.description=Когда владелец призывает существо стихии:\n- огонь: Аматэрасу наносит 4 урона существу напротив\n- вода: увеличивает наименьшую силу на 1\n- воздух: наносит 2 урона противнику\n- земля: исцеляет владельца на 2

zen=Дзен
zen.elementesist=Стихийник
zen.elementesist.description=Наносит урон противостоящей карте и всем вражеским картам той же стихии.
zen.redlight=Красный свет
zen.redlight.description=Атакует противостоящий слот и соседние.
zen.focus=Фокус
zen.focus.description=Даёт 2 маны стихии выбранного существа и по 1 мане стихии каждого соседа.
zen.guard=Электрический страж
zen.guard.description=Наносит 3 урона существам, наносящим урон хозяину.
zen.dreamer=Мечтатель
zen.dreamer.description=Каждый ход наносит 4 урона слабейшему существу противника (крайнему слева при равенстве).
zen.mimic=Мимик
zen.mimic.description=В начале хода хозяина в случайном пустом слоте появляется кокон. Призовите туда существо, чтобы получить 2 маны его стихии и 3 жизни.
zen.cocoon=Кокон
zen.cocoon.description=Призовите сюда существо, чтобы получить 2 маны его стихии и 3 жизни.
zen.fighter=Дзен-боец
zen.fighter.description=Если у противостоящего существа выше атака, больше здоровья или выше стоимость, каждый ход получает 1 ману его стихии и лечит себе 3 хп. Поглощает 5 урона от заклинаний и способностей. Каждый раз, когда хозяин получает удар, лечит себе 1 хп.
zen.inertia=Инерция
zen.inertia.description=Иммунна к заклинаниям. Призывает Материю в ближайший пустой слот справа. При призыве и каждый ход, пока Материя в игре, лечит слабейшее существо хозяина на 3.
zen.matter=Материя
zen.matter.description=При призыве и каждый ход, пока Инерция в игре, наносит 3 урона сильнейшему существу противника.

highpriest=Верховный жрец
highpriest.description=Божественный путь: в зависимости от того, суммарный уровень существ хозяина какой стихии выше, колода становится либо колодой Ра (огонь, земля) либо колодой Сета (вода, воздух)
highpriest.Sacredscarab=Священный скарабей
highpriest.Sacredscarab.description=Сокращает получаемый им немагический урон на 2X; X - количество его соседей.
highpriest.sunpriest=Жрец солнца 
highpriest.sunpriest.description=При атаке наносит всем существам оппонента урон, равный самой низкой силе хозяина.
highpriest.Apis=Апис 
highpriest.Apis.description=Каждый ход приносит хозяину 1 спецманы и 3 жизни за каждого аписа в игре (кроме себя самого).
highpriest.Bennu=Бенну
highpriest.Bennu.description=Если бенну погибает от карты оппонента, то перед гибелью проводит атаку с утроенной силой по противоположному слоту.
highpriest.EyeofWajet=Око Уаджет
highpriest.EyeofWajet.description=Лечит игрока и его существ на 1 за каждую раскрытую карту оппонента, и наносит всем врагам такой же урон.
highpriest.sphinx=Сфинкс
highpriest.sphinx.description=После смерти оставляет вместо себя головоломку 0/6. Если головоломка уничтожена вражеским существом, то сфинкс возрождается с половинным здоровьем. Если заклинанием или способностью, то оппонент теряет 3 маны самой высокой стихии.
highpriest.Ouroboros=Уроборос
highpriest.Ouroboros.description=В начале хода хозяина призывает в игру змея бесконечности 2/8, который в конце хода противника погибает и лечит хозяину и Уроборосу столько жизни, сколько у него (змея) оставалось.
highpriest.Wingeddragon=Дракон Ра
highpriest.Wingeddragon.description=При входе в игру призывает в ближайший свободный слот солнечный камень 0/22, который каждый ход повышает атаку Ра на 1, и увеличивает на 2 урон от всех заклинаний хозяина.
highpriest.Ancientcrocodile=Древний крокодил
highpriest.Ancientcrocodile.description=После атаки пропускает следующий ход (переваривает).
highpriest.Serpopard=Серпопард 
highpriest.Serpopard.description=Когда хозяин произносит заклинание, серпопард перемещается в ближайший незаблокированный слот и до конца хода удваивает свою атаку.
highpriest.Anubite=Анубит
highpriest.Anubite.description=Убивая существо, призывает на сторону хозяина охранную мумию 4/20.
highpriest.Babi=Бааби
highpriest.Babi.description=Когда мана оппонента растет, бааби наносит эквивалентный урон существу напротив.
highpriest.Curseofchaos=Проклятие хаоса
highpriest.Curseofchaos.description=Выбранное существо и его соседи получают урон, равный сумме их атак.
highpriest.Simoom=Песчаная буря 
highpriest.Simoom.description=Сокращает атаку всех существ оппонента до двойки. Начиная со следующего хода, она восстанавливается (+3 атаки за ход).
highpriest.Ammit=Амамат 
highpriest.Ammit.description=Когда гибнет существо оппонента, она наносит ему урон, равный его запасам маны этой стихии, и приносит хозяину 1 маны той же стихии.
highpriest.Apep=Апоп
highpriest.Apep.description=Атакует всех врагов. Каждый ход поглощает по 1 стихийных ман обоих игроков.
highpriest.puzzle=Puzzle
highpriest.puzzle.description=Если головоломка уничтожена вражеским существом, то сфинкс возрождается с половинным здоровьем. Если заклинанием или способностью, то оппонент теряет 3 маны самой высокой стихии.
highpriest.guardianmummy=Охранная мумия
highpriest.sunstone=Солнечный камень
highpriest.sunstone.description=Каждый ход повышает атаку Ра на 1 и увеличивает на 2 урон от всех заклинаний хозяина.
highpriest.serpent=Змея бесконечности
highpriest.serpent.description=В конце хода противника погибает и лечит хозяину и Уроборосу столько жизни, сколько у него (змея) оставалось.

shadowmage=Теневой маг
shadowmage.description=Специализация: Скрытность. Теневой маг плетёт мощную, но временную защиту - щиты, безмолвие и невидимые клинки, что тают к концу хода.
shadowmage.archer=Теневой лучник
shadowmage.archer.description=При призыве наносит противнику 6 урона. Когда Теневой лучник погибает, противник восстанавливает 6 жизней.
shadowmage.stalker=Теневой охотник
shadowmage.stalker.description=Позиция Теневого охотника скрыта от противника, пока он не получит урон.
shadowmage.weaver=Ткач ночного покрова
shadowmage.weaver.description=При призыве соседние существа игнорируют любой урон до конца следующего хода противника.
shadowmage.silencer=Молчун
shadowmage.silencer.description=При призыве противостоящее существо не может атаковать, а противник не может играть карты его стихии до конца своего следующего хода.
shadowmage.eclipse=Затмение
shadowmage.eclipse.description=Увеличивает силы Огня, Воды, Воздуха и Земли хозяина на 2. Хозяин игнорирует до 30 урона до конца следующего хода противника.
shadowmage.spike=Шип боли
shadowmage.spike.description=Наносит 16 урона всем вражеским существам. В конце хода хозяина лечит все вражеские существа на 16 жизней.
shadowmage.warden=Тёмный страж
shadowmage.warden.description=Тёмный страж всегда игнорирует первый урон, полученный в каждом ходу.
shadowmage.assassin=Великий ассасин
shadowmage.assassin.description=При призыве наносит 12 урона существу в противостоящем слоте. Может заменить любое своё существо стоимостью 9 или меньше. Хозяин получает силу стихии заменённого существа, равную половине его стоимости (с округлением вверх).

battlemage=Боевой маг
battlemage.description=Специализация: Тактика. Существа боевого мага сочетают атакующие характеристики с защитными умениями или наоборот. Заклинания служат и нападению, и защите.
battlemage.taunt=Провокация
battlemage.taunt.description=Ваше целевое существо немедленно наносит противнику урон, равный своей атаке. Если цель — вражеское существо с меньшей атакой, чем у противостоящего ему существа, оно оглушается.
battlemage.rune=Рунный воин
battlemage.rune.description=Уменьшает урон от заклинаний противника на 2.
battlemage.sergeant=Серебряный сержант
battlemage.sergeant.description=Соседние существа, не являющиеся стенами, наносят противнику на 3 урона больше, пока их слот не заблокирован.
battlemage.knight=Атакующий рыцарь
battlemage.knight.description=Атакует дважды, пока заблокирован. Если после первой атаки слот свободен, второй атаки нет.
battlemage.fieldmage=Полевой маг
battlemage.fieldmage.description=Урон вражеских заклинаний, нанесённый хозяину или его другим существам, перенаправляется на Полевого мага.
battlemage.cavalier=Золотой кавалерист
battlemage.cavalier.description=Получает +1 атаки за каждый пустой слот на вашей стороне. Запрещённая комбинация: Апокалипсис.
battlemage.warcry=Звучный боевой клич
battlemage.warcry.description=Наносит 9 урона противнику и всем его существам. Эти существа теряют способности до конца вашего следующего хода.
battlemage.retinue=Свита генерала
battlemage.retinue.description=Вы можете сыграть ещё одно существо в этот ход. Пока Свита генерала в игре, следующая карта Тактики стоит на 1 меньше.

tinker=Тинкер
tinker.description=Специализация: Тинкер. Стимпанк-мастерская, которая засевает линию врага тикающими бомбами, а затем тратит их: дополнительные удары, растущие солдаты и королева, превращающая каждый фитиль во взрыв.
tinker.bomb=Бомба механика
tinker.bomb.description=Каждый ход теряет 1 жизнь. При смерти наносит 3 урона своему хозяину.
tinker.plant=Механика
tinker.plant.description=Ставит Бомбу механика в целевой свободный слот противника.
tinker.spider=Заводной паук
tinker.spider.description=При призыве ставит Бомбу механика в противостоящий слот, если он свободен. Когда Заводной паук убивает противостоящее существо, он атакует снова.
tinker.falcon=Заводной сокол
tinker.falcon.description=При призыве ставит Бомбу механика в крайний правый свободный слот противника. При смерти ставит Бомбу механика в крайний левый свободный слот противника.
tinker.scatter=Кассетная бомба
tinker.scatter.description=Наносит 8 урона всем существам противника. За каждое существо, погибшее от этого заклинания, ставит Бомбу механика в занятый им слот.
tinker.soldier=Паровой солдат
tinker.soldier.description=Каждый раз, когда умирает Бомба механика противника, атака Парового солдата навсегда увеличивается на 1.
tinker.automaton=Автоматон
tinker.automaton.description=В конце хода хозяина ставит Бомбу механика в случайный свободный слот противника.
tinker.queen=Заводная королева
tinker.queen.description=При призыве уничтожает все Бомбы механика противника. Пока Заводная королева в игре, все Бомбы механика наносят противнику на 3 урона больше.
tinker.dragon=Паровой дракон
tinker.dragon.description=Атакует при призыве. При призыве ставит Бомбу механика в три случайных свободных слота противника. Каждый раз, когда Паровой дракон убивает противостоящее существо, хозяин получает 1 силы Тинкера.

conjurer=Заклинатель
conjurer.description=Специализация: Конжурация. Заклинания и существа усиливают друг друга: каждое ваше заклинание запускает Конжур на ваших существах. Скачки атаки, сила стихий и второй импульс от той же игры.
conjurer.nectar=Лавандовый нектар
conjurer.nectar.description=Лечит целевое существо на 5 (своё или вражеское). Вы получаете 1 силы стихии этого существа.
conjurer.bravery=Храбрость
conjurer.bravery.description=Увеличивает атаку каждого вашего существа, не являющегося стеной, на 1 до конца хода. Даёт 1 силы Конжурации.
conjurer.warmage=Военный маг
conjurer.warmage.description=При призыве ваши существа получают +2 атаки до конца хода. Конжур: ваши другие существа получают +2 атаки до конца хода.
conjurer.golem=Костяной голем
conjurer.golem.description=Не получает урон от заклинаний и способностей. Конжур: атака Костяного голема навсегда увеличивается на 1. Ваши другие существа лечатся на 3.
conjurer.nurture=Обряд питания
conjurer.nurture.description=Ваши существа не атакуют в этот ход. После особых эффектов они лечатся на величину своей атаки плюс 4, а вы - на сумму их атак плюс 4.
conjurer.pain=Боль сущности
conjurer.pain.description=Наносит 3 урона целевому существу противника и самому противнику. Дополнительно 2 урона за каждую единицу силы противника стихии этого существа.
conjurer.guard=Нечестивый страж
conjurer.guard.description=При призыве снижает атаку каждого существа противника на 3 до конца хода противника. Конжур: навсегда снижает атаку каждого существа противника на 1.
conjurer.mystic=Тёмный мистик
conjurer.mystic.description=При призыве увеличивает силы Огня, Воды, Воздуха и Земли на 2. Конжур: увеличивает силу Конжурации на 2.

rogue=Плут
rogue.description=Специализация: Скрытность. Засада на занятой линии, кража роста и добивание после удара. Слабые тела, грязный тайминг.
rogue.sneak=Внезапная атака
rogue.sneak.description=Оглушает целевое существо и наносит ему 4 урона. Если цель заблокирована, урон удваивается.
rogue.trickster=Полурослик-трикстер
rogue.trickster.description=Пока напротив есть существо, в начале хода хозяина наносит 2 урона противнику.
rogue.thief=Похитительница энергии
rogue.thief.description=В начале хода хозяина уменьшает на 1 силу противника стихии существа напротив Похитительницы энергии.
rogue.dancer=Танцовщица теней
rogue.dancer.description=Пока напротив есть существо, наносит дополнительную атаку.
rogue.fighter=Уличный боец
rogue.fighter.description=Каждый раз, когда Уличный боец получает урон от существа напротив, его атака навсегда увеличивается на 2.
rogue.assassin=Эльфийская ассасин
rogue.assassin.description=При призыве наносит 8 урона существу напротив. Если оно умирает, она сразу атакует.
rogue.trap=Магическая ловушка
rogue.trap.description=Уменьшает все силы противника на 2 и заставляет его пропустить следующий ход.
rogue.archer=Тёмный лучник
rogue.archer.description=При призыве уничтожает всех существ противника с 6 или меньше жизней. Когда Тёмный лучник убивает существо напротив, наносит 3 урона противнику.

meteomancer=Метеоманты
meteomancer.description=Специализация: Предвидение. Когда вы призываете существо Метео, выберите базовую стихию (Огонь, Воду, Воздух или Землю) как Призванную стихию. Большинство карт Метео срабатывают, когда противник играет карты этой стихии.
meteomancer.thief=Похититель молний
meteomancer.thief.description=Когда противник использует заклинание Призванной стихии, Зов грома поражает существо противника с наибольшим здоровьем (6 урона ему и 6 противнику).
meteomancer.extremophile=Экстремофил
meteomancer.extremophile.description=Невосприимчив к урону от заклинаний и способностей противника. Когда противник играет карту Призванной стихии, в крайнем правом свободном слоте владельца появляется ещё один Экстремофил.
meteomancer.clairvoyant=Ясновидящая
meteomancer.clairvoyant.description=При призыве противник получает 3 маны новой Призванной стихии и теряет по 1 мане каждого другого типа.
meteomancer.mistwalker=Ходящая в тумане
meteomancer.mistwalker.description=Призванная стихия, выбранная при призыве Ходящей в тумане, не раскрывается противнику. Атака Ходящей в тумане увеличена на 5, пока это ваше единственное существо Метео в игре.
meteomancer.grenadier=Астральный гренадёр
meteomancer.grenadier.description=Когда противник призывает не-Особое существо, оно теряет половину здоровья (с округлением вверх), если принадлежит Призванной стихии, и получает 4 урона в противном случае.
meteomancer.fateweaver=Ткачиха судьбы
meteomancer.fateweaver.description=Когда противник играет карту Призванной стихии, получите 4 маны этой стихии и сыграйте дополнительную карту Призванной стихии в свой следующий ход.
meteomancer.prism=Призматический маг
meteomancer.prism.description=Каждый ход наносит каждому существу противника урон, равный половине маны противника в Призванной стихии (с округлением вниз). Когда противник играет карту Призванной стихии, атака Призматического мага навсегда увеличивается на 1.
meteomancer.storm=Астральная буря
meteomancer.storm.description=Когда противник играет карту Призванной стихии, наносит 19 урона противнику и каждому его существу.

quantumancer=Квантомант
quantumancer.description=Специализация: Суперпозиция. Заклинания, растущие от маны врага, воины, делящиеся уроном, и печати, крадущие карты противника.
quantumancer.surge=Всплеск силы
quantumancer.surge.description=Наносит каждому существу противника урон, равный мане противника в Доме этого существа, но не менее 3.
quantumancer.kineticist=Кинетик
quantumancer.kineticist.description=Заклинания и способности противника лечат Кинетика вместо урона и навсегда увеличивают его атаку на 1.
quantumancer.warrior=Воин измерений
quantumancer.warrior.description=Когда Воин измерений атакует существо, он также наносит урон противнику, равный своей силе атаки.
quantumancer.martyr=Магнитный мученик
quantumancer.martyr.description=Весь урон, наносимый вашим существам заклинаниями противника, вместо этого наносится Магнитному мученику.
quantumancer.wall=Фосфорная стена
quantumancer.wall.description=Когда Фосфорную стену атакуют, она наносит каждому существу противника урон, равный уровню атаковавшего существа.
quantumancer.sealing=Дух печати
quantumancer.sealing.description=Когда противник играет карту, он не может играть её снова, пока жив Дух печати. Пока он в игре, владелец не может играть другого Духа печати.
quantumancer.fusion=Элементаль слияния
quantumancer.fusion.description=Атака Элементаля слияния равна наибольшему запасу маны противника. Каждый ход уменьшает наименьший запас маны противника на 1.
quantumancer.cosmic=Космический маг
quantumancer.cosmic.description=При появлении даёт дополнительный ход: можно бесплатно переиграть заклинание стоимостью 10 или меньше, сыгранное противником. Переигрывание можно пропустить.
quantumancer.cosmic.choose=Переиграйте заклинание противника бесплатно или пропустите
meteomancer.choose=Призванная стихия (сейчас: {0})
meteomancer.noelement=нет
powermancer=Пауэрмант
powermancer.description=Специализация: Сила. Платите особой силой за любые карты, жертвуйте существ ради силы и жизни и облагайте данью силу противника.
powermancer.bargain=Инфернальная сделка
powermancer.bargain.description=Можно играть любые базовые карты, тратя всю силу её типа и остаток из особой силы. Дает 1 доп. действие. Нельзя играть в первые два хода.
powermancer.burial=Вечное погребение
powermancer.burial.description=Пожертвуйте существо: получите 3 силы его типа и по 1 каждой другой силы. Получите жизнь, равную двойной стоимости существа, но не больше 10.
powermancer.hunter=Охотник за силой
powermancer.hunter.description=Когда Охотник за силой ранит существо противника, получите 1 особой силы. Когда он ранит противника, уменьшите случайную силу противника на 1.
powermancer.tower=Башня из слоновой кости
powermancer.tower.description=Пока в игре, ваши заклинания стоят на 2 меньше, а остальные карты на 1 меньше. Когда вы играете карту, нанесите противнику 3 урона; если это заклинание, вместо этого получите 3 жизни.
powermancer.equilibrium=Равновесие
powermancer.equilibrium.description=Нанесите противнику урон, равный его наибольшей силе, затем уменьшите эту силу на 2. Получите жизнь, равную вашей наименьшей силе, затем увеличьте эту силу на 2.
powermancer.hound=Астральная гончая
powermancer.hound.description=Увеличьте рост вашей особой силы на 1 и уменьшите рост особой силы противника на 1.
powermancer.stasis=Стазис
powermancer.stasis.description=Уменьшите каждую силу противника на 1, оглушите всех существ противника и запретите противнику играть карты в следующий ход.
powermancer.rainbow=Радужные аватары
powermancer.rainbow.description=Призовите в случайные пустые слоты четырёх аватаров 2/16: огня, воды, воздуха и земли. Каждый увеличивает рост своей стихии на 1, пока в игре.
powermancer.avatar.fire=Аватар огня
powermancer.avatar.fire.description=Аватар огня. Увеличивает рост вашей силы огня на 1, пока в игре.
powermancer.avatar.water=Аватар воды
powermancer.avatar.water.description=Аватар воды. Увеличивает рост вашей силы воды на 1, пока в игре.
powermancer.avatar.air=Аватар воздуха
powermancer.avatar.air.description=Аватар воздуха. Увеличивает рост вашей силы воздуха на 1, пока в игре.
powermancer.avatar.earth=Аватар земли
powermancer.avatar.earth.description=Аватар земли. Увеличивает рост вашей силы земли на 1, пока в игре.

shadowcaster=Заклинатель теней
shadowcaster.description=Специализация: Тьма. Сила Тьмы — особый счётчик класса. Питайтесь страхом врагов, набрасывайте тени на поле боя и призывайте проклятых тёмных эльфов из Миров Теней.
shadowcaster.bat=Гигантская летучая мышь
shadowcaster.bat.description=Каждый раз, нанеся урон существу противника, лечит себя на 3.
shadowcaster.wave=Волна теней
shadowcaster.wave.description=Наносит X+2 урона всем существам противника (X — сила Тьмы заклинателя).
shadowcaster.noble=Тёмный эльф-дворянин
shadowcaster.noble.description=Если убит заклинанием противника, увеличивает силу Тьмы владельца на 2.
shadowcaster.mage=Тёмный эльф-маг
shadowcaster.mage.description=Увеличивает стоимость всех заклинаний владельца на 1, а их урон на 2. Каждый раз, когда владелец применяет заклинание, увеличивает его силу Тьмы на 1.
shadowcaster.scythe=Коса теней
shadowcaster.scythe.description=Наносит X+4 урона всем существам противника (X — сила Тьмы заклинателя). За каждое убитое существо наносит противнику 2 урона и увеличивает силу Тьмы заклинателя на 1.
shadowcaster.assassin=Тёмный эльф-убийца
shadowcaster.assassin.description=Атакует в тот же ход, когда призван. Каждый раз, убив существо противника, увеличивает силу Тьмы владельца на 1.
shadowcaster.moonblade=Лунный клинок
shadowcaster.moonblade.description=В начале хода владельца наносит всем существам противника урон, равный силе Тьмы владельца. Каждый раз, убив существо, увеличивает силу Тьмы владельца на 1.
shadowcaster.priestess=Жрица теней
shadowcaster.priestess.description=При призыве оглушает всех существ противника. При смерти увеличивает силу Тьмы владельца на 2.

spiritshaman=Духовный шаман
spiritshaman.description=Специализация: Освобождение. Сила Духа — особая мана. Призывайте духовные тотемы; когда выполняется условие Освобождения, тотем в слоте заменяется духом.
spiritshaman.tortoise=Тотем черепахи
spiritshaman.tortoise.description=При призыве освобождает все тотемы в соседних слотах. Освобождение: когда владелец призывает другое духовное существо.
spiritshaman.tortoise.spirit=Дух черепахи
spiritshaman.tortoise.spirit.description=При освобождении увеличивает силу Духа владельца на 1.
spiritshaman.fox=Тотем лисы
spiritshaman.fox.description=При призыве наносит существу напротив урон, равный его атаке. Освобождение: в начале хода владельца, если у него 5 или меньше жизни.
spiritshaman.fox.spirit=Дух лисы
spiritshaman.fox.spirit.description=При освобождении освобождает все остальные тотемы владельца, даже если их условие Освобождения не выполнено.
spiritshaman.deer=Тотем оленя
spiritshaman.deer.description=Каждый ход исцеляет владельца на 1. Освобождение: в начале хода владельца, если сила Земли владельца 7 или больше.
spiritshaman.deer.spirit=Дух оленя
spiritshaman.deer.spirit.description=При освобождении исцеляет все остальные существа владельца на 6.
spiritshaman.owl=Тотем совы
spiritshaman.owl.description=При призыве увеличивает на 1 наименьшую силу Огня, Воды, Воздуха или Земли владельца. Освобождение: когда одна из этих сил 1 или меньше.
spiritshaman.owl.spirit=Дух совы
spiritshaman.owl.spirit.description=При освобождении увеличивает на 2 наименьшую силу Огня, Воды, Воздуха или Земли владельца.
spiritshaman.panther=Тотем пантеры
spiritshaman.panther.description=Его атака увеличивается на 1 каждый ход, но он не может атаковать. Освобождение: когда суммарная атака тотема пантеры и его соседей 12 или больше.
spiritshaman.panther.spirit=Дух пантеры
spiritshaman.panther.spirit.description=Его атака равна 2 плюс атака тотема пантеры при освобождении. Когда убивает существо противника, атакует снова сразу.
spiritshaman.awakening=Духовное пробуждение
spiritshaman.awakening.description=Исцеляет заклинателя и всех его существ на величину силы Духа владельца (до оплаты стоимости заклинания) и освобождает все тотемы заклинателя.
spiritshaman.bear=Тотем медведя
spiritshaman.bear.description=В ход призыва увеличивает атаку всех остальных существ владельца на 2. Освобождение: когда на поле не менее 8 существ (включая его).
spiritshaman.bear.spirit=Дух медведя
spiritshaman.bear.spirit.description=При освобождении наносит 8 урона всем существам противника.
spiritshaman.eagle=Тотем орла
spiritshaman.eagle.description=При призыве увеличивает силу Духа владельца на 4. Освобождение: когда сила Духа владельца 8 или больше.
spiritshaman.eagle.spirit=Дух орла
spiritshaman.eagle.spirit.description=При освобождении уменьшает силу Духа владельца на 4 и увеличивает все остальные силы владельца на 2.
chronomaster=Хрономастер
chronomaster.description=Специализация: Время. Замораживайте настоящее, ускоряйте удары и возвращайте поле к вчерашнему дню.
chronomaster.freeze=Заморозка
chronomaster.freeze.description=Целевое существо пропускает свой следующий ход.
chronomaster.sprites=Светлые духи
chronomaster.sprites.description=Этих сверхбыстрых существ нельзя заблокировать.
chronomaster.accelerate=Ускорение времени
chronomaster.accelerate.description=Целевое дружественное существо атакует 2 или 3 раза в этом ходу.
chronomaster.wall=Стена искажения времени
