campaign.title=Кампания
campaign.intro=Вы только что прибыли на лодке в незнакомую вам страну. Вы не знаете почему, но всплывает воспоминание: давно ваш учитель предупреждал вас, что может наступить время, когда стихии разрушатся, и тогда те немногие уроки, которые он вам дал, пригодятся. Вы надеетесь найти мирную землю, но, глядя на дальние горы, вы о чём-то беспокоитесь.
campaign.day=День
campaign.night=Ночь
campaign.complete=Вершина ваша
campaign.epilogue=Вы не понимаете, как вы оказались так далеко. Внезапно вам приходит видение. Давно существовала община мансеров, что сражались друг с другом в шуточном споре, и каждый стремился углубить своё мастерство. В равновесии тех времён была магия. Вы помните момент, когда пришлось покинуть эту общину, — и почему. С тех пор вы чувствовали эхо магии во всём, что делали.
campaign.epilogue.menu=Вернуться в меню
