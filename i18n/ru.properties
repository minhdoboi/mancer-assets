campaign.title=Кампания
campaign.intro=Вы только что прибыли на лодке в незнакомую вам страну. Вы не знаете почему, но помните: давно ваш учитель предупреждал вас, что может наступить время, когда стихии разрушатся, и тогда те немногие уроки, которые он вам дал, пригодятся. Вы надеетесь найти мирную землю, но, глядя на дальние горы, вы о чём-то беспокоитесь.
campaign.day=День
campaign.night=Ночь
campaign.complete=Вершина ваша
campaign.epilogue=Вы не понимаете, зачем зашли так далеко. Внезапно приходит видение. Когда-то давно существовала община мансеров, что сражались друг с другом в игровой манере, чтобы расти в мастерстве. В равновесии тех времён была магия. Вы помните момент, когда пришлось покинуть эту общину, и почему пришлось уйти.
campaign.epilogue.menu=Вернуться в меню
