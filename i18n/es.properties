antimancer.0.name=Turba furiosa
antimancer.2.name=Sacerdote espejo
antimancer.2.description=Cada vez que el oponente juega una carta, obtienes 1 de poder del tipo de esa carta. Si el oponente jugó una carta especial, obtienes 1 de Venganza.
antimancer.3.name=Resistencia
antimancer.3.description=Coloca una Turba furiosa 3/9 en cada una de tus casillas desbloqueadas.
antimancer.4.name=Represor
antimancer.4.description=Cada vez que el Represor pierde vida, inflige una cantidad equivalente de daño a todas las criaturas del oponente.
antimancer.5.name=Mártir
antimancer.5.description=Mientras el Mártir esté en juego, todas tus otras cartas que mueran o sean destruidas por un hechizo renacerán.
antimancer.6.name=Cosechador
antimancer.6.description=Cada vez que muere una criatura del jugador, el Cosechador aumenta al azar en 1 el poder de fuego, agua, aire o tierra del jugador.
antimancer.7.name=Muñeco vudú
antimancer.7.description=Al comienzo del turno de su jugador, el Muñeco vudú drena 1 de vida de cada carta del oponente.
antimancer.8.name=Bombardero
antimancer.8.description=Cuando el Bombardero inflige daño al oponente, inflige la misma cantidad de daño a todas las cartas del oponente. Cuando el Bombardero muere, inflige 28 de daño a la carta de la casilla opuesta.
antimancer.9.name=Soborno
antimancer.9.description=Destruye una carta del oponente con coste de poder 7 o menos. Esa carta reaparecerá en una de las casillas vacías al azar del jugador con vida máxima.

colors=Colores
colors.description=Cada color tiene un coste mínimo. Cuando se invoca una carta especial, todo el mana especial se gasta en ella. La cantidad de mana afecta a las habilidades de los colores (X). Solo puede haber un color de cada tipo en el tablero.
colors.Discoloration.name=Decoloración
colors.Discoloration.description=Destruye el color elegido del jugador y da una acción adicional.
colors.Amber.name=Ámbar
colors.Amber.description=Al morir, reparte 2X de mana a partes iguales entre los dos poderes más altos del jugador.
colors.Violet.name=Violeta
colors.Violet.description=Reduce permanentemente en 1 el coste de las cartas del jugador con coste 2X o menos. El daño de los hechizos enemigos se reduce en 3 mientras Violeta permanezca en el tablero.
colors.Azure.name=Azur
colors.Azure.description=Mientras Azur permanezca en el tablero, las criaturas del jugador con coste X, X+1 y X-1 no reciben daño de hechizos ni de habilidades de criaturas, pero reciben 4 de daño cada turno.
colors.Silver.name=Plata
colors.Silver.description=Cura X-1 de vida a las criaturas del jugador cada turno. Reduce en 1 el crecimiento del poder de Colores si X 
colors.Emerald.name=Esmeralda
colors.Emerald.description=Reduce en X-3 el daño infligido al jugador. El coste de todas las cartas de Colores aumenta en X mientras Esmeralda permanezca en el tablero.
colors.Crimson.name=Carmesí
colors.Crimson.description=Aumenta en X el daño que las criaturas infligen a ambos jugadores.
colors.Gold.name=Oro
colors.Gold.description=Muere en lugar de la criatura muerta a su izquierda


