wind.TheSpiritOfThunderstorm.description=Da 1 de mana especial por turno. Inflige 3 de daño a todos los enemigos cuando el jugador pasa turno.
wind.Whirlwind.name=Torbellino
wind.Whirlwind.description=Destruye a la criatura objetivo y a la opuesta, permite usar una carta adicional este turno.
wind.EternalStorm.name=Tormenta eterna
wind.EternalStorm.description=Este turno todas las criaturas aliadas atacan directamente al oponente.

mountainking=Rey de la montaña
mountainking.description=Hird: mientras un enano esté junto a otro enano, obtiene una segunda habilidad
mountainking.DwarvenSoldier.name=Soldado enano
mountainking.DwarvenSoldier.description=Al entrar en juego aumenta en 3 el ataque de los vecinos durante 1 turno. Hird: reduce en 1 el ataque de la criatura opuesta por cada soldado enano en el tablero.
mountainking.DwarvenShieldman.name=Escudero enano
mountainking.DwarvenShieldman.description=Redirige hacia sí la mitad del daño infligido a los vecinos. Hird: no puede morir por magia (quedará al menos 1 de vida).
mountainking.DwarvenСrossbowman.name=Ballestero enano
mountainking.DwarvenСrossbowman.description=Al atacar inflige el mismo daño directamente al oponente. Hird: ataca instantáneamente justo antes de morir.
mountainking.ArmourcladDwarf.name=Enano acorazado
mountainking.ArmourcladDwarf.description=Reduce en X el daño no mágico que recibe (X = diferencia de nivel con la criatura opuesta). Hird: su habilidad se aplica también a los vecinos.
mountainking.Runesmith.name=Forjarrunas
mountainking.Runesmith.description=El Forjarrunas solo puede ser dañado por la criatura opuesta cuando está bloqueado. Hird: +1 de ataque por cada enano en juego (incluido él).
mountainking.Ballista.name=Balista
mountainking.Ballista.description=Cuando una criatura enemiga entra en juego, reduce su salud a la mitad y pierde 10 de salud. Hird: pierde solo 7 de salud al activar la habilidad.
mountainking.Berserker.name=Berserker
mountainking.Berserker.description=Cuando el jugador recibe más de 5 de daño, ataca instantáneamente la casilla opuesta. Hird: +3 de ataque y de daño infligido al berserker.
mountainking.MountainKingCard.name=Rey de la montaña
mountainking.MountainKingCard.description=Cuando un enano aliado entra en juego, se cura 4 y aumenta permanentemente su ataque en 2. Al entrar en juego aturde a la criatura enemiga más fuerte. Hird: reduce en 1 el coste de las cartas de enanos.

darksider=Darksider
darksider.fallen.name=Mago caído
darksider.fallen.description=al atacar, inflige el mismo daño a todas las criaturas enemigas del elemento de la criatura opuesta.
darksider.spider.name=Araña lobo
darksider.spider.description=cuando el oponente invoca una carta, inflige a la criatura opuesta un daño igual al coste de esa carta.
darksider.knight.name=Caballero negro
darksider.knight.description=sus vecinos solo atacan la casilla opuesta al caballero negro.
darksider.mystic.name=Místico oscuro
darksider.mystic.description=su ataque es igual al poder especial del jugador. Cuando muere una criatura elemental aliada, aumenta en 1 el poder especial
darksider.faceless.name=Horror sin rostro
darksider.faceless.description=al ser invocado, el oponente pierde la carta de la criatura opuesta.
darksider.lake.name=Lago del olvido
darksider.lake.description=cuando el oponente invoca una carta, la bloquea hasta la muerte del lago.
darksider.warlock.name=Brujo
darksider.warlock.description=cuando el oponente lanza un hechizo, lo bloquea y pierde 3X de vida (X = coste del hechizo).
darksider.dragon.name=Dragón negro
darksider.dragon.description=inmune a todos los hechizos y habilidades. Al entrar en juego, aturde a todas las criaturas enemigas

limbo=Limbo
limbo.description=Habilidad pasiva del Guardián del Limbo: cada vez que una criatura enemiga ataca y mata al GUARDIÁN DEL LIMBO o a sus criaturas, su muerte se pospone hasta el final del turno del GUARDIÁN DEL LIMBO; se consideran en 'estado Limbo'. Las criaturas en 'estado Limbo' atacan y bloquean como de costumbre.
limbo.heaven=Guardián del Cielo
limbo.heaven.description=cada vez que otra criatura del jugador entra en 'estado Limbo', el Guardián del Cielo cura 2 de vida a su jugador y a cada una de sus criaturas.
limbo.hell=Guardián del Infierno
limbo.hell.description=cada vez que otra criatura del jugador entra en 'estado Limbo', el Guardián del Infierno inflige 2 de daño al oponente y a cada una de sus criaturas.
limbo.wraith=Espectro del Limbo
limbo.wraith.description=el ataque del Espectro del Limbo es igual al número de criaturas del jugador en 'estado Limbo' más 1. El ataque del Espectro del Limbo daña al oponente y a cada una de sus criaturas.
limbo.tower=Torre de los pecados
limbo.tower.description=cada vez que una criatura del jugador entra en 'estado Limbo', el mana del oponente de la casa de esa criatura se reduce en 1 y el mana del jugador de la casa de esa criatura aumenta en 1.
limbo.nether=Garra del abismo
limbo.nether.description=destruye cada una de las criaturas de su lanzador y entran en 'estado Limbo'. Luego inflige 3 de daño a cada criatura del oponente por cada criatura del lanzador que esté en 'estado Limbo'.
limbo.adjudicator=Juez de almas
limbo.adjudicator.description=cada vez que una criatura del jugador entra en 'estado Limbo', se invoca en una casilla vacía al azar adyacente a esa criatura un Guardián del Cielo o un Guardián del Infierno (el que tengas en la mano) con la restricción "no puede entrar en 'estado Limbo'".
limbo.redemption=Redención
limbo.redemption.description=la criatura objetivo del lanzador que esté en 'estado Limbo' es invocada de nuevo con la salud completa.
limbo.baron=Barón del Limbo
limbo.baron.description=cuando un hechizo o habilidad daña y mata al GUARDIÁN DEL LIMBO o al Barón del Limbo, entran en 'estado Limbo'. Cuando el Barón del Limbo entra en 'estado Limbo', su ataque se duplica.

dreamweaver=Tejesueños
dreamweaver.description=El Tejesueños crea y controla el poder de los Sueños, una fuerza formidable tanto en el sueño como en la vigilia. Con suficiente energía creativa, los Tejesueños pueden convertir una idea pasajera en una criatura maravillosa, o crear espectáculos espléndidos de naturaleza y magia.
dreamweaver.wisp=Fuego fatuo etéreo
dreamweaver.wisp.description=El Fuego fatuo etéreo no recibe daño de hechizos ni habilidades enemigos.  Su ataque aumenta en 1 por cada otra criatura del jugador.
dreamweaver.roc=Cría de roc
dreamweaver.roc.description=Mientras la Cría de roc no tenga oponente, su ataque se reduce a la mitad (redondeado hacia arriba).
dreamweaver.aurora=Aurora
dreamweaver.aurora.description=Todas las criaturas se curan 12 de vida y añaden 1 de mana de su propio tipo a las reservas de mana de su jugador.
dreamweaver.guide=Guía espiritual
dreamweaver.guide.description=Cuando se invoca a la Guía espiritual, cura a todas las criaturas del jugador una cantidad igual al poder de Sueño del jugador, y cura al jugador 3 de vida por cada criatura suya.
dreamweaver.sword=Espada viviente
dreamweaver.sword.description=La Espada viviente gana 1 de ataque por cada criatura vecina.  Cuando la Espada viviente ataca, si hay criaturas adyacentes a la casilla opuesta, también las ataca.
dreamweaver.butterfly=Mariposa arcoíris
dreamweaver.butterfly.description=Cada vez que el oponente invoca una criatura, el jugador de la Mariposa arcoíris gana 3 de mana del tipo de esa criatura.  (A este efecto, todas las criaturas Especiales cuentan como Sueño.)
dreamweaver.castle=Castillo volador
dreamweaver.castle.description=El Castillo volador ataca al oponente y a todas sus criaturas.  El Castillo volador reduce en 2 el daño infligido a todas las demás criaturas del jugador.
dreamweaver.mare=Pesadilla
dreamweaver.mare.description=Cuando se invoca la Pesadilla, inflige 6 de daño a cada criatura del oponente por cada casilla vacía del oponente.  El ataque de la Pesadilla aumenta en 1 por cada otra criatura del jugador.

soulbinder=Ligaalmas
soulbinder.description=El Ligaalmas siempre comienza el duelo con 1 Alma ligada en juego en una casilla al azar. El Alma ligada no ataca. El Alma ligada no recibe daño de criaturas atacantes, habilidades ni hechizos. Una criatura opuesta al Alma ligada no la ataca, sino que ataca directamente al jugador como si la casilla estuviera vacía. Cualquier criatura puede invocarse sobre un Alma ligada; cuando esto ocurre, el Alma ligada deja de estar en juego. El Alma ligada ni "muere" ni es "destruida". El Ligaalmas está profundamente conectado con los Espíritus del mundo, viviendo al borde del Mundo de los Vivos & el Mundo de los Espíritus más allá. Debe respetar & cuidar de las almas perdidas & escoltarlas hasta su descanso final. Un Ligaalmas también puede llamar & controlar a los Espíritus para ayudarle en la batalla. Protector de la Vida & Mensajero de los Difuntos.
soulbinder.boundsoul=Alma ligada
soulbinder.boundsoul.description=No ataca y no puede ser dañada. Una criatura opuesta al Alma ligada ataca al jugador como si esta casilla estuviera vacía. Cualquier criatura puede invocarse sobre ella.
soulbinder.tethered=Alma atada
soulbinder.tethered.description=Debe invocarse sobre un Alma ligada. Cuando el Alma atada muere, es sustituida por un Alma ligada.
soulbinder.summon=Invocación espiritual
soulbinder.summon.description=Invoca un Alma ligada en la casilla vacía objetivo y aumenta en 1 los poderes de Fuego, Agua, Aire y Tierra del lanzador.
soulbinder.tree= Árbol semilla de almas
soulbinder.tree.description=Debe invocarse sobre un Alma ligada. Al comienzo del turno de su jugador, el Árbol semilla de almas coloca un Alma ligada en una de sus casillas vecinas (de izquierda a derecha) si esa casilla no está ya ocupada.
soulbinder.seeker=Buscaalmas
soulbinder.seeker.description=Debe invocarse sobre un Alma ligada. Al final del turno de su jugador, el Buscaalmas se mueve a una casilla vacía al azar y coloca un Alma ligada en la casilla que ocupaba.
soulbinder.release=Liberación espiritual
soulbinder.release.description=Cura al lanzador y a todas sus criaturas 3 de vida por cada Alma ligada en juego (propia y del oponente), luego retira del juego todas las Almas ligadas (propias y del oponente) y coloca 2 Almas ligadas en casillas vacías al azar del jugador.
soulbinder.sheppard=Pastor de almas
soulbinder.sheppard.description=Debe invocarse sobre un Alma ligada. El ataque del Pastor de almas aumenta en 1 por cada Alma ligada que controle el jugador. Cada turno el Pastor de almas cura al jugador 2 de vida por cada Alma ligada que controle.
soulbinder.priestess= Sacerdotisa del tránsito
soulbinder.priestess.description=Debe invocarse sobre un Alma ligada. Al ser invocada, la Sacerdotisa del tránsito cura 2 de vida al jugador e inflige 2 de daño al oponente por cada Alma ligada en juego (propia y del oponente). Cada vez que muere una criatura del jugador, la Sacerdotisa del tránsito coloca un Alma ligada en una casilla vacía al azar del jugador.
soulbinder.dragon= Dragón espiritual
soulbinder.dragon.description=Debe invocarse sobre un Alma ligada. Al ser invocado, el Dragón espiritual inflige 6 de daño al oponente y a todas sus criaturas. Cada turno el Dragón espiritual se cura a sí mismo y al jugador 3 de vida por cada Espíritu ligado que controle el jugador.

faerie=Druida hada
faerie.description=Los druidas hadas son magos de la naturaleza que pueden comunicarse con las hadas, criaturas cuya propia existencia está hecha de formas especiales de mana. Las hadas suelen pasar su tiempo actuando con esmero interpretaciones bastante literales de la vida, los sueños y las historias de los humanos, pero en el campo de batalla son una fuerza temible, dispuestas a entregar su vida por los druidas que consideran dignos.
faerie.twins=Gemelas hada
faerie.twins.description=Al ser invocadas, curan 4 de vida a sus criaturas vecinas. Al morir, curan 4 de vida a sus criaturas vecinas
faerie.fire=Fuego feérico
faerie.fire.description=Inflige 5 de daño a todas las criaturas enemigas bloqueadas y aturde a todas las criaturas enemigas desbloqueadas.
faerie.nightwing=Mariposa alanocturna
faerie.nightwing.description=La Mariposa alanocturna reduce en 1 el ataque de todas las criaturas enemigas.
faerie.ring=Anillo feérico
faerie.ring.description=El Anillo feérico aumenta en 1 el crecimiento del mana Feérico del jugador. Cada vez que el jugador usa una carta Feérica, aumenta en 2 el ataque del Anillo feérico.
faerie.piper=Flautista feérico
faerie.piper.description=El Flautista feérico cura 3 de vida a sus criaturas vecinas cada turno.
faerie.cloud=Nube de mariposas
faerie.cloud.description=Invoca una Turba de mariposas en todas las casillas vacías del jugador.
faerie.unicorn=Unicornio
faerie.unicorn.description=El Unicornio ataca el turno en que es invocado. El Unicornio reduce en 1 el coste de todas las criaturas del jugador.
faerie.dragon=Dragón feérico
faerie.dragon.description=Al ser invocado, el Dragón feérico cura 20 de vida a todas las criaturas del jugador. El Dragón feérico aumenta en 2 el ataque de todas las demás criaturas del jugador el turno en que es invocado.
faerie.rabble=Turba de mariposas
faerie.rabble.description=Cuando la Turba de mariposas muere, cura 4 de vida al jugador.

entomologist=Entomólogo
entomologist.beetle=Escarabajo de fuego
entomologist.beetle.description=Al ser invocado, el Escarabajo de fuego inflige 4 de daño a su criatura opuesta. Cuando muere, aumenta en 1 el poder de [#0] del jugador.
entomologist.moth=Polilla de polvo venenoso
entomologist.moth.description=Cada turno la Polilla de polvo venenoso inflige 1 de daño a todas las criaturas del oponente y al oponente. Cuando muere, aturde a la criatura de la casilla opuesta.
entomologist.hivemind=Mente colmena
entomologist.hivemind.description=Elige una criatura del oponente. Todas las criaturas del lanzador atacan a la criatura objetivo en lugar de a sus criaturas opuestas este turno.
entomologist.locust=Plaga de langostas
entomologist.locust.description=Invoca una Plaga de langostas sobre una criatura objetivo del oponente. La criatura objetivo recibe 8 de daño cada turno y el oponente recibe 4 de daño cada turno hasta que la criatura objetivo muera.
entomologist.ant=Hormiga gigante
entomologist.ant.description=Todo el daño infligido a la Hormiga gigante se reduce en 2. La Hormiga gigante reduce en 2 el coste de las otras Hormigas gigantes del jugador mientras esté en juego.
entomologist.assassin=Avispa asesina
entomologist.assassin.description=Al ser invocada, la Avispa asesina invoca Zánganos avispa en sus casillas adyacentes. La Avispa asesina gana +2 de ataque por cada Zángano avispa en juego.
entomologist.hive=Colmena de insectos
entomologist.hive.description=Al final de cada turno del jugador, la Colmena de insectos invoca un Guerrero insecto en una casilla al azar del jugador.
entomologist.mantis=Mantis roja
entomologist.mantis.description=Al ser invocada, la Mantis roja reduce en 1 todos los poderes del oponente. La Mantis roja reduce en 1 el crecimiento del poder del oponente del tipo de su criatura opuesta. Cuando muere, inflige 5 de daño a su criatura opuesta.
entomologist.warrior=Guerrero insecto
entomologist.warrior.description=Cuando el Guerrero insecto muere, aumenta en 1 el poder de Insecto/Entomólogo del jugador.
entomologist.drone=Zángano avispa


seasons=Estaciones
seasons.description=Paso de las estaciones: cada carta especial del Guardián le otorga un pequeño efecto pasivo que permanece activo desde el comienzo de la partida hasta que se juega la carta. Agotamiento: las cartas especiales del Guardián solo pueden usarse una vez cada una durante la partida. Un Guardián de las Estaciones es un mago capaz de controlar el poder de las estaciones y — gracias a la Ley Mágica de Simpatía — canalizar también fenómenos que la gente asocia a las estaciones. Mientras los Cronomastras ejercen un control absoluto sobre el tiempo en un alcance muy pequeño, los "Guardianes" controlan las estaciones bringing subtle changes in time at a far more epic scale. A ese nivel, sin embargo, las fuerzas de la naturaleza y del tiempo son caprichosas, y es agotador — incluso peligroso — intentar manipularlas. Los Guardianes que logran provocar un cambio suelen ser reacios a volver a intentarlo durante mucho tiempo.
seasons.Nectarbloom.name=Floranéctar
seasons.Nectarbloom.description=Floranéctar regenera 2 de vida cada turno.
seasons.AiluvBees.name=Abejas Ailuv
seasons.AiluvBees.description=Cuando se invocan las Abejas Ailuv, se invocan dos Floranéctar 2/10 en casillas vacías al azar del lanzador. Pasiva: Rebrote: tu crecimiento de mana aumenta en 1 en cada Casa con menos de 2 de mana.
seasons.SpiritofEquinox.name=Espíritu del equinoccio
seasons.SpiritofEquinox.description=Al ser invocado, inflige 4 de daño al oponente y a cada criatura del oponente, y cura 4 de vida al lanzador y a cada criatura del lanzador. Pasiva: Rebrote: tu crecimiento de mana aumenta en 1 en cada Casa con menos de 2 de mana.
seasons.SolarWave.name=Ola solar
seasons.SolarWave.description=El oponente recibe 2 de daño por cada una de sus casillas de criatura vacías.  Las criaturas del oponente reciben triple daño este turno. Pasiva: Sol de medianoche: cuando recibes 4 o más de daño, ese daño se reduce en 1.
seasons.EternalSummer.name=Verano eterno
seasons.EternalSummer.description=Puedes jugar de inmediato una criatura y un hechizo de tu mano, en cualquier orden.  Ambos cuestan 2 menos. Pasiva: Sol de medianoche: cuando recibes 4 o más de daño, ese daño se reduce en 1.
seasons.Cornucopia.name=Cornucopia
seasons.Cornucopia.description=Al ser invocada, cura 9 de vida a todas las demás criaturas aliadas.  Todas las demás criaturas aliadas reciben +1 de ataque y sufren -1 de daño mientras Cornucopia esté en el tablero. Pasiva: Abundancia: el coste de tus cartas más caras de Fuego, Agua, Aire y Tierra se reduce en 1.
seasons.GaeasAvatar.name=Avatar de Gaea
seasons.GaeasAvatar.description=Su ataque es igual al número de criaturas en el tablero.  El Avatar de Gaea no se ve afectado por ningún hechizo, pero recibe 1 de daño cada turno por cada casilla vacía del tablero. Pasiva: Abundancia: el coste de tus cartas más caras de Fuego, Agua, Aire y Tierra se reduce en 1.
seasons.BehemothofFrozenTime.name=Behemot del tiempo helado
seasons.BehemothofFrozenTime.description=Al ser invocado, las criaturas bloqueadas del oponente quedan aturdidas durante un turno.  El mana del oponente en cada Casa no puede crecer por encima de 9 mientras el Behemot del tiempo helado esté en juego. Pasiva: Frío invernal: las criaturas desbloqueadas del oponente reciben 1 de daño cada turno.
seasons.TheGreatAurora.name=La gran aurora
seasons.TheGreatAurora.description=Las criaturas del lanzador se curan 16 de salud y cada una otorga 3 de mana de su propio tipo a su lanzador. Pasiva: Frío invernal: las criaturas desbloqueadas del oponente reciben 1 de daño cada turno.

kinetician=Kinetista
kinetician.description=Manipulación de casillas, manipulación de estadísticas.
kinetician.magerunner=Magocorredor
kinetician.magerunner.description=al ser invocado, intercambia su lugar con la criatura aliada de mayor ataque
kinetician.tricker=Embaucador
kinetician.tricker.description=cada turno se mueve a la casilla desbloqueada más cercana
kinetician.force=Fuerza concentrada
kinetician.force.description=este turno todas las criaturas aliadas atacan solo a la criatura objetivo con el ataque aumentado en 1
kinetician.warp=Distorsionar la realidad
kinetician.warp.description=reduce la vida de la criatura objetivo a X (X = su nivel)
kinetician.mage=Mago solitario
kinetician.mage.description=cada turno inflige al oponente X de daño (X = número de casillas vacías del oponente)
kinetician.call=Llamada del más apto
kinetician.call.description=reduce a la mitad el coste de las cartas del elemento objetivo (cada una para un solo uso)
kinetician.barrier=Barrera de fuerza
kinetician.barrier.description=duplica la vida actual y máxima de la criatura aliada objetivo. Pasa el siguiente turno
kinetician.manipulator=Manipulador
kinetician.manipulator.description=al entrar en juego, el ataque de todas las criaturas enemigas pasa a ser 3 durante 1 turno. Cuando el oponente invoca una criatura, esta cambia de dueño y el manipulador pierde 4X de vida (X = coste de esa criatura)

shaman=Chamán
shaman.description=espíritu de los ancestros: al comienzo de la partida aparece un lobo fantasma 2/18 (coste 2, sin habilidad especial) en la casilla junto a la más a la derecha. Si el lobo muere, la carta 1/2 será sustituida por la invocación del lobo (similar al grifo domesticado en la campaña)
shaman.ghost=lobo fantasma
shaman.hunger=Hambre insaciable
shaman.hunger.description=el lobo recibe +X de ataque (X = ataque de la criatura objetivo) durante 1 turno.
shaman.rage=Espíritu de la ira
shaman.rage.description=al entrar en juego, aumenta permanentemente en 1 el ataque de los vecinos.
shaman.moon=Poder de la luna llena
shaman.moon.description=reduce permanentemente en 1 el daño infligido al lobo y cura 8 de vida a sus vecinos y al jugador.
shaman.fury=Furia fantasma
shaman.fury.description=Inflige 8 de daño a todas las criaturas enemigas y aumenta permanentemente en 1 el ataque del lobo por cada criatura muerta este turno.
shaman.protector=Espíritu protector
shaman.protector.description=mientras el protector permanezca en juego, todo el daño recibido por el jugador se reduce en 2 y los hechizos enemigos curarán al lobo en lugar de dañarlo.
shaman.hunter=Espíritu cazador
shaman.hunter.description=mientras el cazador permanezca en juego, el lobo obtiene +2 de ataque y se cura el daño infligido al atacar.
shaman.shadow=Sombra del lobo
shaman.shadow.description=todas las cartas que afectan al lobo afectan también a la sombra del lobo. Al entrar en juego, sus vecinos atacan de inmediato.
shaman.mate=Compañero fantasma
shaman.mate.description=al entrar en juego, reduce permanentemente en 1 el coste de las cartas del lobo e inflige 8 de daño al oponente. Cada turno el lobo ataca además la casilla opuesta al compañero.

vampires=Vampiros
vampires.flock=Bandada oscura
vampires.flock.description=mueve a la criatura del jugador con menos vida a la casilla objetivo y la hace invulnerable durante 1 turno si su nivel no es superior a 9.
vampires.noctule=Nóctulo
vampires.noctule.description=cuando inflige daño al oponente, cura al jugador la misma cantidad de vida.
vampires.ghoul=Necrófago
vampires.ghoul.description=si la criatura opuesta tiene menos de 11 de vida, la mata de un golpe.
vampires.acolyte=Acólito
vampires.acolyte.description=Cuando una criatura enemiga recibe más de 5 de daño, le inflige 4 de daño adicional.
vampires.ties=Lazos de sangre
vampires.ties.description=destruye una criatura del jugador y aumenta permanentemente el ataque de sus vecinas en una cantidad igual a su ataque (aunque no afecta a criaturas con ataque masivo ni a criaturas de nivel superior a 9).
vampires.nosferatu=Nosferatu
vampires.nosferatu.description=cuando una criatura muere, cura 3 al jugador y 2 a sí mismo.
vampires.aristocrat=Aristócrata
vampires.aristocrat.description=al comienzo del turno se mueve a la casilla opuesta a la criatura del oponente con menos vida (puede intercambiar su lugar con una criatura aliada). Cuando mata a una criatura, inflige al oponente un daño igual a su ataque.
vampires.mansion=Mansión
vampires.mansion.description=cuando muere una criatura no especial del jugador, la sustituye por un neófito. Al entrar en juego convierte a sus vecinos en necrófagos.
vampires.neophyte=Neófito
vampires.neophyte.description=Se cura la mitad del daño infligido a los enemigos.


fairy=Caballero hada
fairy.lesovik=Lesovik
fairy.lesovik.description=bloquea la carta de la criatura opuesta mientras esté vivo.
fairy.kikimora=Kikimora
fairy.kikimora.description=al entrar en juego, invoca un vodyanoy en una casilla al azar.
fairy.vodyanoy=Vodyanoy
fairy.rusalka=Rusalka
fairy.rusalka.description=cuando mata a una criatura, el oponente pierde su carta.
fairy.likho=Likho
fairy.likho.description=al morir, reduce a 10 la vida de la criatura que lo mató (la mata si tiene menos de 10). Si lo mató un hechizo o habilidad, da al jugador 2 poderes al azar.
fairy.sirin=Sirin
fairy.sirin.description=reduce a la mitad el ataque de la criatura opuesta y de sus vecinas mientras esté vivo. (el ataque se redondea hacia arriba)
fairy.alkonost=Alkonost
fairy.alkonost.description=cada turno bloquea 6 cartas enemigas al azar. No puede bloquear cartas que ya fueron bloqueadas el turno anterior
fairy.firebird=Pájaro de fuego
fairy.firebird.description=invulnerable mientras esté junto a una criatura de fuego aliada.
fairy.zmey=Zmey Gorynych
fairy.zmey.description=al morir, renace como gorynych de dos cabezas 6/25 y luego como gorynych de una cabeza 3/15. Cuando cualquier jugador usa una carta de fuego, inflige 6 de daño a una criatura enemiga al azar.
fairy.2head=gorynych de dos cabezas
fairy.1head=gorynych de una cabeza

elementalist=Elementalista
elementalist.description=Depende en gran medida de los cuatro elementos básicos.
elementalist.sylph=Sílfide
elementalist.sylph.description= al entrar en juego, permite jugar una carta especial adicional. +1 de coste por cada sílfide en el tablero.
elementalist.freeze=Congelación profunda
elementalist.freeze.description=ambos jugadores pasan 1 turno y no pueden usar cartas especiales en su siguiente turno.
elementalist.salamander=Salamandra
elementalist.salamander.description=si el poder de [#0] del jugador es mayor que el del oponente, inflige 4 de daño al oponente al comienzo del turno.
elementalist.avalanche=Avalancha
elementalist.avalanche.description=inflige 2X de daño a las criaturas enemigas (X = poder de [#3] del jugador)[{0}], cura 2X de vida al jugador y reduce a 0 su poder de [#3].
elementalist.incineration=Incineración
elementalist.incineration.description=destruye a la criatura enemiga más fuerte y a la aliada más débil (calculado por salud), tanto en el tablero como en el mazo.
elementalist.phoenix=Arcofénix
elementalist.phoenix.description=cada turno regenera una cantidad de vida igual al poder de [#0] del jugador.
elementalist.golem=Gólem de piedra
elementalist.golem.description=+4 de ataque cuando está bloqueado. No recibe daño de hechizos ni de habilidades de criaturas cuando está desbloqueado.
elementalist.frost=Rayo de escarcha
elementalist.frost.description=inflige X de daño al oponente (X = diferencia entre su poder más bajo y el poder más alto del jugador) y bloquea permanentemente la casilla objetivo.

reaper=Segador de almas
reaper.description=Cuando muere una criatura en el campo, el jugador obtiene 1 alma. Por cada alma que tenga el jugador, todo el daño infligido por sus hechizos especiales aumenta en 1 (1 alma = 1 de daño)
reaper.damnation=Condenación
reaper.damnation.description=Elige una criatura e inflígele 3 de daño. Si la criatura muere por este hechizo, aumenta el número de almas en x, donde x es igual al coste de la criatura (daño máx. 8)
reaper.passage=Pasaje oscuro
reaper.passage.description=elige 1 criatura objetivo. Esta criatura y sus vecinas se curan x de vida, donde x es igual al número de almas que tienes (curación máx. 12 de vida)
reaper.rage=Ira eterna
reaper.rage.description=elige 1 criatura objetivo; esta criatura permanece activa en el campo 2 turnos más tras morir

reaper.onslaught=Embestida de almas
reaper.onslaught.description=Inflige x de daño a todas las criaturas del oponente, donde x es igual al número de almas que tienes. Tras usar este hechizo, el jugador no recibe almas por las criaturas muertas por él y el número de almas del jugador pasa a ser 0
reaper.tribute=Tributo
reaper.tribute.description=Elige 1 criatura objetivo del jugador y destrúyela; el jugador obtiene x de vida, donde x es igual a la vida de la criatura destruida (vida máx. 36)
reaper.furious=Almas furiosas
reaper.furious.description=Inflige x+7 de daño al oponente, donde x es igual al número de almas del jugador. Tras usar este hechizo, el número de almas se reduce a 0
reaper.sentence=Sentencia de muerte
reaper.sentence.description=Destruye todas las criaturas del campo. Por cada criatura destruida el jugador recibe 2 almas en lugar de 1
reaper.shackles=Grilletes de almas
reaper.shackles.description=La criatura objetivo no puede atacar y su habilidad se anula. Su casilla no puede usarse hasta el final del duelo. Por cada turno que la criatura atrapada permanezca en el campo, el jugador obtendrá 1 alma. Si el jugador invoca algo frente a esa casilla tras destruirse la criatura del oponente, esa criatura recibirá 6 de daño cada turno

sower=Sembrador
sower.description=Manipulación de puntos de vida.
sower.tangling=Enredo
sower.tangling.description=transfiere X de salud de la criatura objetivo a la criatura opuesta (X = ataque de la criatura objetivo).
sower.devouring=Devoración
sower.devouring.description=sacrifica a una criatura aliada y duplica el ataque del resto de criaturas aliadas durante 1 turno.
sower.monster=Planta monstruo
sower.monster.description=cuando mata a una criatura, cura por completo a todas las plantas monstruo del tablero.
sower.pollination=Polinización
sower.pollination.description=convierte a la criatura objetivo de nivel X en una criatura especial de nivel (X menos 3) con vida completa y cura X de vida al jugador.
sower.sundew=Rocío de sangre
sower.sundew.description=cuando inflige daño, regenera la misma cantidad de vida.
sower.predator=Planta depredadora
sower.predator.description=cuando ataca a una criatura, le inflige X de daño adicional (X = diferencia entre su vida actual y máxima).
sower.drake=Draco del bosque
sower.drake.description=cuando el jugador invoca una criatura especial, crea una copia en la casilla vacía más cercana.
sower.flower=Flor ardiente
sower.flower.description=cada turno reduce a la mitad la salud de la criatura enemiga con más vida y da 1 de poder de [#0] al jugador. Al entrar en juego, inflige al oponente X de daño (X = su poder de [#0])

warp=Distorsión
warp.description=Especialización: Disrupción. La Distorsión no sostiene una línea, la rompe: arrebata habilidades, deshace y sustituye criaturas, y lo que el oponente construyó acaba volviéndose en su contra.
warp.errant=Errante
warp.errant.description=se esconde en la sombra tras matar a una criatura, vuelve cuando es dañado
warp.quake=Terremoto
warp.quake.description=inflige a cada criatura enemiga un daño igual a la diferencia entre los poderes del jugador y del oponente de su elemento
warp.cloak=Capa
warp.cloak.description=debe invocarse sobre una criatura existente, suma su ataque y vida a los suyos. Al ser invocada, da 2 de mana de la criatura cubierta. Al morir, restaura a esa criatura
warp.photographer=Fotógrafo
warp.photographer.description=cuando muere una criatura adyacente, es sustituida por el Fotógrafo con la misma vida
warp.schizo=Esquizo
warp.schizo.description=al ser invocado, la criatura opuesta pierde sus habilidades hasta la muerte del esquizo
warp.ram=Ariete
warp.ram.description=al ser invocado, destruye a la criatura opuesta y da a su jugador X-3 de mana (X = coste de esa criatura)
warp.stranger=Forastero
warp.stranger.description=su ataque es igual al poder enemigo más alto. Al ser invocado, copia el efecto de la criatura opuesta (excepto ataque múltiple y efectos inmediatos)
warp.queen=Reina de la distorsión
warp.queen.description=al ser invocada, inflige 4 de daño a las criaturas enemigas. Pierden sus habilidades hasta el final del siguiente turno

disciples=Discípulos
disciples.description=Los discípulos de la iglesia perdida ponen su fe en el prisionero que hay dentro de nosotros. Él encuentra su camino entre las drogas, el plano astral, el miedo y la furia. Los prisioneros aparecen al final del turno del jugador en una casilla vacía al azar del jugador. Cuando un prisionero muere, el jugador pierde 1 de mana de las 2 casas básicas más altas y\ngana 1 de mana especial. Cuando un discípulo tiene poca vida (menos de la mitad), su fe se debilita y pierde 1/3 de ataque.
disciples.prisoner=Prisionero
disciples.prisoner.description=Al morir pierde 1 de mana de las dos casas básicas más altas y gana 1 de mana especial.
disciples.enraged=Prisionero enfurecido
disciples.enraged.description=Inmune a hechizos y habilidades mientras el libertador esté vivo.
disciples.drug=Droga de velocidad
disciples.drug.description=Añade +1 de ataque a las criaturas del jugador y les inflige 4 de daño. El efecto desaparece cuando muere el prisionero.
disciples.preacher=Predicador
disciples.preacher.description=Mientras esté en juego, las cartas normales cuestan 1 de mana más. Aumenta en 1 el crecimiento de mana especial. Añade 1 de ataque al prisionero
disciples.monk=Monje oscuro
disciples.monk.description=Reduce en 2 el mana de [#0] del oponente y aumenta en 1 su coste mientras esté vivo.
disciples.prophet=falso profeta
disciples.prophet.description=Hasta su muerte, las cartas normales cuestan 1 de mana más. Da 2 de mana a cada casa básica. Recupera 1 de mana al morir
disciples.escape=Escape astral
disciples.escape.description=El daño infligido al prisionero se redirige al Escape astral. El prisionero ataca directamente al oponente
disciples.scarecrow=Espantapájaros
disciples.scarecrow.description=Aturde e inflige 4 de daño a la criatura opuesta. Puede cambiar de lugar con el prisionero a la casilla vacía más cercana
disciples.wind=viento de opresión
disciples.wind.description=Aturde a la criatura opuesta al espantapájaros y a sus vecinas. Les inflige 4 de daño
disciples.liberator=Libertador
disciples.liberator.description=Convierte al prisionero en Prisionero enfurecido. Al morir, le inflige {0} de daño.
disciples.falconer=Halconero
disciples.falconer.description=Cada turno inflige (distancia en casillas) de daño a las criaturas del oponente.
disciples.madden=Enloquecer
disciples.madden.description=Inflige 8 de daño a una criatura del oponente. Cura 3 por cada criatura muerta y suma 1 de ataque a todos.

junk=Chatarra
junk.description=Especialización: Desguace. Control de tablero a base de volumen: criaturas baratas llenan la línea, se copian y mueren a montones, hasta que la chatarra que apilaste se convierte en el muro tras el que ganas.
junk.screamer=Chillón
junk.screamer.description=+1 de ataque por cada otro Chillón en juego
junk.poison=Flor venenosa
junk.poison.description=Inflige 5 de daño al objetivo del jugador, y a las cartas opuestas y adyacentes. Resta 1 de mana tanto al jugador como a la criatura opuesta.
junk.fortune=Fortuna del chatarrero
junk.fortune.description=Absorbe 4 del primer daño infligido al jugador
junk.chain=Controlador de cadena
junk.chain.description=Genera un reflejo de la criatura adyacente de coste <4. Cuando muere una criatura adyacente de coste <6, rellena la casilla con otra criatura débil cercana
junk.assassin=Asesino errante
junk.assassin.description=si está desbloqueado, se mueve al siguiente oponente desbloqueado más cercano (el de más a la izquierda si hay que elegir) y le inflige 5 de daño, al final del turno.
junk.factory=Robot fábrica
junk.factory.description=cuando se invoca con una criatura de coste < 6 a un lado y una casilla vacía al otro, copia esa criatura en la casilla vacía. También copia en la casilla vacía del otro lado a una criatura adyacente invocada de coste < 6 (con efecto de aparición aplicado)
junk.bot=Robot reciclador
junk.bot.description=Cuando muere una criatura del jugador, esa criatura se cura 6 de vida y cura 2 de vida al jugador por cada criatura perdida.
junk.cyborg=Cíborg de basura
junk.cyborg.description=al entrar en juego, llena el tablero de basura 2/11. Cada turno 2 trozos de basura se ensamblan en el cíborg, aumentando su vida y ataque en la cantidad de vida que les quede. (puede llegar a 13/85)
junk.trash=Basura

snowblood=Sangre de nieve
snowblood.description=Especialización: Control. Control de tablero frío, materialista y un poco cínico: cada muerte tiene un precio, cada favor una deuda. El calor no forma parte del contrato de la Sangre de nieve. La única esperanza es esperar a Amaterasu, que puede reconocer a sus criaturas.
snowblood.tracker=Rastreador
snowblood.tracker.description=cuando se invoca una criatura en una casilla adyacente, esta obtiene invulnerabilidad durante 1 turno
snowblood.hunter=Cazarrecompensas
snowblood.hunter.description=al ser invocado, inflige 2 de daño a la criatura opuesta. Cuando mata a la criatura opuesta, da al jugador 1/3 de su coste en mana (redondeado hacia arriba)
snowblood.maiko=Maiko
snowblood.maiko.description=reduce en 1 el ataque de la criatura opuesta y de sus vecinas mientras esté viva. Cada turno cura 1 de vida a las criaturas aliadas adyacentes. Tras ser invocada, su carta se sustituye por carta de muerte (coste 3, 0/3 - reduce a 1 el daño que recibe y no puede ser curada. Al morir, inflige 15 de daño a la criatura opuesta)
snowblood.letter=Carta de muerte
snowblood.letter.description=Reduce el daño a 1. Al morir inflige 15 de daño a la criatura opuesta. (No puede ser curada)
snowblood.echo=Eco
snowblood.echo.description=activa al instante para todas las criaturas aliadas los efectos de "cada turno" y "directos", luego todas las criaturas aliadas de Sangre de nieve atacan
snowblood.kojiro=Kojiro
snowblood.kojiro.description=puede invocarse en cualquier casilla del jugador, ocupada o vacía. Ataca al ser invocado, con +4 de ataque ese turno si hay una criatura en la casilla opuesta. Cada turno inflige 2 de daño a la criatura opuesta y a todos sus vecinos (los vecinos son las casillas ocupadas sucesivas a su alrededor)
snowblood.guide=Guía de guerra
snowblood.guide.description=la siguiente criatura invocada infligirá a todas las criaturas enemigas un daño igual a su ataque. Cuando se invoca una criatura especial aliada, cura 1 de vida a todos sus vecinos (los vecinos son las casillas ocupadas sucesivas a su alrededor)
snowblood.janus=Jano
snowblood.janus.description=Al ser invocado y cada turno cura 2 de vida a sí mismo y a sus casillas adyacentes, e inflige 1 de daño a las demás criaturas del jugador; por cada criatura que hiere, el jugador gana 1 de vida y 1 de mana de la casa de esa criatura
snowblood.amaterasu=Amaterasu
snowblood.amaterasu.description=cuando el jugador invoca una criatura del elemento:\n- [@0]: Amaterasu inflige 5 de daño a la criatura opuesta\n- [@1]: aumenta en 1 el poder más bajo\n- [@2]: inflige 3 de daño al oponente\n- [@3]: cura 3 de vida al jugador\n
zen=Zen
zen.description=Especialización: Equilibrio. El Zen responde al tablero tal como está: se enfrenta a la amenaza más fuerte, cura al aliado más débil, y cada casilla vacía puede convertirse todavía en ganancia.
zen.elementesist=Elementresistente
zen.elementesist.description=inflige daño a la carta opuesta y a todas las cartas opuestas del mismo mana.
zen.redlight=Luz roja
zen.redlight.description=Aumenta en 1 el ataque de sí mismo y de las criaturas adyacentes, mientras la criatura de la casilla opuesta tenga mayor ataque.
zen.focus=Enfoque
zen.focus.description=Gana 1 de mana de la casa y cura 1 de vida por cada criatura en la tabla del oponente.
zen.guard=Guardia eléctrico
zen.guard.description=inflige 3 de daño a las criaturas que dañan al jugador.
zen.dreamer=Soñador
zen.dreamer.description=Cada turno inflige 4 de daño a la criatura más débil del oponente (la de más a la izquierda en caso de empate) y pierde 2 de vida.
zen.mimic=Mímico
zen.mimic.description=Al comienzo de tu turno, aparece un capullo en una casilla vacía al azar. Invoca una criatura allí para ganar 2 de mana de su casa y 3 de vida para el jugador.
zen.cocoon=Capullo
zen.cocoon.description=Invoca una criatura aquí para ganar 2 de mana de su casa y 3 de vida para el jugador.
zen.fighter=Luchador zen
zen.fighter.description=Si la criatura opuesta tiene más ataque, más vida o mayor coste, cada turno gana 1 de mana de la casa de esa criatura y se cura 3 de vida. Absorbe 5 de daño de hechizos y habilidades. Cada vez que el jugador es golpeado, su ataque aumenta en 1 durante un turno.
zen.inertia=Inercia
zen.inertia.description=Inmune a hechizos. Genera Materia en la siguiente casilla vacía a la derecha. Al ser invocada y cada turno, mientras la Materia esté en juego, cura 3 a la criatura más débil del jugador.
zen.matter=Materia
zen.matter.description=Al ser invocada y cada turno, mientras la Inercia esté en juego, inflige 3 de daño a la criatura más fuerte del oponente.

highpriest=Sumo sacerdote
highpriest.description=Habilidad especial de clase - camino divino: según sea mayor el nivel total de las criaturas de fuego y tierra, o de agua y aire, del jugador, su robo especial cambia pasando a ser el de Ra o el de Set. "Hermopolis está abierta y mi cabeza está sellada. O Thot, el ojo de Horus está intacto, el Ojo de Horus me salva, y espléndidos son mis adornos de la frente de Ra, padre de los dioses; soy este Osiris aquí en el Oeste. Osiris conoce su día, y si no existe en él, entonces yo tampoco existiré. Soy Ra, que está con los dioses, y no pereceré; levántate, Horus, para que pueda contarte entre los dioses."
highpriest.Sacredscarab=Escarabajo sagrado
highpriest.Sacredscarab.description=reduce en 2X el daño no mágico que recibe; X = número de sus vecinos.
highpriest.sunpriest=Sacerdote del sol
highpriest.sunpriest.description=al atacar, inflige a todas las criaturas enemigas un daño igual al poder más bajo del jugador.
highpriest.Apis=Apis
highpriest.Apis.description=cada turno da al jugador 1 de poder especial y 3 de vida por cada otro apis en el tablero.
highpriest.Bennu=Bennu
highpriest.Bennu.description=si lo mata una carta enemiga, ataca la casilla opuesta con ataque triplicado antes de morir.
highpriest.EyeofWajet=Ojo de Wajet
highpriest.EyeofWajet.description=cura 1 de vida al jugador y a sus criaturas por cada carta revelada del jugador e inflige el mismo daño a todos los enemigos.
highpriest.sphinx=Esfinge
highpriest.sphinx.description=Al morir, deja un enigma 0/6. Si el enigma fue destruido por una criatura enemiga, la esfinge renace con la mitad de vida. Si el enigma fue destruido por un hechizo o habilidad enemigos, el oponente pierde 3 de poder del elemento más alto.
highpriest.Ouroboros=Uróboros
highpriest.Ouroboros.description=al comienzo del turno del jugador invoca en la casilla vacía más cercana una serpiente de eternidad 2/8. Al final del turno del oponente la serpiente muere y cura X de vida al jugador y al Uróboros (X = su vida restante).
highpriest.Wingeddragon=Dragón alado de Ra
highpriest.Wingeddragon.description=al entrar en juego, invoca una piedra solar 0/22 (aumenta en 2 el daño de los hechizos del jugador y aumenta en 1 el ataque de Ra cada turno) en la casilla vacía más cercana.
highpriest.Ancientcrocodile=Cocodrilo ancestral
highpriest.Ancientcrocodile.description=al atacar, pasa el siguiente turno (digestión)).
highpriest.Serpopard=Serpopardo
highpriest.Serpopard.description=cuando el jugador invoca una criatura especial, se mueve a la casilla desbloqueada más cercana y duplica su ataque durante 1 turno.
highpriest.Anubite=Anubita
highpriest.Anubite.description=Cuando mata a una criatura, invoca en la casilla vacía más cercana una momia guardiana 4/20 sin habilidad especial.
highpriest.Babi=Babi
highpriest.Babi.description=cuando crece el poder del oponente, inflige el mismo daño a la criatura opuesta.
highpriest.Curseofchaos=Maldición del caos
highpriest.Curseofchaos.description=Inflige a la criatura objetivo y a sus vecinas un daño igual a su ataque total.
highpriest.Simoom=Simúúún
highpriest.Simoom.description=reduce a 2 el ataque de todas las criaturas enemigas. Recuperan 3 de ataque por turno a partir del siguiente turno.
highpriest.Ammit=Ammit
highpriest.Ammit.description=cuando muere cualquier criatura, inflige a su jugador un daño igual a su poder de ese elemento y da 1 de poder especial al jugador.
highpriest.Apep=Apep
highpriest.Apep.description=ataca a todos los enemigos. Cada turno reduce en 1 los poderes elementales de ambos jugadores.
highpriest.puzzle=enigma
highpriest.puzzle.description=Si el enigma fue destruido por una criatura enemiga, la esfinge renace con la mitad de vida. Si el enigma fue destruido por un hechizo o habilidad enemigos, el oponente pierde 3 de poder del elemento más alto.
highpriest.guardianmummy=momia guardiana
highpriest.sunstone=piedra solar
highpriest.sunstone.description=aumenta en 2 el daño de los hechizos del jugador y aumenta en 1 el ataque de Ra cada turno
highpriest.serpent=serpiente de eternidad
highpriest.serpent.description=aumenta en 2 el daño de los hechizos del jugador y aumenta en 1 el ataque de Ra cada turno

shadowmage=Magosombra
shadowmage.description=Especialización: Sigilo. El Magosombra teje una enorme protección que se desvanece: escudos, silencio y hojas invisibles que duran solo un turno. La idea detrás de esta clase es sobre todo aplicar un nivel de protección enorme, pero temporal, como un efecto que "se desvanece". Así, la idea del sigilo como mecánica puede por fin imaginarse en el universo de Spectromancer.
shadowmage.archer=Arquero sombrío
shadowmage.archer.description=Al ser invocado, inflige 6 de daño al oponente. Cuando el Arquero sombrío muere, el oponente se cura 6 de vida.
shadowmage.stalker=Acechador de sombras
shadowmage.stalker.description=La posición del Acechador de sombras no se revela al oponente hasta que recibe daño.
shadowmage.weaver=Tejedora del manto nocturno
shadowmage.weaver.description=Al ser invocada, las criaturas vecinas ignoran todo daño hasta el final del siguiente turno del oponente.
shadowmage.silencer=Silenciador
shadowmage.silencer.description=Al ser invocado, la criatura opuesta no puede atacar y el oponente no puede usar cartas del elemento de esa criatura, hasta el final de su siguiente turno.
shadowmage.eclipse=Eclipse
shadowmage.eclipse.description=Aumenta en 2 los poderes de Fuego, Agua, Aire y Tierra del lanzador. El lanzador ignora hasta 30 de daño hasta el final del siguiente turno del oponente.
shadowmage.spike=Espina de dolor
shadowmage.spike.description=Inflige 16 de daño a todas las criaturas enemigas. Al final del turno del lanzador, cura 16 de vida a todas las criaturas enemigas.
shadowmage.warden=Guardián oscuro
shadowmage.warden.description=El Guardián oscuro siempre ignora el primer daño que recibe cada turno.
shadowmage.assassin=Asesino gran maestro
shadowmage.assassin.description=Al ser invocado, inflige 12 de daño a la criatura de la casilla opuesta. Puede sustituir a cualquier criatura aliada de coste 9 o menos. El lanzador gana poder del elemento de la criatura sustituida igual a la mitad del coste de esa criatura (redondeado hacia arriba).

battlemage=Magocombatiente
battlemage.description=Especialización: Táctica. Las criaturas del Magocombatiente combinan estadísticas agresivas con habilidades defensivas, o al revés. Los hechizos sirven tanto para atacar como para proteger. Mantén la línea en equilibrio y luego inclínala.
battlemage.taunt=Provocación
battlemage.taunt.description=Tu criatura objetivo inflige de inmediato al oponente daño igual a su ataque. Si eliges una criatura enemiga con menos ataque que la criatura que tiene enfrente, la aturde.
battlemage.rune=Guerrero rúnico
battlemage.rune.description=Reduce en 2 el daño de los hechizos del oponente.
battlemage.sergeant=Sargento de plata
battlemage.sergeant.description=Las criaturas adyacentes que no sean muros infligen 3 de daño extra al oponente mientras estén desbloqueadas.
battlemage.knight=Caballero cargador
battlemage.knight.description=El Caballero cargador ataca dos veces mientras está bloqueado. Si deja de estar bloqueado tras el primer ataque, no ataca una segunda vez.
battlemage.fieldmage=Mago de campo
battlemage.fieldmage.description=El daño de hechizos enemigos infligido al jugador o a las otras criaturas del jugador se redirige al Mago de campo.
battlemage.cavalier=Jinete dorado
battlemage.cavalier.description=Gana 1 de ataque por cada casilla vacía en tu lado del tablero. Combo prohibido: Apocalipsis.
battlemage.warcry=Grito de guerra sonoro
battlemage.warcry.description=Inflige 9 de daño al oponente y a todas las criaturas enemigas. Esas criaturas enemigas pierden sus habilidades hasta el final de tu siguiente turno.
battlemage.retinue=Séquito del general
battlemage.retinue.description=Puedes jugar una criatura adicional este turno. Mientras el Séquito del general permanezca en juego, la próxima carta de Táctica que juegues cuesta 1 menos.

tinker=Ingeniero
tinker.description=Especialización: Ingenio. Un taller steampunk que siembra la línea enemiga de bombas con temporizador y luego las gasta: golpes extra, soldados que crecen y una reina que convierte cada mecha en una explosión.
tinker.bomb=Bombaingenio
tinker.bomb.description=Pierde 1 de vida cada turno. Cuando la Bombaingenio muere, inflige 3 de daño a su jugador.
tinker.plant=Ingeniero
tinker.plant.description=Coloca una Bombaingenio en la casilla libre objetivo del oponente.
tinker.spider=Araña mecánica
tinker.spider.description=Al ser invocada, coloca una Bombaingenio en la casilla opuesta si está vacía. Cuando la Araña mecánica mata a una criatura opuesta, ataca de nuevo.
tinker.falcon=Halcón mecánico
tinker.falcon.description=Al ser invocado, coloca una Bombaingenio en la casilla libre más a la derecha del oponente. Al morir, coloca una Bombaingenio en la casilla libre más a la izquierda del oponente.
tinker.scatter=Bomba dispersa
tinker.scatter.description=Inflige 8 de daño a todas las criaturas del oponente. Por cada criatura que muera por este hechizo, coloca una Bombaingenio en la casilla que ocupaba esa criatura.
tinker.soldier=Soldado de vapor
tinker.soldier.description=Cada vez que muere una Bombaingenio del oponente, el ataque del Soldado de vapor aumenta permanentemente en 1.
tinker.automaton=Autómata
tinker.automaton.description=Al final del turno de su jugador, el Autómata coloca una Bombaingenio en una casilla libre al azar del oponente.
tinker.queen=Reina mecánica
tinker.queen.description=Al ser invocada, mata a todas las Bombaingenio del oponente en juego. Mientras la Reina mecánica esté en juego, todas las Bombaingenio infligen 3 de daño adicional al oponente.
tinker.dragon=Dragón de vapor
tinker.dragon.description=Ataca al ser invocado. Al ser invocado, coloca una Bombaingenio en tres casillas libres al azar del oponente. Cada vez que el Dragón de vapor mata a una criatura opuesta, su jugador gana 1 de poder de Ingenio.

conjurer=Conjurador
conjurer.description=Especialización: Conjuración. Hechizos y criaturas se alimentan mutuamente: cada hechizo que lances activa Conjurar en tus criaturas. Golpes de ataque, mana de tipo y un segundo pulso de la misma jugada.
conjurer.nectar=Néctar de lavanda
conjurer.nectar.description=Cura 5 a la criatura objetivo (tuya o del oponente). Ganas 1 de poder del tipo de esa criatura.
conjurer.bravery=Valentía
conjurer.bravery.description=Aumenta en 1 el ataque de cada una de tus criaturas que no sean muros hasta el final del turno. Gana 1 de poder de Conjuración.
conjurer.warmage=Mago de guerra
conjurer.warmage.description=Al ser invocado, tus criaturas ganan +2 de ataque hasta el final del turno. Conjurar: tus otras criaturas ganan +2 de ataque hasta el final del turno.
conjurer.golem=Gólem de huesos
conjurer.golem.description=El Gólem de huesos no recibe daño de hechizos ni habilidades. Conjurar: el ataque del Gólem de huesos aumenta permanentemente en 1. Tus otras criaturas se curan 3.
conjurer.nurture=Rito de crianza
conjurer.nurture.description=Tus criaturas no atacan este turno. Tras los efectos especiales se curan su ataque más 4, y tú te curas el total de su ataque más 4.
conjurer.pain=Dolor de esencia
conjurer.pain.description=Inflige 3 de daño a una criatura objetivo del oponente y al oponente. Inflige 2 de daño adicional por cada poder que tenga el oponente del tipo de esa criatura.
conjurer.guard=Guardia impía
conjurer.guard.description=Al ser invocada, reduce en 3 el ataque de cada criatura del oponente hasta el final del turno del oponente. Conjurar: reduce permanentemente en 1 el ataque de cada criatura del oponente.
conjurer.mystic=Místico oscuro
conjurer.mystic.description=Al ser invocado, aumenta en 2 el poder de Fuego, Agua, Aire y Tierra. Conjurar: aumenta en 2 el poder de Conjuración.

rogue=Pícaro
rogue.description=Especialización: Sigilo. Embosca la línea bloqueada, roba crecimiento y remata lo que empieza una puñalada. Cuerpos pequeños, sincronía sucia.
rogue.sneak=Ataque furtivo
rogue.sneak.description=Aturde a la criatura objetivo y le inflige 4 de daño. Si el objetivo está bloqueado, este hechizo inflige el doble de daño.
rogue.trickster=Embaucador mediano
rogue.trickster.description=Cuando tiene una criatura enfrente, inflige 2 de daño al oponente al comienzo del turno de su jugador.
rogue.thief=Ladrón de energía
rogue.thief.description=Al comienzo del turno de su jugador, reduce en 1 el poder del oponente del tipo de criatura opuesta al Ladrón de energía.
rogue.dancer=Bailarina de sombras
rogue.dancer.description=Cuando la Bailarina de sombras tiene una criatura enfrente, realiza un ataque extra.
rogue.fighter=Pendenciero
rogue.fighter.description=Cada vez que el Pendenciero recibe daño de la criatura de la casilla opuesta, su ataque aumenta permanentemente en 2.
rogue.assassin=Asesina elfa
rogue.assassin.description=Al ser invocada, inflige 8 de daño a la criatura de la casilla opuesta. Si esa criatura muere, ataca de inmediato.
rogue.trap=Trampa arcana
rogue.trap.description=Reduce en 2 todos los poderes del oponente y le obliga a pasar su siguiente turno.
rogue.archer=Arquero oscuro
rogue.archer.description=Al ser invocado, destruye todas las criaturas del oponente con 6 de vida o menos. Cuando el Arquero oscuro mata a la criatura de la casilla opuesta, inflige 3 de daño al oponente.

meteomancer=Meteomantes
meteomancer.description=Especialización: Presciencia. Cuando invocas una criatura Meteo, eliges un elemento básico como tu Elemento invocado. La mayoría de las cartas Meteo se activan cuando el oponente juega cartas de ese elemento.
meteomancer.thief=Ladrón de rayos
meteomancer.thief.description=Cuando el oponente usa un hechizo del Elemento invocado, se lanza Llamada del trueno sobre la criatura del oponente con más vida (6 de daño a ella y 6 al oponente).
meteomancer.extremophile=Extremófilo
meteomancer.extremophile.description=Inmune al daño de hechizos y habilidades del oponente. Cuando el oponente juega una carta del Elemento invocado, aparece otro Extremófilo en la casilla vacía más a la derecha de su jugador.
meteomancer.clairvoyant=Clarividente
meteomancer.clairvoyant.description=Al ser invocado, el oponente gana 3 de mana del nuevo Elemento invocado y pierde 1 de mana de cada otro tipo.
meteomancer.mistwalker=Caminante de la bruma
meteomancer.mistwalker.description=El Elemento invocado elegido al invocar al Caminante de la bruma no se revela al oponente. El ataque del Caminante de la bruma aumenta en 5 mientras sea tu única criatura Meteo en juego.
meteomancer.grenadier=Granadero astral
meteomancer.grenadier.description=Cuando el oponente invoca una criatura no Especial, esta pierde la mitad de su vida (redondeado hacia arriba) si pertenece al Elemento invocado y recibe 4 de daño en caso contrario.
meteomancer.fateweaver=Tejedestinos
meteomancer.fateweaver.description=Cuando el oponente juega una carta del Elemento invocado, gana 4 de mana de ese elemento y juega una carta extra del Elemento invocado en tu siguiente turno.
meteomancer.prism=Mago prisma
meteomancer.prism.description=Cada turno, inflige a cada criatura del oponente un daño igual a la mitad del mana del oponente en el Elemento invocado (redondeado hacia abajo). Cuando el oponente juega una carta del Elemento invocado, el ataque del Mago prisma aumenta permanentemente en 1.
meteomancer.storm=Tormenta astral
meteomancer.storm.description=Cuando el oponente juega una carta del Elemento invocado, inflige 19 de daño al oponente y a cada criatura del oponente.

quantumancer=Cuantomante
quantumancer.description=Especialización: Superposición. Hechizos que escalan con el mana enemigo, guerreros que comparten su daño y sellos que roban las opciones del oponente. Los distintos tipos de magia son simplemente distintas manifestaciones de la energía bruta, pero hace poco unos pocos magos, conocidos por la mayoría como los Cuantomantes, aprendieron a manipular la fuerza de la Energía misma. Estos magos pueden usar su finura para controlar esa fuerza primitiva, y atacar a sus enemigos no solo con los poderes del universo sino también con los poderes que sus enemigos les lanzan.
quantumancer.surge=Oleada de poder
quantumancer.surge.description=Inflige a cada criatura del oponente un daño igual al mana del oponente en la Casa de esa criatura, pero no menos de 3 de daño.
quantumancer.kineticist=Cinetista
quantumancer.kineticist.description=Los hechizos y habilidades del oponente curan al Cinetista en lugar de dañarlo, y aumentan permanentemente su ataque en 1.
quantumancer.warrior=Guerrero dimensional
quantumancer.warrior.description=Cuando el Guerrero dimensional ataca a una criatura, también inflige al oponente un daño igual a su ataque.
quantumancer.martyr=Mártir magnético
quantumancer.martyr.description=Todo el daño que los hechizos del oponente infligen a tus criaturas se inflige en su lugar al Mártir magnético.
quantumancer.wall=Muro de fósforo
quantumancer.wall.description=Cuando el Muro de fósforo es atacado, inflige a cada criatura del oponente un daño igual al nivel de la criatura que lo atacó.
quantumancer.sealing=Espíritu del sellado
quantumancer.sealing.description=Cuando el oponente juega una carta, no puede volver a jugar esa carta hasta que el Espíritu del sellado muera. Mientras esté en juego, su jugador no puede jugar otro Espíritu del sellado.
quantumancer.fusion=Elemental de fusión
quantumancer.fusion.description=El ataque del Elemental de fusión es igual a la reserva de mana más alta del oponente. Reduce en 1 cada turno la reserva de mana más baja del oponente.
quantumancer.cosmic=Mago cósmico
quantumancer.cosmic.description=Cuando el Mago cósmico entra en juego, ganas un turno extra para volver a jugar gratis un hechizo de coste 10 o menos jugado por el oponente. Puedes omitir la repetición.
quantumancer.cosmic.choose=Repetir gratis un hechizo del oponente, o pasar
meteomancer.choose=Elemento invocado (actual: {0})
meteomancer.noelement=ninguno
powermancer=Poderomante
powermancer.description=Especialización: Poder. Negocia con el poder especial para lanzar lo que quieras, sacrifica criaturas por poder y vida, y grava el poder del oponente. Todas las cartas del Poderomante giran en torno a un único concepto: gestionar tu poder de forma muy eficiente.
powermancer.bargain=Trato infernal
powermancer.bargain.description=Puedes jugar cualquier carta básica gastando todo tu poder de su tipo y el resto de tu poder especial. Permite usar una carta adicional este turno. No puede jugarse durante tus dos primeros turnos.
powermancer.burial=Entierro eterno
powermancer.burial.description=Sacrifica una criatura: gana 3 de poder de su tipo y 1 de cada otro tipo. Gana vida igual al doble de su coste, hasta 10.
powermancer.hunter=Cazador de poder
powermancer.hunter.description=Cada vez que el Cazador de poder daña a una criatura del oponente, gana 1 de poder especial. Cada vez que daña al oponente, reduce en 1 un poder al azar del oponente.
powermancer.tower=Torre de marfil
powermancer.tower.description=Mientras esté en juego, tus hechizos cuestan 2 menos y tus otras cartas 1 menos. Cada vez que juegas una carta, inflige 3 de daño al oponente; si fue un hechizo, ganas 3 de vida en su lugar.
powermancer.equilibrium=Equilibrio
powermancer.equilibrium.description=Inflige al oponente un daño igual a su poder más alto y luego reduce ese poder en 2. Ganas vida igual a tu poder más bajo y luego aumentas ese poder en 2.
powermancer.hound=Sabueso astral
powermancer.hound.description=Aumenta en 1 tu crecimiento de mana especial y reduce en 1 el del oponente.
powermancer.stasis=Estasis
powermancer.stasis.description=Reduce en 1 cada poder del oponente, aturde a todas las criaturas del oponente e impide que el oponente juegue cartas el próximo turno.
powermancer.rainbow=Avatares arcoíris
powermancer.rainbow.description=Invoca cuatro Avatares 2/16 en casillas vacías al azar: uno de Fuego, Agua, Aire y Tierra. Cada uno aumenta en 1 el crecimiento de mana de su elemento mientras esté en juego.
powermancer.avatar.fire=Avatar de fuego
powermancer.avatar.fire.description=Avatar del Fuego. Aumenta en 1 tu crecimiento de mana de fuego mientras esté en juego.
powermancer.avatar.water=Avatar de agua
powermancer.avatar.water.description=Avatar del Agua. Aumenta en 1 tu crecimiento de mana de agua mientras esté en juego.
powermancer.avatar.air=Avatar de aire
powermancer.avatar.air.description=Avatar del Aire. Aumenta en 1 tu crecimiento de mana de aire mientras esté en juego.
powermancer.avatar.earth=Avatar de tierra
powermancer.avatar.earth.description=Avatar de la Tierra. Aumenta en 1 tu crecimiento de mana de tierra mientras esté en juego.

shadowcaster=Lanzasombras
shadowcaster.description=Especialización: Oscuridad. El poder oscuro es un contador aparte, no mana. Aliméntate del miedo del enemigo, proyecta sombras sobre el campo de batalla e invoca a los malditos Elfos Oscuros de los Reinos de la Sombra. El Lanzasombras usa sus poderes de la Oscuridad para confundir a sus enemigos y sembrar el caos en las filas de sus rivales, alimentándose de su miedo para fortalecer su propia Energía Oscura. Desde lo más profundo de la Sacra Oscuridad, el Lanzasombras invoca a los malditos Elfos Oscuros de los Reinos de la Sombra para hacer su voluntad, y echa una sombra grotesca sobre el campo de batalla.
shadowcaster.bat=Murciélago gigante
shadowcaster.bat.description=Cada vez que el Murciélago gigante inflige daño a una criatura opuesta, se cura 3 de vida.
shadowcaster.wave=Ola de sombras
shadowcaster.wave.description=Inflige X+2 de daño a todas las criaturas del oponente (X = poder Oscuro del lanzador).
shadowcaster.noble=Noble elfo oscuro
shadowcaster.noble.description=Si lo mata un hechizo del oponente, aumenta en 2 el poder Oscuro de su jugador.
shadowcaster.mage=Mago elfo oscuro
shadowcaster.mage.description=Aumenta en 1 el coste de todos los hechizos de su jugador y en 2 su daño. Cada vez que su jugador lanza un hechizo, aumenta en 1 el poder Oscuro de su jugador.
shadowcaster.scythe=Guadaña de sombras
shadowcaster.scythe.description=Inflige X+4 de daño a todas las criaturas del oponente (X = poder Oscuro del lanzador). Por cada criatura muerta, inflige 2 de daño al oponente y aumenta en 1 el poder Oscuro del lanzador.
shadowcaster.assassin=Asesino elfo oscuro
shadowcaster.assassin.description=Ataca el mismo turno en que es invocado. Cada vez que mata a una criatura del oponente, aumenta en 1 el poder Oscuro de su jugador.
shadowcaster.moonblade=Hoja lunar
shadowcaster.moonblade.description=Al comienzo del turno de su jugador, inflige a todas las criaturas del oponente un daño igual al poder Oscuro de su jugador. Cada vez que mata a una criatura, aumenta en 1 el poder Oscuro de su jugador.
shadowcaster.priestess=Sacerdotisa de las sombras
shadowcaster.priestess.description=Al ser invocada, aturde a todas las criaturas del oponente. Al morir, aumenta en 2 el poder Oscuro de su jugador.

spiritshaman=Chamán espiritual
spiritshaman.description=Especialización: Liberación. El poder espiritual es el mana especial. Invoca Tótems espirituales; cuando se cumple la condición de Liberación de un tótem, es sustituido en su casilla por su criatura Espíritu. El Chamán espiritual recurre al Reino de los Espíritus en busca de iluminación y fuerza, permitiendo que los espíritus de la naturaleza guíen su camino. Usa el poder de los ancestrales Tótems espirituales para invocar a las criaturas del Reino de los Espíritus y Liberarlas en el mundo de los vivos para luchar a su lado.
spiritshaman.tortoise=Tótem de tortuga
spiritshaman.tortoise.description=Al ser invocado, libera todos los Tótems de las casillas vecinas. Liberación: cuando su jugador invoca otra criatura Espíritu.
spiritshaman.tortoise.spirit=Espíritu de tortuga
spiritshaman.tortoise.spirit.description=Al ser liberado, aumenta en 1 el poder Espiritual de su jugador.
spiritshaman.fox=Tótem de zorro
spiritshaman.fox.description=Al ser invocado, inflige a la criatura opuesta un daño igual al ataque de esa criatura. Liberación: al comienzo del turno de su jugador, si su vida es 5 o menos.
spiritshaman.fox.spirit=Espíritu de zorro
spiritshaman.fox.spirit.description=Al ser liberado, todos los demás Tótems de su jugador también se liberan, aunque no se cumpla su condición de Liberación.
spiritshaman.deer=Tótem de ciervo
spiritshaman.deer.description=Cada turno cura 1 de vida a su jugador. Liberación: al comienzo del turno de su jugador, si el poder de Tierra del jugador es 7 o más.
spiritshaman.deer.spirit=Espíritu de ciervo
spiritshaman.deer.spirit.description=Al ser liberado, cura 6 de vida a todas las demás criaturas de su jugador.
spiritshaman.owl=Tótem de búho
spiritshaman.owl.description=Al ser invocado, aumenta en 1 el poder más bajo de Fuego, Agua, Aire o Tierra de su jugador. Liberación: cuando uno de esos poderes es 1 o menos.
spiritshaman.owl.spirit=Espíritu de búho
spiritshaman.owl.spirit.description=Al ser liberado, aumenta en 2 el poder más bajo de Fuego, Agua, Aire o Tierra de su jugador.
spiritshaman.panther=Tótem de pantera
spiritshaman.panther.description=Su ataque aumenta en 1 cada turno, pero no puede atacar. Liberación: cuando el ataque combinado del Tótem de pantera y sus vecinos es 12 o más.
spiritshaman.panther.spirit=Espíritu de pantera
spiritshaman.panther.spirit.description=Su ataque es 2 más el ataque que tenía el Tótem de pantera al ser liberado. Cuando mata a una criatura del oponente, ataca de nuevo de inmediato.
spiritshaman.awakening=Despertar espiritual
spiritshaman.awakening.description=Cura al lanzador y a todas las criaturas del lanzador una cantidad igual al poder Espiritual del jugador (antes de pagar el coste del hechizo) y libera todos los Tótems del lanzador.
spiritshaman.bear=Tótem de oso
spiritshaman.bear.description=El turno en que es invocado, aumenta en 2 el ataque de todas las demás criaturas de su jugador. Liberación: cuando hay al menos 8 criaturas en el tablero (incluido él).
spiritshaman.bear.spirit=Espíritu de oso
spiritshaman.bear.spirit.description=Al ser liberado, inflige 8 de daño a todas las criaturas del oponente.
spiritshaman.eagle=Tótem de águila
spiritshaman.eagle.description=Al ser invocado, aumenta en 4 el poder Espiritual de su jugador. Liberación: cuando el poder Espiritual de su jugador es 8 o más.
spiritshaman.eagle.spirit=Espíritu de águila
spiritshaman.eagle.spirit.description=Al ser liberado, reduce en 4 el poder Espiritual de su jugador y aumenta en 2 todos sus demás poderes.
chronomaster=Cronomaestro
chronomaster.description=Especialización: Tiempo. Congela el presente, adelanta los relojes y devuelve el tablero a ayer.
chronomaster.freeze=Congelar
chronomaster.freeze.description=La criatura objetivo pierde su próximo turno.
chronomaster.sprites=Espíritus de luz
chronomaster.sprites.description=Estas criaturas ultrarrápidas no pueden ser bloqueadas.
chronomaster.accelerate=Acelerar el tiempo
chronomaster.accelerate.description=La criatura aliada objetivo ataca 2 o 3 veces este turno.
chronomaster.wall=Muro de distorsión temporal
chronomaster.wall.description=Mientras está en juego, su dueño no puede recibir daño. Sus criaturas sí.
chronomaster.aging=Envejecimiento
chronomaster.aging.description=La criatura objetivo pierde 3 de ataque de forma permanente.
chronomaster.groundhog=El día de la marmota
chronomaster.groundhog.description=El tablero vuelve a como estaba al inicio del turno anterior. Los jugadores conservan su vida actual. Ambos pierden 1 de maná en cada casa. Anula los hechizos mortales del último turno.
chronomaster.queen=Reina crono
chronomaster.queen.description=Al ser invocada, todas las criaturas aliadas pueden atacar una vez más este turno.
chronomaster.king=Rey crono
chronomaster.king.description=El próximo turno el dueño puede jugar dos cartas.
chronomaster.king.phase=Jugar una segunda carta
settings.dev=Dev
settings.debug=Modo depuración (campaña: ganar sin jugar)
button.debugwin=Ganar (depuración)


campaign.paganist.name=Maela
campaign.paganist.message=Las piedras viejas tienen sed. Mi dios tiene hambre, y tu magia huele a una buena ofrenda. Verás que tu sacrificio justifica tu desesperación. ¿Bailamos?
campaign.paganist.win=La ofrenda era mía, después de todo. Sigue; las piedras recordarán tu nombre.
campaign.paganist.lose=El dios fue alimentado, y no por ti. Vuelve cuando tus manos estén más firmes.

sound.ambient=Sonido ambiental
earth.forestspider.description=Sin habilidad especial
earth.elemental.description=Aumenta el crecimiento de mana de tierra del propietario en 1 cada turno
entomologist.drone.description=Sin habilidad especial
shaman.ghost.description=El compañero del Chamán. No tiene habilidad propia: las demás cartas del Chamán cambian su ataque, su vida y el daño que recibe.

troopers=Tropas
troopers.marine.description=Cuando se le invoca en el lado del tablero del oponente, el Marine se inflige 4 de daño a sí mismo.
troopers.conscription.description=Da 1 de mana de Tropas. Cuesta 0 la primera vez que se juega y 1 más en cada uso posterior.
troopers.barracks.description=Aumenta el crecimiento de mana de Tropas en 1 cada turno
troopers.wraith.description=Cada turno, inflige 2 de daño a todas las criaturas del oponente
troopers.goliath.description=Reduce en 1 el daño no mágico que recibe. No puede recibir daño de hechizos ni de habilidades.
SiegeTank=Tanque de asedio
troopers.siegetank.description=Cada turno, inflige 8 de daño a la criatura opuesta con más vida
NuclearMissile=Misil nuclear
troopers.nuclearmissile.description=Inflige 19 de daño a todas las criaturas del oponente
ScienceVessel=Nave científica
troopers.sciencevessel.description=Al ser invocado, inflige 12 de daño a todas las criaturas del oponente

dudes=Duros

emotion=Emoción
emotion.description=Especialización: Emoción. Cobardía, revuelta, soledad, coraje, amor, esperanza, trabajo en equipo y leyenda; cada una premia un estado distinto del tablero.
emotion.coward=Guerrero cobarde
emotion.coward.description=El Guerrero cobarde muere en cuanto es la única criatura que queda en su lado del tablero.
emotion.revolt=Revuelta
emotion.revolt.description=Inflige al oponente un daño igual a 2 + el doble del número de criaturas que controle.
emotion.loneliness=Soledad
emotion.loneliness.description=Toda criatura sin criatura enfrente recibe 16 de daño.
emotion.courage=Guerrero valiente
emotion.courage.description=El ataque del Guerrero valiente se triplica mientras la vida de su propietario sea de 12 o menos.
emotion.love=Guerrero del amor
emotion.love.description=Cada turno, el Guerrero del amor se cura una cantidad igual al número de criaturas aliadas en el tablero.
emotion.hope=Guerrero de la esperanza
emotion.hope.description=Cuando el Guerrero de la esperanza muere, todas las criaturas aliadas se curan 7 de vida y todas las criaturas del oponente reciben 7 de daño.
emotion.teamwork=Guerrero del trabajo en equipo
emotion.teamwork.description=El ataque del Guerrero del trabajo en equipo se duplica cuando las dos casillas adyacentes contienen criaturas aliadas.
emotion.legend=Guerrero legendario
emotion.legend.description=Cuando el Guerrero legendario muere, la vida actual de cada criatura aliada se reduce a la mitad, redondeando hacia arriba.

paganist=Pagano
paganist.description=Especialización: Sacrificio. El Pagano gasta su propia vida y sus criaturas para alimentar a un dios cada vez más hambriento. Esta clase gira en torno a sacrificar tus criaturas, tu vida y tu mana para hacer un daño masivo a tu oponente y a sus criaturas. Como el control del tablero es primordial, y cada sacrificio te deja un hueco menos, la parte baja del mazo está diseñada para tener una fuerte sinergia con el resto de la clase, mientras que la parte alta del mazo es increíblemente potente comparada con las otras casas. Los otros temas mayores de la clase son un parecido con Illusion, donde la mayoría de las habilidades hacen daño directo, y el hecho de que muchas cartas interaccionan con el coste de mana de las cartas, como Illusion 6.
paganist.virgin=Doncella sacrificial
paganist.virgin.description=Si la Doncella sacrificial muere a causa de un hechizo, su propietario gana vida igual a la que tenía antes del hechizo.
paganist.lamb=Cordero sacrificial
paganist.lamb.description=Cuando el Cordero sacrificial muere, su propietario invoca inmediatamente una criatura aleatoria de esta Casa, ignorando su coste.
paganist.offering=Ofrenda final
paganist.offering.description=Inflige al oponente un daño igual al coste combinado de las tres criaturas más caras del lanzador, y después las sacrifica.
paganist.contract=Contrato profano
paganist.contract.description=La criatura enemiga objetivo es sacrificada. Inflige 13 de daño al oponente, reducido según el coste de esa criatura.
paganist.terrorize=Aterrorizar
paganist.terrorize.description=Destruye la criatura enemiga objetivo, inflige 13 de daño al oponente y aumenta permanentemente en 1 el coste de sus cartas de Fuego, Agua, Aire y Tierra.
paganist.moloch=Moloch
paganist.moloch.description=Debe invocarse sobre otra criatura de su propietario. Cada turno cura 4 de vida a todos los jugadores y criaturas. Su ataque daña a todos los jugadores y criaturas.
paganist.obliterate=Aniquilar almas
paganist.obliterate.description=Destruye todas las criaturas del oponente. El lanzador pierde 3 de Poder en cada Casa y no puede jugar ninguna carta en su siguiente turno.
paganist.blood=Río de sangre
paganist.blood.description=Inflige 25 de daño al lanzador. Si el lanzador sobrevive, inflige 25 de daño al oponente y a cada criatura del oponente.

kahjivir=Cazadora Kahjivir
kahjivir.description=Especialización: La caza. Las cazadoras Kahjivir se abalanzan sobre un carril ocupado, castigan uno vacío y se vuelven más feroces con cada muerte.
kahjivir.hunger=Hambre de la cazadora
kahjivir.hunger.description=La cazadora aliada objetivo ataca una vez más este turno y se cura por todo el daño que inflija este turno.
kahjivir.ambush=Emboscada de la manada
kahjivir.ambush.description=La cazadora aliada objetivo gana permanentemente 2 de ataque. Cada criatura adyacente a ella ataca una vez más este turno.
kahjivir.stalker=Acechadora Kahjivir
kahjivir.stalker.description=Al ser invocada enfrente de una criatura enemiga, puede atacar el mismo turno en que se invoca. Al ser invocada enfrente de una casilla vacía, inflige 3 de daño al oponente.
kahjivir.javelin=Lanzadora de jabalina
kahjivir.javelin.description=Enfrente de una criatura enemiga, su ataque aumenta en 3.
kahjivir.dancer=Bailarina espiritual
kahjivir.dancer.description=Enfrente de una criatura enemiga, el daño que las criaturas le infligen se reduce en 2. Enfrente de una casilla vacía, el daño de hechizos que recibe se reduce a 0.
kahjivir.shaman=Chamana de la tribu
kahjivir.shaman.description=Cada vez que ataca, su ataque aumenta permanentemente en 1. Enfrente de una criatura enemiga, ataca dos veces cada turno.
kahjivir.archer=Arquera Kahjivir
kahjivir.archer.description=Enfrente de una casilla vacía, su ataque aumenta en 6. Enfrente de una criatura enemiga, inflige 3 de daño a todas las criaturas enemigas cada turno.
kahjivir.headhuntress=Jefa cazadora del clan
kahjivir.headhuntress.description=Al ser invocada enfrente de una criatura enemiga con 25 de vida o menos, la mata. Al ser invocada enfrente de una casilla vacía, inflige 8 de daño al oponente y a todas las criaturas del oponente.

blacksmith=Herrero
blacksmith.description=Habilidad especial de clase - portador: cada vez que se lanza un hechizo de Herrero, quien lo lanza debe elegir una de sus criaturas de coste 8 o menos como portadora del efecto del hechizo. La idea detrás de esta clase es que es una clase defensiva como el clérigo, con el foco en proteger un acelerador de mana, pero más adelante en la partida tiene buena sinergia con cartas de gama media como Troll y Minotaur en lugar de cartas de alto nivel como los elementales.
blacksmith.mithrilspear=Lanza de mithril
blacksmith.mithrilspear.description=El ataque del portador aumenta permanentemente en 2. Si se usa en Duende del bosque, el portador inflige 2 de daño a la criatura opuesta cada turno en su lugar.
blacksmith.mithrilbow=Arco de mithril
blacksmith.mithrilbow.description=El portador ataca el mismo turno en que se le encanta y aturde a la primera criatura a la que inflija daño.
blacksmith.mithrilshield=Escudo de mithril
blacksmith.mithrilshield.description=La vida máxima del portador aumenta permanentemente en 10.
blacksmith.wizardshat=Sombrero de mago
blacksmith.wizardshat.description=El portador no recibe daño de hechizos ni de habilidades.
blacksmith.flyingchariot=Carro volador
blacksmith.flyingchariot.description=El portador cabalga sobre un Pegaso y no entra en juego hasta que el Pegaso muere.
blacksmith.pegasus=Pegaso
blacksmith.pegasus.description=Al final de cada turno, inflige X+4 de daño a la criatura opuesta, donde X es el ataque de la criatura que lo monta. Si la casilla opuesta está vacía, el daño se le inflige al oponente.
blacksmith.cloakanddagger=Capa y daga
blacksmith.cloakanddagger.description=Cuando el portador entra en juego, una Capa astral aparece en la casilla vacía más cercana a su izquierda y una Daga astral en la casilla vacía más cercana a su derecha.
blacksmith.astralcloak=Capa astral
blacksmith.astralcloak.description=Reduce en 1 todo el daño recibido por su propietario y por el portador de la Capa astral. Al morir, el Poder de Agua y Tierra de su propietario aumenta en 1.
blacksmith.astraldagger=Daga astral
blacksmith.astraldagger.description=Aumenta en 1 todo el daño infligido al oponente de su propietario y a la criatura opuesta al portador de la Daga astral. Al morir, el Poder de Fuego y Aire de su propietario aumenta en 1.
blacksmith.excalibur=Excalibur
blacksmith.excalibur.description=Cuando el portador entra en juego, destruye la criatura opuesta, o inflige 15 de daño al oponente si va sin oposición. El ataque del portador se reduce permanentemente a la mitad y daña al oponente y a todas las criaturas del oponente.
blacksmith.barguliangauntlet=Guantelete de Bargul
blacksmith.barguliangauntlet.description=Cuando el portador entra en juego, inflige a todas las criaturas del oponente un daño igual a X+8, donde X es el ataque del portador. El daño del guantelete y el del ataque del portador también reducen la vida máxima, impidiendo curación y resistencia al daño.

trappers=Tramperos
trappers.description=Especialización: Control. Los Tramperos tienen un vínculo increíble con la fuerza oscura del poder de la tierra: con sus poderes de espectromante y la ayuda de las raíces de la ruina y las criaturas del bosque oscuro atrapan a las criaturas enemigas y toman el control de cada batalla.
trappers.whipmaster=Maestro del látigo
trappers.whipmaster.description=Mientras permanezca en juego, cada criatura que el oponente invoque en un turno posterior hace que el oponente pierda 5 de vida.
trappers.psychicshaman=Chamán psíquico
trappers.psychicshaman.description=Cuando el Chamán es invocado, la criatura de la casilla opuesta pierde su próximo ataque. El Chamán ataca el turno en que es invocado.
trappers.rose=Rosa del averno
trappers.rose.description=La criatura objetivo del oponente pierde su próximo ataque y recibe un daño igual a la mitad de su vida, redondeado hacia arriba.
trappers.darkpixie=Duende oscuro
trappers.darkpixie.description=Mientras permanezca en juego, la criatura de la casilla opuesta no puede atacar.
trappers.undergroundpoison=Veneno subterráneo
trappers.undergroundpoison.description=Destruye la criatura objetivo del oponente. El oponente gana maná igual al coste de la criatura destruida menos 3.
trappers.roots=Raíces venenosas
trappers.roots.description=Las criaturas del oponente no pueden atacar el próximo turno y todos los poderes del oponente se reducen en 1.
trappers.mindwitch=Bruja mental
trappers.mindwitch.description=La criatura de la casilla opuesta pierde su habilidad: cualquier criatura que esté allí queda silenciada mientras la Bruja permanezca en juego.
trappers.psychicmedusa=Medusa psíquica
trappers.psychicmedusa.description=Cada turno, la criatura del oponente con más vida pierde su ataque.

grimoire.title=Grimoire
grimoire.description=El grimorio de Mancers: cada casa y cada carta, con arte, coste, estadísticas y reglas.
