campaign.restart.confirm=¿Borrar todo el progreso de la campaña y empezar de nuevo?
campaign.restart.choice=¿Reiniciar toda la campaña, o solo la noche?
campaign.restart.all=Toda la campaña
campaign.restart.night=Solo la noche
campaign.continue=Continuar
campaign.night.rest.title=Noche
campaign.night.rest=Descansaste en una habitación de la ciudad y despiertas de noche.
campaign.antimancer.wake.title=Lejos, en las tierras
campaign.antimancer.wake=Tras vencer al antimante, perdiste el conocimiento y despiertas lejos, en las tierras.
button.yes=Sí
campaign.entomologist.message=El bosque es amable hoy. Camina conmigo un rato: a mis pequeños les encantaría una partida tranquila.
campaign.farmer.message=Puede que haya trampas en los caminos. No te entretengas. Busca tu propio camino para descubrir este hermoso país.
campaign.duckwoman.message=La ciudad está llena de gente estos días. Mantén los ojos abiertos: con un poco de suerte te toparás con un mago que de verdad sepa de magia. O toma los caminos más quietos y evita el gentío.
campaign.duckwoman.choice.go_city=Ir a la ciudad
campaign.duckwoman.choice.avoid_city=Evitar la ciudad
campaign.ram.message=Poca gente sube estas montañas. Cuidado dónde pisas: hay sitios peligrosos.
campaign.rabbit.message=He oído que hay un mago poderoso en las montañas. Si lo encuentras, quizá te enseñe unos trucos.
campaign.beaver.message=Estás cruzando un bosque especial. Hay algo mágico en él.
campaign.elder.message=Por la noche algunos magos abusan de su poder y lo desarrollan sin ninguna restricción. Ten cuidado en este camino.
campaign.fishman.message=Duermo mal, sabiendo que las máquinas siguen trabajando por la noche.
campaign.fisherman.message=Aquí algunos se han perdido por querer competir solo con lo peor.
campaign.deer.message=Pregúntate por qué quieres enfrentarte a estos magos poderosos, y qué has dejado atrás.
campaign.girl.message=Cuando deambulo de noche oigo ruidos terribles que vienen de la montaña. Puedes subir hacia ellos, o bajar al valle.
campaign.girl.choice.to_mountain=Seguir hacia la montaña
campaign.girl.choice.to_valley=Bajar al valle
campaign.patou.message=Estás lejos de tu fuente. Espero que te quede energía suficiente.
campaign.catboy.message=En noches como esta es fácil perderse. Me da miedo volver con mi familia: algunos se volvieron magos poderosos. ¿Me llevas a la ciudad, o seguimos por el campo?
campaign.catboy.choice.bring_city=Llevarlo a la ciudad
campaign.catboy.choice.stay_land=Seguir por el campo
campaign.crowd.message=El muchacho ha desaparecido entre la gente. Te preguntas a qué gritan, y sigues su dirección.
campaign.seasons.message=Buen tiempo para una partida. Veamos a cuál de los dos favorece el año.
campaign.disciples.message=¡Oh! Espero no haberte asustado. ¿Te has perdido? Puedo decirte que no es el caso. Déjame pesar tu alma.
campaign.dudes.message=Buen paseo hasta ahora. Lástima que acabe en el barro. Procura no llorar cuando te tire.
campaign.mountainking.message=Las piedras recuerdan a cada intruso. Acércate: añadiré tu nombre al acantilado.
campaign.spiritshaman.message=Los espíritus de esta cresta me deben un favor. ¿Vemos a quién responden cuando empiecen los tambores?
campaign.shaman.message=Aquí empieza la montaña. Los muertos ya saben cuál de los dos volverá a bajar.
campaign.wind.message=Te arrancaré el aliento y esparciré lo que quede por estas rocas.
campaign.antimancer.message=El sol se ha ido, y la cortesía con él. Aun así, jugaré: una sola vez.
campaign.warp.message=Te ves más delgado con esta luz. Un tirón y te desharás.
campaign.rogue.message=Otro turista. Vacía tus bolsillos o vacía tu vida: aún no he decidido.
campaign.faerie_druid.message=Los árboles recuerdan huéspedes más amables. No te llorarán.
campaign.vampires.message=Tu pulso es una campana de cena. Siéntate. Prefiero que mis comidas sigan hablando.
campaign.darkpriest.message=Arrodíllate. Si no quieres rezar, escribiré tu último himno con sangre.
campaign.zen.message=Aún crees que esto es una lección. Es un final. Calla y pierde.
campaign.darksider.message=Desharé el camino a tu espalda. No queda aldea a la que huir.
campaign.highpriest.message=La cima no admite peregrinos. Te quebraré y bendeciré los pedazos.
campaign.end.win.title=Victoria
campaign.end.lose.title=Derrota
campaign.end.map=Mapa
campaign.end.replay=Revancha
campaign.end.win=El camino se abre. Recordaré este duelo.
campaign.end.lose=Esa fue la diferencia. Recomponte e inténtalo de nuevo.
campaign.end.summoner.win=Me sacaste del tablero sin contemplaciones. Ni siquiera pude lanzar mi enjambre. Bien jugado.
campaign.end.summoner.lose=Les dije a mis pequeños que te quedarías sin respuestas. Ven, podemos jugar otra vez.
campaign.end.strategist.win=Una línea más limpia que la mía. Planeé tres de tus jugadas y tú hiciste la cuarta.
campaign.end.strategist.lose=Leí tu ritmo dos turnos antes de que lo notaras. Baraja y escóndelo mejor.
campaign.end.gambler.win=¡Ja! Descubriste mi farol con mejor mano. La montaña se queda con mi apuesta: sigue tu camino.
campaign.end.gambler.lose=Los dados cayeron de mi lado, amigo. ¿Doble o nada? Las piedras esperan.
campaign.end.lecturer.win=Anotado. Tu tesis se sostiene; la mía necesita revisión. El tablero es tuyo.
campaign.end.lecturer.lose=Una refutación previsible. Repasa tu apertura y solicita otro examen.
campaign.end.oracle.win=Los hilos me mintieron. Sigue adelante: la visión que te espera es más brillante que la que te tenía en el barro.
campaign.end.oracle.lose=Vi este final antes de que robaras. Los árboles, la campana, el himno: todo rima. Intenta sorprenderme.
campaign.end.diviner.win=Vaya. Al fin y al cabo, la cima conserva un peregrino. Sube, y sé más amable que yo.
campaign.end.diviner.lose=La cima aún no conserva peregrinos. Arregla tu mazo, calma tu corazón y sube de nuevo.
campaign.entomologist.win=Mis pequeños están cansados, y yo también. Sigue con suavidad: el bosque te recordará con cariño.
campaign.entomologist.lose=Tranquilo, tranquilo. El bosque sigue siendo amable y a mis pequeños les gustó tu partida. Descansa y juega conmigo otra vez.
campaign.seasons.win=Así que el año te favoreció. Buen tiempo para tu marcha: aprovéchalo bien.
campaign.seasons.lose=El año me favoreció, como dije que podría. Vuelve cuando cambie la estación.
campaign.disciples.win=Listo, en efecto: demostrado antes de que el avivamiento se agriara. Lleva mi bendición junto con mi derrota.
campaign.disciples.lose=Ser listo aún no basta. El avivamiento se agria, como prometí: reza, estudia y vuelve.
campaign.dudes.win=Ja, me tiraste en mi propio barro. Sin lágrimas, lo juro. Te ganaste el camino, luchador.
campaign.dudes.lose=Te dije que acaba en el barro. Sécate los ojos, levántate y exige tu revancha.
campaign.mountainking.win=Las piedras te recordarán a TI, no a mí. Aposté el acantilado y perdí: sigue subiendo.
campaign.mountainking.lose=Tu nombre está ahora en el acantilado, bajo una docena más. Las piedras se quedan con la apuesta: ¿lo intentas de nuevo?
campaign.spiritshaman.lose=Los espíritus me respondieron, como siempre. Descansa junto al fuego y vuelve a tocar el tambor.
campaign.spiritshaman.win=Los tambores callaron para mí. Los espíritus te respondieron a ti: ve, el viento te espera.
campaign.wind.win=Mi aliento se agotó; el tuyo resiste. Una tesis sólida, bien defendida. La cumbre está abierta.
campaign.wind.lose=Esparcido, como prometí. Recobra el aliento y tus cartas, y enfrenta de nuevo al viento.
campaign.antimancer.win=Una partida, y la ganaste. La cortesía vuelve con el alba: vete antes de que cambie mi temario.
campaign.antimancer.lose=Una vez bastó, como dije. La oscuridad guarda su cortesía, pero te concederé otra partida.
campaign.warp.win=Resististe donde más tiré. Un nudo se soltó: mi análisis y el camino son tuyos.
campaign.warp.lose=Te deshiciste con el tirón, justo así. Déjame recomponerte para el próximo examen.
campaign.rogue.win=¿Bolsillos Y vida? Quédate con ambos, turista. Pagaste la lección por completo.
campaign.rogue.lose=Decidí: bolsillos. Vacíalos, aprende las calles y vuelve a comprar tu lección.
campaign.faerie_druid.win=Los árboles recordarán ahora a un huésped más amable: tú. Pasa con suavidad bajo sus ramas.
campaign.faerie_druid.lose=Los árboles no te lloran, como advertí. Hazte más sabio y vuelve a recorrer esta arboleda.
campaign.soulbinder.message=El bosque guarda lo que se cuela entre mundos. Ataré lo que no puedes sostener.
campaign.soulbinder.win=Tu alma siguió siendo tuya. Sigue - la noche aún tiene dientes.
campaign.soulbinder.lose=Atada, como exige la noche. Libérate y encuéntrame otra vez.
campaign.vampires.win=La comida muerde de vuelta. Mi campana suena hueca: bebe el aire de la noche y vete, aún hablando.
campaign.vampires.lose=Tu pulso fue una buena campana de cena, y hablabas tan bonito. El hambre vuelve: ¿te sientas otra vez?
campaign.darkpriest.win=No quisiste arrodillarte y no se escribió ningún himno. La oscuridad te libera: camina sin ataduras.
campaign.darkpriest.lose=Tu último himno está escrito, en rojo como prometí. Reza para que rime mejor la próxima vez: ¿te arrodillas de nuevo?
campaign.zen.win=El final te rechazó. Habla, pues: la lección es ahora tuya, no mía.
campaign.zen.lose=Callado y perdido, como se te indicó. Cuando halles tu voz, escucharé tu revancha.
campaign.shaman.win=Los muertos se equivocaron: TÚ vuelves a bajar. La montaña te abre su apuesta.
campaign.shaman.lose=Los muertos lo sabían, como dije. Mantienen calientes tus huesos: ven a recuperarlos.
campaign.darksider.win=El camino resiste, después de todo. Tu aldea sigue en pie: corre a casa y diles que el camino sigue abierto.
campaign.darksider.lose=El camino a tu espalda está deshecho. Sin aldea, sin retirada: solo una revancha hacia adelante.
campaign.highpriest.win=La cima conserva por fin un peregrino. Estoy quebrado y bendecido a la vez: sube, guardián de la cumbre.
campaign.highpriest.lose=Quebrado, como prometí: déjame bendecir los pedazos. Recomponte y sube de nuevo.
campaign.tinker.message=Los engranajes giran, turista, y mi paciencia también. Veamos cómo aguantas bajo carga.
campaign.tinker.win=Atascado. Mi máquina, no la tuya: toma el camino y cuidado con las chispas.
campaign.tinker.lose=Desmontado para piezas. Vuelve con mejores tolerancias.
campaign.battlemage.message=Acero y sigilo juntos. Verás que soy difícil de leer y más difícil de detener.
campaign.battlemage.win=Parado, luego quebrado. Justo: el campo es tuyo.
campaign.battlemage.lose=Hoja y hechizo, como prometí. Practica tus formas y vuelve.
campaign.snowblood.message=El frío conserva lo que toma. Acércate, te mostraré cuán silencioso puede quedar un corazón.
campaign.snowblood.win=Conservaste tu calor. Raro. Sigue antes de que la nieve cambie de parecer.
campaign.snowblood.lose=Congelado donde estabas. El deshielo llegará, y quizá tú también.
campaign.shadowmage.message=Tu sombra ya te abandonó. Solo vengo a recoger el resto.
campaign.shadowmage.win=Las sombras perdieron su agarre. Sigue, mientras aún proyectes una.
campaign.shadowmage.lose=Tragado entero. Vuelve cuando hayas hallado tu propia sombra.
campaign.shadowcaster.message=La luz es un préstamo, y lo estoy cobrando. Quédate quieto: no tardaré.
campaign.shadowcaster.win=La oscuridad retrocede ante ti. Nunca lo vi venir.
campaign.shadowcaster.lose=Expulsado, como la oscuridad predijo. Busca la luz y vuelve.
campaign.soulreaper.message=Toda alma tiene su día de cosecha. La tuya es una buena cosecha tardía.
campaign.soulreaper.win=Mi guadaña se embotó contigo. Ve: la cosecha puede esperar.
campaign.soulreaper.lose=Segado por completo. Tu alma se conservará hasta que lo intentes de nuevo.
campaign.conjurer.message=Elige una carta, la que sea: todas son mías, y todas te odian.
campaign.conjurer.win=Un truco que no previ. Sube al escenario, entonces.
campaign.conjurer.lose=El telón cae sobre ti. Practica tu destreza y vuelve.
campaign.chronomaster.message=Tu tiempo está contado.
campaign.chronomaster.win=Quedan unos granos. Gástalos antes de que yo gire el reloj.
campaign.chronomaster.lose=Contado, y gastado. Vuelve si aún queda arena.
campaign.limbo.message=Ni día ni noche, ni ganado ni perdido. Aquí es donde esperan todos los caminos.
campaign.limbo.win=Sales del entremedio. Pocos lo hacen. La cima te llama.
campaign.limbo.lose=Retenido en el entremedio. Quédate un rato y luego inténtalo de nuevo.
campaign.meteomancer.message=El cielo me dijo que vendrías. También me dijo cómo termina esto: con lluvia.
campaign.meteomancer.win=Hasta el pronóstico puede fallar. Toma el camino despejado, viajero.
campaign.meteomancer.lose=Lluvia, como el cielo predijo. Sécate y vuelve por un segundo frente.
campaign.sower.message=Plántate en el barro y mira qué crece. Soy paciente: el pantano es paciente.
campaign.sower.win=No echaste raíces. Bien: sigue, y cuidado con los juncos.
campaign.sower.lose=Enraizado al fin. El pantano conserva lo que siembra: vuelve cuando hayas brotado.
campaign.fairy_knight.message=Alto, caminante. Estos juncos están bajo la protección de la Corte de las Hadas. Desenvaina o ríndete.
campaign.fairy_knight.win=Un duelo justo, justamente perdido. La Corte te concede paso.
campaign.fairy_knight.lose=La hoja de la Corte es veloz. Entrena y desafíame de nuevo.
campaign.dreamweaver.message=Shh. Ya estás medio dormido, y la montaña te tararea una nana.
campaign.dreamweaver.win=Despertaste antes de que el sueño se cerrara. Sigue, soñador.
campaign.dreamweaver.lose=Que duermas bien. Sueña con mejores aperturas y vuelve cuando despiertes.
campaign.junk.message=Todo vale algo. Incluso tú. Veamos qué puedo construir con tus restos.
campaign.junk.win=Ja. De chatarra a tesoro: venciste mi montón. Toma el camino.
campaign.junk.lose=Al montón de chatarra contigo. Vuelve cuando te hayan arreglado.
campaign.colors.message=Cada tono tiene su genio. Elige un color, el que sea: tengo respuesta para todos.
campaign.colors.win=Viste a través del espectro. Sigue, con brillo.
campaign.colors.lose=Un arcoíris entero de derrota. Mira los colores e inténtalo de nuevo.
campaign.elementalist.message=Fuego, agua, tierra, aire: cuatro amigos a los que no les caes bien. ¿Empezamos?
campaign.elementalist.win=Los elementos callan para ti. Pasa, portador.
campaign.elementalist.lose=Los elementos han hablado. Vuelve cuando puedas responder a los cuatro.
campaign.powermancer.message=El poder no se da, se extrae. Y yo estoy extrayendo el tuyo ahora mismo.
campaign.powermancer.win=Mi carga está drenada, la tuya no. La montaña se abre para ti.
campaign.powermancer.lose=Drenado hasta la última chispa. Recarga e inténtalo de nuevo conmigo.
campaign.kinetician.message=Todo se mueve. Incluso tú: directo a mis manos.
campaign.kinetician.win=Aguantaste firme contra el empuje. Sigue, pues.
campaign.kinetician.lose=Impulso, como se predijo. Prepárate y vuelve.
campaign.quantumancer.message=Estoy vencido y no vencido hasta que mires. Mira con cuidado.
campaign.quantumancer.win=La onda colapsó a tu favor. Sigue subiendo.
campaign.quantumancer.lose=La onda colapsó en tu contra. Observa, ajusta y repite el experimento.

