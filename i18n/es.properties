campaign.title=Campaña
campaign.intro=Acabas de llegar en barco a este país que no conoces. No sabes por qué, pero recuerdas que hace mucho tu maestro te advirtió que quizá llegara un tiempo en que los elementos de la naturaleza se deshicieran, y que, cuando llegara, las pocas lecciones que te había dado te serían útiles. Esperas encontrar una tierra pacífica, pero cuando miras hacia las montañas lejanas, algo te inquieta.
campaign.day=Día
campaign.night=Noche
campaign.complete=La cima es tuya
campaign.epilogue=No entiendes por qué has llegado tan lejos. De pronto tienes una visión. Hace mucho tiempo, una comunidad de mancers se enfrentaba de forma lúdica para avanzar en su maestría. Había magia en el equilibrio de aquellos tiempos. Recuerdas el momento en que tuviste que marcharte de esa comunidad, y por qué tuviste que irte. En ese momento sentiste un eco de la magia en todo lo que hacías.
