ai.strategist.description=Búsqueda en árbol guiada por un plan de tempo. Adivina tu mazo por las cartas jugadas.
ai.gambler.description=Juega como el Catedrático. Adivina tu mazo por las cartas jugadas.
ai.lecturer.description=Búsqueda Monte-Carlo sobre muchas partidas al azar. Adivina tu mazo por las cartas jugadas.
ai.oracle.description=Juega cada jugada hasta el final con un jugador rápido. Adivina tu mazo por las cartas jugadas.
ai.diviner.description=Las simulaciones del Oráculo sobre varias versiones supuestas de tu mazo. Se cubre entre ellas.
