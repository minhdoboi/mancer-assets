wind.BallLightning.description=Inflige 7 de daño al oponente, permite usar una carta adicional este turno.
wind.Squall.name=Turbonada
wind.Squall.description=Permite usar dos cartas adicionales este turno e inflige 1 de daño a todos los enemigos
wind.EnergeticVortex.name=Vórtice energético
wind.EnergeticVortex.description=Aumenta en un 50% el daño del próximo hechizo del jugador y transfiere 2 de mana de [#2] del oponente al jugador.
