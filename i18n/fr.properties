campaign.restart=Recommencer
campaign.restart.confirm=Effacer toute la progression de la campagne et recommencer ?
campaign.restart.choice=Recommencer toute la campagne, ou seulement la nuit ?
campaign.restart.all=Toute la campagne
campaign.restart.night=La nuit seulement
campaign.continue=Continuer
campaign.night.rest.title=Nuit
campaign.night.rest=Vous vous réveillez la nuit dans un lit, dans une maison inconnue.
campaign.night.visit.title=Une voix inconnue
campaign.night.visit=Je vous ai suivi dans la montagne. Vous vous êtes évanoui après avoir quitté Aelwyn, alors ma femme et moi vous avons porté ici.
campaign.night.meal.title=Un repas chaud
campaign.night.meal=Asseyez-vous sur le linge et mangez quelque chose. Ensuite, vous pourrez explorer le pays de nuit si vous le souhaitez.
campaign.night.out.title=Sous les étoiles
campaign.night.out=Vos forces reviennent lentement. Vous remerciez vos hôtes et sortez, curieux de l'odeur de la campagne la nuit, des bruits du monde nocturne.
campaign.next=Suivant
campaign.antimancer.wake.title=Loin dans les terres
campaign.antimancer.wake=Après l'antimancien, vous avez perdu connaissance et vous vous réveillez loin dans les terres.
button.yes=Oui
campaign.entomologist.message=Les bois sont cléments aujourd'hui. Marchez un peu avec moi : mes petits adoreraient une partie tranquille.
campaign.farmer.message=Vous pourrez trouver des pièges sur les routes. Ne vous attardez pas. Trouvez votre propre chemin pour découvrir ce beau pays.
campaign.duckwoman.message=La ville déborde de monde ces jours-ci. Ouvrez l'œil : avec un peu de chance, vous rencontrerez un mage qui s'y connaît vraiment en magie. Ou prenez les chemins plus calmes et évitez la foule.
campaign.duckwoman.choice.go_city=Aller en ville
campaign.duckwoman.choice.avoid_city=Éviter la ville
campaign.ram.message=Peu de gens grimpent ces montagnes. Attention où vous mettez les pieds : certaines pentes sont glissantes.
campaign.rabbit.message=On dit qu'il y a de puissants magiciens dans les montagnes. Si vous les trouvez, ils pourraient vous apprendre quelques tours.
campaign.beaver.message=Vous traversez une forêt singulière. Il y a quelque chose de magique ici. Le sentez-vous ?
campaign.otter.message=Le marais peut être traître si vous n'y êtes pas habitué. Ici, le temps s'écoule étrangement.
campaign.elder.message=La nuit, certains mages abusent de leur pouvoir et le développent sans aucune retenue. Soyez prudent sur cette route.
campaign.fishman.message=Je dors mal, en sachant que les machines tournent toute la nuit. Elles vont jusqu'à tourner dans ma tête.
campaign.fisherman.message=Ici, certains se sont perdus à ne chercher qu'à rivaliser avec le pire.
campaign.deer.message=Demandez-vous pourquoi vous cherchez à affronter ces mages puissants, et ce que vous laissez derrière vous.
campaign.girl.message=Quand je me promène la nuit, j'entends des bruits effrayants qui viennent de la montagne. Vous pouvez grimper dans leur direction, ou descendre dans la vallée.
campaign.girl.choice.to_mountain=Continuer vers la montagne
campaign.girl.choice.to_valley=Descendre dans la vallée
campaign.patou.message=Vous voilà loin de votre source. J'espère qu'il vous reste assez d'énergie.
campaign.catboy.message=Par des nuits comme celle-ci, on risque de se perdre. J'ai peur de rentrer chez les miens : certains sont devenus de puissants mages. Est-ce que vous m'emmèneriez en ville, ou allez-vous continuer dans les terres ?
campaign.catboy.choice.bring_city=L'emmener en ville
campaign.catboy.choice.stay_land=Continuer dans les terres
campaign.panther.message=La nuit, la lumière peut être aussi dangereuse que les ombres. Vous pouvez oublier l'obscurité.
campaign.crowd.message=Le garçon a disparu dans la foule. Vous vous demandez ce que les gens crient, et suivez leur direction.
campaign.gardener.message=J'ai un potager ici, mais les pommes de terre ne poussent plus depuis des années. Je n'ai aucune idée de pourquoi...
campaign.seasons.message=Beau temps pour une partie. Voyons lequel de nous deux cette année favorise.
campaign.disciples.message=Oh ! J'espère ne pas vous avoir effrayé. Vous vous êtes perdu ? Je peux vous dire que ce n'est pas le cas. Si vous pouviez me laisser peser votre âme.
campaign.dudes.message=Belle balade jusqu'ici. Dommage qu'elle finisse dans la poussière. Tâche de ne pas pleurer quand je te ferai tomber.
campaign.mountainking.message=Les pierres se souviennent de chaque intrus. Approchez : j'imprimerai votre nom dans la falaise.
campaign.spiritshaman.message=Les esprits de cette crête me doivent une faveur. Voyons à qui ils répondront quand les tambours résonneront ?
campaign.shaman.message=C'est ici que commence la montagne. Les morts savent déjà lequel de nous redescendra.
campaign.wind.message=Je vais vous arracher le souffle et éparpiller le reste sur ces rochers.
campaign.antimancer.message=Le soleil a disparu, et la courtoisie avec lui. Pourtant, je jouerai, une fois.
campaign.warp.message=Vous semblez plus mince sous cette lumière. Un seul coup sec et vous allez vous défaire.
campaign.rogue.message=Encore un touriste. Videz vos poches ou videz vous de votre vie : je n'ai pas encore décidé.
campaign.faerie_druid.message=Les arbres se souviennent d'invités plus aimables. Ils ne vous pleureront pas.
campaign.vampires.message=Votre pouls est une cloche de dîner. Asseyez-vous. Je préfère quand mon repas bavarde.
campaign.darkpriest.message=À genoux. Si vous ne voulez pas prier, j'écrirai votre dernier hymne avec du sang.
campaign.zen.message=Vous semblez perdu. Réveillez-vous ! Vous vous imaginez peut-être qu'il s'agit d'une leçon. C'est une fin. Taisez-vous et perdez.
campaign.darksider.message=Je déferai le chemin que vous avez tracé. Il ne reste aucun village où fuir.
campaign.highpriest.message=Le sommet n'accueille aucun pèlerin. Je vous briserai et bénirai les morceaux.
campaign.end.win.title=Victoire
campaign.end.lose.title=Défaite
campaign.end.map=Carte
campaign.end.replay=Revanche
campaign.end.win=La route s'ouvre. Je me souviendrai de ce duel.
campaign.end.lose=Voilà ce qui a fait la différence. Reprenez-vous et réessayez.
campaign.end.summoner.win=Vous m'avez chassé du plateau en un éclair. Je n'ai même pas lancé mon essaim : bien joué.
campaign.end.summoner.lose=J'avais dit à mes petits que vous seriez à court de réponses. Venez, rejouons.
campaign.end.strategist.win=Une ligne plus propre que la mienne. J'avais prévu trois de vos coups et vous avez joué le quatrième.
campaign.end.strategist.lose=J'ai lu votre tempo deux tours avant vous. Mélangez et cachez-le mieux.
campaign.end.gambler.win=Ha ! Vous avez déjoué mon bluff avec une meilleure main. La montagne prend mon pari : passez.
campaign.end.gambler.lose=Les dés ont tourné en ma faveur, ami. Quitte ou double ? Les pierres attendent.
campaign.end.lecturer.win=Noté. Votre thèse tient ; la mienne doit être révisée. Le plateau est à vous.
campaign.end.lecturer.lose=Une réfutation prévisible. Revoyez votre ouverture, puis demandez un nouvel examen.
campaign.end.oracle.win=Les fils m'ont menti. Passez : la vision qui vous suit est plus claire que celle où vous gisiez dans la poussière.
campaign.end.oracle.lose=J'ai vu cette fin avant que vous ne piochiez. Les arbres, la cloche, l'hymne : tout rime. Essayez de me surprendre.
campaign.end.diviner.win=Alors. Le sommet tolère un pèlerin après tout. Montez, et soyez plus bienveillant que moi.
campaign.end.diviner.lose=Le sommet ne tolère pas encore de pèlerins. Réparez votre deck, apaisez votre cœur, et remontez.
campaign.entomologist.win=Mes petits sont fatigués, moi aussi. Passez doucement : les bois se souviendront de vous avec bonté.
campaign.entomologist.lose=Là, là. Les bois sont toujours cléments et mes petits ont aimé votre partie. Reposez-vous, puis rejouez contre moi.
campaign.seasons.win=Ainsi cette année vous a favorisé. Beau temps pour votre marche : profitez-en bien.
campaign.seasons.lose=Cette année m'a favorisé, comme je l'avais dit. Revenez quand la saison changera.
campaign.disciples.win=Malin en effet : une preuve avant que le renouveau ne tourne mal. Acceptez ma bénédiction, ainsi que ma défaite.
campaign.disciples.lose=L'intelligence ne suffit pas encore. Le renouveau tourne mal, comme promis : priez, étudiez, puis revenez.
campaign.dudes.win=Hah, tu m'as jeté dans ma propre poussière. Pas de larmes, je le jure. Tu as mérité la route, pit-fighter.
campaign.dudes.lose=Je t'avais dit que ça finissait dans la poussière. Essuie tes yeux, relève-toi et exige ta revanche.
campaign.mountainking.win=Les pierres se souviendront de VOUS, pas de moi. J'ai parié avec la falaise et je suis tombé : montez.
campaign.mountainking.lose=Votre nom est sur la falaise maintenant, sous une douzaine d'autres. Les pierres gardent leur pari : réessayer ?
campaign.spiritshaman.lose=Les esprits m'ont répondu, comme toujours. Reposez-vous près du feu, puis battez à nouveau le tambour.
campaign.spiritshaman.win=Les tambours se sont tus pour moi. Les esprits vous ont répondu : allez, le vent vous attend.
campaign.wind.win=Mon souffle est épuisé, le vôtre tient. Une thèse solide, bien défendue. Le pic est ouvert.
campaign.wind.lose=Éparpillé, comme promis. Reprenez votre souffle et vos cartes, puis affrontez de nouveau le vent.
campaign.antimancer.win=Une partie, et vous l'avez prise. La courtoisie revient avec l'aube : partez, avant que je change mon programme.
campaign.antimancer.lose=Une fois suffisait, comme je l'ai dit. L'ombre ne vous accorde pas sa courtoisie, mais je vous accorderai une partie de plus.
campaign.warp.win=Vous avez tenu bon là où j'ai tiré le plus fort. Un nœud a cédé : mon analyse, tout comme la route, sont à vous.
campaign.warp.lose=Vous vous êtes disloqué quand j'ai tiré, exactement. Laissez-moi vous recomposer pour que je vous examine de nouveau.
campaign.rogue.win=Poches ET vie : gardez les deux, touriste. Vous avez payé la leçon en entier.
campaign.rogue.lose=J'ai décidé : les poches. Videz-les, apprenez la rue, et venez racheter votre leçon.
campaign.faerie_druid.win=Les arbres se souviendront d'un invité plus aimable : vous. Passez doucement sous leurs branches.
campaign.faerie_druid.lose=Les arbres ne vous pleurent pas, comme je l'avais prévenu. Devenez plus sage et revenez dans ce bosquet.
campaign.soulbinder.message=Le bosquet sacré garde ce qui glisse entre les mondes. Je lierai ce que vous ne savez pas retenir.
campaign.soulbinder.win=Votre âme est restée la vôtre. Continuez - la nuit a encore des dents.
campaign.soulbinder.lose=Liée, comme la nuit l'exige. Libérez vous, puis affrontez-moi encore.
campaign.vampires.win=Le repas mord en retour. Ma cloche sonne creux : buvez l'air de la nuit et partez, votre langue avec.
campaign.vampires.lose=Votre pouls était une belle cloche de dîner, et vous parliez si bien. La faim revient : voulez vous vous rasseoir ?
campaign.darkpriest.win=Vous ne vouliez pas vous agenouiller, et aucun hymne n'est écrit. Les ténèbres vous libèrent : marchez sans entraves.
campaign.darkpriest.lose=Votre dernier hymne est écrit, en rouge comme promis. Priez pour qu'il scande mieux la prochaine fois : vous agenouiller encore ?
campaign.zen.win=La fin vous a refusé. Parlez donc : la leçon est à vous maintenant, pas à moi.
campaign.zen.lose=Silencieux, et perdu, comme demandé. Quand vous trouverez votre voix, j'entendrai votre revanche.
campaign.shaman.win=Les morts se sont trompés : VOUS redescendez. La montagne vous ouvre son pari.
campaign.shaman.lose=Les morts savaient, comme je l'ai dit. Ils gardent vos os au chaud : venez les reprendre.
campaign.darksider.win=Le chemin tient après tout. Votre village est debout : courez chez vous dire que la voie reste ouverte.
campaign.darksider.lose=Le chemin derrière vous est défait. Pas de village, pas de retraite : seulement une revanche en avant.
campaign.highpriest.win=Le sommet garde enfin un pèlerin. Je suis brisé et béni à la fois : montez, gardien du pic.
campaign.highpriest.lose=Brisé, comme promis : laissez-moi bénir les morceaux. Réparez-vous et remontez.
campaign.tinker.message=Les engrenages tournent, touriste, et ma patience aussi. Voyons comment vous tenez sous la charge.
campaign.tinker.win=Grippé. Ma machine, pas la vôtre : prenez la route, et gare aux étincelles.
campaign.tinker.lose=Démonté pour les pièces. Revenez avec de meilleures tolérances.
campaign.battlemage.message=Acier et sceau, réunis. Vous constaterez qu'il est difficile de me cerner et plus difficile encore de m'arrêter.
campaign.battlemage.win=Paré, puis brisé. Soit : le terrain est à vous.
campaign.battlemage.lose=Lame et sort, comme promis. Travaillez vos formes et revenez.
campaign.snowblood.message=Le froid garde ce qu'il prend. Approchez, je vous montrerai à quel point un cœur peut se taire.
campaign.snowblood.win=Vous avez gardé votre chaleur. Rare. Partez avant que la neige ne change d'avis.
campaign.snowblood.lose=Gelé sur place. Le dégel viendra, et peut-être vous aussi.
campaign.shadowmage.message=Votre ombre vous a déjà quitté. Je suis juste là pour ramasser le reste.
campaign.shadowmage.win=Les ombres ont perdu leur emprise. Avancez, tant que vous en projetez une.
campaign.shadowmage.lose=Englouti tout entier. Revenez quand vous aurez retrouvé votre ombre.
campaign.shadowcaster.message=La lumière est un prêt, et je viens réclamer le votre. Ne bougez pas : ce sera rapide.
campaign.shadowcaster.win=Les ténèbres reculent devant vous. Je ne m'y attendais pas.
campaign.shadowcaster.lose=Rejeté, comme l'ombre l'avait prédit. Cherchez la lumière et revenez.
campaign.soulreaper.message=Chaque âme a son jour de moisson. La vôtre est une belle récolte tardive.
campaign.soulreaper.win=Ma faux s'est émoussée sur vous. Allez : la moisson peut attendre.
campaign.soulreaper.lose=Moissonné net. Votre âme se conservera jusqu'à votre retour.
campaign.conjurer.message=Choisissez une carte, n'importe laquelle : elles sont toutes à moi, et elles vous détestent.
campaign.conjurer.win=Un tour que je n'avais pas prévu. Prenez donc la scène.
campaign.conjurer.lose=Le rideau tombe sur vous. Exercez votre adresse et revenez.
campaign.chronomaster.message=Votre temps est compté.
campaign.chronomaster.win=Il reste quelques grains. Dépensez-les avant que je retourne le sablier.
campaign.chronomaster.lose=Compté, et dépensé. Revenez s'il reste encore du sable.
campaign.limbo.message=Ni jour ni nuit, ni gagné ni perdu. C'est ici que toutes les routes attendent.
campaign.limbo.win=Vous sortez de l'entre-deux. Peu y parviennent. Le sommet vous appelle.
campaign.limbo.lose=Retenu dans l'entre-deux. Restez un moment, puis réessayez.
campaign.meteomancer.message=Le ciel m'a dit que vous veniez. Il m'a aussi dit comment cela finit : par la pluie.
campaign.meteomancer.win=Même les prévisions peuvent se tromper. Prenez la route dégagée, voyageur.
campaign.meteomancer.lose=De la pluie, comme le ciel l'avait prédit. Séchez-vous, puis revenez pour un second front.
campaign.emotion.message=Ah, un autre cœur sur la route. Montrez-moi ce que vous ressentez : le plateau me dira le reste.
campaign.emotion.win=Votre cœur est resté stable. Avancez, et laissez-le vous guider.
campaign.emotion.lose=Chaque émotion a son tour. La vôtre a vacillé ; la mienne non. Revenez quand elle sera stable.
campaign.sower.message=Plantez-vous dans la boue et voyez ce qui pousse. Je suis patient : le marais est patient.
campaign.sower.win=Vous n'avez pas pris racine. Soit : avancez, et gare aux roseaux.
campaign.sower.lose=Enraciné enfin. Le marais garde ce qu'il sème : revenez quand vous aurez germé.
campaign.fairy_knight.message=Halte, voyageur. Ces roseaux sont sous la protection de la Cour des fées. Dégainez, ou cédez.
campaign.fairy_knight.win=Un duel loyal, loyalement perdu. La Cour vous accorde le passage.
campaign.fairy_knight.lose=La lame de la Cour est vive. Entraînez-vous et défiez-moi encore.
campaign.dreamweaver.message=Chut. Vous êtes déjà à moitié endormi, et la montagne vous chante une berceuse.
campaign.dreamweaver.win=Vous vous êtes réveillé avant que le rêve ne se referme. Avancez, rêveur.
campaign.dreamweaver.lose=Dormez bien. Rêvez de meilleures ouvertures et revenez à votre réveil.
campaign.junk.message=Tout a de la valeur. Même vous. Voyons ce que je peux construire avec vos débris.
campaign.junk.win=Hah. Du rebut au trésor : vous avez battu mon tas. Prenez la route.
campaign.junk.lose=À la casse avec vous. Revenez quand vous serez réparé.
campaign.colors.message=Chaque teinte a son caractère. Choisissez une couleur, n'importe laquelle : j'ai la réponse à toutes.
campaign.colors.win=Vous avez percé le spectre. Avancez, brillamment.
campaign.colors.lose=Tout un arc-en-ciel de défaite. Regardez les couleurs et réessayez.
campaign.elementalist.message=J'aime jouer avec mes quatre amis : le feu, l'eau, la terre et l'air. Laissez-les vous jouer un tour.
campaign.elementalist.win=Les éléments se taisent pour vous. Passez, maître.
campaign.elementalist.lose=Les éléments ont parlé. Revenez quand vous pourrez répondre aux quatre.
campaign.powermancer.message=La puissance ne se donne pas, elle se puise. Et je puise la vôtre, maintenant.
campaign.powermancer.win=Ma charge est épuisée, pas la vôtre. La montagne vous est ouverte.
campaign.powermancer.lose=Vidé jusqu'à la dernière étincelle. Rechargez-vous et affrontez-moi encore.
campaign.kinetician.message=Tout bouge. Même vous : droit dans mes mains.
campaign.kinetician.win=Vous avez tenu bon face à la pression. Allez donc.
campaign.kinetician.lose=La dynamique est conforme à la prévision. Arc-boutez-vous et revenez.
campaign.quantumancer.message=Je suis à la fois battu et invaincu tant que vous ne regardez pas. Regardez bien.
campaign.quantumancer.win=L'onde s'est effondrée en votre faveur. Montez.
campaign.quantumancer.lose=L'onde s'est effondrée contre vous. Observez, ajustez et relancez l'expérience.

fire=Feu
fire.goblin=Gobelin
fire.goblin.description=Chaque tour, inflige 2 dégâts aux cartes adjacentes du joueur
fire.wall=Mur de flammes
fire.wall.description=Inflige 5 dégâts aux créatures adverses à l'invocation
fire.monk=Moine du feu
fire.monk.description=Chaque tour, augmente de 1 la croissance de mana de feu
fire.drake=Drake
fire.drake.description=Attaque dès le tour de son invocation
fire.orc=Chef orc
fire.orc.description=Augmente de 2 l'attaque de la carte adjacente
fire.wave=Vague de flammes
fire.wave.description=Inflige 9 dégâts aux créatures adverses
fire.bull=Commandant taureau
fire.bull.description=Augmente de 1 l'attaque des cartes du joueur
fire.blargl=Blargl
fire.blargl.description=Inflige 4 dégâts à chaque créature à l'invocation
fire.inferno=Inferno
fire.inferno.description=Inflige 18 dégâts à la cible et 10 aux autres créatures adverses
fire.elemental=Élémentaire de feu
fire.elemental.description=L'élémentaire de feu inflige 3 dégâts aux créatures adverses à l'invocation
fire.apocalypse=Apocalypse
fire.apocalypse.description=Inflige 8 + mana de feu [{0}] dégâts à une créature et à l'adversaire
fire.dragon=Dragon
fire.dragon.description=Augmente de 50 % les dégâts des sorts

water=Eau
water.meditate=Méditation
water.meditate.description=Augmente de 1 le mana normal
water.sprite=lutin des mers
water.sprite.description=Chaque tour, inflige 2 dégâts au joueur
water.apostate=Apostat sirénide
water.apostate.description=Donne 2 mana de feu à l'invocation
water.golem=Golem de glace
water.golem.description=Immunisé aux sorts et capacités
water.elder=Ancien sirénide
water.elder.description=Augmente de 1 la croissance de mana d'air
water.guard=Garde de glace
water.guard.description=Divise par deux les dégâts subis par le joueur
water.turtle=Tortue géante
water.turtle.description=Absorbe 5 dégâts
water.shower=Pluie acide
water.shower.description=Inflige 15 dégâts à toutes les créatures et réduit de 1 le mana de l'adversaire
water.lord=Seigneur des mers
water.lord.description=Les cartes adjacentes attaquent dès le tour de leur invocation
water.elemental=Élémentaire d'eau
water.elemental.description=Soigne le joueur de 10 à l'invocation
water.mind=Maître de l'esprit
water.mind.description=Augmente de 1 la croissance de mana
water.astral=Garde astral
water.astral.description=Réduit de 1 la croissance de mana

air=Air
air.fairy=Novice féerique
air.fairy.description=Augmente de 1 les dégâts des sorts
air.griffin=Griffon
air.griffin.description=Si mana d'air >= 5, inflige 5 dégâts à l'adversaire à l'invocation
air.call=Appel du tonnerre
air.call.description=Inflige 6 dégâts à la créature ciblée et à l'adversaire
air.medic=Médecin de l'air
air.medic.description=À l'invocation, soigne le joueur du montant de mana de terre (limité à 10)
air.fence=Clôture d'éclairs
air.fence.description=Chaque tour, inflige 4 dégâts à l'adversaire
air.lightnin=Foudre
air.lightnin.description=Inflige (5 + puissance d'air)[{0}] dégâts à l'adversaire
air.phoenix=Phénix
air.phoenix.description=Peut renaître si mana de feu >= 10
air.chain=Éclair en chaîne
air.chain.description=Inflige 9 dégâts à l'adversaire et à ses créatures
air.cloud=Nuage
air.cloud.description=Attaque toutes les créatures adverses
air.twister=Tornade
air.twister.description=Détruit la cible
air.elemental=Élémentaire d'air
air.elemental.description=L'élémentaire d'air inflige 8 dégâts à l'adversaire à l'invocation
air.titan=Titan
air.titan.description=Inflige 15 dégâts à la créature opposée à l'invocation



earth=Terre
earth.elven=Elfe
earth.elven.description=Soigne le joueur de 3 chaque tour
earth.care=Soins de la nature
earth.care.description=soigne la cible et le joueur de 8
earth.sprite=Lutin des forêts
earth.sprite.description=attaque toutes les créatures adverses
earth.therapy=Thérapie végétale
earth.therapy.description=soigne de 2 * mana de terre [{0}]
earth.hermit=ermite des bois
earth.hermit.description=Augmente de 2 la croissance de mana de terre
earth.fury=Furie
earth.fury.description=Inflige à l'adversaire la somme des attaques des 2 créatures les plus fortes du joueur[{0}]
earth.hugespider=Araignée géante
earth.hugespider.description=Fait apparaître 2 araignées des forêts autour d'elle
earth.forestspider=araignée des forêts
earth.troll=Troll
earth.troll.description=Chaque tour, se soigne de 4
earth.shower=Pluie de pierres
earth.shower.description=Inflige 25 dégâts à une créature au choix
earth.elemental=Élémentaire de terre
earth.healer=Maître guérisseur
earth.healer.description=Chaque tour, soigne de 3 le joueur et ses créatures
earth.hydra=Hydre
earth.hydra.description=Attaque toutes les créatures adverses

darkpriest=Prêtre noir
darkpriest.description=Capacité spéciale de classe - âme en peine : au début de la partie, une créature du même nom 3/11 (si elle meurt, renaît à la fin du tour adverse et donne 2 mana spécial au prêtre noir) apparaît du côté adverse.
darkpriest.RestlessSoul.name=Âme en peine
darkpriest.RestlessSoul.description=Si elle meurt, renaît à la fin du tour adverse et donne 2 mana spécial au prêtre noir.
darkpriest.Ghost.name=Fantôme
darkpriest.Ghost.description=S'il est tué par un sort ou une capacité de créature, renaît et change de camp.\nÀ son arrivée, soigne le joueur de 1 vie par créature qu'il a sur le plateau.
darkpriest.Occultist.name=Occultiste
darkpriest.Occultist.description=À son arrivée, invoque une ombre de prêtre dans l'emplacement opposé.
darkpriest.BlackMass.name=Messe noire
darkpriest.BlackMass.description=Sacrifie la créature ciblée et inflige 4X dégâts à toutes les créatures ennemies (X - nombre d'éléments différents auxquels appartiennent les créatures ennemies).
darkpriest.EnergyVampire.name=Vampire d'énergie
darkpriest.EnergyVampire.description=Chaque tour, donne au joueur 1 mana par voisin (élément du mana = élément du voisin).
darkpriest.BlackMonk.name=Moine noir
darkpriest.BlackMonk.description=Quand il reçoit des dégâts, soigne le joueur du même montant.
darkpriest.Betrayer.name=Traître
darkpriest.Betrayer.description=Ne peut être invoqué que sur une créature ennemie qui meurt. Chaque tour, s'inflige 4 dégâts, ainsi qu'au joueur et aux voisins.
darkpriest.DarkHydra.name=Hydre noire
darkpriest.DarkHydra.description=Quand elle attaque, blesse l'adversaire et toutes ses créatures. Après l'attaque, augmente définitivement son attaque de 1 et soigne le joueur de X vie (X 
darkpriest.Missionary.name=Missionnaire
darkpriest.Missionary.description=À son arrivée, la créature alliée la plus faible et la créature ennemie la plus faible du même élément perdent la moitié de leur vie actuelle. Quand le joueur invoque une créature élémentaire, la transforme en hérétique 6/20 (sans capacité spéciale). Quand le joueur invoque une créature spéciale, se transforme en ange noir 8/25 (quand il tue une créature, se soigne complètement).
darkpriest.Heretic.name=Hérétique
darkpriest.BlackAngel.name=Ange noir
darkpriest.BlackAngel.description=Quand il tue une créature, se soigne complètement
darkpriest.ShadowOfPriest.name=Ombre de prêtre
darkpriest.ShadowOfPriest.description=Chaque tour, soigne de 1 vie le prêtre noir et toutes ses créatures

antimancer=Antimancien
antimancer.0.name=Foule en colère
antimancer.2.name=Prêtre miroir
antimancer.2.description=Chaque fois que l'adversaire joue une carte, gagne 1 puissance du type de cette carte. Si l'adversaire a joué une carte spéciale, gagne 1 Vengeance.
antimancer.3.name=Résistance
antimancer.3.description=Place une Foule en colère 3/9 dans chacun de vos emplacements non bloqués.
antimancer.4.name=Représailles
antimancer.4.description=Chaque fois que le Représailleur perd de la vie, il inflige autant de dégâts à toutes les créatures adverses.
antimancer.5.name=Martyr
antimancer.5.description=Tant que le Martyr est en jeu, toutes vos autres cartes qui meurent ou sont détruites par un sort renaissent.
antimancer.6.name=Moissonneur
antimancer.6.description=Chaque fois qu'une créature du joueur meurt, le Moissonneur augmente au hasard de 1 la puissance de feu, d'eau, d'air ou de terre du joueur.
antimancer.7.name=Poupée vaudou
antimancer.7.description=Au début du tour de son joueur, la Poupée vaudou draine 1 vie à chaque carte adverse.
antimancer.8.name=Bombardier
antimancer.8.description=Quand le Bombardier inflige des dégâts à l'adversaire, il inflige les mêmes dégâts à toutes les cartes adverses. Quand le Bombardier meurt, il inflige 28 dégâts à la carte de l'emplacement opposé.
antimancer.9.name=Corruption
antimancer.9.description=Détruit une carte adverse ciblée de coût 7 ou moins. Cette carte réapparaît dans un emplacement vide aléatoire du joueur avec sa vie maximale.

colors=Couleurs
colors.description=Chaque couleur a un coût minimal. Quand une carte spéciale est invoquée, tout le mana spécial est dépensé pour elle. La quantité de mana influe sur les capacités des couleurs (X). Une seule couleur de chaque type peut être présente sur le plateau.
colors.Discoloration.name=Décoloration
colors.Discoloration.description=Détruit la couleur choisie du joueur, donne une action supplémentaire.
colors.Amber.name=Ambre
colors.Amber.description=Quand elle est tuée, répartit 2X mana également entre les deux plus hautes puissances du joueur.
colors.Violet.name=Violet
colors.Violet.description=Réduit définitivement de 1 le coût des cartes du joueur de coût 2X et moins. Les dégâts des sorts ennemis sont réduits de 3 tant que Violet reste sur le plateau.
colors.Azure.name=Azur
colors.Azure.description=Tant qu'Azur reste sur le plateau, les créatures du joueur de coût X, X+1, X-1 ne reçoivent aucun dégât des sorts et capacités de créatures mais reçoivent 4 dégâts chaque tour.
colors.Silver.name=Argent
colors.Silver.description=Soigne les créatures du joueur de X-1 vie chaque tour. Réduit de 1 la croissance de puissance des Couleurs si X 
colors.Emerald.name=Émeraude
colors.Emerald.description=Réduit de X-3 les dégâts subis par le joueur. Le coût de toutes les cartes de Couleurs est augmenté de X tant qu'Émeraude reste sur le plateau.
colors.Crimson.name=Pourpre
colors.Crimson.description=Augmente de X les dégâts infligés aux deux joueurs par les créatures.
colors.Gold.name=Or
colors.Gold.description=Meurt à la place de la créature tuée à sa gauche


wind=Vent
wind.description=Maître du vent
wind.WingedWarrior.name=Guerrier ailé
wind.WingedWarrior.description=La prochaine créature invoquée attaquera dès le tour de son invocation.
wind.Simoom.name=Simoun
wind.Simoom.description=Étourdit la créature élémentaire ciblée, donne X mana. X 
wind.BallLightning.name=Foudre en boule
wind.BallLightning.description=Inflige 7 dégâts à l'adversaire, permet de jouer une carte supplémentaire ce tour.
wind.Squall.name=Bourrasque
wind.Squall.description=Permet de jouer deux cartes supplémentaires ce tour et inflige 1 dégât à tous les ennemis
wind.EnergeticVortex.name=Vortex énergique
wind.EnergeticVortex.description=Augmente de 50 % les dégâts du prochain sort du joueur et transfère 2 mana d'air de l'adversaire au joueur.
wind.TheSpiritOfThunderstorm.name=L'esprit de l'orage
wind.TheSpiritOfThunderstorm.description=Donne 1 mana spécial par tour. Inflige 3 dégâts à tous les ennemis quand le joueur passe son tour.
wind.Whirlwind.name=Tourbillon
wind.Whirlwind.description=Détruit la créature ciblée et celle d'en face, permet de jouer une carte supplémentaire ce tour.
wind.EternalStorm.name=Tempête éternelle
wind.EternalStorm.description=Ce tour, toutes les créatures alliées attaquent directement l'adversaire.

mountainking=Roi de la montagne
mountainking.description=Hird : tant qu'un nain se tient à côté d'un autre nain, il obtient une seconde capacité
mountainking.DwarvenSoldier.name=Soldat nain
mountainking.DwarvenSoldier.description=À son arrivée, augmente de 3 l'attaque des voisins pour 1 tour. Hird : réduit de 1 l'attaque de la créature opposée par soldat nain sur le plateau.
mountainking.DwarvenShieldman.name=Bouclier nain
mountainking.DwarvenShieldman.description=Redirige vers lui la moitié des dégâts infligés aux voisins. Hird : ne peut être tué par magie (il restera au moins 1 PV).
mountainking.DwarvenСrossbowman.name=Arbalétrier nain
mountainking.DwarvenСrossbowman.description=Quand il attaque, inflige les mêmes dégâts directement à l'adversaire. Hird : attaque instantanément juste avant de mourir.
mountainking.ArmourcladDwarf.name=Nain cuirassé
mountainking.ArmourcladDwarf.description=Réduit de X les dégâts non magiques qu'il reçoit (X = différence de niveau avec la créature opposée). Hird : sa capacité s'applique aussi aux voisins.
mountainking.Runesmith.name=Forgerune
mountainking.Runesmith.description=Le Forgerune ne peut être blessé que par la créature opposée quand il est bloqué. Hird : +1 attaque par nain en jeu (lui compris).
mountainking.Ballista.name=Baliste
mountainking.Ballista.description=Quand une créature ennemie arrive, réduit sa vie de moitié et perd 10 vie. Hird : ne perd que 7 vie à l'activation.
mountainking.Berserker.name=Berserker
mountainking.Berserker.description=Quand le joueur reçoit plus de 5 dégâts, attaque instantanément l'emplacement opposé. Hird : +3 attaque et dégâts infligés au berserker.
mountainking.MountainKingCard.name=Roi de la montagne
mountainking.MountainKingCard.description=Quand un nain allié arrive, se soigne de 4 et augmente définitivement son attaque de 2. À son arrivée, étourdit la créature adverse la plus forte. Hird : réduit de 1 le coût des cartes de nains.

darksider=Obscuriste
darksider.fallen.name=Mage déchu
darksider.fallen.description=quand il attaque, inflige les mêmes dégâts à toutes les créatures ennemies de l'élément de la créature opposée.
darksider.spider.name=Araignée-loup
darksider.spider.description=quand l'adversaire invoque une carte, inflige à la créature opposée des dégâts égaux au coût de cette carte.
darksider.knight.name=Chevalier noir
darksider.knight.description=ses voisins n'attaquent que l'emplacement opposé au chevalier noir.
darksider.mystic.name=Mystique noir
darksider.mystic.description=l'attaque est égale à la puissance spéciale du joueur. Quand une créature élémentaire alliée meurt, augmente de 1 la puissance spéciale
darksider.faceless.name=Horreur sans visage
darksider.faceless.description=à l'invocation, l'adversaire perd la carte de la créature opposée.
darksider.lake.name=Lac de l'oubli
darksider.lake.description=quand l'adversaire invoque une carte, la bloque jusqu'à la mort du lac.
darksider.warlock.name=Sorcier
darksider.warlock.description=quand l'adversaire lance un sort, le bloque et perd 3X PV (X - coût du sort).
darksider.dragon.name=Dragon noir
darksider.dragon.description=immunisé à tous les sorts et capacités. À son arrivée, étourdit toutes les créatures ennemies

limbo=Limbes
limbo.description=Capacité passive du Gardien des limbes : chaque fois qu'une créature ennemie attaque et tue le GARDIEN DES LIMBES ou ses créatures, leur mort est reportée à la fin du tour du GARDIEN DES LIMBES ; elles sont considérées comme en 'état de limbes'. Les créatures en 'état de limbes' attaquent et bloquent normalement.
limbo.heaven=Gardien du ciel
limbo.heaven.description=chaque fois qu'une autre créature du joueur entre en 'état de limbes', le Gardien du ciel soigne de 2 vie son joueur et chacune de ses créatures.
limbo.hell=Gardien de l'enfer
limbo.hell.description=chaque fois qu'une autre créature du joueur entre en 'état de limbes', le Gardien de l'enfer inflige 2 dégâts à l'adversaire et à chacune de ses créatures.
limbo.wraith=Spectre des limbes
limbo.wraith.description=L'attaque du Spectre des limbes est égale au nombre de créatures du joueur en 'état de limbes' plus 1. Son attaque blesse l'adversaire et chacune de ses créatures.
limbo.tower=Tour des péchés
limbo.tower.description=chaque fois qu'une créature du joueur entre en 'état de limbes', le mana de l'adversaire de la maison de cette créature est réduit de 1 et celui du joueur est augmenté de 1.
limbo.nether=Étreinte infernale
limbo.nether.description=détruit chacune des créatures de son lanceur et elles entrent en 'état de limbes'. Puis inflige 3 dégâts à chaque créature adverse par créature du lanceur en 'état de limbes'.
limbo.adjudicator=Juge des âmes
limbo.adjudicator.description=chaque fois qu'une créature du joueur entre en 'état de limbes', un Gardien du ciel ou de l'enfer (celui que vous avez en main), avec la restriction "ne peut entrer en 'état de limbes'", est invoqué dans un emplacement vide aléatoire adjacent à cette créature.
limbo.redemption=Rédemption
limbo.redemption.description=la créature ciblée du lanceur en 'état de limbes' est réinvoquée avec toute sa vie.
limbo.baron=Baron des limbes
limbo.baron.description=quand un sort ou une capacité blesse et tue le GARDIEN DES LIMBES ou le Baron des limbes, ils entrent en 'état de limbes'. Quand le Baron des limbes entre en 'état de limbes', son attaque double.

dreamweaver=Tisseur de rêves
dreamweaver.wisp=Feu follet éthéré
dreamweaver.wisp.description=Le Feu follet éthéré ne subit aucun dégât des sorts et capacités ennemis. Son attaque augmente de 1 par autre créature du joueur.
dreamweaver.roc=Petit roc
dreamweaver.roc.description=Tant que le Petit roc n'a pas d'opposant, son attaque est divisée par deux (arrondi au supérieur).
dreamweaver.aurora=Aurore
dreamweaver.aurora.description=Toutes les créatures sont soignées de 12 vie et ajoutent 1 mana de leur propre type aux réserves de leur joueur.
dreamweaver.guide=Guide spirituel
dreamweaver.guide.description=À l'invocation du Guide spirituel, toutes les créatures du joueur sont soignées d'un montant égal à la puissance de Rêve du joueur, et le joueur est soigné de 3 vie par créature du joueur.
dreamweaver.sword=Épée vivante
dreamweaver.sword.description=L'Épée vivante gagne 1 attaque par créature voisine. Quand l'Épée vivante attaque, s'il y a des créatures adjacentes à l'emplacement opposé, elle les attaque aussi.
dreamweaver.butterfly=Papillon arc-en-ciel
dreamweaver.butterfly.description=Chaque fois que l'adversaire invoque une créature, le joueur du Papillon arc-en-ciel gagne 3 mana du type de cette créature.  (Toutes les créatures spéciales comptent comme Rêve ici.)
dreamweaver.castle=Château volant
dreamweaver.castle.description=Le Château volant attaque l'adversaire et toutes ses créatures. Le Château volant réduit de 2 les dégâts subis par toutes les autres créatures du joueur.
dreamweaver.mare=Cauchemar
dreamweaver.mare.description=À l'invocation du Cauchemar, il inflige 6 dégâts à chaque créature adverse par emplacement adverse vide. L'attaque du Cauchemar augmente de 1 par autre créature du joueur.

soulbinder=Lieur d'âmes
soulbinder.description=Le Lieur d'âmes commence toujours le duel avec 1 Âme liée en jeu dans un emplacement aléatoire. L'Âme liée n'attaque pas. L'Âme liée ne reçoit aucun dégât des créatures attaquantes, capacités ou sorts. Une créature opposée à l'Âme liée ne l'attaque pas mais attaque directement le joueur comme si l'emplacement était vide. Toute créature peut être invoquée sur une Âme liée ; dans ce cas, l'Âme liée n'est plus en jeu. L'Âme liée ne \"meurt\" ni n'est \"détruite\"
soulbinder.boundsoul=Âme liée
soulbinder.boundsoul.description=N'attaque pas et ne peut être blessée. Une créature opposée à l'Âme liée attaque le joueur comme si cet emplacement était vide. Toute créature peut être invoquée dessus.
soulbinder.tethered=Âme enchaînée
soulbinder.tethered.description=Doit être invoquée sur une Âme liée. Quand l'Âme enchaînée meurt, elle est remplacée par une Âme liée.
soulbinder.summon=Invocation spirituelle
soulbinder.summon.description=Invoque une Âme liée dans l'emplacement vide ciblé et augmente de 1 les puissances de Feu, Eau, Air et Terre du lanceur.
soulbinder.tree= Arbre germe d'âme
soulbinder.tree.description=Doit être invoqué sur une Âme liée. Au début du tour de son joueur, l'Arbre germe d'âme place une Âme liée dans l'un de ses emplacements voisins (de gauche à droite) si cet emplacement n'est pas déjà occupé.
soulbinder.seeker=Chercheur d'âmes
soulbinder.seeker.description=Doit être invoqué sur une Âme liée. À la fin du tour de son joueur, le Chercheur d'âmes se déplace dans un emplacement vide aléatoire et place une Âme liée dans l'emplacement qu'il occupait.
soulbinder.release=Libération spirituelle
soulbinder.release.description=Soigne le lanceur et toutes ses créatures de 3 vie par Âme liée en jeu (les siennes et celles de l'adversaire), puis retire du jeu toutes les Âmes liées (les siennes et celles de l'adversaire) et place 2 Âmes liées dans des emplacements vides aléatoires du joueur.
soulbinder.sheppard=Berger d'âmes
soulbinder.sheppard.description=Doit être invoqué sur une Âme liée. L'attaque du Berger d'âmes augmente de 1 par Âme liée contrôlée par le joueur. Chaque tour, le Berger d'âmes soigne le joueur de 2 vie par Âme liée qu'il contrôle.
soulbinder.priestess= Prêtresse du passage
soulbinder.priestess.description=Doit être invoquée sur une Âme liée. À l'invocation, la Prêtresse du passage soigne le joueur de 2 vie et inflige 2 dégâts à l'adversaire par Âme liée en jeu (les siennes et celles de l'adversaire). Chaque fois qu'une créature du joueur meurt, la Prêtresse du passage place une Âme liée dans un emplacement vide aléatoire du joueur.
soulbinder.dragon= Dragon spirituel
soulbinder.dragon.description=Doit être invoqué sur une Âme liée. À l'invocation, le Dragon spirituel inflige 6 dégâts à l'adversaire et à toutes ses créatures. Chaque tour, le Dragon spirituel se soigne et soigne le joueur de 3 vie par Âme liée contrôlée par le joueur.

faerie=Druide féerique
faerie.twins=Jumeaux féeriques
faerie.twins.description=À l'invocation, soigne de 4 vie ses créatures voisines. À sa mort, soigne de 4 vie ses créatures voisines
faerie.fire=Feu féerique
faerie.fire.description=Inflige 5 dégâts à toutes les créatures ennemies bloquées, étourdit toutes les créatures ennemies non bloquées.
faerie.nightwing=Papillon d'aile-nuit
faerie.nightwing.description=Le Papillon d'aile-nuit réduit de 1 l'attaque de toutes les créatures ennemies.
faerie.ring=Cercle féerique
faerie.ring.description=Le Cercle féerique augmente de 1 la croissance du mana féerique du joueur. Chaque fois que le joueur utilise une carte féerique, augmente de 2 l'attaque du Cercle féerique.
faerie.piper=Joueur de flûte féerique
faerie.piper.description=Le Joueur de flûte féerique soigne de 3 vie ses créatures voisines chaque tour.
faerie.cloud=Nuée de papillons
faerie.cloud.description=Invoque une Troupe de papillons dans tous les emplacements vides du joueur.
faerie.unicorn=Licorne
faerie.unicorn.description=La Licorne attaque dès le tour de son invocation. La Licorne réduit de 1 le coût de toutes les créatures du joueur.
faerie.dragon=Dragon féerique
faerie.dragon.description=À l'invocation, le Dragon féerique soigne de 20 vie toutes les créatures du joueur. Le Dragon féerique augmente de 2 l'attaque de toutes les autres créatures du joueur le tour de son invocation.
faerie.rabble=Troupe de papillons
faerie.rabble.description=Quand la Troupe de papillons meurt, elle soigne le joueur de 4 vie.

entomologist=Entomologiste
entomologist.beetle=Scarabée de feu
entomologist.beetle.description=À l'invocation, le Scarabée de feu inflige 4 dégâts à sa créature opposée. Quand le Scarabée de feu meurt, il augmente de 1 la puissance de feu du joueur.
entomologist.moth=Phalène de poudre toxique
entomologist.moth.description=Chaque tour, la Phalène de poudre toxique inflige 1 dégât à toutes les créatures adverses et à l'adversaire. Quand elle meurt, elle étourdit la créature de l'emplacement opposé.
entomologist.hivemind=Esprit de ruche
entomologist.hivemind.description=Choisissez une créature adverse. Toutes les créatures du lanceur attaquent la créature ciblée au lieu de leur créature opposée ce tour.
entomologist.locust=Essaim de criquets
entomologist.locust.description=Invoque un Essaim de criquets sur une créature adverse ciblée. La créature ciblée subit 8 dégâts chaque tour et l'adversaire subit 4 dégâts chaque tour jusqu'à la mort de la créature ciblée.
entomologist.ant=Fourmi géante
entomologist.ant.description=Tous les dégâts subis par la Fourmi géante sont réduits de 2. La Fourmi géante réduit de 2 le coût des autres Fourmis géantes du joueur tant qu'elle est en jeu.
entomologist.assassin=Guêpe assassine
entomologist.assassin.description=À l'invocation, la Guêpe assassine invoque des Guêpes ouvrières dans ses emplacements adjacents. La Guêpe assassine gagne +2 attaque par Guêpe ouvrière en jeu.
entomologist.hive=Ruche d'insectes
entomologist.hive.description=À la fin de chaque tour du joueur, la Ruche d'insectes invoque un Guerrier insecte dans un emplacement aléatoire du joueur.
entomologist.mantis=Mante rouge
entomologist.mantis.description=À l'invocation, la Mante rouge réduit de 1 toutes les puissances de l'adversaire. La Mante rouge réduit de 1 la croissance de la puissance de l'adversaire du type de sa créature opposée. Quand la Mante rouge meurt, elle inflige 5 dégâts à sa créature opposée.
entomologist.warrior=Guerrier insecte
entomologist.warrior.description=Quand le Guerrier insecte meurt, il augmente de 1 la puissance Insecte/Entomologiste du joueur.
entomologist.drone=Guêpe ouvrière


seasons=Saisons
seasons.description=Passage des saisons : chacune des cartes spéciales du Gardien lui accorde un petit effet passif qui reste actif du début de la partie jusqu'à ce que la carte soit jouée. Épuisement : les cartes spéciales du Gardien ne peuvent être utilisées qu'une fois chacune pendant la partie.
seasons.Nectarbloom.name=Fleur de nectar
seasons.Nectarbloom.description=La Fleur de nectar régénère 2 vie chaque tour.
seasons.AiluvBees.name=Abeilles d'Ailuv
seasons.AiluvBees.description=À l'invocation des Abeilles d'Ailuv, deux Fleurs de nectar 2/10 sont invoquées dans des emplacements vides aléatoires du lanceur. Passif : Repousse : votre croissance de mana augmente de 1 dans chaque maison ayant moins de 2 mana.
seasons.SpiritofEquinox.name=Esprit de l'équinoxe
seasons.SpiritofEquinox.description=À l'invocation, inflige 4 dégâts à l'adversaire et à chacune de ses créatures, et soigne de 4 vie le lanceur et chacune de ses créatures. Passif : Repousse : votre croissance de mana augmente de 1 dans chaque maison ayant moins de 2 mana.
seasons.SolarWave.name=Vague solaire
seasons.SolarWave.description=L'adversaire subit 2 dégâts par emplacement de créature vide. Les créatures adverses subissent des dégâts triplés ce tour. Passif : Soleil de minuit : quand vous subissez 4 dégâts ou plus, ces dégâts sont réduits de 1.
seasons.EternalSummer.name=Été éternel
seasons.EternalSummer.description=Vous pouvez jouer immédiatement une créature et un sort de votre main, dans l'ordre de votre choix.  Les deux coûtent 2 de moins. Passif : Soleil de minuit : quand vous subissez 4 dégâts ou plus, ces dégâts sont réduits de 1.
seasons.Cornucopia.name=Corne d'abondance
seasons.Cornucopia.description=À l'invocation, soigne de 9 vie toutes les autres créatures alliées.  Toutes les autres créatures alliées reçoivent +1 attaque et subissent 1 dégât de moins tant que la Corne d'abondance est sur le plateau. Passif : Plénitude : le coût de vos cartes les plus chères de Feu, Eau, Air et Terre est réduit de 1.
seasons.GaeasAvatar.name=Avatar de Gaïa
seasons.GaeasAvatar.description=L'attaque est égale au nombre de créatures sur le plateau.  L'Avatar de Gaïa n'est affecté par aucun sort mais subit 1 dégât chaque tour par emplacement vide sur le plateau. Passif : Plénitude : le coût de vos cartes les plus chères de Feu, Eau, Air et Terre est réduit de 1.
seasons.BehemothofFrozenTime.name=Béhémoth du temps gelé
seasons.BehemothofFrozenTime.description=À l'invocation, les créatures bloquées de l'adversaire sont étourdies pendant un tour.  Le mana de l'adversaire dans chaque maison ne peut dépasser 9 tant que le Béhémoth du temps gelé est en jeu. Passif : Froid hivernal : les créatures non bloquées de l'adversaire subissent 1 dégât chaque tour.
seasons.TheGreatAurora.name=La Grande Aurore
seasons.TheGreatAurora.description=Les créatures du lanceur sont soignées de 16 vie et donnent chacune 3 mana de leur propre type au lanceur. Passif : Froid hivernal : les créatures non bloquées de l'adversaire subissent 1 dégât chaque tour.

kinetician=Cinéticien
kinetician.magerunner=Mage-coureur
kinetician.magerunner.description=à l'invocation, échange sa place avec la créature alliée ayant la plus forte attaque
kinetician.tricker=Filou
kinetician.tricker.description=chaque tour, se déplace vers l'emplacement non bloqué le plus proche
kinetician.force=Force concentrée
kinetician.force.description=ce tour, toutes les créatures alliées n'attaquent que la créature ciblée avec une attaque augmentée de 1
kinetician.warp=Déformer la réalité
kinetician.warp.description=réduit les PV de la créature ciblée à X (X = son niveau)
kinetician.mage=Mage solitaire
kinetician.mage.description=chaque tour, inflige X dégâts à l'adversaire (X = nombre d'emplacements vides de l'adversaire)
kinetician.call=Appel du plus apte
kinetician.call.description=divise par deux le coût des cartes de l'élément ciblé (chacune pour une seule utilisation)
kinetician.barrier=Barrière de force
kinetician.barrier.description=double les PV actuels et max de la créature alliée ciblée. Elle passe son prochain tour
kinetician.manipulator=Manipulateur
kinetician.manipulator.description=à son arrivée, l'attaque de toutes les créatures ennemies devient égale à 3 pendant 1 tour. Quand l'adversaire invoque une créature, elle change de joueur, le manipulateur perd 4X PV (X = coût de cette créature)

shaman=Chaman
shaman.description=esprit des ancêtres : au début de la partie, un loup fantôme 2/18 (coût 2, sans capacité spéciale) apparaît dans l'emplacement à côté du plus à droite. Si le loup meurt, une carte 1/2 sera remplacée par l'invocation du loup (comme le griffon apprivoisé en campagne)
shaman.ghost=loup fantôme
shaman.hunger=Faim inapaisable
shaman.hunger.description=le loup reçoit +X attaque (X - attaque de la créature ciblée) pendant 1 tour.
shaman.rage=Esprit de rage
shaman.rage.description=à son arrivée, augmente définitivement de 1 l'attaque des voisins.
shaman.moon=Pouvoir de la pleine lune
shaman.moon.description=réduit définitivement de 1 les dégâts subis par le loup et soigne de 8 vie ses voisins et le joueur.
shaman.fury=Fureur fantôme
shaman.fury.description=Inflige 8 dégâts à toutes les créatures ennemies et augmente définitivement l'attaque du loup de 1 par créature morte ce tour.
shaman.protector=Esprit protecteur
shaman.protector.description=tant que le protecteur reste en jeu, tous les dégâts reçus par le joueur sont réduits de 2, et les sorts ennemis soignent le loup au lieu de le blesser.
shaman.hunter=Esprit chasseur
shaman.hunter.description=tant que le chasseur reste en jeu, le loup gagne +2 attaque et se soigne des dégâts infligés quand il attaque.
shaman.shadow=Ombre du loup
shaman.shadow.description=toutes les cartes qui affectent le loup affectent aussi l'ombre du loup. À son arrivée, ses voisins attaquent immédiatement.
shaman.mate=Compagnon fantôme
shaman.mate.description=à son arrivée, réduit définitivement de 1 le coût des cartes du loup et inflige 8 dégâts à l'adversaire. Chaque tour, le loup attaque en plus l'emplacement opposé au compagnon.

vampires=Vampires
vampires.flock=Nuée sombre
vampires.flock.description=déplace la créature du joueur ayant le moins de PV dans l'emplacement ciblé et la rend invulnérable pendant 1 tour si son niveau n'est pas supérieur à 9.
vampires.noctule=Noctule
vampires.noctule.description=quand elle inflige des dégâts à l'adversaire, soigne le joueur du même montant.
vampires.ghoul=Goule
vampires.ghoul.description=si la créature opposée a moins de 11 vie, la tue d'un coup.
vampires.acolyte=Acolyte
vampires.acolyte.description=Quand une créature ennemie reçoit plus de 5 dégâts, lui inflige 4 dégâts supplémentaires.
vampires.ties=Liens du sang
vampires.ties.description=détruit une créature du joueur et augmente définitivement l'attaque de ses voisins de la valeur de son attaque (n'affecte pas les créatures à attaque de masse ni les créatures de niveau supérieur à 9).
vampires.nosferatu=Nosferatu
vampires.nosferatu.description=quand une créature meurt, soigne le joueur de 3 et lui-même de 2.
vampires.aristocrat=Aristocrate
vampires.aristocrat.description=au début du tour, se place dans l'emplacement opposé à la créature adverse ayant le moins de PV (peut échanger sa place avec une créature alliée). Quand il tue une créature, inflige à l'adversaire des dégâts égaux à son attaque.
vampires.mansion=Manoir
vampires.mansion.description=quand une créature non spéciale du joueur meurt, la remplace par un néophyte. À son arrivée, transforme ses voisins en goules.
vampires.neophyte=Néophyte
vampires.neophyte.description=Se soigne de la moitié des dégâts infligés aux ennemis.


fairy=Chevalier féerique
fairy.lesovik=Lesovik
fairy.lesovik.description=bloque la carte de la créature opposée, tant qu'il est en vie.
fairy.kikimora=Kikimora
fairy.kikimora.description=à son arrivée, invoque un vodyanoy dans un emplacement aléatoire.
fairy.vodyanoy=Vodyanoy
fairy.rusalka=Roussalka
fairy.rusalka.description=quand elle tue une créature, l'adversaire perd sa carte.
fairy.likho=Likho
fairy.likho.description=à sa mort, réduit à 10 les PV de la créature qui l'a tué (la tue si elle a moins de 10 PV). S'il est tué par un sort ou une capacité, donne 2 puissances aléatoires au joueur.
fairy.sirin=Sirine
fairy.sirin.description=divise par deux l'attaque de la créature opposée et de ses voisins tant qu'elle est en vie. (l'attaque est arrondie au supérieur)
fairy.alkonost=Alkonost
fairy.alkonost.description=chaque tour, bloque 6 cartes ennemies aléatoires. Ne peut pas bloquer les cartes déjà bloquées le tour précédent
fairy.firebird=Oiseau de feu
fairy.firebird.description=invulnérable à côté d'une créature de feu alliée.
fairy.zmey=Zmey Gorynych
fairy.zmey.description=à sa mort, renaît en gorynych à deux têtes 6/25, puis en gorynych à une tête 3/15. Quand un joueur utilise une carte de feu, inflige 6 dégâts à une créature ennemie aléatoire.
fairy.2head=gorynych à deux têtes
fairy.1head=gorynych à une tête

elementalist=Élémentaliste
elementalist.sylph=Sylphe
elementalist.sylph.description= à son arrivée, permet de jouer une carte spéciale supplémentaire. +1 coût par sylphe sur le plateau.
elementalist.freeze=Gel profond
elementalist.freeze.description=les deux joueurs passent 1 tour et ne peuvent pas utiliser de cartes spéciales à leur prochain tour.
elementalist.salamander=Salamandre
elementalist.salamander.description=si la puissance de feu du joueur est supérieure à celle de l'adversaire, inflige 4 dégâts à l'adversaire au début du tour.
elementalist.avalanche=Avalanche
elementalist.avalanche.description=inflige 2X dégâts aux créatures ennemies (X = puissance de terre du joueur)[{0}], soigne le joueur de 2X vie et réduit sa puissance de terre à 0.
elementalist.incineration=Incinération
elementalist.incineration.description=détruit la créature ennemie la plus forte et la créature alliée la plus faible (selon la vie), sur le plateau comme dans le deck.
elementalist.phoenix=Archi-phénix
elementalist.phoenix.description=chaque tour, régénère un montant de PV égal à la puissance de feu du joueur.
elementalist.golem=Golem de pierre
elementalist.golem.description=+4 attaque quand il est bloqué. Ne reçoit aucun dégât des sorts et capacités de créatures quand il n'est pas bloqué.
elementalist.frost=Foudre de givre
elementalist.frost.description=inflige X dégâts à l'adversaire (X = différence entre sa puissance la plus basse et la puissance la plus haute du joueur) et bloque définitivement l'emplacement ciblé.

reaper=Faucheur d'âmes
reaper.description=Quand une créature sur le terrain meurt, le joueur gagne 1 âme. Pour chaque âme du joueur, tous les dégâts de ses sorts spéciaux augmentent de 1 (1 âme = 1 dégât)
reaper.damnation=Damnation
reaper.damnation.description=Cible une créature et lui inflige 3 dégâts. Si la créature meurt à cause de ce sort, augmente le nombre d'âmes de x, où x est égal au coût de la créature (dégâts max. 8)
reaper.passage=Passage sombre
reaper.passage.description=choisissez 1 créature cible. Cette créature et ses voisines sont soignées de x vie, où x est égal au nombre d'âmes que vous avez (soin max. 12 vie)
reaper.rage=Rage éternelle
reaper.rage.description=choisissez 1 créature cible ; cette créature reste active sur le terrain 2 tours de plus après sa mort

reaper.onslaught=Assaut d'âmes
reaper.onslaught.description=Inflige x dégâts à toutes les créatures adverses, où x est égal au nombre d'âmes que vous avez. Après l'utilisation de ce sort, le joueur ne reçoit pas d'âmes pour les créatures tuées par ce sort et son nombre d'âmes devient 0
reaper.tribute=Tribut
reaper.tribute.description=Choisissez 1 créature du joueur et détruisez-la ; le joueur gagne x vie, où x est égal à la vie de la créature détruite (vie max 36)
reaper.furious=Âmes furieuses
reaper.furious.description=Inflige x+7 dégâts à l'adversaire, où x est égal au nombre d'âmes du joueur. Après l'utilisation de ce sort, le nombre d'âmes est réduit à 0
reaper.sentence=Sentence de mort
reaper.sentence.description=Détruit toutes les créatures sur le terrain. Pour chaque créature détruite, le joueur reçoit 2 âmes au lieu de 1
reaper.shackles=Chaînes d'âme
reaper.shackles.description=La créature ciblée ne peut pas attaquer et sa capacité est annulée. Son emplacement est inutilisable jusqu'à la fin du duel. Chaque tour où la créature piégée reste sur le terrain, le joueur gagne 1 âme. Si le joueur invoque quelque chose en face de cet emplacement après la destruction de la créature adverse, cette créature recevra 6 dégâts chaque tour

sower=Semeur
sower.tangling=Enchevêtrement
sower.tangling.description=transfère X vie de la créature ciblée à la créature opposée (X = attaque de la créature ciblée).
sower.devouring=Dévoration
sower.devouring.description=sacrifie une créature alliée, double l'attaque des autres créatures alliées pendant 1 tour.
sower.monster=Plante monstrueuse
sower.monster.description=quand elle tue une créature, soigne complètement toutes les plantes monstrueuses sur le plateau.
sower.pollination=Pollinisation
sower.pollination.description=transforme la créature ciblée de niveau X en créature spéciale de niveau (X moins 3) avec tous ses PV et soigne le joueur de X vie.
sower.sundew=Drosera sanglante
sower.sundew.description=quand elle inflige des dégâts, régénère autant de PV.
sower.predator=Plante prédatrice
sower.predator.description=quand elle attaque une créature, lui inflige X dégâts supplémentaires (X = différence entre ses PV actuels et max).
sower.drake=Drake des forêts
sower.drake.description=quand le joueur invoque une créature spéciale, en crée une copie dans l'emplacement vide le plus proche.
sower.flower=Fleur ardente
sower.flower.description=chaque tour, divise par deux la vie de la créature ennemie ayant le plus de PV et donne 1 puissance de feu au joueur. À son arrivée, inflige à l'adversaire X dégâts (X = sa puissance de feu)

warp=Distorsion
warp.errant=Errant
warp.errant.description=se cache dans l'ombre après avoir tué une créature, revient quand il est blessé
warp.quake=Tremblement de terre
warp.quake.description=inflige à chaque créature ennemie des dégâts égaux à la différence entre les puissances du joueur et de l'adversaire de son élément
warp.cloak=Manteau
warp.cloak.description=doit être invoqué sur une créature existante, ajoute son attaque et sa vie aux siennes. À l'invocation, donne 2 mana de la créature couverte. À sa mort, restaure cette créature
warp.photographer=Photographe
warp.photographer.description=quand une créature adjacente meurt, elle est remplacée par le Photographe avec les mêmes PV
warp.schizo=Schizo
warp.schizo.description=à l'invocation, la créature opposée perd ses capacités jusqu'à la mort du schizo
warp.ram=Bélier
warp.ram.description=à l'invocation, détruit la créature opposée et donne à son joueur X-3 mana (X = coût de cette créature)
warp.stranger=Étranger
warp.stranger.description=l'attaque est égale à la plus haute puissance ennemie. À l'invocation, copie l'effet de la créature opposée (sauf attaque multiple et effets immédiats)
warp.queen=Reine de la distorsion
warp.queen.description=à l'invocation, inflige 4 dégâts aux créatures ennemies. Elles perdent leurs capacités jusqu'à la fin du prochain tour

disciples=Disciples
disciples.description=Un prisonnier apparaît à la fin du tour du joueur dans un emplacement vide aléatoire du joueur. Quand un prisonnier meurt, le joueur perd 1 mana des 2 plus hautes maisons de base et\ngagne un mana spécial. Quand un disciple a peu de vie (< moitié), sa foi faiblit et il perd 1/3 d'attaque.
disciples.prisoner=Prisonnier
disciples.prisoner.description=À sa mort, fait perdre 1 mana des deux plus hautes maisons de base et gagner 1 mana spécial.
disciples.enraged=Prisonnier enragé
disciples.enraged.description=Immunisé aux sorts et capacités tant que le libérateur est en vie.
disciples.drug=Drogue de vitesse
disciples.drug.description=Ajoute +1 attaque aux créatures du joueur, leur inflige 4 dégâts. L'effet disparaît à la mort du prisonnier.
disciples.preacher=Prêcheur
disciples.preacher.description=En jeu, les cartes normales coûtent 1 mana de plus. Augmente de 1 la croissance du mana spécial. Ajoute 1 attaque au prisonnier
disciples.monk=Moine sombre
disciples.monk.description=Réduit de 2 le mana de feu de l'adversaire et augmente leur coût de 1 tant qu'il est en vie.
disciples.prophet=faux prophète
disciples.prophet.description=Jusqu'à sa mort, les cartes normales coûtent 1 mana de plus. Donne 2 mana à chaque maison de base. Reprend un mana à sa mort
disciples.escape=Fuite astrale
disciples.escape.description=Les dégâts infligés au prisonnier sont redirigés vers la Fuite astrale. Le prisonnier attaque directement l'adversaire
disciples.scarecrow=Épouvantail
disciples.scarecrow.description=Étourdit et inflige 4 dégâts à la créature opposée. Peut échanger sa place avec un prisonnier vers l'emplacement vide le plus proche
disciples.wind=vent d'oppression
disciples.wind.description=Étourdit la créature opposée à l'épouvantail et ses voisines. Leur inflige 4 dégâts
disciples.liberator=Libérateur
disciples.liberator.description=Transforme un prisonnier en Prisonnier enragé. À sa mort, lui inflige {0} dégâts.
disciples.falconer=Fauconnier
disciples.falconer.description=Chaque tour, inflige (distance d'emplacement) dégâts aux créatures adverses.
disciples.madden=Rendre fou
disciples.madden.description=Inflige 8 dégâts à une créature adverse. Soigne de 3 par créature tuée et ajoute 1 attaque à chacun.

junk=Bric-à-brac
junk.screamer=Hurleur
junk.screamer.description=+1 attaque par autre Hurleur en jeu
junk.poison=Fleur empoisonnée
junk.poison.description=Inflige 5 dégâts à la cible du joueur, ainsi qu'aux cartes opposée et adjacentes. Inflige -1 mana au joueur et à la créature opposée.
junk.fortune=Fortune de la casse
junk.fortune.description=Absorbe 4 des premiers dégâts infligés au joueur
junk.chain=Contrôleur de chaîne
junk.chain.description=Engendre un miroir de la créature adjacente de coût <4. Quand une créature adjacente de coût <6 meurt, remplit l'emplacement avec une autre créature faible voisine
junk.assassin=Assassin vagabond
junk.assassin.description=s'il n'est pas bloqué, se déplace vers l'adversaire non bloqué suivant le plus proche (le plus à gauche en cas de choix) et lui inflige 5 dégâts, à la fin du tour.
junk.factory=Robot-usine
junk.factory.description=quand il est invoqué avec une créature de coût < 6 d'un côté et un emplacement vide de l'autre, copie cette créature dans l'emplacement vide. Copie aussi une créature adjacente invoquée de coût < 6 dans l'emplacement vide de l'autre côté (effet d'apparition appliqué)
junk.bot=Robot de recyclage
junk.bot.description=Quand une créature du joueur meurt, elle se soigne de 6 vie, et soigne le joueur de 2 vie par créature perdue.
junk.cyborg=Cyborg de déchets
junk.cyborg.description=à son arrivée, remplit le plateau de déchets 2/11. Chaque tour, 2 déchets s'assemblent dans le cyborg, augmentant sa vie et son attaque de leur vie restante. (peut atteindre 13/85)
junk.trash=Déchet

snowblood=Sang de neige
snowblood.tracker=Pisteur
snowblood.tracker.description=quand une créature est invoquée dans un emplacement adjacent, elle devient invulnérable pendant 1 tour
snowblood.hunter=Chasseur de primes
snowblood.hunter.description=à l'invocation, inflige 2 dégâts à la créature opposée. Quand il tue la créature opposée, donne au joueur 1/3 de son coût en mana (arrondi au supérieur)
snowblood.maiko=Maiko
snowblood.maiko.description=réduit de 1 l'attaque de la créature opposée et de ses voisins tant qu'elle est en vie. Chaque tour, soigne 1 PV aux créatures alliées adjacentes. Après l'invocation, sa carte est remplacée par une lettre de mort (coût 3, 0/3 – réduit à 1 les dégâts reçus et ne peut être soignée. À sa mort, inflige 15 dégâts à la créature opposée)
snowblood.letter=Lettre de mort
snowblood.letter.description=Réduit les dégâts à 1. À sa mort, inflige 15 dégâts à la créature opposée. (Ne peut être soignée)
snowblood.echo=Écho
snowblood.echo.description=déclenche instantanément pour toutes les créatures alliées les effets "chaque tour" && "directs", puis toutes les créatures alliées de Sang de neige attaquent
snowblood.kojiro=Kojiro
snowblood.kojiro.description=peut être invoqué sur n'importe quel emplacement du joueur, occupé ou vide. Attaque à l'invocation, avec +4 attaque ce tour-là. Chaque tour, inflige 2 dégâts à la créature opposée et à tous ses voisins (les voisins sont les emplacements remplis successifs autour d'elle)
snowblood.guide=Guide de guerre
snowblood.guide.description=la prochaine créature invoquée infligera à toutes les créatures ennemies des dégâts égaux à son attaque. Quand une créature spéciale alliée est invoquée, soigne 1 PV à tous ses voisins (les voisins sont les emplacements remplis successifs autour de lui)
snowblood.janus=Janus
snowblood.janus.description=à l'invocation, +1 mana par créature dans les deux autres emplacements de son côté, et soigne le joueur de 2 PV. Chaque tour, inflige 2 dégâts à toutes les créatures du joueur du côté opposé du plateau
snowblood.amaterasu=Amaterasu
snowblood.amaterasu.description=quand le joueur invoque une créature d'élément :\n- feu : Amaterasu inflige 4 dégâts à la créature opposée\n- eau : augmente de 1 la puissance la plus basse\n- air : inflige 2 dégâts à l'adversaire\n- terre : soigne 2 PV au joueur

zen=Zen
zen.elementesist=Élémentiste
zen.elementesist.description=inflige des dégâts à la carte opposée, et à toutes les cartes opposées du même mana.
zen.redlight=Feu rouge
zen.redlight.description=Attaque les emplacements opposé et adjacents
zen.focus=Concentration
zen.focus.description=Gagne 2 mana de la maison de la créature ciblée, et 1 mana de la maison de chaque créature adjacente.
zen.guard=Garde électrique
zen.guard.description=inflige 3 dégâts aux créatures qui blessent le joueur.
zen.dreamer=Rêveur
zen.dreamer.description=Chaque tour, inflige 4 dégâts à la créature adverse la plus faible (la plus à gauche en cas d'égalité).
zen.mimic=Mimique
zen.mimic.description=Au début de votre tour, un cocon apparaît dans un emplacement vide aléatoire. Invoquez-y une créature pour gagner 2 mana de sa maison et 3 vie pour le joueur.
zen.cocoon=Cocon
zen.cocoon.description=Invoquez-y une créature pour gagner 2 mana de sa maison et 3 vie pour le joueur.
zen.fighter=Combattant zen
zen.fighter.description=Si la créature opposée a une attaque plus forte, plus de vie ou un coût plus élevé, gagne chaque tour 1 mana de la maison de cette créature et se soigne de 3 vie. Absorbe 5 dégâts des sorts et capacités. Chaque fois que le joueur est touché, se soigne de 1.
zen.inertia=Inertie
zen.inertia.description=Immunisée aux sorts. Engendre la Matière dans le prochain emplacement vide à droite. À l'invocation et chaque tour, tant que la Matière est en jeu, soigne de 3 la créature la plus faible du joueur.
zen.matter=Matière
zen.matter.description=À l'invocation et chaque tour, tant que l'Inertie est en jeu, inflige 3 dégâts à la créature la plus forte de l'adversaire.

highpriest=Grand prêtre
highpriest.description=Capacité spéciale de classe - voie divine : selon que le niveau total des créatures de feu et de terre du joueur, ou d'eau et d'air, est plus élevé, son tirage spécial devient celui de Rê ou de Seth.
highpriest.Sacredscarab=Scarabée sacré
highpriest.Sacredscarab.description=réduit de 2X les dégâts non magiques qu'il reçoit ; X = nombre de ses voisins.
highpriest.sunpriest=Prêtre du soleil
highpriest.sunpriest.description=quand il attaque, inflige à toutes les créatures ennemies des dégâts égaux à la plus basse puissance du joueur.
highpriest.Apis=Apis
highpriest.Apis.description=chaque tour, donne au joueur 1 puissance spéciale et 3 PV par autre apis sur le plateau.
highpriest.Bennu=Bennu
highpriest.Bennu.description=s'il est tué par une carte ennemie, attaque l'emplacement opposé avec une attaque triplée avant de mourir.
highpriest.EyeofWajet=Œil de Ouadjet
highpriest.EyeofWajet.description=soigne le joueur et ses créatures de 1 PV par carte révélée du joueur et inflige les mêmes dégâts à tous les ennemis.
highpriest.sphinx=Sphinx
highpriest.sphinx.description=À sa mort, laisse une énigme 0/6. Si l'énigme est détruite par une créature ennemie, le sphinx renaît avec la moitié de ses PV. Si l'énigme est détruite par un sort ou une capacité ennemis, l'adversaire perd 3 puissance de son plus haut élément.
highpriest.Ouroboros=Ouroboros
highpriest.Ouroboros.description=au début du tour du joueur, invoque dans l'emplacement vide le plus proche un serpent d'éternité 2/8. À la fin du tour de l'adversaire, le serpent meurt et soigne X PV le joueur et Ouroboros (X = ses PV restants).
highpriest.Wingeddragon=Dragon ailé de Rê
highpriest.Wingeddragon.description=à son arrivée, invoque une pierre solaire 0/22 (augmente de 2 les dégâts des sorts du joueur et augmente de 1 l'attaque de Rê chaque tour) dans l'emplacement vide le plus proche.
highpriest.Ancientcrocodile=Crocodile antique
highpriest.Ancientcrocodile.description=quand il attaque, passe son prochain tour (digestion).
highpriest.Serpopard=Serpopard
highpriest.Serpopard.description=quand le joueur invoque une créature spéciale, se déplace vers l'emplacement non bloqué le plus proche et double son attaque pendant 1 tour.
highpriest.Anubite=Anubite
highpriest.Anubite.description=Quand il tue une créature, invoque dans l'emplacement vide le plus proche une momie gardienne 4/20 sans capacité spéciale.
highpriest.Babi=Babi
highpriest.Babi.description=quand la puissance de l'adversaire augmente, inflige les mêmes dégâts à la créature opposée.
highpriest.Curseofchaos=Malédiction du chaos
highpriest.Curseofchaos.description=Inflige à la créature ciblée et à ses voisines des dégâts égaux à leur attaque totale.
highpriest.Simoom=Simoun
highpriest.Simoom.description=réduit à 2 l'attaque de toutes les créatures ennemies. Elles regagnent 3 attaque par tour à partir du tour suivant.
highpriest.Ammit=Ammit
highpriest.Ammit.description=quand une créature meurt, inflige à son joueur des dégâts égaux à sa puissance de cet élément et donne 1 puissance spéciale au joueur.
highpriest.Apep=Apophis
highpriest.Apep.description=attaque tous les ennemis. Chaque tour, réduit de 1 les puissances élémentaires des deux joueurs.
highpriest.puzzle=énigme
highpriest.puzzle.description=Si l'énigme est détruite par une créature ennemie, le sphinx renaît avec la moitié de ses PV. Si l'énigme est détruite par un sort ou une capacité ennemis, l'adversaire perd 3 puissance de son plus haut élément.
highpriest.guardianmummy=momie gardienne
highpriest.sunstone=pierre solaire
highpriest.sunstone.description=augmente de 2 les dégâts des sorts du joueur et augmente de 1 l'attaque de Rê chaque tour
highpriest.serpent=serpent d'éternité
highpriest.serpent.description=augmente de 2 les dégâts des sorts du joueur et augmente de 1 l'attaque de Rê chaque tour

shadowmage=Mage des ombres
shadowmage.description=Spécialisation : furtivité. Le Mage des ombres tisse une immense protection qui s'estompe : boucliers, silence et lames invisibles qui ne durent qu'un tour.
shadowmage.archer=Archer des ombres
shadowmage.archer.description=À l'invocation, inflige 6 dégâts à l'adversaire. Quand l'Archer des ombres meurt, l'adversaire se soigne de 6 vie.
shadowmage.stalker=Rôdeur d'ombre
shadowmage.stalker.description=La position du Rôdeur d'ombre n'est pas révélée à l'adversaire tant qu'il ne reçoit pas de dégâts.
shadowmage.weaver=Tisseur du voile nocturne
shadowmage.weaver.description=À l'invocation, les créatures voisines ignorent tous les dégâts jusqu'à la fin du prochain tour de l'adversaire.
shadowmage.silencer=Réducteur au silence
shadowmage.silencer.description=À l'invocation, la créature opposée ne peut pas attaquer, et l'adversaire ne peut pas utiliser de cartes de l'élément de cette créature, jusqu'à la fin de son prochain tour.
shadowmage.eclipse=Éclipse
shadowmage.eclipse.description=Augmente de 2 les puissances de Feu, Eau, Air et Terre du lanceur. Le lanceur ignore jusqu'à 30 dégâts jusqu'à la fin du prochain tour de l'adversaire.
shadowmage.spike=Pointe de douleur
shadowmage.spike.description=Inflige 16 dégâts à toutes les créatures ennemies. À la fin du tour du lanceur, soigne toutes les créatures ennemies de 16 vie.
shadowmage.warden=Gardien sombre
shadowmage.warden.description=Le Gardien sombre ignore toujours les premiers dégâts qu'il reçoit chaque tour.
shadowmage.assassin=Grand maître assassin
shadowmage.assassin.description=À l'invocation, inflige 12 dégâts à la créature de l'emplacement opposé. Peut remplacer toute créature alliée de coût 9 ou moins. Le lanceur gagne une puissance de l'élément de la créature remplacée égale à la moitié de son coût (arrondi au supérieur).

battlemage=Mage de guerre
battlemage.description=Spécialisation : tactique. Les créatures du Mage de guerre associent des stats offensives à des capacités défensives, ou l'inverse. Les sorts servent à attaquer comme à protéger. Gardez la ligne en équilibre, puis faites-la basculer.
battlemage.taunt=Provocation
battlemage.taunt.description=Votre créature ciblée inflige immédiatement à l'adversaire des dégâts égaux à son attaque. Si vous ciblez une créature ennemie dont l'attaque est inférieure à celle de la créature qui lui fait face, l'étourdit.
battlemage.rune=Guerrier runique
battlemage.rune.description=Réduit de 2 les dégâts des sorts de l'adversaire.
battlemage.sergeant=Sergent d'argent
battlemage.sergeant.description=Les créatures adjacentes non murs infligent 3 dégâts supplémentaires à l'adversaire tant qu'elles ne sont pas bloquées.
battlemage.knight=Chevalier chargeur
battlemage.knight.description=Le Chevalier chargeur attaque deux fois tant qu'il est bloqué. S'il n'est plus bloqué après la première attaque, il n'attaque pas une seconde fois.
battlemage.fieldmage=Mage de terrain
battlemage.fieldmage.description=Les dégâts de sorts ennemis infligés au joueur ou aux autres créatures du joueur sont redirigés vers le Mage de terrain.
battlemage.cavalier=Cavalier doré
battlemage.cavalier.description=Gagne 1 attaque par emplacement vide de votre côté du plateau. Combo interdit : Apocalypse.
battlemage.warcry=Cri de guerre sonore
battlemage.warcry.description=Inflige 9 dégâts à l'adversaire et à toutes les créatures ennemies. Ces créatures ennemies perdent leurs capacités jusqu'à la fin de votre prochain tour.
battlemage.retinue=Suite du général
battlemage.retinue.description=Vous pouvez jouer une créature supplémentaire ce tour. Tant que la Suite du général reste en jeu, la prochaine carte de tactique que vous jouez coûte 1 de moins.

tinker=Bricoleur
tinker.description=Spécialisation : bricolage. Un atelier steampunk qui sème des bombes à retardement dans la ligne ennemie, puis les dépense : attaques supplémentaires, soldats qui grandissent et une reine qui transforme chaque mèche en explosion.
tinker.bomb=Bricobombe
tinker.bomb.description=Perd 1 vie chaque tour. Quand la Bricobombe meurt, elle inflige 3 dégâts à son joueur.
tinker.plant=Bricoleur
tinker.plant.description=Place une Bricobombe dans l'emplacement adverse libre ciblé.
tinker.spider=Araignée mécanique
tinker.spider.description=À l'invocation, place une Bricobombe dans l'emplacement opposé s'il est vide. Quand l'Araignée mécanique tue une créature opposée, elle attaque de nouveau.
tinker.falcon=Faucon mécanique
tinker.falcon.description=À l'invocation, place une Bricobombe dans l'emplacement adverse libre le plus à droite. À sa mort, place une Bricobombe dans l'emplacement adverse libre le plus à gauche.
tinker.scatter=Bombe éclatée
tinker.scatter.description=Inflige 8 dégâts à toutes les créatures adverses. Pour chaque créature qui meurt à cause de ce sort, place une Bricobombe dans l'emplacement qu'elle occupait.
tinker.soldier=Soldat à vapeur
tinker.soldier.description=Chaque fois qu'une Bricobombe adverse meurt, l'attaque du Soldat à vapeur augmente définitivement de 1.
tinker.automaton=Automate
tinker.automaton.description=À la fin du tour de son joueur, l'Automate place une Bricobombe dans un emplacement adverse libre aléatoire.
tinker.queen=Reine mécanique
tinker.queen.description=À l'invocation, tue toutes les Bricobombes adverses en jeu. Tant que la Reine mécanique est en jeu, toutes les Bricobombes infligent 3 dégâts supplémentaires à l'adversaire.
tinker.dragon=Dragon à vapeur
tinker.dragon.description=Attaque à l'invocation. À l'invocation, place une Bricobombe dans trois emplacements adverses libres aléatoires. Chaque fois que le Dragon à vapeur tue une créature opposée, son joueur gagne 1 puissance de Bricoleur.

conjurer=Conjurateur
conjurer.description=Spécialisation : conjuration. Sorts et créatures s'alimentent : chaque sort que vous lancez déclenche Conjuration sur vos créatures. Attaques, mana de type et une seconde impulsion du même coup.
conjurer.nectar=Nectar de lavande
conjurer.nectar.description=Soigne de 5 la créature ciblée (la vôtre ou celle de l'adversaire). Vous gagnez 1 puissance du type de cette créature.
conjurer.bravery=Bravoure
conjurer.bravery.description=Augmente de 1 l'attaque de chacune de vos créatures non murs jusqu'à la fin du tour. Gagne 1 puissance de Conjuration.
conjurer.warmage=Mage de guerre
conjurer.warmage.description=À l'invocation, vos créatures gagnent +2 attaque jusqu'à la fin du tour. Conjuration : vos autres créatures gagnent +2 attaque jusqu'à la fin du tour.
conjurer.golem=Golem d'os
conjurer.golem.description=Le Golem d'os ne reçoit aucun dégât des sorts et capacités. Conjuration : l'attaque du Golem d'os augmente définitivement de 1. Vos autres créatures sont soignées de 3.
conjurer.nurture=Rite nourricier
conjurer.nurture.description=Vos créatures n'attaquent pas ce tour. Après les effets spéciaux, elles sont soignées de leur attaque plus 4, et vous êtes soigné du total de leur attaque plus 4.
conjurer.pain=Douleur de l'essence
conjurer.pain.description=Inflige 3 dégâts à la créature adverse ciblée et à l'adversaire. Inflige 2 dégâts supplémentaires par puissance que l'adversaire possède du type de cette créature.
conjurer.guard=Garde impie
conjurer.guard.description=À l'invocation, réduit de 3 l'attaque de chaque créature adverse jusqu'à la fin du tour de l'adversaire. Conjuration : réduit définitivement de 1 l'attaque de chaque créature adverse.
conjurer.mystic=Mystique noir
conjurer.mystic.description=À l'invocation, augmente de 2 les puissances de Feu, Eau, Air et Terre. Conjuration : augmente de 2 la puissance de Conjuration.

rogue=Voleur
rogue.description=Spécialisation : furtivité. Tendez une embuscade à la ligne bloquée, volez la croissance et achevez ce qu'un coup de poignard commence. Petits corps, timing sournois.
rogue.sneak=Attaque sournoise
rogue.sneak.description=Étourdit la créature ciblée et lui inflige 4 dégâts. Si la cible est bloquée, ce sort inflige le double de dégâts.
rogue.trickster=Fripon halfelin
rogue.trickster.description=Quand une créature lui fait face, inflige 2 dégâts à l'adversaire au début du tour de son joueur.
rogue.thief=Voleur d'énergie
rogue.thief.description=Au début du tour de son joueur, réduit de 1 la puissance de l'adversaire du type de créature opposé au Voleur d'énergie.
rogue.dancer=Danseuse de l'ombre
rogue.dancer.description=Quand une créature fait face à la Danseuse de l'ombre, elle effectue une attaque supplémentaire.
rogue.fighter=Combattant des rues
rogue.fighter.description=Chaque fois que le Combattant des rues reçoit des dégâts de la créature de l'emplacement opposé, son attaque augmente définitivement de 2.
rogue.assassin=Assassine elfe
rogue.assassin.description=À l'invocation, inflige 8 dégâts à la créature de l'emplacement opposé. Si cette créature meurt, elle attaque immédiatement.
rogue.trap=Piège arcanique
rogue.trap.description=Réduit de 2 toutes les puissances de l'adversaire et lui fait passer son prochain tour.
rogue.archer=Archer sombre
rogue.archer.description=À l'invocation, détruit toutes les créatures adverses ayant 6 vie ou moins. Quand l'Archer sombre tue la créature de l'emplacement opposé, inflige 3 dégâts à l'adversaire.

meteomancer=Météomanciens
meteomancer.description=Spécialisation : prescience. Quand vous invoquez une créature Météo, choisissez un élément de base (Feu, Eau, Air ou Terre) comme Élément appelé. La plupart des cartes Météo se déclenchent quand l'adversaire joue des cartes de cet élément.
meteomancer.thief=Voleur de foudre
meteomancer.thief.description=Quand l'adversaire utilise un sort de l'Élément appelé, Appel du tonnerre est lancé sur la créature adverse ayant le plus de vie (6 dégâts à elle et 6 à l'adversaire).
meteomancer.extremophile=Extrémophile
meteomancer.extremophile.description=Immunisé aux dégâts des sorts et capacités de l'adversaire. Quand l'adversaire joue une carte de l'Élément appelé, un autre Extrémophile apparaît dans l'emplacement vide le plus à droite de son joueur.
meteomancer.clairvoyant=Clairvoyant
meteomancer.clairvoyant.description=À l'invocation, l'adversaire gagne 3 mana du nouvel Élément appelé et perd 1 mana de chaque autre type.
meteomancer.mistwalker=Marcheur des brumes
meteomancer.mistwalker.description=L'Élément appelé choisi à l'invocation du Marcheur des brumes n'est pas révélé à l'adversaire. L'attaque du Marcheur des brumes augmente de 5 tant que c'est votre seule créature Météo en jeu.
meteomancer.grenadier=Grenadier astral
meteomancer.grenadier.description=Quand l'adversaire invoque une créature non spéciale, elle perd la moitié de sa vie (arrondi au supérieur) si elle appartient à l'Élément appelé et subit 4 dégâts sinon.
meteomancer.fateweaver=Tisseur de destin
meteomancer.fateweaver.description=Quand l'adversaire joue une carte de l'Élément appelé, gagnez 4 mana de cet élément et jouez une carte supplémentaire de l'Élément appelé à votre prochain tour.
meteomancer.prism=Mage prisme
meteomancer.prism.description=Chaque tour, inflige à chaque créature adverse des dégâts égaux à la moitié du mana de l'adversaire dans l'Élément appelé (arrondi à l'inférieur). Quand l'adversaire joue une carte de l'Élément appelé, l'attaque du Mage prisme augmente définitivement de 1.
meteomancer.storm=Tempête astrale
meteomancer.storm.description=Quand l'adversaire joue une carte de l'Élément appelé, inflige 19 dégâts à l'adversaire et à chaque créature adverse.

quantumancer=Quantomancien
quantumancer.description=Spécialisation : superposition. Des sorts qui évoluent avec le mana ennemi, des guerriers qui partagent leurs dégâts et des sceaux qui volent les options de l'adversaire.
quantumancer.surge=Surtension
quantumancer.surge.description=Inflige à chaque créature adverse des dégâts égaux au mana de l'adversaire dans la Maison de cette créature, mais pas moins de 3 dégâts.
quantumancer.kineticist=Cinéticiste
quantumancer.kineticist.description=Les sorts et capacités de l'adversaire soignent le Cinéticiste au lieu de le blesser, et augmentent définitivement son attaque de 1.
quantumancer.warrior=Guerrier dimensionnel
quantumancer.warrior.description=Quand le Guerrier dimensionnel attaque une créature, il inflige aussi à l'adversaire des dégâts égaux à son attaque.
quantumancer.martyr=Martyr magnétique
quantumancer.martyr.description=Tous les dégâts infligés à vos créatures par les sorts de l'adversaire sont infligés au Martyr magnétique à la place.
quantumancer.wall=Mur de phosphore
quantumancer.wall.description=Quand le Mur de phosphore est attaqué, il inflige à chaque créature adverse des dégâts égaux au niveau de la créature qui l'a attaqué.
quantumancer.sealing=Esprit du scellement
quantumancer.sealing.description=Quand l'adversaire joue une carte, il ne peut plus la rejouer tant que l'Esprit du scellement n'est pas mort. Tant qu'il est en jeu, son joueur ne peut pas jouer un autre Esprit du scellement.
quantumancer.fusion=Élémentaire de fusion
quantumancer.fusion.description=L'attaque de l'Élémentaire de fusion est égale à la plus grande réserve de mana de l'adversaire. Réduit de 1 la plus petite réserve de mana de l'adversaire chaque tour.
quantumancer.cosmic=Mage cosmique
quantumancer.cosmic.description=Quand le Mage cosmique entre en jeu, gagnez un tour supplémentaire pour rejouer gratuitement un sort de coût 10 ou moins joué par l'adversaire. Vous pouvez ne pas le rejouer.
quantumancer.cosmic.choose=Rejouer gratuitement un sort adverse, ou passer
meteomancer.choose=Élément appelé (actuel : {0})
meteomancer.noelement=aucun
powermancer=Puissancien
powermancer.description=Spécialisation : puissance. Marchandez avec la puissance spéciale pour tout lancer, sacrifiez des créatures pour la puissance et la vie, et taxez la puissance de l'adversaire.
powermancer.bargain=Marché infernal
powermancer.bargain.description=Vous pouvez jouer n'importe quelle carte de base en dépensant toute votre puissance de son type et le reste de votre puissance spéciale. Permet de jouer une carte supplémentaire ce tour. Ne peut pas être joué pendant vos deux premiers tours.
powermancer.burial=Enterrement éternel
powermancer.burial.description=Sacrifiez une créature : gagnez 3 puissance de son type et 1 de chaque autre type. Gagnez de la vie égale au double de son coût, jusqu'à 10.
powermancer.hunter=Chasseur de puissance
powermancer.hunter.description=Chaque fois que le Chasseur de puissance blesse une créature adverse, gagnez 1 puissance spéciale. Chaque fois qu'il blesse l'adversaire, réduit de 1 une puissance aléatoire de l'adversaire.
powermancer.tower=Tour d'ivoire
powermancer.tower.description=En jeu, vos sorts coûtent 2 de moins et vos autres cartes 1 de moins. Chaque fois que vous jouez une carte, infligez 3 dégâts à l'adversaire ; gagnez 3 vie à la place si c'était un sort.
powermancer.equilibrium=Équilibre
powermancer.equilibrium.description=Inflige à l'adversaire des dégâts égaux à sa plus haute puissance, puis réduit cette puissance de 2. Vous gagnez autant de vie que votre plus basse puissance, puis augmentez cette puissance de 2.
powermancer.hound=Chien astral
powermancer.hound.description=Augmente de 1 votre croissance de mana spécial et réduit de 1 celle de l'adversaire.
powermancer.stasis=Stase
powermancer.stasis.description=Réduit de 1 chaque puissance de l'adversaire, étourdit toutes les créatures adverses et empêche l'adversaire de jouer des cartes au prochain tour.
powermancer.rainbow=Avatars arc-en-ciel
powermancer.rainbow.description=Invoque quatre Avatars 2/16 dans des emplacements vides aléatoires : un de Feu, d'Eau, d'Air et de Terre. Chacun augmente de 1 la croissance de mana de son élément tant qu'il est en jeu.
powermancer.avatar.fire=Avatar de feu
powermancer.avatar.fire.description=Avatar du Feu. Augmente de 1 votre croissance de mana de feu tant qu'il est en jeu.
powermancer.avatar.water=Avatar d'eau
powermancer.avatar.water.description=Avatar de l'Eau. Augmente de 1 votre croissance de mana d'eau tant qu'il est en jeu.
powermancer.avatar.air=Avatar d'air
powermancer.avatar.air.description=Avatar de l'Air. Augmente de 1 votre croissance de mana d'air tant qu'il est en jeu.
powermancer.avatar.earth=Avatar de terre
powermancer.avatar.earth.description=Avatar de la Terre. Augmente de 1 votre croissance de mana de terre tant qu'il est en jeu.

shadowcaster=Lanceur d'ombre
shadowcaster.description=Spécialisation : ténèbres. La puissance des ténèbres est un compteur à part, pas du mana. Nourrissez-vous de la peur de l'ennemi, jetez des ombres sur le champ de bataille et appelez les maudits Elfes noirs des Royaumes d'ombre.
shadowcaster.bat=Chauve-souris géante
shadowcaster.bat.description=Chaque fois que la Chauve-souris géante inflige des dégâts à une créature opposée, elle se soigne de 3 vie.
shadowcaster.wave=Vague d'ombre
shadowcaster.wave.description=Inflige X+2 dégâts à toutes les créatures adverses (X = puissance des Ténèbres du lanceur).
shadowcaster.noble=Noble elfe noir
shadowcaster.noble.description=S'il est tué par un sort adverse, augmente de 2 la puissance des Ténèbres de son joueur.
shadowcaster.mage=Mage elfe noir
shadowcaster.mage.description=Augmente de 1 le coût de tous les sorts de son joueur et de 2 leurs dégâts. Chaque fois que son joueur lance un sort, augmente de 1 sa puissance des Ténèbres.
shadowcaster.scythe=Faux d'ombre
shadowcaster.scythe.description=Inflige X+4 dégâts à toutes les créatures adverses (X = puissance des Ténèbres du lanceur). Pour chaque créature tuée, inflige 2 dégâts à l'adversaire et augmente de 1 la puissance des Ténèbres du lanceur.
shadowcaster.assassin=Assassin elfe noir
shadowcaster.assassin.description=Attaque dès le tour de son invocation. Chaque fois qu'il tue une créature adverse, augmente de 1 la puissance des Ténèbres de son joueur.
shadowcaster.moonblade=Lame de lune
shadowcaster.moonblade.description=Au début du tour de son joueur, inflige à toutes les créatures adverses des dégâts égaux à la puissance des Ténèbres de son joueur. Chaque fois qu'elle tue une créature, augmente de 1 la puissance des Ténèbres de son joueur.
shadowcaster.priestess=Prêtresse des ombres
shadowcaster.priestess.description=À l'invocation, étourdit toutes les créatures adverses. Quand elle est tuée, augmente de 2 la puissance des Ténèbres de son joueur.

spiritshaman=Chaman des esprits
spiritshaman.description=Spécialisation : libération. La puissance d'Esprit est le mana spécial. Invoquez des Totems d'esprit ; quand la condition de Libération d'un totem est remplie, il est remplacé dans son emplacement par sa créature Esprit.
spiritshaman.tortoise=Totem tortue
spiritshaman.tortoise.description=À l'invocation, libère chaque Totem des emplacements voisins. Libération : quand son joueur invoque une autre créature Esprit.
spiritshaman.tortoise.spirit=Esprit tortue
spiritshaman.tortoise.spirit.description=Quand il est libéré, augmente de 1 la puissance d'Esprit de son joueur.
spiritshaman.fox=Totem renard
spiritshaman.fox.description=À l'invocation, inflige à la créature opposée des dégâts égaux à son attaque. Libération : au début du tour de son joueur, si sa vie est de 5 ou moins.
spiritshaman.fox.spirit=Esprit renard
spiritshaman.fox.spirit.description=Quand il est libéré, tous les autres Totems de son joueur sont aussi libérés, même si leur condition de Libération n'est pas remplie.
spiritshaman.deer=Totem cerf
spiritshaman.deer.description=Chaque tour, soigne son joueur de 1 vie. Libération : au début du tour de son joueur, si la puissance de Terre du joueur est de 7 ou plus.
spiritshaman.deer.spirit=Esprit cerf
spiritshaman.deer.spirit.description=Quand il est libéré, soigne de 6 vie toutes les autres créatures de son joueur.
spiritshaman.owl=Totem chouette
spiritshaman.owl.description=À l'invocation, augmente de 1 la plus basse puissance de Feu, Eau, Air ou Terre de son joueur. Libération : quand l'une de ces puissances est de 1 ou moins.
spiritshaman.owl.spirit=Esprit chouette
spiritshaman.owl.spirit.description=Quand il est libéré, augmente de 2 la plus basse puissance de Feu, Eau, Air ou Terre de son joueur.
spiritshaman.panther=Totem panthère
spiritshaman.panther.description=Son attaque augmente de 1 chaque tour, mais il ne peut pas attaquer. Libération : quand l'attaque combinée du Totem panthère et de ses voisins est de 12 ou plus.
spiritshaman.panther.spirit=Esprit panthère
spiritshaman.panther.spirit.description=Son attaque est de 2 plus l'attaque qu'avait le Totem panthère à sa libération. Quand il tue une créature adverse, il attaque de nouveau immédiatement.
spiritshaman.awakening=Éveil spirituel
spiritshaman.awakening.description=Soigne le lanceur et toutes ses créatures d'un montant égal à la puissance d'Esprit du joueur (avant paiement du coût du sort) et libère tous les Totems du lanceur.
spiritshaman.bear=Totem ours
spiritshaman.bear.description=Le tour de son invocation, augmente de 2 l'attaque de toutes les autres créatures de son joueur. Libération : quand il y a au moins 8 créatures sur le plateau (lui compris).
spiritshaman.bear.spirit=Esprit ours
spiritshaman.bear.spirit.description=Quand il est libéré, inflige 8 dégâts à toutes les créatures adverses.
spiritshaman.eagle=Totem aigle
spiritshaman.eagle.description=À l'invocation, augmente de 4 la puissance d'Esprit de son joueur. Libération : quand la puissance d'Esprit de son joueur est de 8 ou plus.
spiritshaman.eagle.spirit=Esprit aigle
spiritshaman.eagle.spirit.description=Quand il est libéré, réduit de 4 la puissance d'Esprit de son joueur et augmente de 2 toutes ses autres puissances.
chronomaster=Chronomaître
chronomaster.description=Spécialisation : le Temps. Gèle le présent, avance les horloges et ramène le plateau à la veille.
chronomaster.freeze=Gel
chronomaster.freeze.description=La créature ciblée passe son prochain tour.
chronomaster.sprites=Esprits de lumière
chronomaster.sprites.description=Ces créatures ultra-rapides ne peuvent pas être bloquées.
chronomaster.accelerate=Accélération temporelle
chronomaster.accelerate.description=La créature alliée ciblée attaque 2 ou 3 fois ce tour-ci.
chronomaster.wall=Mur de distorsion temporelle
chronomaster.wall.description=Tant qu'il est en jeu, son propriétaire ne peut pas être blessé. Ses créatures peuvent encore l'être.
chronomaster.aging=Vieillissement
chronomaster.aging.description=La créature ciblée perd définitivement 3 points d'attaque.
chronomaster.groundhog=Jour de la marmotte
chronomaster.groundhog.description=Le plateau redevient tel qu'il était au début du tour précédent. Les joueurs gardent leur vie actuelle. Les deux perdent 1 mana dans chaque maison. Annule les sorts dévastateurs du tour passé.
chronomaster.queen=Reine chrono
chronomaster.queen.description=À l'invocation, toutes les créatures alliées peuvent attaquer une fois de plus ce tour-ci.
chronomaster.king=Roi chrono
chronomaster.king.description=Au prochain tour, le propriétaire peut jouer deux cartes.
chronomaster.king.phase=Jouer une seconde carte
settings.dev=Dév.
settings.debug=Mode débogage (campagne : gagner sans jouer)
button.debugwin=Gagner (débogage)


campaign.paganist.name=Maela
campaign.paganist.message=Les vieilles pierres ont soif. Mon dieu a faim, et votre magie a le parfum d'une belle offrande. Dansons ?
campaign.paganist.win=L'offrande était mienne, finalement. Continuez ; les pierres retiendront votre nom.
campaign.paganist.lose=Le dieu a été nourri, et pas par vous. Revenez quand vos mains seront plus sûres.
