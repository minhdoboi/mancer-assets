campaign.title=Campagne
campaign.intro=Vous venez d'arriver en bateau dans ce pays inconnu. Vous ne savez pas pourquoi, mais vous vous souvenez qu'il y a longtemps votre maître vous avait averti qu'un jour les éléments de la nature pourraient se disloquer, et que, le jour venu, les rares leçons qu'il vous avait données vous seraient utiles. Vous espérez trouver une terre paisible, mais lorsque vous regardez les montagnes lointaines, quelque chose vous inquiète.
campaign.day=Jour
campaign.night=Nuit
campaign.complete=Le sommet est à vous
campaign.epilogue=Vous ne comprenez pas pourquoi vous êtes allé si loin. Soudain, une vision vous traverse. Il y a longtemps, une communauté de manciens s'affrontait de façon ludique pour progresser dans leur maîtrise. Il y avait de la magie dans l'équilibre de ces temps anciens. Vous vous souvenez du moment où vous avez dû quitter cette communauté, et pourquoi vous avez dû partir. À cet instant, vous avez senti un écho de la magie dans tout ce que vous faisiez.
campaign.epilogue.menu=Retour au menu
