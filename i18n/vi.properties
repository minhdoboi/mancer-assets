darkpriest.EnergyVampire.description=Mỗi lượt cho chủ nhân 1 mana cho mỗi sinh vật liền kề (mana mang nguyên tố của sinh vật liền kề).
darkpriest.BlackMonk.name=Hòa thượng đen
darkpriest.BlackMonk.description=Khi nhận sát thương, nó hồi phục cho chủ nhân lượng sinh lực tương đương.
darkpriest.Betrayer.name=Kẻ phản bội
darkpriest.Betrayer.description=Chỉ có thể được triệu hồi lên một sinh vật địch khi nó chết. Mỗi lượt gây 4 sát thương lên chính nó, chủ nhân và những sinh vật liền kề.
darkpriest.DarkHydra.name=Thủy ngư bóng tối
darkpriest.DarkHydra.description=Khi tấn công, nó gây sát thương lên đối phương và mọi sinh vật của đối phương. Sau khi tấn công, nó tăng vĩnh viễn 1 công và hồi phục X sinh lực cho chủ nhân (X = sát thương gây ra lên đối phương)
darkpriest.Missionary.name=Nhà truyền giáo
darkpriest.Missionary.description=Khi vào trận, sinh vật đồng minh yếu nhất và sinh vật địch yếu nhất cùng nguyên tố mất nửa sinh lực hiện tại. Khi chủ nhân triệu hồi sinh vật nguyên tố, nó biến thành kẻ nổi loạn 6/20 (không năng lực đặc biệt). Khi chủ nhân triệu hồi sinh vật đặc biệt, nó biến thành thiên thần đen 8/25 (khi giết một sinh vật, nó tự hồi phục đầy đủ).
darkpriest.Heretic.name=Kẻ nổi loạn
darkpriest.BlackAngel.name=Thiên thần đen
darkpriest.BlackAngel.description=Khi giết một sinh vật, nó tự hồi phục đầy đủ
darkpriest.ShadowOfPriest.name=Bóng của Tư Tế
darkpriest.ShadowOfPriest.description=Mỗi lượt hồi phục 1 sinh lực cho Tư Tế Bóng Tối và mọi sinh vật của tư tế

antimancer=Phản Pháp Sư
antimancer.description=Hãy quay sức mạnh của đối phương thành vũ khí chống lại chính đối thủ.
antimancer.0.name=Đám đông giận dữ
antimancer.2.name=Tư Tế gương
antimancer.2.description=Mỗi khi đối phương ra một lá bài, bạn nhận 1 sức mạnh mang nguyên tố của lá bài ấy. Nếu đối phương ra lá bài đặc biệt, bạn nhận 1 Báo Thù.
antimancer.3.name=Chống kháng
antimancer.3.description=Đặt một Đám đông giận dữ 3/9 vào mỗi ô trống chưa bị chặn của bạn.
antimancer.4.name=Kẻ báo thù
antimancer.4.description=Mỗi khi kẻ báo thù mất sinh lực, nó gây sát thương tương đương lên mọi sinh vật đối phương.
antimancer.5.name=Đạo tử
antimancer.5.description=Chừng nào Đạo tử còn ở trong trận, mọi lá bài khác của bạn chết hoặc bị phép thuật hủy diệt sẽ tái sinh.
antimancer.6.name=Kẻ thu hoạch
antimancer.6.description=Mỗi khi một sinh vật của chủ nhân chết, Kẻ thu hoạch ngẫu nhiên tăng 1 sức mạnh lửa, nước, gió hoặc đất cho chủ nhân.
antimancer.7.name=Búp bê mê
antimancer.7.description=Đầu lượt của chủ nhân, Búp bê mê rút 1 sinh lực từ mỗi lá bài của đối phương.
antimancer.8.name=Pháo thủ
antimancer.8.description=Khi Pháo thủ gây sát thương lên đối phương, nó gây lượng sát thương tương ứng lên mọi lá bài của đối phương. Khi Pháo thủ chết, nó gây 28 sát thương lên lá bài ở ô đối diện.
antimancer.9.name=Hối lộ
antimancer.9.description=Hủy diệt lá bài mục tiêu của đối phương có sức mạnh từ 7 trở xuống. Lá bài ấy sẽ xuất hiện lại ở một ô trống ngẫu nhiên của chủ nhân với sinh lực tối đa.

colors=Màu sắc
colors.description=Mỗi màu có chi phí tối thiểu. Khi triệu hồi lá bài đặc biệt, toàn bộ mana đặc biệt được dùng cho nó. Số mana ảnh hưởng tới năng lực của các màu (X). Chỉ có thể có một màu của mỗi loại trên sân.
colors.Discoloration.name=Mất màu
colors.Discoloration.description=Hủy diệt màu đã chọn của chủ nhân và cho thêm một hành động.
colors.Amber.name=Hổ phách
colors.Amber.description=Khi bị giết, nó chia đều 2X mana giữa hai sức mạnh cao nhất của chủ nhân.
colors.Violet.name=Tím
colors.Violet.description=Vĩnh viễn giảm 1 chi phí cho các lá bài của chủ nhân có giá 2X trở xuống. Sát thương từ phép thuật địch giảm 3 chừng nào Tím còn trên sân.
colors.Azure.name=Xanh ngọc
colors.Azure.description=Chừng nào Xanh ngọc còn trên sân, các sinh vật của chủ nhân có giá X, X + 1 hoặc X - 1 không chịu sát thương từ phép thuật và năng lực sinh vật, nhưng chịu 4 sát thương mỗi lượt.
colors.Silver.name=Bạc
colors.Silver.description=Mỗi lượt hồi phục X - 1 sinh lực cho các sinh vật của chủ nhân. Giảm 1 tốc độ tăng sức mạnh của Màu sắc nếu X > 5.
colors.Emerald.name=Ngọc lục bảo
colors.Emerald.description=Giảm sát thương chủ nhân phải nhận đi X - 3. Chi phí mọi lá bài Màu sắc tăng X chừng nào Ngọc lục bảo còn trên sân.
colors.Crimson.name=Đỏ thẫm
colors.Crimson.description=Tăng X sát thương do sinh vật gây ra lên cả hai người chơi.
colors.Gold.name=Vàng
colors.Gold.description=Chết thay cho sinh vật bị giết ở ô bên trái


wind=Gió
wind.description=Chúa tế của Gió
wind.WingedWarrior.name=Chiến binh cánh
wind.WingedWarrior.description=Sinh vật được triệu hồi kế tiếp sẽ tấn công ngay lượt nó được triệu hồi.
wind.Simoom.name=Simun
wind.Simoom.description=Làm choáng sinh vật nguyên tố mục tiêu và cho X mana mang nguyên tố của sinh vật ấy (X = một nửa giá của sinh vật, làm tròn xuống)
wind.BallLightning.name=Sét cầu
wind.BallLightning.description=Gây 7 sát thương lên đối phương và cho phép ra thêm một lá bài lượt này.
wind.Squall.name=Bão giật
wind.Squall.description=Cho phép ra thêm hai lá bài lượt này và gây 1 sát thương lên mọi kẻ địch
wind.EnergeticVortex.name=Xoáy năng lượng
wind.EnergeticVortex.description=Tăng 50% sát thương của phép thuật kế tiếp của chủ nhân và chuyển 2 mana [#2] từ đối phương sang cho chủ nhân.
wind.TheSpiritOfThunderstorm.name=Linh thể của bão sấm
wind.TheSpiritOfThunderstorm.description=Cho 1 mana đặc biệt mỗi lượt. Gây 3 sát thương lên mọi kẻ địch khi chủ nhân bỏ lượt.
wind.Whirlwind.name=Cuồng phong
wind.Whirlwind.description=Hủy diệt sinh vật mục tiêu và sinh vật đối diện, và cho phép ra thêm một lá bài lượt này.
wind.EternalStorm.name=Bão vĩnh cửu
wind.EternalStorm.description=Lượt này, mọi sinh vật đồng minh tấn công thẳng vào đối phương.

mountainking=Vua Núi
mountainking.description=Bầy người: khi một người lùn đứng cạnh một người lùn khác, nó nhận năng lực thứ hai
mountainking.DwarvenSoldier.name=Lính người lùn
mountainking.DwarvenSoldier.description=Khi vào trận, nó tăng 3 công cho sinh vật liền kề trong 1 lượt. Bầy người: giảm 1 công của sinh vật đối diện cho mỗi lính người lùn trên sân.
mountainking.DwarvenShieldman.name=Khiên binh người lùn
mountainking.DwarvenShieldman.description=Chuyển nửa sát thương gây ra cho sinh vật liền kề sang cho chính nó. Bầy người: không thể bị giết bằng phép thuật (sẽ còn ít nhất 1 sinh lực).
mountainking.DwarvenCrossbowman.name=Kỵ binh người lùn
mountainking.DwarvenCrossbowman.description=Khi tấn công, nó gây lượng sát thương tương đương thẳng lên đối phương. Bầy người: tấn công ngay lập tức trước khi chết.
mountainking.ArmourcladDwarf.name=Người lùn mặc giáp
mountainking.ArmourcladDwarf.description=Giảm X sát thương không phải phép thuật gây ra cho nó (X = chênh lệch cấp với sinh vật đối diện). Bầy người: năng lực này cũng áp dụng cho sinh vật liền kề.
mountainking.Runesmith.name=Thợ khắc rune
mountainking.Runesmith.description=Thợ khắc rune chỉ có thể bị gây sát thương bởi sinh vật đối diện khi bị chặn. Bầy người: +1 công cho mỗi người lùn trong trận (bao gồm chính nó).
mountainking.Ballista.name=Băng thương
mountainking.Ballista.description=Khi sinh vật địch vào trận, nó làm giảm một nửa sinh lực của sinh vật ấy và tự mất 10 sinh lực. Bầy người: chỉ mất 7 sinh lực khi thi triển năng lực.
mountainking.Berserker.name=Kẻ cuồng chiến
mountainking.Berserker.description=Khi chủ nhân nhận hơn 5 sát thương, nó tấn công ô đối diện ngay lập tức. Bầy người: +3 công và sát thương gây ra lên kẻ cuồng chiến.
mountainking.MountainKingCard.name=Vua núi
mountainking.MountainKingCard.description=Khi một người lùn đồng minh vào trận, nó tự hồi phục 4 sinh lực và tăng vĩnh viễn 2 công. Khi nó vào trận, nó làm choáng sinh vật mạnh nhất của đối phương. Bầy người: giảm 1 chi phí cho mọi lá bài người lùn.

darksider=Kẻ Bên Kia
darksider.fallen.name=Pháp sư sa ngã
darksider.fallen.description=Khi tấn công, nó gây lượng sát thương tương đương lên mọi sinh vật địch mang nguyên tố của sinh vật đối diện.
darksider.spider.name=Nhện sói
darksider.spider.description=Khi đối phương triệu hồi một lá bài, nó gây lên sinh vật đối diện sát thương bằng đúng giá trị của lá bài ấy.
darksider.knight.name=Kỵ sĩ đen
darksider.knight.description=Sinh vật liền kề chỉ tấn công ô đối diện với Kỵ sĩ Đen.
darksider.mystic.name=Huyền sư bóng tối
darksider.mystic.description=Công của nó bằng sức mạnh đặc biệt của chủ nhân. Khi một sinh vật nguyên tố đồng minh chết, sức mạnh đặc biệt tăng 1
darksider.faceless.name=Kinh khủng vô mặt
darksider.faceless.description=Khi được triệu hồi, đối phương mất lá bài ở ô đối diện.
darksider.lake.name=Hồ quên
darksider.lake.description=Khi đối phương triệu hồi một lá bài, nó chặn lá bài ấy cho tới khi hồ chết.
darksider.warlock.name=Phù thủy
darksider.warlock.description=Khi đối phương thi triển phép thuật, nó chặn và tự mất 3X sinh lực (X = giá của phép thuật).
darksider.dragon.name=Rồng đen
darksider.dragon.description=Miễn nhiễm với mọi phép thuật và năng lực. Khi vào trận, nó làm choáng mọi sinh vật địch

limbo=Cõi Vô Định
limbo.description=Kẻ Giữ Cõi Vô Định. Năng lực thụ động: mỗi khi sinh vật địch tấn công và giết Kẻ Giữ Cõi Vô Định hoặc một sinh vật của kẻ ấy, cái chết của chúng bị hoãn lại tới cuối lượt của Kẻ Giữ Cõi Vô Định, và chúng được coi là đang ở 'trạng thái Vô Định'. Sinh vật ở 'trạng thái Vô Định' tấn công và chặn như bình thường.
limbo.heaven=Kẻ Giữ Thiên Đàng
limbo.heaven.description=Mỗi khi một sinh vật khác của chủ nhân rơi vào 'trạng thái Vô Định', Kẻ Giữ Thiên Đàng hồi phục 2 sinh lực cho chủ nhân và cho mỗi sinh vật của chủ nhân.
limbo.hell=Kẻ Giữ Địa Ngục
limbo.hell.description=Mỗi khi một sinh vật khác của chủ nhân rơi vào 'trạng thái Vô Định', Kẻ Giữ Địa Ngục gây 2 sát thương lên đối phương và mọi sinh vật của đối phương.
limbo.wraith=Hồn Vô Định
limbo.wraith.description=Công của Hồn Vô Định bằng số sinh vật của chủ nhân đang ở 'trạng thái Vô Định' cộng 1. Công của Hồn Vô Định gây sát thương lên đối phương và mọi sinh vật của đối phương.
limbo.tower=Tháp tội lỗi
limbo.tower.description=Mỗi khi một sinh vật của chủ nhân rơi vào 'trạng thái Vô Định', mana mang nguyên tố của sinh vật ấy của đối phương giảm 1 và mana của chủ nhân tăng 1.
limbo.nether=Vòng tay âm
limbo.nether.description=Hủy diệt mọi sinh vật của người thi triển và chúng rơi vào 'trạng thái Vô Định', sau đó gây 3 sát thương lên mỗi sinh vật của đối phương cho mỗi sinh vật của người thi triển đang ở 'trạng thái Vô Định'.
limbo.adjudicator=Quan xét linh hồn
limbo.adjudicator.description=Mỗi khi một sinh vật của chủ nhân rơi vào 'trạng thái Vô Định', một Kẻ Giữ Thiên Đàng hoặc Kẻ Giữ Địa Ngục (loại nào đang có trong tay bạn) với hạn chế "không thể rơi vào 'trạng thái Vô Định'" được triệu hồi vào một ô trống ngẫu nhiên liền kề sinh vật ấy.
limbo.redemption=Cứu chuộc
limbo.redemption.description=Sinh vật mục tiêu của người thi triển đang ở 'trạng thái Vô Định' được triệu hồi lại với sinh lực đầy đủ.
limbo.baron=Bá tước Vô Định
limbo.baron.description=Khi một phép thuật hoặc năng lực gây sát thương và giết Kẻ Giữ Cõi Vô Định hoặc Bá Tước Vô Định, chúng rơi vào 'trạng thái Vô Định'. Khi Bá Tước Vô Định rơi vào 'trạng thái Vô Định', công của nó nhân đôi.

dreamweaver=Kẻ Dệt Giấc Mơ
dreamweaver.description=Kẻ Dệt Giấc Mơ tạo ra và kiểm soát sức mạnh của Giấc Mơ, một lực lượng đáng sợ dù trong giấc ngủ hay khi thức. Với đủ năng lượng sáng tạo, Kẻ Dệt Giấc Mơ có thể biến một ý tưởng thoáng qua thành một sinh vật tuyệt vời, hoặc tạo ra những màn trình diễn kỳ diệu của thiên nhiên và ma thuật.
dreamweaver.wisp=Bóng ma linh ảo
dreamweaver.wisp.description=Bóng ma linh ảo không chịu sát thương từ phép thuật và năng lực địch. Công của Bóng ma linh ảo tăng 1 cho mỗi sinh vật khác của chủ nhân.
dreamweaver.roc=Đàn trĩ non
dreamweaver.roc.description=Chừng nào Đàn trĩ non không bị chặn, công của nó bị chia đôi (làm tròn lên).
dreamweaver.aurora=Cực quang
dreamweaver.aurora.description=Mọi sinh vật được hồi phục 12 sinh lực và cộng 1 mana mang nguyên tố của chính nó vào kho mana của chủ nhân.
dreamweaver.guide=Dẫn đường tinh thần
dreamweaver.guide.description=Khi Dẫn đường tinh thần được triệu hồi, nó hồi phục cho mọi sinh vật của chủ nhân lượng bằng sức mạnh Giấc Mơ của chủ nhân, và hồi phục 3 sinh lực cho chủ nhân cho mỗi sinh vật của chủ nhân.
dreamweaver.sword=Kiếm sống
dreamweaver.sword.description=Kiếm sống nhận 1 công cho mỗi sinh vật liền kề. Khi Kiếm sống tấn công, nếu có sinh vật liền kề với ô đối diện, nó cũng tấn công những sinh vật ấy.
dreamweaver.butterfly=Bướm cầu vồng
dreamweaver.butterfly.description=Mỗi khi đối phương triệu hồi một sinh vật, chủ nhân của Bướm cầu vồng nhận 3 mana mang nguyên tố của sinh vật ấy. (Mọi sinh vật đặc biệt đều tính là Giấc Mơ trong trường hợp này.)
dreamweaver.castle=Lâu đài bay
dreamweaver.castle.description=Lâu đài bay tấn công đối phương và mọi sinh vật của đối phương. Lâu đài bay giảm 2 sát thương gây ra lên mọi sinh vật khác của chủ nhân.
dreamweaver.mare=Ác mộng
dreamweaver.mare.description=Khi Ác mộng được triệu hồi, nó gây 6 sát thương lên mỗi sinh vật của đối phương cho mỗi ô trống của đối phương. Công của Ác mộng tăng 1 cho mỗi sinh vật khác của chủ nhân.

soulbinder=Kẻ Buộc Hồn
soulbinder.description=Kẻ Buộc Hồn luôn bắt đầu trận đấu với 1 Linh Hồn Bị Trói ở một ô ngẫu nhiên. Linh Hồn Bị Trói không tấn công. Linh Hồn Bị Trói không nhận sát thương từ sinh vật tấn công, năng lực hay phép thuật. Sinh vật đối diện Linh Hồn Bị Trói không tấn công linh hồn mà tấn công thẳng chủ nhân như thể ô ấy trống. Bất kỳ sinh vật nào cũng có thể được triệu hồi lên Linh Hồn Bị Trói; khi điều này xảy ra, Linh Hồn Bị Trói không còn ở trong trận. Linh Hồn Bị Trói vừa không "chết" cũng không bị "hủy diệt". Kẻ Buộc Hồn gắn bó sâu sắc với Linh của thế giới, sống ngay trên ranh giới giữa Thế Giới Của Sự Sống & Thế Giới Của Linh Hồn bên kia. Họ phải tôn trọng & chăm sóc những linh hồn lạc lõng & dẫn dắt chúng đến nơi an nghỉ cuối cùng. Một Kẻ Buộc Hồn cũng có thể gọi lên & điều khiển các Linh Hồn để trợ giúp họ trong trận đấu. Người Bảo Vệ Sự Sống & Người Nói Thay Người Đã Qua.
soulbinder.boundsoul=Linh Hồn Bị Trói
soulbinder.boundsoul.description=Không tấn công và không thể bị gây sát thương. Sinh vật đối diện Linh Hồn Bị Trói tấn công chủ nhân như thể ô ấy trống. Bất kỳ sinh vật nào cũng có thể được triệu hồi lên nó.
soulbinder.tethered=Linh Hồn Bị Xích
soulbinder.tethered.description=Phải được triệu hồi lên Linh Hồn Bị Trói. Khi Linh Hồn Bị Xích chết, nó được thay bằng một Linh Hồn Bị Trói.
soulbinder.summon=Triệu hồi tinh thần
soulbinder.summon.description=Triệu hồi một Linh Hồn Bị Trói vào ô trống mục tiêu và tăng 1 sức mạnh Lửa, Nước, Gió và Đất của người thi triển.
soulbinder.tree= Cây hạt linh hồn
soulbinder.tree.description=Phải được triệu hồi lên Linh Hồn Bị Trói. Đầu lượt của chủ nhân, Cây hạt linh hồn đặt một Linh Hồn Bị Trói vào một ô liền kề của nó (từ trái sang phải) nếu ô ấy chưa bị chiếm.
soulbinder.seeker=Kẻ tìm linh hồn
soulbinder.seeker.description=Phải được triệu hồi lên Linh Hồn Bị Trói. Cuối lượt của chủ nhân, Kẻ tìm linh hồn di chuyển vào một ô trống ngẫu nhiên và đặt một Linh Hồn Bị Trói vào ô nó vừa rời.
soulbinder.release=Thả linh hồn
soulbinder.release.description=Hồi phục 3 sinh lực cho người thi triển và mọi sinh vật của người thi triển cho mỗi Linh Hồn Bị Trói đang trong trận (của cả hai bên), sau đó gỡ mọi Linh Hồn Bị Trói khỏi trận (của cả hai bên) và đặt 2 Linh Hồn Bị Trói vào các ô trống ngẫu nhiên của chủ nhân.
soulbinder.sheppard=Kẻ dắt linh hồn
soulbinder.sheppard.description=Phải được triệu hồi lên Linh Hồn Bị Trói. Công của Kẻ dắt linh hồn tăng 1 cho mỗi Linh Hồn Bị Trói mà chủ nhân kiểm soát. Mỗi lượt, Kẻ dắt linh hồn hồi phục cho chủ nhân 2 sinh lực cho mỗi Linh Hồn Bị Trói mà chủ nhân kiểm soát.
soulbinder.priestess= Nữ tư tế của lối đi
soulbinder.priestess.description=Phải được triệu hồi lên Linh Hồn Bị Trói. Khi được triệu hồi, Nữ tư tế của lối đi hồi phục 2 sinh lực cho chủ nhân và gây 2 sát thương lên đối phương cho mỗi Linh Hồn Bị Trói trong trận (của cả hai bên). Mỗi khi một sinh vật của chủ nhân chết, Nữ tư tế của lối đi đặt một Linh Hồn Bị Trói vào một ô trống ngẫu nhiên của chủ nhân.
soulbinder.dragon= Rồng tinh thần
soulbinder.dragon.description=Phải được triệu hồi lên Linh Hồn Bị Trói. Khi được triệu hồi, Rồng tinh thần gây 6 sát thương lên đối phương và mọi sinh vật của đối phương. Mỗi lượt, Rồng tinh thần tự hồi phục và hồi phục 3 sinh lực cho chủ nhân cho mỗi Linh Hồn Bị Trói mà chủ nhân kiểm soát.

faerie=Thầy Tế Tiên Nữ
faerie.description=Thầy Tế Tiên Nữ là những pháp sư thiên nhiên có thể giao tiếp với Tiên Nữ, những sinh vật mà sự tồn tại của chính chúng được tạo nên từ các dạng mana đặc biệt. Tiên Nữ thường dùng thời gian để diễn lại một cách cẩn thận và khá nghĩa đáng những cách hiểu gần như nguyên văn về cuộc sống, giấc mơ và câu chuyện của con người, nhưng trên chiến trường họ là một lực lượng không thể xem nhẹ, và sẵn sàng giao đời mình cho những Thầy Tế mà họ coi là xứng đáng.
faerie.twins=Sinh đôi tiên nữ
faerie.twins.description=Khi được triệu hồi, nó hồi phục 4 sinh lực cho các sinh vật liền kề. Khi nó chết, nó hồi phục 4 sinh lực cho các sinh vật liền kề
faerie.fire=Lửa tiên
faerie.fire.description=Gây 5 sát thương lên mọi sinh vật địch bị chặn và làm choáng mọi sinh vật địch không bị chặn.
faerie.nightwing=Bướm cánh đêm
faerie.nightwing.description=Bướm cánh đêm giảm 1 công của mọi sinh vật địch.
faerie.ring=Nhẫn tiên
faerie.ring.description=Nhẫn tiên tăng 1 tốc độ tăng mana Tiên Nữ của chủ nhân. Mỗi khi chủ nhân dùng một lá bài Tiên Nữ, công của Nhẫn tiên tăng 2.
faerie.piper=Người thổi sáo tiên
faerie.piper.description=Người thổi sáo tiên hồi phục 3 sinh lực cho các sinh vật liền kề mỗi lượt.
faerie.cloud=Đám bướm
faerie.cloud.description=Triệu hồi một Đám bướm vào tất cả các ô trống của chủ nhân.
faerie.unicorn=Kỳ lân
faerie.unicorn.description=Kỳ lân tấn công ngay lượt được triệu hồi. Kỳ lân giảm 1 chi phí của mọi sinh vật thuộc chủ nhân.
faerie.dragon=Rồng tiên nữ
faerie.dragon.description=Khi được triệu hồi, Rồng tiên nữ hồi phục 20 sinh lực cho mọi sinh vật của chủ nhân. Rồng tiên nữ tăng 2 công cho mọi sinh vật khác của chủ nhân trong lượt nó được triệu hồi.
faerie.rabble=Đám bướm loạn
faerie.rabble.description=Khi Đám bướm loạn chết, nó hồi phục 4 sinh lực cho chủ nhân.

entomologist=Nhà côn trùng học
entomologist.beetle=Bọ cánh cứng lửa
entomologist.beetle.description=Khi được triệu hồi, Bọ cánh cứng lửa gây 4 sát thương lên sinh vật ở ô đối diện. Khi Bọ cánh cứng lửa chết, nó tăng 1 sức mạnh [#0] cho chủ nhân.
entomologist.moth=Đêm trích bột độc
entomologist.moth.description=Mỗi lượt Đêm trích bột độc gây 1 sát thương lên mọi sinh vật đối phương và lên đối phương. Khi Đêm trích bột độc chết, nó làm choáng sinh vật ở ô đối diện.
entomologist.hivemind=Đầu óc đàn
entomologist.hivemind.description=Chọn một sinh vật mục tiêu của đối phương. Trong lượt này, mọi sinh vật của người thi triển tấn công sinh vật mục tiêu thay vì sinh vật đối diện.
entomologist.locust=Bầy châu chấu
entomologist.locust.description=Triệu hồi một Bầy châu chấu lên sinh vật mục tiêu của đối phương. Sinh vật mục tiêu chịu 8 sát thương mỗi lượt và đối phương chịu 4 sát thương mỗi lượt cho tới khi sinh vật mục tiêu chết.
entomologist.ant=Kiến khổng lồ
entomologist.ant.description=Mọi sát thương gây ra lên Kiến khổng lồ đều giảm 2. Chừng nào còn trong trận, Kiến khổng lồ giảm 2 chi phí cho những con Kiến khổng lồ khác của chủ nhân.
entomologist.assassin=Ong bắt mồng
entomologist.assassin.description=Khi được triệu hồi, Ong bắt mồng triệu hồi Tiến trinh ong vào các ô liền kề. Ong bắt mồng nhận +2 công cho mỗi Tiến trình ong đang trong trận.
entomologist.hive=Tổ côn trùng
entomologist.hive.description=Cuối mỗi lượt của chủ nhân, Tổ côn trùng triệu hồi một Chiến binh côn trùng vào một ô ngẫu nhiên của chủ nhân.
entomologist.mantis=Châu chấu đỏ
entomologist.mantis.description=Khi được triệu hồi, Châu chấu đỏ giảm 1 mọi sức mạnh của đối phương. Châu chấu đỏ giảm 1 tốc độ tăng sức mạnh của đối phương, theo loại sức mạnh của sinh vật ở ô đối diện. Khi Châu chấu đỏ chết, nó gây 5 sát thương lên sinh vật ở ô đối diện.
entomologist.warrior=Chiến binh côn trùng
entomologist.warrior.description=Khi Chiến binh côn trùng chết, nó tăng 1 sức mạnh Nhà côn trùng học cho chủ nhân.
entomologist.drone=Tiến trinh ong


seasons=Bốn Mùa
seasons.description=Luân chuyển của bốn mùa: mỗi lá bài đặc biệt của Kẻ Canh Giữ ban cho họ một hiệu ứng thụ động nhỏ, có hiệu lực từ đầu trận cho tới khi lá bài ấy được chơi. Kiệt sức: mỗi lá bài đặc biệt của Kẻ Canh Giữ chỉ dùng được một lần trong trận. Một Kẻ Canh Giữ của Bốn Mùa là pháp sư có thể kiểm soát sức mạnh của các mùa và — nhờ Luật Ma Thuật của Đồng Cảm — còn dẫn dắt được cả những hiện tượng mà người ta gắn với các mùa. Trong khi những Tam pháp thời gian nắm quyền kiểm soát tuyệt đối đối với thời gian ở một phạm vi rất nhỏ, "Kẻ Canh Giữ" kiểm soát các mùa bằng cách tạo ra những thay đổi tinh tế trong thời gian ở tầm mức hoành tráng hơn nhiều. Tuy nhiên, ở tầm mức ấy, các thế lực thiên nhiên và thời gian đều bất ổn, và việc cố thao túng chúng thì vừa tốn sức vừa nguy hiểm. Những Kẻ Canh Giữ đã thành công tạo ra sự thay đổi thường do dè chừng và không muốn lặp lại trong một thời gian dài.
seasons.Nectarbloom.name=Hoa mật
seasons.Nectarbloom.description=Hoa mật hồi phục 2 sinh lực mỗi lượt.
seasons.AiluvBees.name=Đàn ong Ailuv
seasons.AiluvBees.description=Khi Đàn ong Ailuv được triệu hồi, hai Hoa mật 2/10 được triệu hồi vào các ô trống ngẫu nhiên của người thi triển. Thụ động: Nảy mầm: tốc độ tăng mana của bạn tăng 1 ở mỗi Lớp có dưới 2 mana.
seasons.SpiritofEquinox.name=Linh thần thu cân
seasons.SpiritofEquinox.description=Khi được triệu hồi, nó gây 4 sát thương lên đối phương và mọi sinh vật của đối phương, đồng thời hồi phục 4 sinh lực cho người thi triển và mọi sinh vật của người thi triển. Thụ động: Nảy mầm: tốc độ tăng mana của bạn tăng 1 ở mỗi Lớp có dưới 2 mana.
seasons.SolarWave.name=Làn sóng mặt trời
seasons.SolarWave.description=Đối phương chịu 2 sát thương cho mỗi ô sinh vật trống của họ. Sinh vật của đối phương chịu sát thương gấp ba lượt này. Thụ động: Mặt trời nửa đêm: khi bạn chịu 4 sát thương trở lên, sát thương đó giảm 1.
seasons.EternalSummer.name=Mùa hè vĩnh cửu
seasons.EternalSummer.description=Bạn có thể ngay lập tức chơi một sinh vật và một phép thuật trong tay, theo bất kỳ thứ tự nào. Cả hai đều giảm 2 chi phí. Thụ động: Mặt trời nửa đêm: khi bạn chịu 4 sát thương trở lên, sát thương đó giảm 1.
seasons.Cornucopia.name=Đường chứa của sự phong phú
seasons.Cornucopia.description=Khi được triệu hồi, nó hồi phục 9 sinh lực cho mọi sinh vật đồng minh khác. Mọi sinh vật đồng minh khác nhận +1 công và chịu -1 sát thương chừng nào Đường chứa của sự phong phú còn trên sân. Thụ động: Tràn chan: chi phí lá bài Lửa, Nước, Gió và Đất đắt nhất của bạn giảm 1.
seasons.GaeasAvatar.name=Ảnh thần của Gaia
seasons.GaeasAvatar.description=Công của nó bằng số sinh vật trên sân. Ảnh thần của Gaia không chịu ảnh hưởng của phép thuật nào nhưng chịu 1 sát thương mỗi lượt cho mỗi ô trống trên sân. Thụ động: Tràn chan: chi phí lá bài Lửa, Nước, Gió và Đất đắt nhất của bạn giảm 1.
seasons.BehemothofFrozenTime.name=Quái vật thời gian đóng băng
seasons.BehemothofFrozenTime.description=Khi được triệu hồi, các sinh vật bị chặn của đối phương bị làm choáng trong một lượt. Mana của đối phương ở mỗi Lớp không thể tăng quá 9 chừng nào Quái vật thời gian đóng băng còn trong trận. Thụ động: rét buốt: các sinh vật không bị chặn của đối phương chịu 1 sát thương mỗi lượt.
seasons.TheGreatAurora.name=Cực quang vĩ đại
seasons.TheGreatAurora.description=Các sinh vật của người thi triển được hồi phục 16 sinh lực, và mỗi sinh vật cho 3 mana mang nguyên tố của chính nó cho người thi triển. Thụ động: rét buốt: các sinh vật không bị chặn của đối phương chịu 1 sát thương mỗi lượt.

kinetician=Người cơ động lực
kinetician.description=Thao túng các ô, thao túng chỉ số.
kinetician.magerunner=Lính chạy pháp thuật
kinetician.magerunner.description=Khi được triệu hồi, nó đổi chỗ với sinh vật đồng minh có công cao nhất
kinetician.tricker=Kẻ lừa
kinetician.tricker.description=Mỗi lượt nó di chuyển tới ô gần nhất không bị chặn
kinetician.force=Lực tập trung
kinetician.force.description=Lượt này, mọi sinh vật đồng minh chỉ tấn công sinh vật mục tiêu, với công của sinh vật ấy tăng 1
kinetician.warp=Bẻ cong thực tại
kinetician.warp.description=Đưa sinh lực của sinh vật mục tiêu về còn X (X = cấp của nó)
kinetician.mage=Pháp sư cô đơn
kinetician.mage.description=Mỗi lượt gây X sát thương lên đối phương (X = số ô trống của đối phương)
kinetician.call=Gọi kẻ mạnh nhất
kinetician.call.description=Chia đôi chi phí của các lá bài mang nguyên tố mục tiêu (mỗi lá dùng một lần)
kinetician.barrier=Rào chắn lực
kinetician.barrier.description=Nhân đôi sinh lực hiện tại và tối đa của sinh vật đồng minh mục tiêu. Nó bỏ qua lượt kế tiếp
kinetician.manipulator=Kẻ thao túng
kinetician.manipulator.description=Khi vào trận, công của mọi sinh vật địch trở thành bằng 3 trong 1 lượt. Khi đối phương triệu hồi một sinh vật, nó đổi chủ nhân; Kẻ thao túng mất 4X sinh lực (X = giá của sinh vật ấy)

shaman=Tam pháp
shaman.description=Tinh thần tổ tiên: khi bắt đầu trận đấu, một sói ma 2/18 (giá 2, không có năng lực đặc biệt) xuất hiện ở ô ngoài cùng bên phải. Nếu con sói chết, lá bài 1/2 được thay bằng lời triệu hồi sói (giống như chim ưng đã thuần trong chiến dịch)
shaman.ghost=sói ma
shaman.hunger=Đói không dật được
shaman.hunger.description=Con sói nhận +X công (X = công của sinh vật mục tiêu) trong 1 lượt.
shaman.rage=Tinh thần cơn thịnh
shaman.rage.description=Khi vào trận, nó tăng vĩnh viễn 1 công cho sinh vật liền kề.
shaman.moon=Sức mạnh trăng tròn
shaman.moon.description=Vĩnh viễn giảm 1 sát thương gây ra lên con sói và hồi phục 8 sinh lực cho sinh vật liền kề và chủ nhân.
shaman.fury=Cơn thịnh ảo
shaman.fury.description=Gây 8 sát thương lên mọi sinh vật địch và tăng vĩnh viễn 1 công cho sói cho mỗi sinh vật đã chết trong lượt này.
shaman.protector=Hộ vệ tinh thần
shaman.protector.description=Chừng nào hộ vệ còn trong trận, mọi sát thương chủ nhân nhận phải giảm 2, và phép thuật địch sẽ hồi phục cho con sói thay vì gây sát thương.
shaman.hunter=Săn thú tinh thần
shaman.hunter.description=Chừng nào kẻ săn còn trong trận, con sói được +2 công và tự hồi phục bằng lượng sát thương nó gây ra khi tấn công.
shaman.shadow=Bóng sói
shaman.shadow.description=Mọi lá bài tác động lên con sói cũng tác động lên bóng sói. Khi vào trận, sinh vật liền kề tấn công ngay lập tức.
shaman.mate=Bạn đồng ảo
shaman.mate.description=Khi vào trận, nó vĩnh viễn giảm 1 chi phí cho mọi lá bài sói và gây 8 sát thương lên đối phương. Mỗi lượt, con sói tấn công thêm vào ô đối diện với bạn đồng.

vampires=Ma cày
vampires.flock=Bầy đen
vampires.flock.description=Di chuyển sinh vật có sinh lực thấp nhất của chủ nhân vào ô mục tiêu và khiến nó bất tử trong 1 lượt nếu cấp của nó không cao hơn 9.
vampires.noctule=Dơi
vampires.noctule.description=Khi nó gây sát thương lên đối phương, nó hồi phục lượng sinh lực tương đương cho chủ nhân.
vampires.ghoul=Quỷ
vampires.ghoul.description=Nếu sinh vật đối diện có dưới 11 sinh lực, nó giết sinh vật ấy trong một nhát.
vampires.acolyte=Môn đồ
vampires.acolyte.description=Khi một sinh vật địch nhận hơn 5 sát thương, nó gây thêm 4 sát thương lên sinh vật ấy.
vampires.ties=Dòng máu
vampires.ties.description=Hủy diệt sinh vật của chủ nhân và vĩnh viễn tăng công của sinh vật liền kề bằng đúng công của nó (không ảnh hưởng tới sinh vật tấn công diện rộng cũng như sinh vật cấp cao hơn 9).
vampires.nosferatu=Nosferatu
vampires.nosferatu.description=Khi một sinh vật chết, nó hồi phục 3 sinh lực cho chủ nhân và 2 cho chính nó.
vampires.aristocrat=Quý tộc
vampires.aristocrat.description=Đầu lượt, nó di chuyển vào ô đối diện với sinh vật có sinh lực thấp nhất của đối phương (nó có thể đổi chỗ với một sinh vật đồng minh). Khi nó giết một sinh vật, nó gây sát thương lên đối phương bằng đúng công của nó.
vampires.mansion=Biệt thự
vampires.mansion.description=Khi một sinh vật không đặc biệt của chủ nhân chết, nó thay thế sinh vật ấy bằng một tân binh. Khi vào trận, nó biến sinh vật liền kề thành quỷ.
vampires.neophyte=Tân binh
vampires.neophyte.description=Nó tự hồi phục một nửa sát thương nó gây ra lên kẻ địch.


fairy=Kỵ sĩ tiên
fairy.lesovik=Lesovik
fairy.lesovik.description=Chừng nào còn sống, nó chặn lá bài của sinh vật đối diện.
fairy.kikimora=Kikimora
fairy.kikimora.description=Khi vào trận, nó triệu hồi một Vodyanoy vào một ô ngẫu nhiên.
fairy.vodyanoy=Vodyanoy
fairy.rusalka=Rusalka
fairy.rusalka.description=Khi nó giết một sinh vật, đối phương mất lá bài ấy.
fairy.likho=Likho
fairy.likho.description=Khi nó chết, nó đưa sinh lực của sinh vật đã giết nó về còn 10 (nó giết sinh vật ấy nếu sinh lực dưới 10). Nếu bị giết bởi phép thuật hoặc năng lực, nó cho chủ nhân 2 sức mạnh ngẫu nhiên.
fairy.sirin=Sirin
fairy.sirin.description=Chừng nào còn sống, nó chia đôi công của sinh vật đối diện và sinh vật liền kề (công làm tròn lên).
fairy.alkonost=Alkonost
fairy.alkonost.description=Mỗi lượt nó chặn 6 lá bài địch ngẫu nhiên. Nó không thể chặn những lá bài đã bị chặn trong lượt trước
fairy.firebird=Chim lửa
fairy.firebird.description=Bất tử khi ở cạnh một sinh vật Lửa đồng minh.
fairy.zmey=Zmey Gorynych
fairy.zmey.description=Khi nó chết, nó tái sinh thành gorynych hai đầu 6/25, rồi thành gorynych một đầu 3/15. Mỗi khi bất kỳ người chơi nào dùng lá bài Lửa, nó gây 6 sát thương lên một sinh vật địch ngẫu nhiên.
fairy.2head=gorynych hai đầu
fairy.1head=gorynych một đầu

elementalist=Người gọi nguyên tố
elementalist.description=Dựa rất nhiều vào bốn nguyên tố cơ bản.
elementalist.sylph=Sylph
elementalist.sylph.description=Khi nó vào trận, nó cho phép ra thêm một lá bài đặc biệt. +1 chi phí cho mỗi sylph trên sân.
elementalist.freeze=Đóng băng sâu
elementalist.freeze.description=Cả hai người chơi bỏ 1 lượt và không thể dùng lá bài đặc biệt ở lượt kế tiếp.
elementalist.salamander=Kỳ giông
elementalist.salamander.description=Nếu sức mạnh [#0] của chủ nhân cao hơn của đối phương, nó gây 4 sát thương lên đối phương ở đầu lượt.
elementalist.avalanche=Lở đá
elementalist.avalanche.description=Gây 2X sát thương lên sinh vật địch (X = sức mạnh [#3] của chủ nhân) [{0}], hồi phục 2X sinh lực cho chủ nhân và đưa sức mạnh [#3] của chủ nhân về 0.
elementalist.incineration=Thiêu đốt
elementalist.incineration.description=Hủy diệt sinh vật địch mạnh nhất và sinh vật đồng minh yếu nhất (tính theo sinh lực), cả trên sân lẫn trong bộ bài.
elementalist.phoenix=Phoénix viễn
elementalist.phoenix.description=Mỗi lượt nó hồi phục lượng sinh lực bằng sức mạnh [#0] của chủ nhân.
elementalist.golem=Golem đá
elementalist.golem.description=+4 công khi bị chặn. Khi không bị chặn, nó không nhận sát thương từ phép thuật và năng lực sinh vật.
elementalist.frost=Sét băng
elementalist.frost.description=Gây X sát thương lên đối phương (X = chênh lệch giữa sức mạnh thấp nhất của nó và sức mạnh cao nhất của chủ nhân) và vĩnh viễn chặn ô mục tiêu.

reaper=Kẻ Cắt Hồn
reaper.description=Khi một sinh vật trên sân chết, chủ nhân nhận 1 linh hồn. Cứ mỗi linh hồn chủ nhân có, mọi sát thương do phép thuật đặc biệt của họ gây ra tăng 1 (1 linh hồn = 1 sát thương)
reaper.damnation=Án phạt
reaper.damnation.description=Chọn một sinh vật và gây 3 sát thương lên nó. Nếu sinh vật chết vì phép thuật này, tăng số linh hồn lên x, với x bằng giá của sinh vật (sát thương tối đa 8)
reaper.passage=Lối đi tối tăm
reaper.passage.description=Chọn 1 sinh vật mục tiêu. Sinh vật này và sinh vật liền kề được hồi phục x sinh lực, với x bằng số linh hồn của bạn (hồi phục tối đa 12 sinh lực)
reaper.rage=Cơn thịnh vĩnh cửu
reaper.rage.description=Chọn 1 sinh vật mục tiêu; nó vẫn hoạt động trên sân thêm 2 lượt sau khi chết

reaper.onslaught=Đợt xung kích linh hồn
reaper.onslaught.description=Gây x sát thương lên mọi sinh vật của đối phương, với x bằng số linh hồn của bạn. Sau khi dùng phép thuật này, chủ nhân không nhận linh hồn từ những sinh vật bị giết bởi phép thuật này, và số linh hồn của chủ nhân trở thành 0
reaper.tribute=Lễ tế
reaper.tribute.description=Chọn 1 sinh vật mục tiêu của chủ nhân và hủy diệt nó; chủ nhân nhận x sinh lực, với x bằng sinh lực của sinh vật bị hủy (tối đa 36 sinh lực)
reaper.furious=Linh hồn cuồng nộ
reaper.furious.description=Gây x + 7 sát thương lên đối phương, với x bằng số linh hồn của chủ nhân. Sau khi dùng phép thuật này, số linh hồn giảm về 0
reaper.sentence=Án tử
reaper.sentence.description=Hủy diệt mọi sinh vật trên sân. Với mỗi sinh vật bị hủy diệt, chủ nhân nhận 2 linh hồn thay vì 1
reaper.shackles=Xích linh hồn
reaper.shackles.description=Sinh vật mục tiêu không thể tấn công và năng lực của nó bị hủy. Ô của nó không thể dùng cho tới hết trận đấu. Mỗi lượt chừng nào sinh vật bị giam còn trên sân, chủ nhân nhận 1 linh hồn. Nếu sau khi sinh vật đối phương ở ô ấy bị hủy diệt, chủ nhân triệu hồi thứ gì vào trước ô ấy, sinh vật đó chịu 6 sát thương mỗi lượt

sower=Kẻ Gieo
sower.description=Thao túng sinh lực.
sower.tangling=Mắc xích
sower.tangling.description=Chuyển X sinh lực từ sinh vật mục tiêu sang sinh vật đối diện (X = công của sinh vật mục tiêu).
sower.devouring=Nuốt chửng
sower.devouring.description=Hy sinh một sinh vật đồng minh và nhân đôi công của những sinh vật đồng minh còn lại trong 1 lượt.
sower.monster=Cây quái
sower.monster.description=Khi nó giết một sinh vật, nó hồi phục đầy đủ cho mọi cây quái trên sân.
sower.pollination=Thụ phấn
sower.pollination.description=Biến sinh vật mục tiêu cấp X thành sinh vật đặc biệt cấp (X trừ 3) với sinh lực đầy đủ và hồi phục X sinh lực cho chủ nhân.
sower.sundew=Cây bắc hương máu
sower.sundew.description=Khi nó gây sát thương, nó hồi phục lượng sinh lực tương đương.
sower.predator=Cây ký sinh
sower.predator.description=Khi nó tấn công một sinh vật, nó gây thêm X sát thương lên sinh vật ấy (X = chênh lệch giữa sinh lực hiện tại và tối đa).
sower.drake=Rồng rừng
sower.drake.description=Khi chủ nhân triệu hồi sinh vật đặc biệt, nó tạo ra một bản sao ở ô trống gần nhất.
sower.flower=Hoa lửa
sower.flower.description=Mỗi lượt nó chia đôi sinh lực của sinh vật địch có sinh lực cao nhất và cho chủ nhân 1 sức mạnh [#0]. Khi vào trận, nó gây X sát thương lên đối phương (X = sức mạnh [#0] của nó)

warp=Bẻ cong
warp.description=Chuyên môn hóa: Phá hoại. Bẻ cong không giữ một đường tuyến, nó phá vỡ đường tuyến: năng lực bị cướp mất, sinh vật bị hủy và thay thế, và thứ đối thủ dựng lên quay ngược lại chính họ.
warp.errant=Kẻ lạc loạn
warp.errant.description=Ẩn vào bóng tối sau khi giết một sinh vật và quay lại khi bị gây sát thương
warp.quake=Động đất
warp.quake.description=Gây lên mỗi sinh vật địch sát thương bằng chênh lệch giữa sức mạnh của chủ nhân và đối phương ở nguyên tố của nó
warp.cloak=Áo choàng
warp.cloak.description=Phải được triệu hồi lên một sinh vật đã có; nó cộng công và sinh lực của sinh vật ấy vào của chính nó. Khi được triệu hồi, nó cho 2 mana mang nguyên tố của sinh vật được khoác. Khi nó chết, nó khôi phục sinh vật ấy
warp.photographer=Nhiếp ảnh gia
warp.photographer.description=Khi một sinh vật liền kề chết, nó được thay bằng một Nhiếp ảnh gia có cùng sinh lực
warp.schizo=Người đa tính
warp.schizo.description=Khi được triệu hồi, sinh vật đối diện mất năng lực cho tới khi Người đa tính chết
warp.ram=Hươu
warp.ram.description=Khi được triệu hồi, nó giảm một nửa sinh lực của sinh vật đối diện (làm tròn lên). Chủ nhân của sinh vật ấy được thêm 1 mana thuộc nhà của sinh vật ấy và mất 1 mana ở mỗi nhà khác. Nếu không có sinh vật đối diện thì không có gì xảy ra
warp.stranger=Người lạ
warp.stranger.description=Công của nó bằng sức mạnh địch cao nhất. Khi được triệu hồi, nó sao chép hiệu ứng của sinh vật đối diện (trừ tấn công diện rộng và hiệu ứng tức thời)
warp.queen=Nữ hoàng bẻ cong
warp.queen.description=Khi được triệu hồi, nó gây 4 sát thương lên sinh vật địch. Chúng mất năng lực cho tới cuối lượt kế tiếp

disciples=Tín đồ
disciples.description=Các tín đồ của Giáo hội đã lạc đường đặt niềm tin vào tù nhân bên trong chúng ta. Anh ta tìm đường qua ma túy, cõi astral, nỗi sợ và cơn cuồng nộ. Tù nhân xuất hiện cuối lượt của chủ nhân ở một ô trống ngẫu nhiên của chủ nhân. Khi một tù nhân chết, chủ nhân mất 1 mana ở 2 lớp cơ bản cao nhất và\nkiếm 1 mana đặc biệt. Khi một tín đồ sắp cạn sinh lực (< một nửa), đức tin của nó suy yếu và nó mất 1/3 công.
disciples.prisoner=Tù nhân
disciples.prisoner.description=Khi chết, nó mất 1 mana ở hai lớp cơ bản cao nhất và kiếm 1 mana đặc biệt.
disciples.enraged=Tù nhân cuồng nộ
disciples.enraged.description=Miễn nhiễm với phép thuật và năng lực chừng nào kẻ giải cứu còn sống.
disciples.drug=Chất kích thích
disciples.drug.description=Cho +1 công cho các sinh vật của chủ nhân và gây 4 sát thương lên chúng. Hiệu ứng biến mất khi tù nhân chết.
disciples.preacher=Người rao giảng
disciples.preacher.description=Chừng nào còn trong trận, các lá bài thường tốn thêm 1 mana. Nó tăng 1 tốc độ tăng mana đặc biệt và cho tù nhân +1 công.
disciples.monk=Hòa thượng bóng tối
disciples.monk.description=Chừng nào còn sống, nó giảm 2 mana [#0] của đối phương và tăng giá của mana ấy lên 1.
disciples.prophet=người tiên tri giả
disciples.prophet.description=Cho tới khi chết, các lá bài thường tốn thêm 1 mana. Nó cho 2 mana cho mỗi lớp cơ bản và lấy lại 1 mana khi chết.
disciples.escape=Lối thoát astral
disciples.escape.description=Sát thương gây ra lên tù nhân được chuyển hướng sang Lối thoát astral. Tù nhân tấn công thẳng vào đối phương.
disciples.scarecrow=Chuộc
disciples.scarecrow.description=Làm choáng và gây 4 sát thương lên sinh vật đối diện. Nó có thể đổi chỗ với tù nhân tới ô trống gần nhất
disciples.wind=Gió chế nghi
disciples.wind.description=Làm choáng sinh vật đối diện với chuộc và những sinh vật liền kề của nó. Gây 4 sát thương lên chúng
disciples.liberator=Kẻ giải cứu
disciples.liberator.description=Biến tù nhân thành Tù nhân cuồng nộ. Khi chết, nó gây {0} sát thương lên tù nhân.
disciples.falconer=Người huấn luyện chim ưng
disciples.falconer.description=Mỗi lượt, nó gây lên sinh vật đối phương sát thương bằng khoảng cách giữa các ô.
disciples.madden=Điên
disciples.madden.description=Gây 8 sát thương lên một sinh vật đối phương. Nó hồi phục 3 cho mỗi sinh vật bị giết và cộng 1 công cho tất cả.

junk=Phế tặng
junk.description=Chuyên môn hóa: Phế tặng. Kiểm soát chiến trường bằng số lượng: những sinh vật rẻ tiền lấp đầy đường tuyến, sao chép lẫn nhau và chết ngày càng nhiều, cho tới khi đống phế liệu ngươi chất lại trở thành bức tường để ngươi thắng sau lưng.
junk.screamer=Kẻ réo
junk.screamer.description=+1 công cho mỗi Kẻ réo trong trận
junk.poison=Hoa độc
junk.poison.description=Gây 5 sát thương lên mục tiêu của chủ nhân, và lên lá bài đối diện cùng lá bài liền kề. Nó lấy 1 mana từ cả chủ nhân lẫn sinh vật đối diện.
junk.fortune=Vận may bãi phế
junk.fortune.description=Hấp thụ 4 sát thương đầu tiên gây ra cho chủ nhân
junk.chain=Bộ điều khiển xích
junk.chain.description=Sao chép lời triệu hồi của một sinh vật liền kề có giá < 4. Khi một sinh vật liền kề có giá < 6 chết, nó lấp đầy ô ấy bằng một sinh vật yếu khác ở gần đó
junk.assassin=Sát thủ lang thang
junk.assassin.description=Nếu không bị chặn, nó di chuyển tới đối phương gần nhất không bị chặn (ngoài cùng bên trái nếu phải chọn) và gây 5 sát thương lên họ vào cuối lượt.
junk.factory=Robot nhà máy
junk.factory.description=Khi được triệu hồi với một sinh vật có giá < 6 ở một bên và một ô trống ở bên kia, nó sao chép sinh vật ấy vào ô trống. Nó cũng sao chép một sinh vật liền kề được triệu hồi có giá < 6 vào ô trống ở bên kia (hiệu ứng sinh ra cũng được áp dụng)
junk.bot=Cơ máy tái chế
junk.bot.description=Khi một sinh vật của chủ nhân chết, sinh vật ấy hồi phục 6 sinh lực, và chủ nhân hồi phục 2 sinh lực cho mỗi sinh vật đã mất.
junk.cyborg=Cyborg rác
junk.cyborg.description=Khi vào trận, nó lấp đầy sân bằng rác 2/11. Mỗi lượt, 2 mảnh rác lắp vào cyborg, tăng sinh lực và công của nó theo lượng sinh lực còn lại của chúng (nó có thể đạt tới 13/85).
junk.trash=Rác

snowblood=Huyết tuyết
snowblood.description=Chuyên môn hóa: Kiểm soát. Kiểm soát chiến trường lạnh lùng, vật chất và đôi chút mỉa mai: mỗi cái chết đều có giá, mỗi ân huệ đều là món nợ. Hơi ấm không nằm trong hợp đồng của Huyết tuyết. Hy vọng duy nhất là chờ Amaterasu, người có thể nhận ra những sinh vật của mình.
snowblood.tracker=Người truy đuổi
snowblood.tracker.description=Khi một sinh vật được triệu hồi ở ô liền kề, nó nhận bất tử trong 1 lượt
snowblood.hunter=Săn tiền thưởng
snowblood.hunter.description=Khi được triệu hồi, nó gây 2 sát thương lên sinh vật đối diện. Khi nó giết sinh vật đối diện, nó cho chủ nhân 1/3 giá trị của sinh vật ấy dưới dạng mana (làm tròn lên)
snowblood.maiko=Maiko
snowblood.maiko.description=Chừng nào còn sống, nó giảm 1 công của sinh vật đối diện và sinh vật liền kề. Mỗi lượt, nó hồi phục 1 sinh lực cho sinh vật đồng minh liền kề. Sau khi được triệu hồi, lá bài của nó được thay bằng thư tử (giá 3, 0/3 - giảm sát thương phải nhận xuống 1 và không thể hồi phục). Khi nó chết, nó gây 15 sát thương lên sinh vật đối diện
snowblood.letter=Thư tử
snowblood.letter.description=Giảm sát thương phải nhận xuống 1. Khi nó chết, nó gây 15 sát thương lên sinh vật đối diện. (Không thể hồi phục)
snowblood.echo=Dư âm
snowblood.echo.description=Lập tức kích hoạt mọi hiệu ứng "mỗi lượt" và "trực tiếp" của sinh vật đồng minh, rồi mọi sinh vật Huyết tuyết đồng minh tấn công
snowblood.kojiro=Kojiro
snowblood.kojiro.description=Có thể được triệu hồi ở bất kỳ ô nào của chủ nhân, đã chiếm hay trống. Nó tấn công khi được triệu hồi, với +4 công trong lượt đó nếu có sinh vật ở ô đối diện. Mỗi lượt, nó gây 2 sát thương lên sinh vật đối diện và mọi sinh vật liền kề (hàng xóm là các ô đã đầy liên tiếp quanh nó)
snowblood.guide=Hướng dẫn viên chiến tranh
snowblood.guide.description=Sinh vật được triệu hồi kế tiếp gây sát thương lên mọi sinh vật địch bằng đúng công của nó. Khi một sinh vật đặc biệt đồng minh được triệu hồi, nó hồi phục 1 sinh lực cho mọi sinh vật liền kề (hàng xóm là các ô đã đầy liên tiếp quanh nó)
snowblood.janus=Janus
snowblood.janus.description=Khi được triệu hồi và mỗi lượt, nó hồi 2 sinh lực cho chính nó và các ô liền kề, đồng thời gây 1 sát thương lên những sinh vật còn lại của chủ nhân; với mỗi sinh vật bị thương, chủ nhân nhận 1 sinh lực và 1 mana mang lớp của sinh vật ấy
snowblood.amaterasu=Amaterasu
snowblood.amaterasu.description=Khi chủ nhân triệu hồi một sinh vật mang nguyên tố:\n- [@0]: Amaterasu gây 5 sát thương lên sinh vật đối diện\n- [@1]: tăng sức mạnh thấp nhất lên 1\n- [@2]: gây 3 sát thương lên đối phương\n- [@3]: hồi phục 3 sinh lực cho chủ nhân\n
zen=Thiền
zen.description=Chuyên môn hóa: Cân bằng. Thiền đáp lại chiến trường đúng như nó đang là: gặp gỡ mối đe dọa mạnh nhất, chữa lành đồng minh yếu nhất, và mỗi ô trống vẫn còn có thể thành lợi lợi.
zen.elementesist=Người gọi nguyên tố
zen.elementesist.description=Gây sát thương lên lá bài đối diện, và lên mọi lá bài đối diện cùng nguyên tố.
zen.redlight=Đèn đỏ
zen.redlight.description=Tăng 1 điểm tấn công cho bản thân và các sinh vật liền kề, miễn là sinh vật ở ô đối diện có sức tấn công cao hơn.
zen.focus=Tập trung
zen.focus.description=Nhận 1 mana mang lớp của hai sinh vật mạnh nhất của đối thủ và của hai sinh vật yếu nhất của bạn.
zen.guard=Vệ binh điện
zen.guard.description=Gây 3 sát thương lên những sinh vật đã gây sát thương cho chủ nhân.
zen.dreamer=Kẻ mơ
zen.dreamer.description=Mỗi lượt gây 4 sát thương lên sinh vật đối phương yếu nhất (ngoài cùng bên trái nếu bằng nhau) và mất 2 máu.
zen.mimic=Kẻ bắt chước
zen.mimic.description=Đầu lượt của bạn, một kén xuất hiện ở một ô trống ngẫu nhiên. Triệu hồi một sinh vật ở đó để nhận 2 mana mang lớp của nó và 3 sinh lực cho người chơi.
zen.cocoon=Kén
zen.cocoon.description=Triệu hồi một sinh vật ở đây để nhận 2 mana mang lớp của nó và 3 sinh lực cho người chơi.
zen.fighter=Chiến binh thiền
zen.fighter.description=Nếu sinh vật đối diện có công lớn hơn, nhiều sinh lực hơn hoặc giá cao hơn, mỗi lượt bạn nhận 1 mana mang lớp của sinh vật ấy và hồi phục 3 sinh lực. Hấp thụ 7 sát thương từ phép thuật và năng lực. Mỗi khi chủ nhân bị đánh, công của nó tăng 1 trong một lượt.
zen.inertia=Quán tính
zen.inertia.description=Miễn nhiễm với phép thuật. Sinh ra Vật chất ở ô trống kế tiếp bên phải. Khi được triệu hồi và mỗi lượt, chừng nào Vật chất còn trong trận, nó hồi phục 3 sinh lực cho sinh vật yếu nhất của chủ nhân.
zen.matter=Vật chất
zen.matter.description=Khi được triệu hồi và mỗi lượt, chừng nào Quán tính còn trong trận, nó gây 3 sát thương lên sinh vật mạnh nhất của đối phương.

highpriest=Đại Tư Tế
highpriest.description=Năng lực đặc biệt của lớp - thánh đạo: tùy thuộc tổng cấp của sinh vật Lửa và Đất hay của sinh vật Nước và Gió của chủ nhân cao hơn, lượt rút bài đặc biệt của họ thay đổi, thành lượt rút của Ra hoặc của Set. "Hermopolis mở ra và đầu tôi được niêm phong. O Thoth, con mắt của Horus còn nguyên vẹn, Con Mắt của Horus cứu tôi, và trang sức của tôi rực rỡ, lấy từ trán của Ra, cha của các vị thần; tôi là vị Osiris này ở phía Tây. Osiris biết ngày của mình, và nếu ngài không tồn tại trong ngày ấy, thì tôi cũng sẽ không tồn tại. Tôi là Ra, người ở cùng các vị thần, và tôi sẽ không diệt vong; hãy đứng dậy, Horus, để tôi có thể xếp ngài vào hàng các vị thần."
highpriest.Sacredscarab=Bọ cánh cứng thiêng
highpriest.Sacredscarab.description=Giảm 2X sát thương không phải phép thuật mà nó phải nhận; X = số sinh vật liền kề.
highpriest.sunpriest=Tư tế mặt trời
highpriest.sunpriest.description=Khi nó tấn công, nó gây lên mọi sinh vật địch sát thương bằng sức mạnh thấp nhất của chủ nhân.
highpriest.Apis=Apis
highpriest.Apis.description=Mỗi lượt, nó cho chủ nhân 1 sức mạnh đặc biệt và 3 sinh lực cho mỗi con Apis khác trên sân.
highpriest.Bennu=Bennu
highpriest.Bennu.description=Nếu bị giết bởi một lá bài địch, nó tấn công ô đối diện với công gấp ba trước khi chết.
highpriest.EyeofWajet=Con mắt Wajet
highpriest.EyeofWajet.description=Nó hồi phục 1 sinh lực cho chủ nhân và các sinh vật của chủ nhân cho mỗi lá bài của chủ nhân đã được lật, và gây lượng sát thương tương ứng lên mọi kẻ địch.
highpriest.sphinx=Sphinx
highpriest.sphinx.description=Khi nó chết, nó để lại một câu đố 0/6. Nếu câu đố bị hủy bởi sinh vật địch, Sphinx tái sinh với sinh lực bị chia đôi. Nếu câu đố bị hủy bởi phép thuật hoặc năng lực địch, đối phương mất 3 sức mạnh ở nguyên tố cao nhất.
highpriest.Ouroboros=Ouroboros
highpriest.Ouroboros.description=Đầu lượt của chủ nhân, nó triệu hồi một rắn vĩnh cửu 2/8 ở ô trống gần nhất. Cuối lượt của đối phương, con rắn chết và hồi phục X sinh lực cho chủ nhân và cho Ouroboros (X = sinh lực còn lại của nó).
highpriest.Wingeddragon=Rồng cánh của Ra
highpriest.Wingeddragon.description=Khi vào trận, nó triệu hồi một viên đá mặt trời 0/22 ở ô trống gần nhất (nó tăng 2 sát thương từ phép thuật của chủ nhân và tăng 1 công của Ra mỗi lượt).
highpriest.Ancientcrocodile=Cá sấu cổ đại
highpriest.Ancientcrocodile.description=Khi nó tấn công, nó bỏ qua lượt kế tiếp (tiêu hóa).
highpriest.Serpopard=Serpopard
highpriest.Serpopard.description=Khi chủ nhân triệu hồi một sinh vật đặc biệt, nó di chuyển vào ô gần nhất không bị chặn và nhân đôi công trong 1 lượt.
highpriest.Anubite=Anubite
highpriest.Anubite.description=Khi nó giết một sinh vật, nó triệu hồi một xác ướp canh gác 4/20 không có năng lực đặc biệt ở ô trống gần nhất.
highpriest.Babi=Babi
highpriest.Babi.description=Khi sức mạnh của đối phương tăng lên, nó gây lượng sát thương tương ứng lên sinh vật đối diện.
highpriest.Curseofchaos=Lời nguyền hỗn loạn
highpriest.Curseofchaos.description=Gây lên sinh vật mục tiêu và sinh vật liền kề sát thương bằng tổng công của chúng.
highpriest.Simoom=Simuuoom
highpriest.Simoom.description=Đưa công của mọi sinh vật địch xuống còn 2. Chúng phục hồi 3 công mỗi lượt bắt đầu từ lượt kế tiếp.
highpriest.Ammit=Ammit
highpriest.Ammit.description=Khi bất kỳ sinh vật nào chết, nó gây lên chủ nhân sát thương bằng sức mạnh ở nguyên tố ấy và cho chủ nhân 1 sức mạnh đặc biệt.
highpriest.Apep=Apep
highpriest.Apep.description=Tấn công mọi kẻ địch. Mỗi lượt, nó giảm 1 sức mạnh nguyên tố của cả hai người chơi.
highpriest.puzzle=câu đố
highpriest.puzzle.description=Nếu câu đố bị hủy bởi sinh vật địch, Sphinx tái sinh với sinh lực bị chia đôi. Nếu câu đố bị hủy bởi phép thuật hoặc năng lực địch, đối phương mất 3 sức mạnh ở nguyên tố cao nhất.
highpriest.guardianmummy=xác ướp canh gác
highpriest.sunstone=đá mặt trời
highpriest.sunstone.description=Tăng 2 sát thương từ phép thuật của chủ nhân và tăng 1 công của Ra mỗi lượt
highpriest.serpent=rắn vĩnh cửu
highpriest.serpent.description=Tăng 2 sát thương từ phép thuật của chủ nhân và tăng 1 công của Ra mỗi lượt

shadowmage=Thầy bóng
shadowmage.description=Chuyên môn hóa: Ẩn thóp. Thầy bóng dệt nên lớp phòng ngự khổng lồ rồi khiến tan - khiên chắn, im lặng, và những lưỡi kiếm vô hình chỉ kéo dài một lượt. Ý tưởng chủ đạo của lớp này là tạo ra một mức phòng ngự cực lớn, nhưng chỉ trong thời gian ngắn, giống như một hiệu ứng "tan dần". Nhờ vậy, ý tưởng về ẩn thóp như một cơ chế giờ đây có thể được hình dung trong vũ trụ Spectromancer.
shadowmage.archer=Cung thủ bóng
shadowmage.archer.description=Khi được triệu hồi, gây 6 sát thương lên đối phương. Khi Cung thủ bóng chết, đối phương hồi phục 6 sinh lực.
shadowmage.stalker=Săn mồi bóng
shadowmage.stalker.description=Vị trí của Săn mồi bóng không lộ ra cho đối phương cho tới khi nó nhận sát thương.
shadowmage.weaver=Người dệt màn đêm
shadowmage.weaver.description=Khi được triệu hồi, sinh vật liền kề bỏ qua mọi sát thương cho tới cuối lượt kế tiếp của đối phương.
shadowmage.silencer=Kẻ câm lặng
shadowmage.silencer.description=Khi được triệu hồi, sinh vật đối diện không thể tấn công, và đối phương không thể dùng lá bài mang nguyên tố của sinh vật ấy, cho tới cuối lượt kế tiếp của họ.
shadowmage.eclipse=Nhật thực
shadowmage.eclipse.description=Tăng 2 sức mạnh Lửa, Nước, Gió và Đất của người thi triển. Người thi triển bỏ qua tới 30 sát thương cho tới cuối lượt kế tiếp của đối phương.
shadowmage.spike=Gai đau đớn
shadowmage.spike.description=Gây 16 sát thương lên mọi sinh vật địch. Cuối lượt của người thi triển, hồi phục 16 sinh lực cho mọi sinh vật địch.
shadowmage.warden=Quản giữ bóng tối
shadowmage.warden.description=Quản giữ bóng tối luôn bỏ qua sát thương đầu tiên nó nhận mỗi lượt.
shadowmage.assassin=Đại sư ám sát
shadowmage.assassin.description=Khi được triệu hồi, gây 12 sát thương lên sinh vật ở ô đối diện. Có thể thay thế bất kỳ sinh vật đồng minh nào có giá 9 trở xuống. Người thi triển nhận sức mạnh mang nguyên tố của sinh vật bị thay bằng bằng một nửa giá của sinh vật ấy (làm tròn lên).

battlemage=Pháp sư chiến tranh
battlemage.description=Chuyên môn hóa: Chiến thuật. Sinh vật Pháp sư chiến tranh ghép chỉ số tấn công hung hăng với năng lực phòng ngự, hoặc ngược lại. Phép thuật vừa để tấn công vừa để bảo vệ. Giữ đường tuyến cân bằng, rồi làm nghiêng nó.
battlemage.taunt=Khiêu khích
battlemage.taunt.description=Sinh vật mục tiêu của bạn lập tức gây sát thương lên đối phương bằng đúng công của nó. Nếu bạn nhắm vào một sinh vật địch có công thấp hơn sinh vật đối diện với nó, hãy làm choáng sinh vật ấy.
battlemage.rune=Chiến binh rune
battlemage.rune.description=Giảm 2 sát thương của phép thuật đối phương.
battlemage.sergeant=Đại úy bạc
battlemage.sergeant.description=Sinh vật liền kề không phải tường gây thêm 3 sát thương lên đối phương khi không bị chặn.
battlemage.knight=Kỵ sĩ lao tới
battlemage.knight.description=Kỵ sĩ lao tới tấn công hai lần khi bị chặn. Nếu sau lần tấn công đầu nó không còn bị chặn, nó không tấn công lần thứ hai.
battlemage.fieldmage=Pháp sư tiền tuyến
battlemage.fieldmage.description=Sát thương phép thuật địch gây ra lên chủ nhân hoặc các sinh vật khác của chủ nhân được chuyển hướng sang Pháp sư tiền tuyến.
battlemage.cavalier=Kỵ binh vàng
battlemage.cavalier.description=Nhận 1 công cho mỗi ô trống ở phía bạn trên sân. Tổ hợp bị cấm: Ngày tận thế.
battlemage.warcry=Tiếng gào vang
battlemage.warcry.description=Gây 9 sát thương lên đối phương và mọi sinh vật địch. Những sinh vật địch ấy mất năng lực cho tới cuối lượt kế tiếp của bạn.
battlemage.retinue=Đoàn tùy tùng tướng
battlemage.retinue.description=Bạn có thể chơi thêm một sinh vật trong lượt này. Chừng nào Đoàn tùy tùng tướng còn trong trận, lá bài Chiến thuật kế tiếp bạn chơi tốn 1 mana.

tinker=Kỹ sư cơ khí
tinker.description=Chuyên môn hóa: Kỹ sư cơ khí. Một xưởng đồng hơ kiểu steampunk rải bom nổ chậm vào đội tuyến địch, rồi kích hoạt chúng - những nhát chém bất ngờ, đội quân lớn dần, và một bà hoàng biến mỗi dây cháy thành một vụ nổ.
tinker.bomb=Bom kỹ sư
tinker.bomb.description=Mỗi lượt mất 1 sinh lực. Khi Bom kỹ sư chết, nó gây 3 sát thương lên chủ nhân.
tinker.plant=Kỹ sư cơ khí
tinker.plant.description=Đặt một Bom kỹ sư vào ô trống nào đó ở phía đối phương.
tinker.spider=Nhện đồng hồ
tinker.spider.description=Khi được triệu hồi, nó đặt một Bom kỹ sư vào ô đối diện nếu ô ấy trống. Khi Nhện đồng hồ giết một sinh vật đối phương, nó tấn công lại.
tinker.falcon=Chim ưng đồng hồ
tinker.falcon.description=Khi được triệu hồi, nó đặt một Bom kỹ sư vào ô trống ngoài cùng bên phải của đối phương. Khi nó chết, nó đặt một Bom kỹ sư vào ô trống ngoài cùng bên trái của đối phương.
tinker.scatter=Bom rải
tinker.scatter.description=Gây 8 sát thương lên mọi sinh vật đối phương. Với mỗi sinh vật chết vì phép thuật này, đặt một Bom kỹ sư vào ô sinh vật ấy đã chiếm.
tinker.soldier=Lính hơi nước
tinker.soldier.description=Mỗi khi một Bom kỹ sư của đối phương chết, công của Lính hơi nước tăng vĩnh viễn 1.
tinker.automaton=Người máy
tinker.automaton.description=Cuối lượt của chủ nhân, Người máy đặt một Bom kỹ sư vào một ô trống ngẫu nhiên của đối phương.
tinker.queen=Bà hoàng đồng hồ
tinker.queen.description=Khi được triệu hồi, giết mọi Bom kỹ sư của đối phương đang trong trận. Chừng nào Bà hoàng đồng hồ còn trong trận, mọi Bom kỹ sư gây thêm 3 sát thương lên đối phương.
tinker.dragon=Rồng hơi nước
tinker.dragon.description=Tấn công ngay khi được triệu hồi. Khi được triệu hồi, nó đặt Bom kỹ sư vào ba ô trống ngẫu nhiên của đối phương. Mỗi khi Rồng hơi nước giết một sinh vật đối phương, chủ nhân nhận 1 sức mạnh Kỹ sư cơ khí.

conjurer=Người triệu hồi
conjurer.description=Chuyên môn hóa: Triệu hồi. Phép thuật và sinh vật nuôi lẫn nhau: mỗi phép thuật bạn thi triển lại kích hoạt Triệu hồi trên sinh vật của bạn. Những nhát chém bất ngờ, mana theo nguyên tố, và một nhịp thứ hai từ cùng một nước đi.
conjurer.nectar=Mật oải hương
conjurer.nectar.description=Hồi phục 5 sinh lực cho sinh vật mục tiêu (của bạn hoặc của đối phương). Bạn nhận 1 sức mạnh mang nguyên tố của sinh vật ấy.
conjurer.bravery=Dũng cảm
conjurer.bravery.description=Tăng 1 công cho mỗi sinh vật không phải tường của bạn cho tới cuối lượt. Nhận 1 sức mạnh Triệu hồi.
conjurer.warmage=Pháp sư chiến
conjurer.warmage.description=Khi được triệu hồi, sinh vật của bạn nhận +2 công cho tới cuối lượt. Triệu hồi: các sinh vật khác của bạn nhận +2 công cho tới cuối lượt.
conjurer.golem=Golem xương
conjurer.golem.description=Golem xương không nhận sát thương từ phép thuật và năng lực. Triệu hồi: công của Golem xương tăng vĩnh viễn 1. Các sinh vật khác của bạn được hồi phục 3.
conjurer.nurture=Nghi thức nuôi dưỡng
conjurer.nurture.description=Sinh vật của bạn không tấn công lượt này. Sau các hiệu ứng đặc biệt, chúng được hồi phục lượng bằng công cộng 4, và bạn được hồi phục tổng số công của chúng cộng 4.
conjurer.pain=Đau đớn của tinh thần
conjurer.pain.description=Gây 3 sát thương lên sinh vật đối phương mục tiêu và lên đối phương. Gây thêm 2 sát thương cho mỗi sức mạnh ở nguyên tố của sinh vật ấy mà đối phương có.
conjurer.guard=Vệ binh bất thiện
conjurer.guard.description=Khi được triệu hồi, giảm 3 công của mỗi sinh vật đối phương cho tới cuối lượt của đối phương. Triệu hồi: vĩnh viễn giảm 1 công của mỗi sinh vật đối phương.
conjurer.mystic=Huyền sư bóng tối
conjurer.mystic.description=Khi được triệu hồi, tăng 2 sức mạnh Lửa, Nước, Gió và Đất. Triệu hồi: tăng 2 sức mạnh Triệu hồi.

rogue=Lừa đảo
rogue.description=Chuyên môn hóa: Ẩn thóp. Bất ngờ tấn công đường tuyến bị chặn, cướp tốc độ tăng mana, và hoàn tất điều mà một nhát đâm bắt đầu. Thân hình nhỏ, thời điểm bẩn thỉu.
rogue.sneak=Tấn công lén lút
rogue.sneak.description=Làm choáng sinh vật mục tiêu và gây 4 sát thương lên nó. Nếu mục tiêu đang bị chặn, phép thuật này gây gấp đôi sát thương.
rogue.trickster=Kẻ lừa đảo lão lớn
rogue.trickster.description=Khi gặp phải sinh vật ở ô đối diện, nó gây 2 sát thương lên đối phương ở đầu lượt của chủ nhân.
rogue.thief=Kẻ trộm năng lượng
rogue.thief.description=Đầu lượt của chủ nhân, nó giảm 1 sức mạnh của đối phương ở loại sinh vật đối diện với Kẻ trộm năng lượng.
rogue.dancer=Nữ vũ công bóng
rogue.dancer.description=Khi Nữ vũ công bóng gặp phải sinh vật ở ô đối diện, cô tấn công thêm một lần.
rogue.fighter=Đấu sĩ đường phố
rogue.fighter.description=Mỗi khi Đấu sĩ đường phố nhận sát thương từ sinh vật ở ô đối diện, công của anh tăng vĩnh viễn 2.
rogue.assassin=Sát thủ người tinh linh
rogue.assassin.description=Khi được triệu hồi, gây 8 sát thương lên sinh vật ở ô đối diện. Nếu sinh vật ấy chết, cô tấn công ngay lập tức.
rogue.trap=Bẫy huyền thuật
rogue.trap.description=Giảm 2 mọi sức mạnh của đối phương và bắt họ phải bỏ lượt kế tiếp.
rogue.archer=Cung thủ bóng tối
rogue.archer.description=Khi được triệu hồi, hủy diệt mọi sinh vật đối phương có 6 sinh lực trở xuống. Khi Cung thủ bóng tối giết sinh vật ở ô đối diện, nó gây 3 sát thương lên đối phương.

meteomancer=Người đoán thời tiết
meteomancer.description=Chuyên môn hóa: Tiên tri. Khi bạn triệu hồi một sinh vật Meteo, hãy chọn một nguyên tố cơ bản làm Nguyên tố Được Gọi của bạn. Phần lớn lá bài Meteo kích hoạt khi đối phương chơi lá bài mang nguyên tố ấy.
meteomancer.thief=Kẻ trộm sét
meteomancer.thief.description=Khi đối phương dùng phép thuật mang Nguyên tố Được Gọi, Gọi sấm được thi triển lên sinh vật có nhiều sinh lực nhất của đối phương (6 sát thương lên nó và 6 lên đối phương).
meteomancer.extremophile=Sinh vật chịu cực
meteomancer.extremophile.description=Miễn nhiễm với sát thương từ phép thuật và năng lực đối phương. Khi đối phương chơi một lá bài mang Nguyên tố Được Gọi, một Sinh vật chịu cực khác xuất hiện ở ô trống ngoài cùng bên phải của chủ nhân.
meteomancer.clairvoyant=Người nhìn thấy tương lai
meteomancer.clairvoyant.description=Khi được triệu hồi, đối phương nhận 3 mana của Nguyên tố Được Gọi mới và mất 1 mana của mọi loại khác.
meteomancer.mistwalker=Kẻ bước trong sương
meteomancer.mistwalker.description=Nguyên tố Được Gọi chọn khi Kẻ bước trong sương được triệu hồi không được tiết lộ cho đối phương. Công của Kẻ bước trong sương tăng 5 chừng nào nó là sinh vật Meteo duy nhất của bạn trong trận.
meteomancer.grenadier=Bộ binh astral
meteomancer.grenadier.description=Khi đối phương triệu hồi một sinh vật không đặc biệt, sinh vật ấy mất nửa sinh lực (làm tròn lên) nếu thuộc Nguyên tố Được Gọi, và chịu 4 sát thương nếu không.
meteomancer.fateweaver=Người dệt số phận
meteomancer.fateweaver.description=Khi đối phương chơi một lá bài mang Nguyên tố Được Gọi, bạn nhận 4 mana của nguyên tố ấy và được chơi thêm một lá bài mang Nguyên tố Được Gọi ở lượt kế tiếp.
meteomancer.prism=Pháp sư lăng kính
meteomancer.prism.description=Mỗi lượt, gây lên mỗi sinh vật đối phương sát thương bằng một nửa mana Nguyên tố Được Gọi của đối phương (làm tròn xuống). Khi đối phương chơi một lá bài mang Nguyên tố Được Gọi, công của Pháp sư lăng kính tăng vĩnh viễn 1.
meteomancer.storm=Bão astral
meteomancer.storm.description=Khi đối phương chơi một lá bài mang Nguyên tố Được Gọi, gây 19 sát thương lên đối phương và mọi sinh vật đối phương.

quantumancer=Lượng tử sư
quantumancer.description=Chuyên môn hóa: Chồng chất. Phép thuật thích nghi với mana địch, những chiến binh chia sẻ sát thương của nhau, và những ấn triện lấy đi các lựa chọn của đối phương. Các loại phép thuật khác nhau chỉ đơn giản là những biểu hiện khác nhau của năng lượng thuần khiết, nhưng gần đây vài pháp sư, được đa số biết đến dưới cái tên Lượng tử sư, đã học cách điều khiển chính dòng Năng lượng. Những pháp sư này có thể dùng sự khéo léo của mình để kiểm soát dòng lực nguyên thủy ấy, và tấn công kẻ địch không chỉ bằng quyền năng của vũ trụ mà còn bằng cả những quyền năng mà kẻ địch ném về phía họ.
quantumancer.surge=Đột phá sức mạnh
quantumancer.surge.description=Gây lên mỗi sinh vật đối phương sát thương bằng mana Lớp của sinh vật ấy, nhưng không ít hơn 3 sát thương.
quantumancer.kineticist=Nhà cơ động lực
quantumancer.kineticist.description=Phép thuật và năng lực đối phương hồi phục cho Nhà cơ động lực thay vì gây sát thương, và tăng vĩnh viễn 1 công cho nó.
quantumancer.warrior=Chiến binh chiều không gian
quantumancer.warrior.description=Khi Chiến binh chiều không gian tấn công một sinh vật, nó cũng gây sát thương lên đối phương bằng đúng sức công của nó.
quantumancer.martyr=Đạo tử từ tính
quantumancer.martyr.description=Mọi sát thương phép thuật đối phương gây ra lên sinh vật của bạn đều gây lên Đạo tử từ tính thay thế.
quantumancer.wall=Bức tường lân quang
quantumancer.wall.description=Khi Bức tường lân quang bị tấn công, nó gây lên mỗi sinh vật đối phương sát thương bằng cấp của sinh vật đã tấn công nó.
quantumancer.sealing=Linh thần phong ấn
quantumancer.sealing.description=Khi đối phương chơi một lá bài, đối phương không thể chơi lại lá bài ấy cho tới khi Linh thần phong ấn chết. Chừng nào nó còn trong trận, chủ nhân không thể chơi thêm Linh thần phong ấn khác.
quantumancer.fusion=Elemental dung hợp
quantumancer.fusion.description=Công của Elemental dung hợp bằng kho mana cao nhất của đối phương. Mỗi lượt, giảm 1 kho mana thấp nhất của đối phương.
quantumancer.cosmic=Pháp sư vũ trụ
quantumancer.cosmic.description=Khi Pháp sư vũ trụ vào trận, bạn nhận thêm một lượt để chơi lại một phép thuật giá 10 trở xuống mà đối phương đã dùng, miễn phí. Bạn có thể bỏ qua việc chơi lại.
quantumancer.cosmic.choose=Chơi lại phép thuật của đối phương miễn phí, hoặc bỏ qua
meteomancer.choose=Nguyên tố được gọi (hiện tại: {0})
meteomancer.noelement=không có
meteomancer.called=Nguyên tố được gọi: {0}
powermancer=Sức mạnh sư
powermancer.description=Chuyên môn hóa: Sức mạnh. Mặc cả bằng sức mạnh đặc biệt để thi triển bất cứ thứ gì, hy sinh sinh vật để lấy sức mạnh và sinh lực, và đánh thuế sức mạnh đối phương. Mọi lá bài của Sức mạnh sư đều xoay quanh một ý tưởng: quản lý sức mạnh của bạn một cách cực kỳ hiệu quả.
powermancer.bargain=Điều đoán địa ngục
powermancer.bargain.description=Bạn có thể chơi bất kỳ lá bài cơ bản nào bằng cách dùng hết toàn bộ sức mạnh loại ấy và phần còn lại từ sức mạnh đặc biệt. Cho phép bạn chơi thêm một lá bài lượt này. Không thể chơi trong hai lượt đầu tiên của bạn.
powermancer.burial=Cựu trang vĩnh cửu
powermancer.burial.description=Hy sinh một sinh vật: nhận 3 sức mạnh loại của nó và 1 sức mạnh của mọi loại khác. Nhận sinh lực bằng hai lần giá của nó, tối đa 10.
powermancer.hunter=Săn sức mạnh
powermancer.hunter.description=Mỗi khi Săn sức mạnh gây sát thương lên sinh vật đối phương, bạn nhận 1 sức mạnh đặc biệt. Mỗi khi nó gây sát thương lên đối phương, giảm 1 sức mạnh ngẫu nhiên của đối phương.
powermancer.tower=Tháp ngà
powermancer.tower.description=Chừng nào còn trong trận, phép thuật của bạn tốn ít hơn 2 mana và mọi lá bài khác tốn ít hơn 1 mana. Mỗi khi bạn chơi một lá bài, gây 3 sát thương lên đối phương; nếu đó là phép thuật thay vào đó bạn nhận 3 sinh lực.
powermancer.equilibrium=Cân bằng
powermancer.equilibrium.description=Gây lên đối phương sát thương bằng sức mạnh cao nhất của họ, rồi giảm sức mạnh ấy 2. Nhận sinh lực bằng sức mạnh thấp nhất của bạn, rồi tăng sức mạnh ấy lên 2.
powermancer.hound=Chó săn astral
powermancer.hound.description=Tăng 1 tốc độ tăng mana đặc biệt của bạn và giảm 1 tốc độ tăng mana đặc biệt của đối phương.
powermancer.stasis=Ức đọng
powermancer.stasis.description=Giảm 1 mọi sức mạnh của đối phương, làm choáng mọi sinh vật đối phương, và khiến đối phương không thể chơi lá bài ở lượt kế tiếp.
powermancer.rainbow=Ảnh thần cầu vồng
powermancer.rainbow.description=Triệu hồi bốn Ảnh thần 2/16 vào các ô trống ngẫu nhiên: mỗi nguyên tố Lửa, Nước, Gió và Đất một con. Mỗi con tăng 1 tốc độ tăng mana của nguyên tố ấy chừng nào còn trong trận.
powermancer.avatar.fire=Ảnh thần lửa
powermancer.avatar.fire.description=Ảnh thần của Lửa. Tăng 1 tốc độ tăng mana lửa của bạn chừng nào còn trong trận.
powermancer.avatar.water=Ảnh thần nước
powermancer.avatar.water.description=Ảnh thần của Nước. Tăng 1 tốc độ tăng mana nước của bạn chừng nào còn trong trận.
powermancer.avatar.air=Ảnh thần gió
powermancer.avatar.air.description=Ảnh thần của Gió. Tăng 1 tốc độ tăng mana gió của bạn chừng nào còn trong trận.
powermancer.avatar.earth=Ảnh thần đất
powermancer.avatar.earth.description=Ảnh thần của Đất. Tăng 1 tốc độ tăng mana đất của bạn chừng nào còn trong trận.

shadowcaster=Người triệu hồi bóng tối
shadowcaster.description=Chuyên môn hóa: Bóng tối. Quyền lực bóng tối là một bộ đếm riêng, không phải mana. Hút nối nỗi sợ hãi của kẻ địch, phủ bóng xuống chiến trường, và gọi những nàng tiên tinh bị nguyền rủa từ các cõi bóng. Người triệu hồi bóng tối dùng quyền lực Bóng tối của mình để làm rối loạn kẻ địch và gieo hỗn loạn vào hàng ngũ đối phương, hút nối nỗi sợ hãi của chúng để củng cố Quyền lực Bóng Tối của bản thân. Từ sâu trong Bóng Tối Thánh Thiện, Người triệu hồi bóng tối gọi những nàng tiên tinh bị nguyền rủa từ các cõi bóng để làm theo ý mình, và phủ một bóng tối quái dị xuống chiến trường.
shadowcaster.bat=Dơi khổng lồ
shadowcaster.bat.description=Mỗi khi Dơi khổng lồ gây sát thương lên sinh vật đối diện, nó tự hồi phục 3 sinh lực.
shadowcaster.wave=Làn sóng bóng
shadowcaster.wave.description=Gây X+2 sát thương lên mọi sinh vật đối phương (X = sức mạnh Bóng tối của người thi triển).
shadowcaster.noble=Quý tộc tinh linh tối
shadowcaster.noble.description=Nếu bị giết bởi phép thuật đối phương, nó tăng 2 sức mạnh Bóng tối cho chủ nhân.
shadowcaster.mage=Pháp sư tinh linh tối
shadowcaster.mage.description=Tăng 1 chi phí và 2 sát thương cho mọi phép thuật của chủ nhân. Mỗi khi chủ nhân thi triển phép thuật, tăng 1 sức mạnh Bóng tối cho chủ nhân.
shadowcaster.scythe=Lưỡi liềm bóng
shadowcaster.scythe.description=Gây X+4 sát thương lên mọi sinh vật đối phương (X = sức mạnh Bóng tối của người thi triển). Với mỗi sinh vật bị giết, gây 2 sát thương lên đối phương và tăng 1 sức mạnh Bóng tối cho người thi triển.
shadowcaster.assassin=Sát thủ tinh linh tối
shadowcaster.assassin.description=Tấn công ngay lượt được triệu hồi. Mỗi khi nó giết một sinh vật đối phương, tăng 1 sức mạnh Bóng tối cho chủ nhân.
shadowcaster.moonblade=Lưỡi cày trăng
shadowcaster.moonblade.description=Đầu lượt của chủ nhân, gây lên mọi sinh vật đối phương sát thương bằng sức mạnh Bóng tối của chủ nhân. Mỗi khi nó giết một sinh vật, tăng 1 sức mạnh Bóng tối cho chủ nhân.
shadowcaster.priestess=Nữ tư tế bóng tối
shadowcaster.priestess.description=Khi được triệu hồi, làm choáng mọi sinh vật đối phương. Khi bị giết, tăng 2 sức mạnh Bóng tối cho chủ nhân.

spiritshaman=Tam pháp tinh thần
spiritshaman.description=Chuyên môn hóa: Thả linh. Sức mạnh Linh là mana đặc biệt. Triệu hồi các Tổng linh; khi điều kiện Thả của một tổng được thoả mãn, nó được thay bằng sinh vật Linh của mình trong ô ấy. Tam pháp tinh thần tiếp cận Vực Linh Hồn để tìm kiếm tri thức & sức mạnh, để các linh hồn của hoang dã dẫn đường cho họ. Họ dùng sức mạnh của những Tổng linh cổ xưa để gọi những sinh vật của Vực Linh Hồn & Thả chúng vào thế giới sống để chiến đấu bên cạnh họ.
spiritshaman.tortoise=Tổng rùa
spiritshaman.tortoise.description=Khi được triệu hồi, nó giải phóng mọi Tổng ở các ô liền kề. Thả: khi chủ nhân triệu hồi một sinh vật Linh khác.
spiritshaman.tortoise.spirit=Linh hồn rùa
spiritshaman.tortoise.spirit.description=Khi được giải phóng, tăng 1 sức mạnh Linh cho chủ nhân.
spiritshaman.fox=Tổng cáo
spiritshaman.fox.description=Khi được triệu hồi, gây lên sinh vật đối diện sát thương bằng đúng công của sinh vật ấy. Thả: ở đầu lượt của chủ nhân, nếu sinh lực của nó từ 5 trở xuống.
spiritshaman.fox.spirit=Linh hồn cáo
spiritshaman.fox.spirit.description=Khi được giải phóng, mọi Tổng khác của chủ nhân cũng được giải phóng, kể cả khi điều kiện Thả của chúng chưa được thoả mãn.
spiritshaman.deer=Tổng hươu
spiritshaman.deer.description=Mỗi lượt hồi phục 1 sinh lực cho chủ nhân. Thả: ở đầu lượt của chủ nhân, nếu sức mạnh Đất của chủ nhân từ 7 trở lên.
spiritshaman.deer.spirit=Linh hồn hươu
spiritshaman.deer.spirit.description=Khi được giải phóng, hồi phục 6 sinh lực cho mọi sinh vật khác của chủ nhân.
spiritshaman.owl=Tổng cú
spiritshaman.owl.description=Khi được triệu hồi, tăng 1 sức mạnh Lửa, Nước, Gió hoặc Đất thấp nhất của chủ nhân. Thả: khi một trong những sức mạnh ấy từ 1 trở xuống.
spiritshaman.owl.spirit=Linh hồn cú
spiritshaman.owl.spirit.description=Khi được giải phóng, tăng 2 sức mạnh Lửa, Nước, Gió hoặc Đất thấp nhất của chủ nhân.
spiritshaman.panther=Tổng báo
spiritshaman.panther.description=Công của nó tăng 1 mỗi lượt, nhưng nó không được tấn công. Thả: khi tổng công của Tổng báo và những sinh vật liền kề từ 12 trở lên.
spiritshaman.panther.spirit=Linh hồn báo
spiritshaman.panther.spirit.description=Công của nó bằng 2 cộng công mà Tổng báo có khi được giải phóng. Khi nó giết một sinh vật đối phương, nó tấn công lại ngay lập tức.
spiritshaman.awakening=Thức tỉnh tinh thần
spiritshaman.awakening.description=Hồi phục cho người thi triển và mọi sinh vật của người thi triển lượng bằng sức mạnh Linh của chủ nhân (trước khi trả giá phép thuật) và giải phóng mọi Tổng của người thi triển.
spiritshaman.bear=Tổng gấu
spiritshaman.bear.description=Trong lượt được triệu hồi, tăng 2 công cho mọi sinh vật khác của chủ nhân. Thả: khi có ít nhất 8 sinh vật trên sân (bao gồm chính nó).
spiritshaman.bear.spirit=Linh hồn gấu
spiritshaman.bear.spirit.description=Khi được giải phóng, gây 8 sát thương lên mọi sinh vật đối phương.
spiritshaman.eagle=Tổng đại bàng
spiritshaman.eagle.description=Khi được triệu hồi, tăng 4 sức mạnh Linh cho chủ nhân. Thả: khi sức mạnh Linh của chủ nhân từ 8 trở lên.
spiritshaman.eagle.spirit=Linh hồn đại bàng
spiritshaman.eagle.spirit.description=Khi được giải phóng, giảm 4 sức mạnh Linh của chủ nhân và tăng 2 mọi sức mạnh khác của chủ nhân.
chronomaster=Tam pháp thời gian
chronomaster.description=Chuyên môn hóa: Thời gian. Đóng băng hiện tại, nhảy cóc, và tua bàn đấu về ngày hôm qua.
chronomaster.freeze=Đóng băng
chronomaster.freeze.description=Sinh vật mục tiêu bỏ qua lượt kế tiếp của nó.
chronomaster.sprites=Bóng ma sáng
chronomaster.sprites.description=Những sinh vật siêu nhanh này không thể bị chặn.
chronomaster.accelerate=Tăng tốc thời gian
chronomaster.accelerate.description=Sinh vật đồng minh mục tiêu tấn công 2 hoặc 3 lần trong lượt này.
chronomaster.wall=Bức tường méo thời gian
chronomaster.wall.description=Chừng nào còn trong trận, chủ nhân không thể bị gây sát thương. Sinh vật của họ vẫn có thể bị gây sát thương.
chronomaster.aging=Hóa già
chronomaster.aging.description=Sinh vật mục tiêu vĩnh viễn mất 3 công.
chronomaster.groundhog=Tháng trùng
chronomaster.groundhog.description=Bàn đấu trở về như lúc bắt đầu lượt trước. Người chơi giữ nguyên sinh lực hiện tại. Cả hai người chơi mất 1 mana ở mọi lớp. Chống lại mọi lá bài quét sạch bàn đấu và những phép thuật chết người khác từ lượt trước.
chronomaster.queen=Nữ hoàng thời gian
chronomaster.queen.description=Khi được triệu hồi, mọi sinh vật đồng minh có thể tấn công thêm một lần trong lượt này.
chronomaster.king=Nữ vương thời gian
chronomaster.king.description=Lượt tới, chủ nhân có thể chơi hai lá bài.
chronomaster.king.phase=Chơi lá bài thứ hai
settings.dev=Nhà phát triển
settings.debug=Chế độ gỡ lỗi (chiến dịch: thắng mà không cần đánh)
button.debugwin=Thắng (gỡ lỗi)


campaign.paganist.name=Maela
campaign.paganist.message=Đá cổ đang khát. Thần của ta đang đói, và phép thuật của ngươi có mùi của một lễ vật tuyệt đẹp. Ngươi sẽ hiểu rằng sự hy sinh của mình khiến nỗi tuyệt vọng của ngươi trở nên có lý. Khiêu vũ chứ?
campaign.paganist.win=Lễ vật hóa ra là của ta. Đi đi; đá sẽ nhớ tên ngươi.
campaign.paganist.lose=Thần đã được no, và không phải nhờ ngươi. Quay lại khi tay ngươi vững vàng hơn.

sound.ambient=Âm thanh môi trường
earth.forestspider.description=Không có năng lực đặc biệt
earth.elemental.description=Tăng hồi mana Đất của chủ nhân thêm 1 mỗi lượt
entomologist.drone.description=Không có năng lực đặc biệt
shaman.ghost.description=Bạn đồng hành của Pháp sư. Tự nó không có năng lực: các lá khác của Pháp sư thay đổi công, sinh lực và sát thương nó phải chịu.

troopers=Quân đội
troopers.marine.description=Khi được triệu hồi trên phía sân của đối phương, Marine tự gây 4 sát thương lên mình.
troopers.conscription.description=Cho 1 mana Quân đội. Giá 0 lần đầu ra, rồi đắt thêm 1 mỗi lần sau.
troopers.barracks.description=Tăng tốc độ hồi mana Quân đội thêm 1 mỗi lượt
troopers.wraith.description=Mỗi lượt, gây 2 sát thương lên mọi sinh vật đối phương
troopers.goliath.description=Giảm 1 sát thương không phải phép thuật gây lên nó. Không thể bị sát thương bởi phép hay năng lực.
SiegeTank=Xe tăng vây thành
troopers.siegetank.description=Mỗi lượt, gây 8 sát thương lên sinh vật đối diện có sinh lực cao nhất
NuclearMissile=Tên lửa hạt nhân
troopers.nuclearmissile.description=Gây 19 sát thương lên mọi sinh vật đối phương
ScienceVessel=Tàu khoa học
troopers.sciencevessel.description=Khi được triệu hồi, gây 12 sát thương lên mọi sinh vật đối phương

dudes=Đấu sĩ

emotion=Cảm xúc
emotion.description=Chuyên hóa: Cảm xúc. Sợ hãi, nổi loạn, cô đơn, can đảm, tình yêu, hy vọng, đồng đội và huyền thoại - mỗi trạng thái thưởng riêng cho một thế trận khác nhau.
emotion.coward=Chiến binh hèn nhát
emotion.coward.description=Chiến binh hèn nhát chết ngay khi là sinh vật duy nhất còn lại trên phía sân của mình.
emotion.revolt=Nổi loạn
emotion.revolt.description=Gây sát thương lên đối phương bằng 2 + gấp hai số sinh vật họ điều khiển.
emotion.loneliness=Cô đơn
emotion.loneliness.description=Mọi sinh vật không có sinh vật đối diện chịu 16 sát thương.
emotion.courage=Chiến binh can đảm
emotion.courage.description=Công của Chiến binh can đảm được nhân ba khi sinh lực chủ nhân từ 12 trở xuống.
emotion.love=Chiến binh yêu thương
emotion.love.description=Mỗi lượt, Chiến binh yêu thương tự hồi sinh lực bằng số sinh vật đồng minh trên sân.
emotion.hope=Chiến binh hy vọng
emotion.hope.description=Khi Chiến binh hy vọng chết, mọi sinh vật đồng minh hồi 7 sinh lực và mọi sinh vật địch chịu 7 sát thương.
emotion.teamwork=Chiến binh đồng đội
emotion.teamwork.description=Công của Chiến binh đồng đội được nhân đôi khi cả hai ô liền kề đều có sinh vật đồng minh.
emotion.legend=Chiến binh huyền thoại
emotion.legend.description=Khi Chiến binh huyền thoại chết, sinh lực hiện tại của mỗi sinh vật đồng minh bị chia đôi, làm tròn lên.

paganist=Ngoại đạo
paganist.description=Chuyên hóa: Hi sinh. Ngoại đạo tiêu dùng sinh mạng và sinh vật của chính mình để nuôi một vị thần ngày càng đói. Lớp này xoay quanh việc hy sinh sinh vật, sinh lực và mana của bạn để gây sát thương khổng lồ lên đối phương và sinh vật của đối phương. Vì kiểm soát chiến trường là điều tối quan trọng, và mỗi lần hy sinh lại khiến bạn mất đi một ô, phần dưới bộ bài được thiết kế để cộng hưởng mạnh với phần còn lại của lớp, còn phần trên bộ bài thì mạnh hơn vô số so với các lớp khác. Các chủ đề lớn khác của lớp là sự tương đồng với Illusion, khi phần lớn năng lực gây sát thương trực tiếp, và việc nhiều lá bài liên quan đến tương tác với chi phí mana của các lá bài, như Illusion 6.
paganist.virgin=Trinh nữ tế lễ
paganist.virgin.description=Nếu Trinh nữ tế lễ bị phép giết, chủ nhân nhận sinh lực bằng lượng cô ta có trước phép ấy.
paganist.lamb=Cừu tế lễ
paganist.lamb.description=Khi Cừu tế lễ chết, chủ nhân lập tức triệu hồi một sinh vật ngẫu nhiên của Lớp này, bỏ qua giá của nó.
paganist.offering=Lễ vật cuối cùng
paganist.offering.description=Gây sát thương lên đối phương bằng tổng giá của ba sinh vật đắt nhất của người tung phép, rồi hi sinh chúng.
paganist.contract=Khế ước tà đạo
paganist.contract.description=Sinh vật địch mục tiêu bị hi sinh. Gây 13 sát thương lên đối phương, giảm theo giá của sinh vật ấy.
paganist.terrorize=Khủng bố
paganist.terrorize.description=Hủy diệt sinh vật địch mục tiêu, gây 13 sát thương lên đối phương và tăng vĩnh viễn giá các lá Lửa, Nước, Gió, Đất của họ thêm 1.
paganist.moloch=Moloch
paganist.moloch.description=Phải được triệu hồi lên một sinh vật khác của chủ nhân. Mỗi lượt nó hồi 4 sinh lực cho mọi người chơi và sinh vật. Đòn tấn công của nó gây sát thương lên mọi người chơi và sinh vật.
paganist.obliterate=Hủy diệt linh hồn
paganist.obliterate.description=Hủy diệt mọi sinh vật của đối phương. Người tung mất 3 sức mạnh ở mỗi Lớp và không thể ra lá bài nào trong lượt kế tiếp.
paganist.blood=Dòng sông máu
paganist.blood.description=Gây 25 sát thương lên người tung. Nếu người tung sống sót, gây 25 sát thương lên đối phương và mỗi sinh vật đối phương.

kahjivir=Nữ thợ săn Kahjivir
kahjivir.description=Chuyên hóa: Săn mồi. Các nữ thợ săn Kahjivir lao vào hàng có địch, trừng phạt hàng trống, và hung hãn hơn sau mỗi lần hạ gục.
kahjivir.hunger=Nỗi đói của thợ săn
kahjivir.hunger.description=Nữ thợ săn đồng minh mục tiêu tấn công thêm một lần lượt này và hồi máu bằng mọi sát thương cô ta gây ra trong lượt này.
kahjivir.ambush=Mồi phục bầy đàn
kahjivir.ambush.description=Nữ thợ săn đồng minh mục tiêu tăng vĩnh viễn 2 công. Mỗi sinh vật liền kề cô ta tấn công thêm một lần trong lượt này.
kahjivir.stalker=Nữ thợ rình Kahjivir
kahjivir.stalker.description=Khi được triệu hồi đối diện sinh vật địch, cô ta có thể tấn công ngay lượt được triệu hồi. Khi được triệu hồi đối diện ô trống, cô ta gây 3 sát thương lên đối phương.
kahjivir.javelin=Nữ lính phóng giáo
kahjivir.javelin.description=Đối diện sinh vật địch, công của cô ta tăng thêm 3.
kahjivir.dancer=Nữ vũ công tinh linh
kahjivir.dancer.description=Đối diện sinh vật địch, sát thương sinh vật gây lên cô ta bị giảm 2. Đối diện ô trống, sát thương phép gây lên cô ta bị giảm về 0.
kahjivir.shaman=Nữ pháp sư bộ lạc
kahjivir.shaman.description=Mỗi lần tấn công, công của cô ta tăng vĩnh viễn thêm 1. Đối diện sinh vật địch, cô ta tấn công hai lần mỗi lượt.
kahjivir.archer=Cung nữ Kahjivir
kahjivir.archer.description=Đối diện ô trống, công của cô ta tăng thêm 6. Đối diện sinh vật địch, mỗi lượt cô ta gây 3 sát thương lên mọi sinh vật địch.
kahjivir.headhuntress=Thủ lĩnh thợ săn bộ lạc
kahjivir.headhuntress.description=Khi được triệu hồi đối diện sinh vật địch có 25 sinh lực trở xuống, cô ta giết nó. Khi được triệu hồi đối diện ô trống, cô ta gây 8 sát thương lên đối phương và mọi sinh vật đối phương.

blacksmith=Thợ rèn
blacksmith.description=Năng lực đặc biệt của Lớp - vật chủ: mỗi khi một phép của Thợ rèn được tung ra, người tung phải chọn một sinh vật của mình có giá 8 trở xuống làm vật chủ của hiệu ứng phép. Ý tưởng đằng sau lớp này là đây là một lớp phòng thủ giống như giáo sĩ, tập trung vào việc bảo vệ một khuếch đại mana, nhưng về sau trong ván đấu lại hợp với các lá bài tầm trung như Troll và Minotaur thay vì các lá bài cao cấp như nguyên tố.
blacksmith.mithrilspear=Giáo mithril
blacksmith.mithrilspear.description=Công của vật chủ tăng vĩnh viễn thêm 2. Nếu dùng lên Nàng tiên rừng, vật chủ thay vào đó gây 2 sát thương lên sinh vật đối diện mỗi lượt.
blacksmith.mithrilbow=Cung mithril
blacksmith.mithrilbow.description=Vật chủ tấn công ngay lượt được phù phép và làm choáng sinh vật đầu tiên mà nó gây sát thương.
blacksmith.mithrilshield=Khiên mithril
blacksmith.mithrilshield.description=Sinh lực tối đa của vật chủ tăng vĩnh viễn thêm 10.
blacksmith.wizardshat=Mũ phù thủy
blacksmith.wizardshat.description=Vật chủ không chịu sát thương từ phép và năng lực.
blacksmith.flyingchariot=Xe chiến xa bay
blacksmith.flyingchariot.description=Vật chủ cưỡi trên lưng một Pegasus và không vào trận cho đến khi Pegasus chết.
blacksmith.pegasus=Pegasus
blacksmith.pegasus.description=Cuối mỗi lượt, nó gây X+4 sát thương lên sinh vật đối diện, với X là công của sinh vật cưỡi nó. Nếu ô đối diện trống, sát thương được gây lên đối phương.
blacksmith.cloakanddagger=Áo choàng và dao găm
blacksmith.cloakanddagger.description=Khi vật chủ vào trận, một Áo choàng tinh thể xuất hiện ở ô trống gần nhất bên trái và một Dao găm tinh thể ở ô trống gần nhất bên phải.
blacksmith.astralcloak=Áo choàng tinh thể
blacksmith.astralcloak.description=Giảm 1 mọi sát thương gây lên chủ nhân và lên vật chủ của Áo choàng tinh thể. Khi chết, Sức mạnh Nước và Đất của chủ nhân tăng thêm 1.
blacksmith.astraldagger=Dao găm tinh thể
blacksmith.astraldagger.description=Tăng 1 mọi sát thương gây lên đối phương của chủ nhân và lên sinh vật đối diện vật chủ của Dao găm tinh thể. Khi chết, Sức mạnh Lửa và Gió của chủ nhân tăng thêm 1.
blacksmith.excalibur=Excalibur
blacksmith.excalibur.description=Khi vào trận, vật chủ hủy diệt sinh vật đối diện, hoặc gây 15 sát thương lên đối phương nếu không bị chặn. Công của vật chủ bị giảm vĩnh viễn một nửa và gây sát thương lên đối phương cùng mọi sinh vật của đối phương.
blacksmith.barguliangauntlet=Găng tay Bargul
blacksmith.barguliangauntlet.description=Khi vào trận, vật chủ gây X+8 sát thương lên mọi sinh vật của đối phương, với X là công của vật chủ. Sát thương từ găng tay và từ đòn tấn công của vật chủ còn giảm sinh lực tối đa, chặn hồi máu và kháng sát thương.

trappers=Kẻ Săn Bẫy
trappers.description=Chuyên môn hóa: Kiểm soát. Kẻ Săn Bẫy có mối liên hệ kỳ lạ với lực lượng tối của sức mạnh Đất: với sức mạnh phong hồn của họ cùng sự trợ giúp của rễ tử thần và những sinh vật rừng tối, họ bẫy được sinh vật đối phương và kiểm soát mọi trận đấu.
trappers.whipmaster=Bậu Roi
trappers.whipmaster.description=Khi nó còn ở trận, mỗi sinh vật đối phương triệu hồi ở lượt sau đều khiến đối phương mất 5 sinh lực.
trappers.psychicshaman=Pháp Sư Tâm Linh
trappers.psychicshaman.description=Khi Pháp Sư được triệu hồi, sinh vật ở ô đối diện bỏ lượt tấn công kế tiếp của nó. Pháp Sư tấn công ngay lượt được triệu hồi.
trappers.rose=Hoa Hồng Địa Ngục
trappers.rose.description=Sinh vật đối phương là mục tiêu bỏ lượt tấn công kế tiếp và chịu sát thương bằng một nửa sinh lực của nó, làm tròn lên.
trappers.darkpixie=Tiên Nữ Bóng Tối
trappers.darkpixie.description=Khi nó còn ở trận, sinh vật ở ô đối diện không thể tấn công.
trappers.undergroundpoison=Độc Lòng Đất
trappers.undergroundpoison.description=Hủy diệt sinh vật đối phương là mục tiêu. Đối phương nhận mana bằng giá trị của sinh vật bị hủy diệt trừ 3.
trappers.roots=Rễ Độc
trappers.roots.description=Sinh vật đối phương không thể tấn công ở lượt kế tiếp, và mọi sức mạnh của đối phương giảm 1.
trappers.mindwitch=Phù Thủy Tâm Linh
trappers.mindwitch.description=Sinh vật ở ô đối diện mất năng lực: mọi sinh vật ở đó đều bị câm lặng khi Phù Thủy còn ở trận.
trappers.psychicmedusa=Medusa Tâm Linh
trappers.psychicmedusa.description=Mỗi lượt, sinh vật đối phương có sinh lực cao nhất bỏ lượt tấn công.

beastlord=Chúa Thú
beastlord.description=Chuyên môn: Chúa Thú. Các Chúa Thú bộc lộ tâm hồn cho bầy đàn: mỗi lá ngươi đánh ra đều được hé lộ, và mỗi con thú trên bàn cờ đều cảm nhận được. Càng khoe nhiều màu, bầy đàn càng mạnh.
beastlord.wolverine=Bầy Quỷ Sói
beastlord.wolverine.description=Trong lượt này ngươi có thể đánh thêm một lá khác, miễn không phải Bầy Quỷ Sói.
beastlord.poison=Tiêu Độc
beastlord.poison.description=Gây 11 sát thương lên sinh vật chỉ định. Cần hé lộ ít nhất 5 lá mới đánh được.
beastlord.minotaur=Ngưu Đầu Nhân
beastlord.minotaur.description=Nhận thêm 5 sinh lực mỗi khi một lá mới được hé lộ.
beastlord.hound=Chó Săn Huyết
beastlord.hound.description=Khi sinh vật ở ô đối diện nhận sát thương, lá này nhận thêm 2 sát thương vĩnh viễn.
beastlord.elephant=Voi Say Giấc
beastlord.elephant.description=Mỗi khi một lá mới được hé lộ, nhận 2 mana của nhà lá đó.
beastlord.ritual=Nghi Thức Xưa
beastlord.ritual.description=Ngươi và các sinh vật của ngươi nhận sinh lực bằng đúng hai lần số lá đã hé lộ.
beastlord.sabretooth=Bầy Hổ Kiếm
beastlord.sabretooth.description=Mỗi khi một lá mới được hé lộ, gây 5 sát thương lên toàn bộ sinh vật của đối phương.
beastlord.wyvern=Song Túc Long
beastlord.wyvern.description=Nhận thêm 1 sát thương cho mỗi lá Lửa đã hé lộ.

chaospriest=Tượng Tế Hỗn Loạn
chaospriest.description=Chuyên môn: Hỗn Loạn. Tượng Tế Hỗn Loạn không phục vụ trật tự nào: mỗi lá bài đều gieo xúc xắc, phong tỏa sức mạnh, chữa trị sinh vật mà chúng chọn, làm choáng mọi kẻ địch trừ một kẻ, và ném lời triệu hồi cùng phép thuật của đối thủ vào những ô ngẫu nhiên.
chaospriest.deepmeditation=Thiền Sâu
chaospriest.deepmeditation.description=Phong tỏa sự phát triển của một sức mạnh ngẫu nhiên của bạn trong 1 lượt và tăng các sức mạnh còn lại của bạn thêm 1.
chaospriest.unstablehealing=Chữa Trị Bất Ổn Định
chaospriest.unstablehealing.description=Chữa trị hoàn toàn một sinh vật ngẫu nhiên của bạn.
chaospriest.shockwave=Sóng Xung Kích
chaospriest.shockwave.description=Làm choáng mọi sinh vật của đối thủ trừ một sinh vật ngẫu nhiên.
chaospriest.selftaughthealer=Nhà Chữa Trị Tự Học
chaospriest.selftaughthealer.description=Mỗi lượt, sát thương bạn nhận phải giảm đi 1-5.
chaospriest.glider=Kẻ Lượn
chaospriest.glider.description=Mỗi lượt, chuyển một trong láng giềng của nó đến một ô trống ngẫu nhiên.
chaospriest.witcher=Pháp Sư
chaospriest.witcher.description=Khi sinh vật đối diện nhận sát thương, một sức mạnh ngẫu nhiên của đối thủ giảm đi 1.
chaospriest.distorter=Kẻ Xuyên Tạc
chaospriest.distorter.description=Khi đối thủ triệu hồi sinh vật hoặc thi triển phép, nó bị chuyển hướng đến một ô ngẫu nhiên.
chaospriest.unstablecannon=Đại Pháo Bất Ổn Định
chaospriest.unstablecannon.description=Mỗi lượt, phong tỏa một ô trống ngẫu nhiên của đối thủ trong 1 lượt: sinh vật vẫn có thể tấn công xuyên qua, nhưng không thể triệu hồi vào đó. Khi vào trận, nó gây 10 sát thương lên 3 sinh vật ngẫu nhiên của đối thủ.

lightstave=Trượng Ánh Sáng
lightstave.description=Chuyên môn: Hào quang. Trượng Ánh Sáng triệu hồi một quả cầu ma thuật quanh một trong các sinh vật của bạn. Hào quang được thi triển như phép nhưng không phải là phép; nó tồn tại cho đến khi hết hiệu lực hoặc mục tiêu chết. Mỗi tên hào quang chỉ có thể có một cái đang hoạt động.
lightstave.prismlantern=Đèn Lăng Kính
lightstave.prismlantern.description=Khi được triệu hồi, tất cả hào quang đang hoạt động của bạn tăng 1 lượt thời gian.
lightstave.aurora=Cực Quang
lightstave.aurora.description=Mỗi khi Cực Quang nhận sát thương, gây 2 sát thương cho đối thủ.
lightstave.auraoflife=Hào Quang Sự Sống
lightstave.auraoflife.description=Hào quang (4 lượt). Khi thi triển và khi tan biến, người niệm hồi 5 máu. Mỗi lượt, mục tiêu và các sinh vật kề bên hồi 4 máu.
lightstave.auraofprotection=Hào Quang Bảo Vệ
lightstave.auraofprotection.description=Hào quang (4 lượt). Sát thương lên mục tiêu giảm 5. Sát thương lên các sinh vật kề bên được chuyển sang mục tiêu.
lightstave.auraofillumination=Hào Quang Chiếu Sáng
lightstave.auraofillumination.description=Hào quang (4 lượt). Mỗi lượt, mục tiêu và các sinh vật khác của bạn hồi 3 máu, và mọi sinh vật đối thủ nhận 3 sát thương.
lightstave.crystallinepalace=Cung Điện Pha Lê
lightstave.crystallinepalace.description=Đòn tấn công của nó gây sát thương cho đối thủ và mọi sinh vật đối thủ. Mỗi khi nó nhận sát thương từ phép, gây 3 sát thương cho đối thủ và mọi sinh vật đối thủ.
lightstave.priestessoflight=Nữ Tư Tế Ánh Sáng
lightstave.priestessoflight.description=Khi được triệu hồi, mọi hào quang kết thúc; đối thủ và mỗi sinh vật đối thủ nhận 6 sát thương cho mỗi hào quang đã kết thúc. Mỗi khi một sinh vật đối thủ chết, nhận 1 sức mạnh Ánh Sáng.
lightstave.rainbowdragon=Rồng Cầu Vồng
lightstave.rainbowdragon.description=Khi được triệu hồi, nhận 1 sức mạnh Hỏa, Thủy, Phong hoặc Thổ cho mỗi sinh vật của bạn có sức mạnh đó.

grimoire.title=Sách pha chú
grimoire.description=Sách pha chú của Mancers: mọi lớp và mọi lá bài, kèm hình ảnh, chi phí, chỉ số và luật chơi.
grimoire.back=Quay lại
grimoire.language=Ngôn ngữ
grimoire.spell=Phép thuật
grimoire.creature=Sinh vật
grimoire.token=Token
grimoire.search=Tìm…
grimoire.noart=Không có tranh
grimoire.loading=Đang tải danh sách lá bài…
grimoire.none=Không có lá bài nào phù hợp.
barbarians=Man Tộc
barbarians.description=Chuyên môn: Cuồng nộ. Man tộc chiến đấu mạnh nhất khi bị thương: dưới các ngưỡng máu nhất định, các lá bài của họ thức tỉnh, tăng công, đánh hai lần, bỏ qua sinh vật chắn trước mặt hoặc quay sang chống lại những phép làm họ bị thương. Hãy để máu mình tụt xuống và cả bộ bài hóa hoang dã.
barbarians.axewarrior=Chiến Binh Rìu
barbarians.axewarrior.description=Nếu máu của bạn từ 8 trở xuống, nó tăng 5 công.
barbarians.dwarvenhammer=Búa Người Lùn
barbarians.dwarvenhammer.description=Gây 8 sát thương cho sinh vật mục tiêu. Đối thủ không thể thi triển phép trong lượt kế tiếp của họ.
barbarians.goliath=Goliath
barbarians.goliath.description=Nếu máu của bạn từ 13 trở xuống, nó tăng 4 công. Nó nhận gấp đôi sát thương từ sinh vật và phép của đối thủ có cấp 4 trở xuống.
barbarians.cerberus=Cerberus
barbarians.cerberus.description=Nếu máu của bạn từ 10 trở xuống, đòn tấn công của nó đánh trúng mọi sinh vật đối thủ thay vì một.
barbarians.ogremage=Pháp Sư Yêu Tinh
barbarians.ogremage.description=Nếu máu của bạn từ 8 trở xuống, mỗi lượt của bạn nó hồi 8 máu và vĩnh viễn tăng 1 công.
barbarians.steamingbull=Bò Bốc Khói
barbarians.steamingbull.description=Nếu máu của bạn từ 15 trở xuống, nó tấn công hai lần mỗi lượt.
barbarians.eldritchgiant=Cự Nhân Dị Giới
barbarians.eldritchgiant.description=Nếu máu của bạn từ 20 trở xuống, vào cuối lượt của bạn nó tiêu diệt một sinh vật đối thủ ngẫu nhiên có cấp 4 trở lên.
barbarians.behemoth=Behemoth
barbarians.behemoth.description=Nếu máu của bạn từ 20 trở xuống, đòn tấn công của nó đánh vào đối thủ thay vì sinh vật trước mặt.
grimoire.summary=Sinh vật: {0}, phép thuật: {1}
grimoire.footer=Tranh từ kho {0}. Danh sách là {1}.
grimoire.some=một ít
