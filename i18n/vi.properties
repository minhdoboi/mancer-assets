darkpriest.description=Năng lực đặc biệt của lớp - linh hồn bất an: khi bắt đầu trận đấu, một sinh vật cùng tên (3/11) xuất hiện ở phía đối phương. Nếu nó chết, nó tái sinh vào cuối lượt của đối phương và cho Tư Tế 2 mana đặc biệt.
