campaign.night.rest.title=Ban đêm
campaign.night.rest=Bạn thức dậy trong đêm trên một chiếc giường, trong một ngôi nhà lạ.
campaign.night.visit.title=Một giọng nói xa lạ
campaign.night.visit=Tôi đã theo bạn lên núi. Bạn ngất xỉu sau khi rời Aelwyn, nên vợ tôi và tôi đã đưa bạn về đây.
campaign.night.meal.title=Bữa ăn nóng
campaign.night.meal=Hãy ngồi xuống chiếc khăn và ăn chút gì đó. Sau đó bạn có thể khám phá xứ này vào ban đêm nếu muốn.
campaign.night.out.title=Dưới những vì sao
campaign.night.out=Sức mạnh dần trở lại. Bạn cảm ơn vợ chồng chủ nhà và bước ra ngoài, tò mò về mùi đồng quê ban đêm, tiếng động của thế giới ban đêm.
campaign.next=Tiếp
campaign.antimancer.wake.title=Nơi đất xa
campaign.antimancer.wake=Sau khi gặp Corvin, ngươi mất ý thức, như thể có gì đó chưa ổn, và tỉnh dậy ở nơi đất xa.
button.yes=Có
campaign.entomologist.message=Rừng hôm nay hiền lành quá. Đi cùng tôi một lát nhé — lũ nhỏ nhà tôi thích một ván bài nhẹ nhàng lắm.
campaign.farmer.message=Trên đường có thể gặp bẫy. Đừng đi lang thang. Hãy tự tìm lối riêng để khám phá vùng đất tuyệt đẹp này.
campaign.duckwoman.message=Thành phố dạo này đông nghẹt. Để mắt tới nhé — may ra bạn sẽ gặp một pháp sư thật sự biết dùng phép thuật. Hoặc đi những con đường vắng cho khỏi đám đông.
campaign.duckwoman.choice.go_city=Vào thành phố
campaign.duckwoman.choice.avoid_city=Tránh thành phố
campaign.ram.message=Không nhiều người leo lên dãy núi này. Ngươi chắc chắn muốn đi tiếp? Đã bước vào thì khó quay đầu, và bất cứ sai lầm nào cũng đều có thể tử vong. Nếu vậy, giữ bình tĩnh và cẩn thận bước chân - có nơi sườn dốc trơn trượt.
campaign.rabbit.message=Nghe nói trên núi có những vị pháp thuật gia rất lợi hại. Nếu gặp được, họ có thể truyền cho bạn vài mẹo.
campaign.beaver.message=Bạn đang đi qua một khu rừng kỳ lạ. Ở đây có điều gì đó mang ma thuật, dù giờ có lẽ chỉ còn rất mờ nhạt. Bạn có cảm nhận được không?
campaign.otter.message=Con đầm lầy có thể có phần nguy hiểm nếu bạn không quen. Ở đây thời gian trôi qua một cách kỳ lạ.
campaign.elder.message=Ban đêm, có pháp sư lạm dụng quyền năng, không kiềm chế mà cứ tăng lên mãi. Ai cũng cố xây dựng vương quốc của riêng mình, hoặc nhà thờ của riêng mình. Trên con đường này, bạn sẽ đi qua lãnh địa của họ. Hãy cẩn thận.
campaign.fishman.message=Tôi không ngủ được, biết những cỗ máy vẫn chạy suốt đêm. Giờ chúng cứ chạy trong đầu tôi.
campaign.fisherman.message=Ở đây có không ít người đánh mất chính mình vì cứ vô tình tranh đua với kẻ tệ nhất. Những kẻ bị kẻ tệ nhất hút cạn có thể bỏ lại một phần bản thân mình phía sau, nhưng đòi lại nó thì cũng như câu cá ngoài biển khơi.
campaign.deer.message=Hãy tự hỏi vì sao bạn muốn đối mặt với những pháp sư quyền lực này - và những gì bạn đã bỏ lại phía sau.
campaign.girl.message=Khi tôi đi lang thang ban đêm, tôi nghe những âm thanh kinh khủng vọng ra từ núi. Bạn có thể leo lên tìm, hoặc đi xuống thung lũng.
campaign.girl.choice.to_mountain=Đi tiếp lên núi
campaign.girl.choice.to_valley=Đi xuống thung lũng
campaign.patou.message=Bạn đã xa nguồn gốc. Hy vọng bạn vẫn còn đủ sức lực. Bạn có thể nghỉ ngơi ở bất cứ đâu, bất cứ khi nào cần. Núi kia có thể đợi. Nó sẽ không đi đâu cả.
campaign.catboy.message=Trong bóng tối thì dễ lạc lối. Tôi sợ phải quay về gia đình - có người đã trở thành pháp sư quyền lực. Bạn sẽ đưa tôi vào thành phố, hay tiếp tục ngoài hoang dã?
campaign.catboy.choice.bring_city=Đưa cậu vào thành phố
campaign.catboy.choice.stay_land=Đi tiếp ngoài đất
campaign.panther.message=Ban đêm, tôi đã thấy các pháp sư thôi miên người ta, nhốt họ vào những câu chuyện không hề có thật, nhưng ở đó ánh sáng cũng nguy hiểm không kém bóng tối. Nó có thể khiến mọi người nghi ngờ về những gì bóng tối che giấu, và nỗi sợ có thể đi theo họ đến tận ban ngày.
campaign.crowd.message=Cậu nhóc đã biến mất trong đám đông. Bạn tự hỏi họ đang hô vang cái gì, rồi đi theo hướng của họ.
campaign.gardener.message=Tôi có một vườn rau ở đây, nhưng khoai tây đã mấy năm nay không mọc nổi. Tôi không biết tại sao...
campaign.seasons.message=Trời đẹp cho một ván bài. Xem năm này sẽ thiên vị ai.
campaign.pigboy.message=Cháu sống gần đây, ở một nông trại. Khi buồn, cháu thích đi dạo quanh đầm lầy. Dạo này cháu hay giận... hay có lẽ vì bố cháu giận vì cháu buồn.
campaign.disciples.message=Ồ! Hy vọng tôi không dọa bạn. Bạn lạc đường phải không? Không, bạn không lạc đường đâu. Bạn đã tìm được đường đến đây mà không hề hay biết. Nếu bạn để tôi cân đo linh hồn, chỉ một lát thôi, thì tôi sẽ thấy rõ bạn là ai.
campaign.dudes.message=Dạo này đi thong thả quá. Tiếc là nó kết thúc giữa bụi. Cố không khóc khi tôi quật ngươi xuống nhé.
campaign.mountainking.message=Trên núi ai cũng thấy mình nhỏ bé. Chỉ kẻ dũng cảm mới sống ở đây. Lại gần đi - ta sẽ khắc tên ngươi lên vách đá.
campaign.spiritshaman.message=Linh thú trên sườn núi này không thật sự biết suy nghĩ, nhưng chúng có những cách kỳ lạ của riêng mình. Hãy đến gần chúng trong khi ta đánh trống, và ngươi sẽ thấy chúng không hề sợ các nguyên tố.
campaign.shaman.message=Núi bắt đầu từ đây. Kẻ đã chết vốn biết ai sẽ đi xuống lại.
campaign.wind.message=Nơi đây, không khí mỏng manh, và gió có thể cuốn ngươi đi giữa hơi thở này và hơi thở kế tiếp. Hãy hít thở theo nhịp của gió và lắng nghe điều hơi thở của nó muốn nói.
campaign.antimancer.message=Có lẽ ngươi ở trong đám đông đã đánh dấu ta bằng dấu ấn của sự trục xuất, vì ta không chịu nổi thế giới tưởng tượng của chúng. Dù sao, ta vẫn chơi - một ván thôi. Ngồi xuống đi, và hãy giữ lễ nghi.
campaign.warp.message=Dưới ánh sáng này ngươi gầy đi. Chỉ cần một cái giật là ngươi rách toạc ra. Vậy hãy xem điều gì giữ cho ngươi còn nguyên: chỉ là âm thanh tên ngươi, hay chỉ là hình dáng của ngươi?
campaign.rogue.message=Lại một tên du khách. Làm rỗng túi, hoặc mất mạng - ta chưa quyết định. Nhảy trước đi. Ngươi sẽ không cảm thấy đau.
campaign.faerie_druid.message=Ta đang trò chuyện điềm tĩnh với các tiên nữ của ta, và ngươi đã đi qua rừng để làm phiền chúng ta. Giờ ta nói thay cho cây cối. Cây cối nhớ những vị khách hiền lành. Chúng sẽ không đau buồn vì ngươi.
campaign.vampires.message=Mạch đập của ngươi là chuông báo cơm. Ngồi xuống. Ta thích bữa ăn còn biết nói chuyện.
campaign.darkpriest.message=Quỳ xuống. Nếu ngươi không chịu cầu nguyện, ta sẽ viết bài kinh cuối cùng của ngươi bằng máu.
campaign.zen.message=Ngươi có vẻ lạc lõng. Tỉnh lại! Ngươi có thể nghĩ đây là một bài học. Nhưng đây là kết cục. Im lặng đi và thua.
campaign.darksider.message=Ta sẽ phá hủy lối đi sau lưng ngươi. Không còn ngôi làng nào để chạy tới nữa.
campaign.chaospriest.message=Trật tự là một chiếc lồng, kẻ lang thang. Nếu chỉ dựa vào nó, ngươi sẽ không thấy được những gì ở bên ngoài. Ta đã gặm nhấm song sắt của nó - để ta cho ngươi thấy những viên xúc xắc giải phóng điều gì.
campaign.highpriest.message=Ngọn núi không giữ khách hành hương. Ít người dám tới đây. Ta sẽ bẻ nát cái tôi của ngươi và ban phước cho những mảnh vỡ.
campaign.end.win.title=Chiến thắng
campaign.end.lose.title=Thất bại
campaign.end.map=Bản đồ
campaign.end.replay=Đấu lại
campaign.end.win=Con đường đã mở. Ta sẽ nhớ trận đấu này.
campaign.end.lose=Chỉ khác ở chỗ đó. Trấn tĩnh lại rồi thử lần nữa.
campaign.end.summoner.win=Ngươi đã quét sạch bàn đấu của ta. Đám ruồi của ta còn chưa kịp đổ. Hay lắm.
campaign.end.summoner.lose=Ta đã bảo lũ nhỏ nhà ta rằng ngươi sẽ hết cách. Nào, ta chơi lại ván nữa.
campaign.end.strategist.win=Một đường đi gọn gàng hơn ta. Ta tính trước ba nước của ngươi, mà ngươi chơi nước thứ tư.
campaign.end.strategist.lose=Ta đọc được nhịp độ của ngươi sớm hơn ngươi cảm nhận hai lượt. Xáo lại bài đi, giấu kỹ hơn.
campaign.end.gambler.win=Ha! Ngươi phá nước bài của ta bằng bài đẹp hơn. Núi lấy cược của ta - đi tiếp đi.
campaign.end.gambler.lose=Xúc xắc nghiêng về phía ta, bạn ơi. Gấp đôi hay không? Đá đang đợi đây.
campaign.end.lecturer.win=Ghi nhận. Luận án của ngươi thì đúng, của ta cần sửa. Bàn đấu là của ngươi.
campaign.end.lecturer.lose=Một lập luận bác bỏ dễ đoán quá. Xem lại khai cuộc của ngươi rồi xin thi lại.
campaign.end.oracle.win=Sợi chỉ đã nói dối ta. Đi tiếp đi - cảnh tượng sau ngươi sáng hơn cảnh tượng có ngươi nằm trong bụi.
campaign.end.oracle.lose=Ta đã thấy kết cục này trước khi ngươi đánh. Rừng, tiếng chuông, bài kinh - chúng đều vần với nhau. Hãy làm ta bất ngờ.
campaign.end.diviner.win=Vậy sao. Ngọn núi hóa ra vẫn còn giữ khách hành hương. Hãy leo lên đi - và nhân từ hơn ta.
campaign.end.diviner.lose=Ngọn núi vẫn chưa giữ khách hành hương nào. Vá lại bài, vững lòng, rồi leo lại.
campaign.entomologist.win=Lũ nhỏ nhà ta mệt rồi, ta cũng vậy. Đi nhẹ nhàng - rừng sẽ nhớ đến ngươi một cách tử tế.
campaign.entomologist.lose=Thôi nào. Rừng vẫn hiền lành, và lũ nhỏ thích ván chơi của ngươi. Nghỉ đi, rồi đánh lại với ta.
campaign.seasons.win=Vậy là năm này chiếu cố ngươi. Thời tiết đẹp cho cuộc hành trình của ngươi - hãy dùng cho đáng.
campaign.seasons.lose=Năm này chiếu cố ta, như ta đã nói. Quay lại khi mùa chuyển vậy.
campaign.disciples.win=Khéo thật - được chứng minh trước khi cuộc phục hưng hỏng. Hãy nhận lời ban phước của ta cùng với thất bại của ta đi.
campaign.disciples.lose=Khéo là chưa đủ. Chỉnh đạo sẽ hỏng như đã hứa - hãy cầu nguyện, học hỏi, rồi quay lại.
campaign.dudes.win=Hah - ngươi đẩy ta ngã trong bụi của chính ta. Ta thề không khóc. Ngươi xứng đáng với con đường này, đấu sĩ.
campaign.dudes.lose=Ta đã bảo rồi, nó kết thúc giữa bụi. Lau mắt, đứng dậy, rồi đòi ta đấu lại.
campaign.mountainking.win=Đá sẽ nhớ NGƯƠI, không phải ta. Ta đã đặt cược cả vách đá và thua - leo lên đi.
campaign.mountainking.lose=Tên ngươi giờ nằm trên vách đá, dưới hàng chục cái tên khác. Đá giữ cược của chúng - thử lại?
campaign.spiritshaman.lose=Linh thú đã đáp lời ta, như chúng vẫn vậy. Nghỉ bên lửa rồi đánh trống lại.
campaign.spiritshaman.win=Trống đã im lặng vì ta. Linh thú đáp lời ngươi - đi đi, gió đang chờ.
campaign.wind.win=Hơi thở ta đã cạn - của ngươi thì còn. Một luận án chặt chẽ, bảo vệ tốt. Đỉnh núi đã mở.
campaign.wind.lose=Bị gió xé tan tành, theo ý chí của nó. Gom lại hơi thở và bài của ngươi, rồi đối mặt gió lần nữa.
campaign.antimancer.win=Một ván bài, và ngươi thắng. Lịch sự và mẹo vặt của ta là thứ duy nhất đã đỡ cho ta - đi đi, trước khi ta đổi giáo trình.
campaign.antimancer.lose=Một lần là đủ, như ta đã nói. Quay lại với đám đông của ngươi và nghĩ lại thế giới của ngươi - ta sẽ cho thêm một ván.
campaign.warp.win=Ngươi giữ được mạch khi ta kéo mạnh nhất. Một nút thắt bị tuột - phân tích của ta và con đường, ngươi lấy cả.
campaign.warp.lose=Ngươi rách toạc ra khi ta kéo, đúng như vậy. Để ta lắp lại ngươi cho kỳ thi sau.
campaign.rogue.win=Túi lẫn mạng - giữ được cả hai, du khách. Ngươi đã trả trọn giá cho bài học này.
campaign.rogue.lose=Ta đã quyết: là túi. Làm rỗng túi đi, học kỹ phố phường, rồi quay lại mua lại bài học của ngươi.
campaign.blacksmith.name=Brann
campaign.blacksmith.message=Ta sẽ cho ngươi thấy rằng ngươi cần thép của ta để tự vệ.
campaign.blacksmith.win=Ma thuật của ngươi, hình như cũng có chút thực lực. Hãy nhớ rằng mỗi ngày có thể cần một công cụ khác nhau, và một công cụ vừa với một tay sẽ chẳng bao giờ vừa với tay khác. Lên đường đi - và giữ gìn những gì ngươi mang theo.
campaign.blacksmith.lose=Thép giữ được; còn ma thuật của ngươi chỉ là gió. Quay lại với thứ gì đó thật, và ta sẽ vá lại những gì có thể.
campaign.faerie_druid.win=Cây cối giờ sẽ nhớ một vị khách hiền lành - ngươi. Đi nhẹ qua cành cây đi.
campaign.faerie_druid.lose=Ta đã cảnh báo, cây cối không đau buồn vì ngươi. Khôn ngoan hơn đi, rồi bước qua khu rừng này lần nữa.
campaign.soulbinder.message=Những kẻ bước vào khu rừng này vào ban đêm thường đang chạy trốn điều gì đó. Còn ngươi đang chạy trốn thế giới. Rừng giữ những thứ lọt qua kẽ các cõi. Ta sẽ buộc trói những gì ngươi không nắm được.
campaign.soulbinder.win=Linh hồn ngươi vẫn là của riêng ngươi. Đi tiếp đi - đêm vẫn còn răng nanh.
campaign.soulbinder.lose=Bị trói, như đêm đòi hỏi. Ngươi đã dâng mình cho đêm một cách tự tin. Đây là lúc ta có thể buộc trói linh hồn ngươi. Gỡ ra, rồi đối mặt ta lần nữa.
campaign.vampires.win=Bữa ăn cắn lại ta. Chuông của ta vang rỗng - hãy uống không khí đêm rồi đi, vẫn còn biết nói chuyện.
campaign.vampires.lose=Mạch đập của ngươi là chuông báo cơm tuyệt hay, và ngươi nói chuyện ngọt ngào thật. Cơn đói sẽ quay lại - ngồi xuống lần nữa?
campaign.darkpriest.win=Ngươi không chịu quỳ, nên không có bài kinh nào được viết. Bóng tối thả ngươi ra - đi, không còn bị trói buộc.
campaign.darkpriest.lose=Bài kinh cuối của ngươi đã viết xong, bằng đỏ như đã hứa. Cầu cho bài kinh lần sau xuôi nhịp hơn - quỳ lại không?
campaign.zen.win=Kết cục đã từ chối ngươi. Ở lại trên cõi của ta, ta đã nhìn mọi thứ từ chỗ quá cao. Nói đi - giờ bài học là của ngươi, không phải của ta.
campaign.zen.lose=Im lặng và thua, như đã dạy. Khi nào ngươi tìm lại giọng nói, ta sẽ nghe lời đòi đấu lại của ngươi.
campaign.shaman.win=Ngươi đã nhìn thấu ta hơn cả ta, qua đôi mắt con sói của ta. Kẻ chết đã sai - chính NGƯƠI đi xuống lại. Núi mở cược của nó cho ngươi.
campaign.shaman.lose=Kẻ chết đã biết, như ta đã nói. Chúng giữ xương ngươi ấm - hãy quay lại đòi lấy.
campaign.darksider.win=Con đường vẫn còn. Ngôi làng của ngươi vẫn đứng - hãy chạy về kể họ lối đi vẫn mở.
campaign.darksider.lose=Con đường sau lưng ngươi đã bị xóa. Không có làng, không có đường lui - chỉ còn đấu lại phía trước.
campaign.chaospriest.win=Những viên xúc xắc đã lên tiếng, và chúng gọi linh hồn của ngươi là kẻ tự do nhất. Cứ đi - đôi khi cả hỗn loạn cũng nhường đường.
campaign.chaospriest.lose=Một chút hỗn loạn lộn xộn là đủ để ngươi thua. Hãy trở lại khi vận may thuộc tên ngươi.
campaign.highpriest.win=Ngọn núi cuối cùng cũng giữ được một khách hành hương. Ngươi đã nhìn thấu ta. Hay là vì cái tôi của ngươi? Ta vừa bị bẻ vừa được phước - hãy leo lên, kẻ giữ đỉnh.
campaign.highpriest.lose=Bị bẻ vỡ như đã hứa - để ta ban phước cho những mảnh vỡ. Vá lại ngươi rồi leo lại.
campaign.tinker.message=Bánh răng quay, du khách, và cả kiên nhẫn của ta nữa. Xem ngươi chịu nổi tải trọng thế nào.
campaign.tinker.win=Kẹt. Máy của ta chứ không phải của ngươi - đi đi, cẩn thận tia lửa.
campaign.tinker.lose=Bị tháo tung ra lấy phụ tùng. Quay lại khi sai số nhỏ hơn.
campaign.battlemage.message=Thép và ấn ký cùng đi. Ngươi sẽ thấy ta khó đọc, và khó chặn hơn nữa.
campaign.battlemage.win=Đỡ được đòn, rồi bị bẻ gãy. Công bằng mà - chiến trường là của ngươi.
campaign.battlemage.lose=Lưỡi kiếm và phép thuật, như đã hứa. Luyện lại các thế rồi trở về.
campaign.snowblood.message=Gió lạnh giữ lấy thứ nó lấy. Không còn chỗ cho nghi ngờ. Lại gần đi, ta sẽ cho ngươi thấy trái tim có thể im lặng đến mức nào.
campaign.snowblood.win=Ngươi giữ được hơi ấm. Hiếm thật. Đi đi trước khi tuyết đổi ý.
campaign.snowblood.lose=Đông cứng ngay tại chỗ. Rã sẽ tới - mong ngươi cũng thế.
campaign.shadowmage.message=Nhìn vào bóng tối - nơi đó có nhiều hơn ngươi nghĩ. Bóng của ngươi đã chẳng còn ở đó: nó đã rời đi. Ta chỉ ở đây để thu phần còn lại.
campaign.shadowmage.win=Bóng tối đã buông ngươi. Đi tiếp đi, khi ngươi còn đổ bóng.
campaign.shadowmage.lose=Bị nuốt chửng, trong lúc ngươi chỉ thắng trong tưởng tượng. Quay lại khi ngươi tìm thấy bóng của riêng mình.
campaign.shadowcaster.message=Ánh sáng là khoản vay, và ngươi đã dùng sai. Ta đang đòi. Đứng yên - việc này không mất lâu.
campaign.shadowcaster.win=Bóng tối lùi lại trước ngươi. Ta không ngờ điều đó.
campaign.shadowcaster.lose=Bị trục xuất, như bóng tối đã báo trước. Tìm ánh sáng rồi quay lại.
campaign.soulreaper.message=Mỗi linh hồn đều có ngày thu hoạch, một ngày mà mỗi linh hồn đều muốn trì hoãn. Ngươi thuộc về vụ mùa hôm nay.
campaign.soulreaper.win=Lưỡi liềm của ta bị mẻ vì ngươi. Đi đi - mùa thu còn đợi.
campaign.soulreaper.lose=Bị gặt sạch. Linh hồn ngươi còn đủ đợi đến khi ngươi thử lại.
campaign.conjurer.message=Mỗi phép thuật đều để lại dấu vết, và mỗi dấu vết gọi một thứ gì đó trở lại. Câu trả lời có thể chứa một ý định ẩn. Để ta cho ngươi thấy điều gì đáp lời khi ta gọi.
campaign.conjurer.win=Ngươi đã cho những triệu hồi của ta nhiều hơn chúng có thể chịu. Nghi lễ còn lại là của ngươi.
campaign.conjurer.lose=Vòng tròn đã khép quanh ngươi, đúng như phải thế. Trở lại khi ý chí ngươi đủ sức giữ lời gọi.
campaign.kahjivir.name=Nahira
campaign.kahjivir.message=Ngươi đã bước vào đất săn của chúng ta, và cỏ đã khép lại sau lưng ngươi. Hình như ngươi đã quên mất phần hoang dã của mình. Sớm muộn ngươi sẽ nhớ lại. Đêm nay bầy chưa ăn - chạy đi, nếu muốn. Như vậy cuộc săn chỉ thêm ngọt ngào.
campaign.kahjivir.win=Bầy hạ giáo xuống. Chúng không thể cạnh tranh với thứ phép thuật mà chúng không hiểu. Ngươi đã giành quyền bước dưới ánh trăng này - đi đi, trước khi gió đổi chiều.
campaign.kahjivir.lose=Cuộc săn kết thúc với ngươi nằm trong cỏ. Chúng ta để ngươi sống; hãy trở lại khi móng vuốt ngươi sắc hơn.
campaign.chronomaster.message=Thời gian của ngươi đã bị đếm. Trong mọi ván chơi, ngươi đã dâng cho ta biết bao nhiêu - và tất cả sẽ dẫn ngươi tới bại trận. Món nợ sẽ được thanh toán... ngay!
campaign.chronomaster.win=Còn mấy hạt cát. Hãy dùng trước khi ta lật đồng hồ cát.
campaign.chronomaster.lose=Đã đếm và đã tiêu. Quay lại nếu còn chút cát nào.
campaign.limbo.message=Không ngày cũng không đêm, không thắng cũng không thua, không thực cũng không hư. Đây là nơi mọi con đường đều chờ.
campaign.limbo.win=Thắng hay thua không quyết định việc ngươi ở địa ngục hay thiên đường. Ngươi có thể thắng mà vẫn ở địa ngục. Trong khoảng lơ lửng, ngươi thấy được mình ở cả hai nơi cùng lúc. Tùy ngươi quyết định cái nào là địa ngục, cái nào là thiên đường. Ngươi bước ra khỏi khoảng lơ lửng. Ít người làm được. Ngọn núi đang gọi.
campaign.limbo.lose=Bị giữ trong khoảng lơ lửng. Ở lại một lát rồi thử lại.
campaign.barbarians.message=Ngươi nồng mùi thành phố và bánh mì mềm. Ngoài này kẻ yếu hoặc mạnh lên, hoặc nằm xuống. Hãy chảy chút máu và xem điều gì thức dậy trong ngươi.
campaign.barbarians.win=Tốt. Ngươi chiến đấu như một vết thương không chịu lành. Núi không chừa chỗ cho kẻ nhút nhát — hãy leo.
campaign.barbarians.lose=Ngươi ngã, nhưng ngã là cách một kẻ man tộc học lấy mặt đất. Băng vết cắt rồi quay lại với cơn giận lớn hơn.
campaign.meteomancer.message=Bầu trời nói với ta rằng ngươi sắp tới. Nó cũng nói cả kết cục - là mưa.
campaign.meteomancer.win=Ngay cả dự báo cũng có thể sai. Hãy đi con đường khô ráo, kẻ lữ hành.
campaign.meteomancer.lose=Mưa, như bầu trời đã báo trước. Lau khô rồi quay lại đón đợt thứ hai.
campaign.emotion.message=À, lại một trái tim nữa trên đường. Cho ta thấy ngươi cảm thấy gì - bàn cờ sẽ kể nốt phần còn lại. Điều nó hé lộ luôn là điều quý giá nhất.
campaign.emotion.win=Ngươi giữ được trái tim mình vững vàng. Đi tiếp đi, và để nó dẫn lối.
campaign.emotion.lose=Mỗi cảm xúc đều có lượt của nó. Cảm xúc của ngươi chùng xuống; của ta thì không. Quay lại khi nó đã ổn định.
campaign.sower.message=Cắm rễ trong bùn rồi xem cây gì mọc lên. Ta kiên nhẫn lắm - đầm lầy cũng kiên nhẫn.
campaign.sower.win=Ngươi không bám rễ. Được vậy - đi tiếp đi, và cẩn thận lau sậy.
campaign.sower.lose=Cuối cùng cũng bám rễ. Đầm lầy giữ lấy thứ nó gieo - quay lại khi ngươi nảy mầm. Ngươi muốn để thứ gì lớn hơn ngươi mọc ra ngoài ngươi, hoặc thứ gì đẹp hơn, một bông hoa chẳng hạn. Nhưng bông hoa này có răng. Nó có thể nuốt chửng kẻ khác dễ dàng y như ngươi vậy.
campaign.trappers.message=Rễ già ghi nhớ từng bước chân. Ngươi vùng vẫy thế nào cũng được - chốn này chẳng ai rời đi mà không bị trói.
campaign.trappers.win=Ngươi vùng vẫy giỏi. Bước đầu tiên để tự giải thoát là nhận ra mình đang bị giam cầm. Rừng già vẫn chừa một chỗ cho ngươi.
campaign.trappers.lose=Rễ già đã trói ngươi rồi. Nghỉ tạm một lát, rồi lặng đi.
campaign.beastlord.message=Một bàn tay giơ lên, và bản năng trong bầy thú của ta ngóc đầu dậy. Bản năng của ngươi thức dậy thế nào? Hãy khoe ra - cuộc săn càng thêm thú vị.
campaign.beastlord.win=Bầy thú rải ra liếm vết thương. Bản năng của ngươi đã cứu ngươi, và con thú tôn trọng điều đó.
campaign.beastlord.lose=Bầy thú đã nhìn thấu ngươi rồi. Cút đi - cuộc săn tiếp tục lúc chạng vạng.
campaign.fairy_knight.message=Dừng lại, kẻ lang thang. Lau sậy nơi đây thuộc về Triều đình Tiên nữ. Ngươi không được đặt chân lên mảnh đất này trừ khi ta coi ngươi là xứng đáng. Rút kiếm, hoặc nhường đường.
campaign.fairy_knight.win=Một trận đấu công bằng, thua một cách công bằng. Triều đình nhường ngươi đi.
campaign.fairy_knight.lose=Lưỡi kiếm của Triều đình rất nhanh. Hãy luyện tập rồi thách ta lại.
campaign.dreamweaver.message=Suỵt. Ngươi đã nửa ngủ rồi, mắc kẹt trong giấc mơ hay cơn ác mộng của ngươi. Nghe thấy không? Núi đang ngân cho ngươi bài hát ru.
campaign.dreamweaver.win=Ngươi tỉnh trước khi giấc mơ khép lại. Ngươi chắc chắn không còn trong giấc mơ? Đi tiếp đi, kẻ mơ.
campaign.dreamweaver.lose=Ngủ ngon. Mơ về những nước mở đầu tốt đẹp hơn, rồi quay lại khi tỉnh.
campaign.lightstave.name=Solwen
campaign.lightstave.message=Ít người đến đây mà không bị ánh sáng của ta lôi kéo. Nhưng ánh sáng có thể mờ đi - và khi ánh sáng của ngươi mờ đi, bóng tối mà nó kìm giữ bắt đầu phình lên. Nếu điều đó xảy ra, thú cầm của ta sẽ đứng đợi để đẩy lùi nó.
campaign.lightstave.win=Ánh sáng của ta đã lôi kéo ngươi, nhưng chưa từng chạm vào ngươi - và cũng không có ý để làm thế. Đi đi.
campaign.lightstave.lose=Chẳng có gì xấu hổ khi bị lu mờ. Hôm nay ánh sáng không đòi hỏi gì - hãy ngồi cùng nó một lát, cho nó ăn, rồi thử lại ta.
campaign.junk.message=Ngươi trông có vẻ ngạc nhiên. Đa số mọi người muốn quên đi nơi này. Còn ta thì không. Ở nơi ngươi thấy ma thuật, ta chỉ thấy đống phế liệu ngươi để lại. Ngươi không đáng giá gì, trừ khi ta lấy được thứ gì từ đống đổ nát của ngươi.
campaign.junk.win=Hah. Từ phế liệu thành của cải, ngươi thắng đống của ta. Đi đi.
campaign.junk.lose=Vào đống sắt vụn với ngươi. Quay lại khi ngươi được sửa xong.
campaign.colors.message=Mỗi sắc màu đều có tính khí. Chọn một màu, bất kỳ màu nào - ta có đáp án cho tất cả.
campaign.colors.win=Ngươi đã nhìn xuyên qua cả quang phổ. Đi tiếp đi, tươi sáng.
campaign.colors.lose=Một cầu vồng thất bại. Nhìn lại màu sắc rồi thử lần nữa.
campaign.elementalist.message=Tao thích chơi với bốn người bạn tinh thần của mình. Chúng cũng thích chơi lắm, nhưng chúng buồn vì chỉ có một đứa trẻ biết chơi với chúng. Đi, thử xem.
campaign.elementalist.win=Giờ các nguyên tố đã vui rồi. Qua đi, kẻ cầm quyền.
campaign.elementalist.lose=Các nguyên tố đã chán rồi. Quay lại khi ngươi trả lời nổi cả bốn.
campaign.powermancer.message=Xin chào, kẻ lữ hành, ta là Shams. Ta đến từ một đất nước nơi mặt trời luôn rực rỡ. Dù vậy, quyền lực không phải thứ có thể ban cho; nó được rút ra, và giữ lại bởi những kẻ biết cách biến đổi nó và duy trì nó luân chuyển bên trong chính họ. Ta sẽ cho ngươi một thoáng nhìn về điều đó.
campaign.powermancer.win=Năng lượng của ta cạn, của ngươi thì chưa. Ngọn núi mở cho ngươi.
campaign.powermancer.lose=Quyền lực của ta đã rút cạn quyền lực của ngươi đến tia lửa cuối cùng. Nạp lại rồi thử lại với ta.
campaign.kinetician.message=Mọi thứ đều chuyển động. Kể cả ngươi, dù muốn hay không — thẳng vào tay ta.
campaign.kinetician.win=Ngươi giữ vững đất khi bị đẩy. Đi tiếp đi.
campaign.kinetician.lose=Đà như đã đoán. Chống đỡ rồi quay lại lần nữa.
campaign.quantumancer.message=Ta vừa thắng vừa chưa thắng cho tới khi ngươi nhìn. Có lẽ ngươi cũng vậy - thắng hay thua, ngươi thực ra không thay đổi. Hãy nhìn kỹ.
campaign.quantumancer.win=Sóng đã sập nghiêng về phía ngươi. Hãy leo lên.
campaign.quantumancer.lose=Sóng đã sập chống lại ngươi. Quan sát, điều chỉnh, rồi chạy lại thí nghiệm.

