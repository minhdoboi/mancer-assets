campaign.title=Chiến dịch
campaign.intro=Bạn vừa đến vùng đất xa lạ này bằng thuyền. Bạn không hiểu vì sao, nhưng một ký ức hiện lên: rất lâu trước đây, thầy đã cảnh báo có một thời đại các yếu tố tự nhiên sẽ vỡ vụn, và khi thời đại ấy đến, vài bài học ít ỏi thầy truyền dạy sẽ trở nên hữu ích. Bạn hy vọng tìm thấy một vùng đất yên bình, nhưng khi nhìn về phía dãy núi xa xôi, điều gì đó khiến bạn lo lắng.
campaign.day=Ban ngày
campaign.night=Ban đêm
campaign.complete=Đỉnh núi thuộc về bạn
campaign.epilogue=Bạn không hiểu mình đã đi xa đến thế bằng cách nào. Bỗng nhiên, một hình bóng thoáng hiện về với bạn. Rất lâu trước đây, có một cộng đồng pháp sư đã so tài với nhau một cách vui vẻ, mỗi người đều cố gắng đào sâu tay nghề của mình. Có phép thuật trong sự cân bằng của thời đại ấy. Bạn nhớ lại khoảnh khắc mình phải rời khỏi cộng đồng ấy, và lý do phải rời đi. Từ đó, bạn đã cảm thấy dư âm của ma thuật trong mọi việc mình làm.
